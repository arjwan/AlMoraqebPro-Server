<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المراقب برو - إنشاء حساب وتفعيل الشركة</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #2e1a47 0%, #1f1135 50%, #100820 100%);
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .main-card {
            width: 100%;
            max-width: 550px;
            background: #ffffff;
            padding: 40px;
            border-radius: 28px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
        }

        .header-title {
            text-align: center;
            margin-bottom: 25px;
        }

        .header-title h2 {
            font-size: 26px;
            font-weight: 800;
            color: #0284c7;
            margin-bottom: 8px;
        }

        .header-title p {
            color: #64748b;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            font-size: 14px;
            color: #334155;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 13px 16px;
            border: 2px solid #cbd5e1;
            border-radius: 14px;
            font-size: 15px;
            background: #f8fafc;
            outline: none;
            transition: 0.2s;
        }

        .form-group input:focus {
            border-color: #0284c7;
            background: #fff;
            box-shadow: 0 0 10px rgba(2, 132, 199, 0.15);
        }

        .hint-text {
            font-size: 12px;
            color: #0284c7;
            margin-top: 5px;
            display: block;
            font-weight: 600;
        }

        .btn-submit {
            background: #10b981;
            color: white;
            border: none;
            padding: 16px;
            width: 100%;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: #059669;
        }

        .footer-link {
            text-align: center;
            margin-top: 20px;
        }

        .footer-link a {
            color: #0284c7;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
        }

        .footer-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="header-title">
            <h2>🏢 بوابة المراقب برو - إنشاء حساب الشركة</h2>
            <p>أدخل بيانات شركتك ومفتاح الترخيص لتهيئة قاعدة بيانات نظيفة وخالية من الأمثلة</p>
        </div>

        <form id="registerForm" onsubmit="registerCleanCompany(event)">
            <div class="form-group">
                <label>اسم الشركة / المؤسسة الرسمية:</label>
                <input type="text" id="companyName" placeholder="أدخل اسم شركتك..." required>
            </div>

            <div class="form-group">
                <label>اسم المسؤول / مدير النظام:</label>
                <input type="text" id="username" placeholder="الاسم الكامل..." required>
            </div>

            <div class="form-group">
                <label>كلمة المرور:</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <div class="form-group">
                <label>البريد الإلكتروني:</label>
                <input type="email" id="email" placeholder="name@company.com" required>
            </div>

            <div class="form-group">
                <label>مفتاح التفعيل (License Key):</label>
                <input type="text" id="licenseKey" placeholder="أدخل مفتاح الترخيص المعتمد..." required>
                <span class="hint-text">💡 مفتاح الترخيص التجريبي للاختبار: PRO-2026</span>
            </div>

            <button type="submit" class="btn-submit">إنشاء قاعدة البيانات النظيفة والانتقال للوحة التحكم ✅</button>
        </form>

        <div class="footer-link">
            <a href="company-activate.html">← لديك حساب مسبق؟ تسجيل الدخول</a>
        </div>
    </div>

    <script>
        function registerCleanCompany(event) {
            event.preventDefault();

            const companyName = document.getElementById('companyName').value.trim();
            const email = document.getElementById('email').value.trim();
            const licenseKey = document.getElementById('licenseKey').value.trim();

            if (licenseKey === "") {
                alert('الرجاء إدخال مفتاح تفعيل صحيح.');
                return;
            }

            // توليد معرف فريد ونظيف للشركة
            const companyId = companyName.toLowerCase().replace(/\s+/g, '_').replace(/[^\w-]/g, '') + "_" + Math.floor(Math.random() * 1000);

            // 1. تسجيل الشركة في السجل العام
            let companiesList = JSON.parse(localStorage.getItem('registeredCompanies')) || [];
            companiesList.push({ id: companyId, name: companyName, email: email });
            localStorage.setItem('registeredCompanies', JSON.stringify(companiesList));

            // 2. إنشاء قاعدة بيانات مستقلة وخالية تماماً من البيانات الوهمية (مصفوفة فارغة)
            const companyDbKey = `company_employees_${companyId}`;
            localStorage.setItem(companyDbKey, JSON.stringify([]));

            // 3. تفعيل جلسة الشركة الحالية
            localStorage.setItem('activeCompanyId', companyId);
            localStorage.setItem(`is_activated_${companyId}`, "true");

            alert(`تم إنشاء قاعدة البيانات المستقلة والنظيفة للشركة "${companyName}" بنجاح!`);
            window.location.href = 'admin.html';
        }
    </script>
</body>
</html>

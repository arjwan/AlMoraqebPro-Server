<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المراقب برو - إنشاء حساب وتفعيل الشركة</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #2e1a47 0%, #1f1135 50%, #100820 100%); color: #1e293b; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 30px; }
        .main-card { width: 100%; max-width: 550px; background: #ffffff; padding: 40px; border-radius: 28px; box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5); }
        .header-title { text-align: center; margin-bottom: 25px; }
        .header-title h2 { font-size: 24px; font-weight: 800; color: #0284c7; margin-bottom: 8px; }
        .header-title p { color: #64748b; font-size: 14px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-weight: 700; font-size: 14px; color: #334155; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 12px 16px; border: 2px solid #cbd5e1; border-radius: 12px; font-size: 15px; background: #f8fafc; outline: none; transition: 0.2s; }
        .form-group input:focus { border-color: #0284c7; background: #fff; }
        .btn-submit { background: #10b981; color: white; border: none; padding: 15px; width: 100%; border-radius: 14px; font-size: 16px; font-weight: 800; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        .btn-submit:hover { background: #059669; }
        .footer-link { text-align: center; margin-top: 20px; }
        .footer-link a { color: #0284c7; text-decoration: none; font-weight: 700; font-size: 14px; }
        .footer-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="main-card">
        <div class="header-title">
            <h2>🏢 تسجيل شركة جديدة ونظامها المستقل</h2>
            <p>أنشئ حساب شركتك وحدد بيانات الدخول الخاصة بك</p>
        </div>

        <form id="registerForm" onsubmit="registerCompany(event)">
            <div class="form-group">
                <label>معرّف الشركة بالإنجليزية (Company ID - فريد بدون مسافات):</label>
                <input type="text" id="companyId" placeholder="مثال: al_bayan_co" required>
            </div>
            <div class="form-group">
                <label>اسم الشركة أو المؤسسة الرسمي:</label>
                <input type="text" id="companyName" placeholder="مثال: شركة البيان التقني" required>
            </div>
            <div class="form-group">
                <label>اسم المستخدم (للدخول):</label>
                <input type="text" id="adminUser" placeholder="admin_bayan" required>
            </div>
            <div class="form-group">
                <label>كلمة المرور:</label>
                <input type="password" id="adminPass" placeholder="••••••••" required>
            </div>
            <div class="form-group">
                <label>مفتاح الترخيص (License Key):</label>
                <input type="text" id="licenseKey" placeholder="PRO-2026" required>
            </div>

            <button type="submit" class="btn-submit">🚀 إنشاء البيئة والانتقال لتسجيل الدخول</button>
        </form>

        <div class="footer-link">
            <a href="company-activate.html">← لديك حساب مسجل مسبقاً؟ تسجيل الدخول</a>
        </div>
    </div>

    <script>
        function registerCompany(event) {
            event.preventDefault();

            const cId = document.getElementById('companyId').value.trim().toLowerCase().replace(/\s+/g, '_').replace(/[^\w-]/g, '');
            const cName = document.getElementById('companyName').value.trim();
            const user = document.getElementById('adminUser').value.trim();
            const pass = document.getElementById('adminPass').value.trim();
            const licenseKey = document.getElementById('licenseKey').value.trim();

            if (!cId || !cName || !user || !pass) {
                alert('الرجاء إكمال كافة الحقول المطلوبة بدقة.');
                return;
            }

            // 1. تحديث أو حفظ قائمة الشركات المسجلة العامة
            let companiesList = JSON.parse(localStorage.getItem('registeredCompanies')) || [];
            if (!companiesList.some(c => c.id === cId)) {
                companiesList.push({ id: cId, name: cName });
                localStorage.setItem('registeredCompanies', JSON.stringify(companiesList));
            }

            // 2. حفظ بيانات الاعتماد الخاصة بهذه الشركة حصراً للتحقق لاحقاً أثناء تسجيل الدخول
            localStorage.setItem(`company_auth_${cId}`, JSON.stringify({ user, pass, companyName: cName }));

            // 3. إنشاء قاعدة بيانات الموظفين الخاصة بالنظام النظيف لهذه الشركة إذا لم تكن موجودة
            const dbKeyEmployees = `company_employees_${cId}`;
            if (!localStorage.getItem(dbKeyEmployees)) {
                localStorage.setItem(dbKeyEmployees, JSON.stringify([]));
            }

            alert(`تم إنشاء الحساب والبيئة المستقلة لشركة "${cName}" بنجاح!`);
            
            // الانتقال لصفحة تسجيل الدخول الخاصة بهذه الشركة مع تمرير المعرف في الرابط
            window.location.href = `company-activate.html?company=${encodeURIComponent(cId)}`;
        }
    </script>
</body>
</html>

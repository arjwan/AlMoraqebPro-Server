<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المراقب برو - تسجيل الشركات والمديرين</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #1e293b, #0f172a); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; color: #1e293b; }
        
        .register-container { background: #ffffff; padding: 35px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4); width: 100%; max-width: 500px; text-align: center; }
        h2 { margin-bottom: 8px; color: #1e293b; font-size: 24px; font-weight: 800; }
        .subtitle { font-size: 14px; color: #64748b; margin-bottom: 25px; }
        
        .form-group { margin-bottom: 15px; text-align: right; }
        label { display: block; margin-bottom: 6px; color: #334155; font-size: 14px; font-weight: 600; }
        input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 15px; outline: none; transition: all 0.3s; }
        input:focus { border-color: #0284c7; box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15); }
        
        .btn { width: 100%; padding: 12px; background: #0f172a; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.3s; margin-top: 10px; }
        .btn:hover { background: #1e293b; }

        /* فقرة الدخول السريع المضافة حديثاً */
        .quick-login-section { margin-top: 30px; border-top: 2px dashed #e2e8f0; padding-top: 20px; text-align: right; }
        .quick-login-section h3 { font-size: 16px; color: #0284c7; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .quick-row { display: flex; gap: 10px; margin-bottom: 12px; }
        .quick-row input { flex: 1; }
        .quick-btn { background: #0284c7; color: white; border: none; padding: 10px 18px; border-radius: 10px; font-weight: 600; cursor: pointer; transition: background 0.3s; width: 100%; }
        .quick-btn:hover { background: #0369a1; }

        .status-msg { margin-top: 15px; font-size: 14px; font-weight: bold; text-align: center; min-height: 22px; }
    </style>
</head>
<body>

    <div class="register-container">
        <h2>🏢 تسجيل شركة جديدة</h2>
        <p class="subtitle">أنشئ حساب شركتك وابدأ الإدارة فوراً</p>
        
        <!-- نموذج تسجيل الشركة الأساسي -->
        <form id="registerForm" onsubmit="handleRegisterCompany(event)">
            <div class="form-group">
                <label for="companyId">رمز الشركة (المعرف الفريد)</label>
                <input type="text" id="companyId" required placeholder="مثال: COMP-01">
            </div>

            <div class="form-group">
                <label for="companyName">اسم الشركة</label>
                <input type="text" id="companyName" required placeholder="أدخل اسم الشركة الكامل">
            </div>

            <div class="form-group">
                <label for="manager">اسم المدير المسؤول</label>
                <input type="text" id="manager" required placeholder="أدخل اسم المدير">
            </div>

            <div class="form-group">
                <label for="phone">رقم هاتف المدير (يستخدم للدخول السريع)</label>
                <input type="text" id="phone" required placeholder="أدخل رقم الهاتف">
            </div>

            <div class="form-group">
                <label for="username">اسم المستخدم</label>
                <input type="text" id="username" required placeholder="اسم المستخدم الخاص بالدخول">
            </div>

            <div class="form-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" required placeholder="أدخل كلمة المرور">
            </div>

            <button type="submit" class="btn">حفظ وتسجيل الشركة</button>
        </form>

        <!-- فقرة الدخول السريع برمز الشركة ورقم الهاتف -->
        <div class="quick-login-section">
            <h3>⚡ دخول سريع للمدير المسجل مسبقاً</h3>
            <div class="quick-row">
                <input type="text" id="quickCompanyCode" placeholder="رمز الشركة">
                <input type="text" id="quickPhone" placeholder="رقم الهاتف">
            </div>
            <button type="button" class="quick-btn" onclick="handleQuickLogin()">دخول فوري لوحة التحكم</button>
        </div>

        <div class="status-msg" id="statusMsg"></div>
    </div>

    <script>
        // إرسال بيانات تسجيل الشركة الجديدة للخادم
        async function handleRegisterCompany(e) {
            e.preventDefault();
            const statusMsg = document.getElementById('statusMsg');
            
            const payload = {
                companyId: document.getElementById('companyId').value.trim(),
                companyName: document.getElementById('companyName').value.trim(),
                manager: document.getElementById('manager').value.trim(),
                phone: document.getElementById('phone').value.trim(),
                username: document.getElementById('username').value.trim(),
                password: document.getElementById('password').value.trim()
            };

            statusMsg.style.color = "#0284c7";
            statusMsg.textContent = "جاري حفظ بيانات الشركة...";

            try {
                const response = await fetch('/api/developer/register-company', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                if (data.success) {
                    statusMsg.style.color = "#16a34a";
                    statusMsg.textContent = "تم تسجيل الشركة بنجاح! جاري التوجيه...";
                    localStorage.setItem('activeCompanyId', data.companyCode);
                    setTimeout(() => {
                        window.location.href = `admin.html?company=${encodeURIComponent(data.companyCode)}`;
                    }, 1000);
                } else {
                    statusMsg.style.color = "#dc2626";
                    statusMsg.textContent = data.error || "فشل تسجيل الشركة";
                }
            } catch (err) {
                statusMsg.style.color = "#dc2626";
                statusMsg.textContent = "حدث خطأ في الاتصال بالسيرفر";
            }
        }

        // دالة الدخول السريع عبر مطابقة رمز الشركة ورقم الهاتف مباشرة من نفس الصفحة
        async function handleQuickLogin() {
            const companyCode = document.getElementById('quickCompanyCode').value.trim();
            const phone = document.getElementById('quickPhone').value.trim();
            const statusMsg = document.getElementById('statusMsg');

            if (!companyCode || !phone) {
                statusMsg.style.color = "#dc2626";
                statusMsg.textContent = "يرجى إدخال رمز الشركة ورقم الهاتف معاً للدخول السريع";
                return;
            }

            statusMsg.style.color = "#0284c7";
            statusMsg.textContent = "جاري التحقق من مطابقة المعرف ورقم الهاتف...";

            try {
                const response = await fetch('/api/auth/quick-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ companyCode, phone })
                });

                const data = await response.json();
                if (data.success) {
                    statusMsg.style.color = "#16a34a";
                    statusMsg.textContent = "تم الدخول بنجاح، جاري نقلك للوحة التحكم...";
                    localStorage.setItem('activeCompanyId', data.companyCode);
                    setTimeout(() => {
                        window.location.href = `admin.html?company=${encodeURIComponent(data.companyCode)}`;
                    }, 800);
                } else {
                    statusMsg.style.color = "#dc2626";
                    statusMsg.textContent = data.message || "رمز الشركة أو رقم الهاتف غير صحيح";
                }
            } catch (err) {
                statusMsg.style.color = "#dc2626";
                statusMsg.textContent = "تعذر الاتصال بالخادم";
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>الخدمات - المراقب برو</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#0284c7;--blue2:#0369a1;--navy:#0f172a;--muted:#64748b;--line:#dbe4ee;--green:#16a34a;--red:#dc2626;--amber:#d97706}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:linear-gradient(160deg,#0f172a,#172554 55%,#0c4a6e);min-height:100vh;padding:14px;color:#0f172a}
.app{width:100%;max-width:500px;margin:auto;padding-bottom:20px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;color:#fff}
.brand{font-size:20px;font-weight:900}.connection{font-size:11px;background:rgba(255,255,255,.1);padding:7px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.12)}
.connection.ok{color:#86efac}.connection.bad{color:#fca5a5}.connection.busy{color:#fde68a}
.ticker-wrapper{background:#07111f;border-radius:40px;padding:10px 16px;margin-bottom:14px;overflow:hidden;white-space:nowrap;border:1px solid #1e293b;box-shadow:inset 0 0 20px rgba(2,132,199,.12)}
.ticker-text{display:inline-block;font-size:13px;font-weight:700;color:#cbd5e1;animation:tickerScroll 24s linear infinite}.ticker-text span{margin:0 18px;color:#38bdf8}
@keyframes tickerScroll{0%{transform:translateX(20%)}100%{transform:translateX(-120%)}}
.card{background:rgba(255,255,255,.98);border-radius:26px;padding:18px;box-shadow:0 22px 50px rgba(0,0,0,.3)}
.welcome{background:linear-gradient(135deg,#0284c7,#0369a1);color:#fff;border-radius:20px;padding:16px;margin-bottom:14px;text-align:center;box-shadow:0 10px 25px rgba(2,132,199,.25)}
.welcome h2{font-size:18px;margin-bottom:4px}.welcome p{font-size:12px;opacity:.92}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.service-card{position:relative;background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px 10px;text-align:center;cursor:pointer;transition:transform .18s,box-shadow .18s,border-color .18s,background .18s;user-select:none;min-height:125px}
.service-card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(15,23,42,.12);border-color:#7dd3fc}.service-card:active{transform:scale(.97);background:#f0f9ff;border-color:var(--blue)}.service-card:focus-visible{outline:3px solid rgba(56,189,248,.45);outline-offset:2px}
.icon{font-size:31px;display:block;margin-bottom:7px}.service-card h3{font-size:14px;font-weight:900;color:#0f172a}.service-card p{font-size:10px;color:var(--muted);margin-top:5px;line-height:1.5}
.card-status{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 2px}.mini-status{flex:1;min-width:100px;background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:9px;text-align:center;font-size:11px;font-weight:800;color:#475569}
.mini-status strong{display:block;font-size:12px;color:#0f172a;margin-top:3px}
.btn{width:100%;padding:12px;border:0;border-radius:14px;color:#fff;font-weight:900;cursor:pointer;margin-top:12px;transition:.18s;box-shadow:0 6px 14px rgba(2,132,199,.2)}
.btn:hover{filter:brightness(1.05);transform:translateY(-1px)}.btn:active{transform:scale(.98)}.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn-blue{background:var(--blue)}.btn-gray{background:#475569}.btn-red{background:var(--red)}.btn-green{background:var(--green)}.btn-amber{background:var(--amber)}
.overlay{position:fixed;inset:0;background:rgba(2,6,23,.72);display:none;align-items:flex-end;justify-content:center;z-index:1000;padding:12px}.overlay.open{display:flex}
.modal{background:#fff;width:100%;max-width:500px;max-height:88vh;overflow:auto;border-radius:28px 28px 18px 18px;padding:20px;color:#0f172a;box-shadow:0 -15px 50px rgba(0,0,0,.35);animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modal h3{font-size:18px;color:var(--blue)}.close{border:0;background:#f1f5f9;color:#475569;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer}
.field{margin-bottom:12px}.field label{display:block;font-size:12px;font-weight:900;color:#475569;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid #cbd5e1;border-radius:12px;font-size:14px;background:#f8fafc;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(2,132,199,.1)}.field textarea{min-height:80px;resize:vertical}
.actions{display:flex;gap:8px;margin-top:15px}.actions .btn{margin-top:0;flex:1}
.result-list{display:flex;flex-direction:column;gap:9px}.record{background:#f8fafc;border:1px solid var(--line);border-radius:13px;padding:11px;font-size:12px;line-height:1.7}.record-top{display:flex;justify-content:space-between;gap:8px;align-items:center}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:10px;font-weight:900;white-space:nowrap}.badge.green{background:#dcfce7;color:#166534}.badge.red{background:#fee2e2;color:#991b1b}.badge.amber{background:#fef3c7;color:#92400e}.badge.blue{background:#e0f2fe;color:#075985}.empty{text-align:center;padding:24px 12px;color:#64748b;font-size:13px;background:#f8fafc;border-radius:14px;border:1px dashed #cbd5e1}
.loading{display:flex;align-items:center;justify-content:center;gap:8px;padding:18px;color:#475569;font-size:12px}.spinner{width:16px;height:16px;border:2px solid #cbd5e1;border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;right:14px;left:14px;bottom:14px;z-index:3000;background:#0f172a;color:#fff;border-radius:14px;padding:13px 15px;font-size:12px;font-weight:800;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25);display:none}.toast.show{display:block;animation:fade .2s ease-out}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(max-width:360px){.grid{grid-template-columns:1fr}.service-card{min-height:105px}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="brand">☀️ المراقب برو</div><div class="connection busy" id="connection">● جارٍ الاتصال</div></div>
  <div class="ticker-wrapper"><div class="ticker-text" id="tickerText"><span>📢</span> جاري تحميل توجيهات الإدارة...</div></div>

  <div class="card">
    <div class="welcome"><h2 id="greetingTitle">🌅 أهلاً بك</h2><p id="greetingText">خدماتك الإدارية في مكان واحد</p></div>
    <div class="card-status">
      <div class="mini-status">الشركة<strong id="companyView">—</strong></div>
      <div class="mini-status">الجهاز<strong id="deviceView">—</strong></div>
      <div class="mini-status">الحساب<strong id="accountView">جارٍ الفحص</strong></div>
    </div>

    <div class="grid" style="margin-top:12px">
      <button class="service-card" type="button" onclick="openLoanModal()"><span class="icon">💰</span><h3>طلب سلفة</h3><p>إرسال طلب سلفة مباشرة إلى المدير</p></button>
      <button class="service-card" type="button" onclick="openLeaveModal()"><span class="icon">📅</span><h3>طلب إجازة</h3><p>تقديم طلب إجازة مع التاريخ والسبب</p></button>
      <button class="service-card" type="button" onclick="fetchNotifications(true)"><span class="icon">🔔</span><h3>إشعارات المدير</h3><p>رسائل الإدارة وآخر التنبيهات</p></button>
      <button class="service-card" type="button" onclick="fetchAttendanceLog(true)"><span class="icon">📋</span><h3>سجل الحضور</h3><p>عرض حركات البصمة المسجلة فعلياً</p></button>
      <button class="service-card" type="button" onclick="checkAccountStatus(true)"><span class="icon">📶</span><h3>حالة الحساب</h3><p>فحص السيرفر والجهاز المرتبط</p></button>
      <button class="service-card" type="button" onclick="fetchRewards(true)"><span class="icon">🎁</span><h3>المكافآت والخصومات</h3><p>عرض البيانات المتاحة في النظام</p></button>
    </div>

    <button class="btn btn-gray" type="button" onclick="goBackToMain()">⬅ العودة إلى واجهة الكاميرا والبصمة</button>
  </div>
</div>

<div class="overlay" id="loanModal"><div class="modal">
  <div class="modal-head"><h3>💰 طلب سلفة مالية</h3><button class="close" onclick="closeModal('loanModal')">×</button></div>
  <div class="field"><label>المبلغ بالدينار العراقي</label><input type="number" id="loanAmount" min="1" placeholder="500000"></div>
  <div class="field"><label>السبب والتفاصيل</label><textarea id="loanReason" placeholder="اكتب سبب طلب السلفة..."></textarea></div>
  <div class="actions"><button class="btn btn-gray" onclick="closeModal('loanModal')">إلغاء</button><button class="btn btn-amber" id="loanSubmit" onclick="submitLoan()">إرسال الطلب</button></div>
</div></div>

<div class="overlay" id="leaveModal"><div class="modal">
  <div class="modal-head"><h3>📅 طلب إجازة</h3><button class="close" onclick="closeModal('leaveModal')">×</button></div>
  <div class="field"><label>نوع الإجازة</label><select id="leaveType"><option value="اعتيادية">اعتيادية</option><option value="مرضية">مرضية</option><option value="طارئة">طارئة</option><option value="زمنية">زمنية</option></select></div>
  <div class="field"><label>تاريخ الإجازة</label><input type="date" id="leaveDate"></div>
  <div class="field"><label>السبب</label><textarea id="leaveReason" placeholder="اكتب سبب الإجازة..."></textarea></div>
  <div class="actions"><button class="btn btn-gray" onclick="closeModal('leaveModal')">إلغاء</button><button class="btn btn-blue" id="leaveSubmit" onclick="submitLeave()">إرسال الطلب</button></div>
</div></div>

<div class="overlay" id="dataModal"><div class="modal">
  <div class="modal-head"><h3 id="dataTitle">البيانات</h3><button class="close" onclick="closeModal('dataModal')">×</button></div>
  <div id="dataBody" class="result-list"></div>
  <button class="btn btn-gray" onclick="closeModal('dataModal')">إغلاق</button>
</div></div>

<div class="toast" id="toast"></div>

<script>
const SERVER_URL = location.origin;
const params = new URLSearchParams(location.search);
const companyId = params.get('company') || params.get('companyId') || localStorage.getItem('companyId') || '';
const employeeId = params.get('employeeId') || localStorage.getItem('employeeId') || '';
const employeeName = params.get('name') || localStorage.getItem('employeeName') || 'الموظف';
const deviceId = params.get('deviceId') || localStorage.getItem('deviceId') || localStorage.getItem('employeeDeviceId') || localStorage.getItem('device_id') || '';

const $ = id => document.getElementById(id);
$('companyView').textContent = companyId || 'غير محددة';
$('deviceView').textContent = deviceId ? 'مرتبط' : 'غير معروف';

function toast(message, type='info'){
  const el=$('toast'); el.textContent=message; el.style.background=type==='error'?'#991b1b':type==='success'?'#166534':'#0f172a'; el.classList.add('show'); clearTimeout(window.__toast); window.__toast=setTimeout(()=>el.classList.remove('show'),4200);
}
function openModal(id){$(id).classList.add('open')}
function closeModal(id){$(id).classList.remove('open')}
window.addEventListener('click',e=>{if(e.target.classList.contains('overlay'))e.target.classList.remove('open')});

function setButtonLoading(id, loading, text){const b=$(id); if(!b)return; if(loading){b.dataset.oldText=b.textContent;b.disabled=true;b.textContent='⏳ جارٍ الإرسال...'}else{b.disabled=false;b.textContent=text||b.dataset.oldText||'إرسال'}}

async function api(path, options={}){
  const controller=new AbortController(); const timer=setTimeout(()=>controller.abort(),15000);
  try{
    const res=await fetch(SERVER_URL+path,{...options,signal:controller.signal,headers:{'Content-Type':'application/json',...(options.headers||{})}});
    const text=await res.text(); let data={}; try{data=text?JSON.parse(text):{}}catch{data={message:text}};
    if(!res.ok) throw new Error(data.message||data.error||`HTTP ${res.status}`);
    return data;
  }finally{clearTimeout(timer)}
}

function updateGreeting(){
  const h=new Date().getHours(); let title='🌙 مساء الخير',text=`مرحباً ${employeeName} – خدماتك في مكان واحد`;
  if(h>=5&&h<12){title='🌅 صباح الخير';text=`مرحباً ${employeeName} – تذكر تسجيل بصمة الحضور`}
  else if(h>=12&&h<17){title='🌤️ مساء الخير';text=`مرحباً ${employeeName} – خدماتك في مكان واحد`}
  else if(h>=17&&h<21){title='🌆 مساء الخير';text=`مرحباً ${employeeName} – تذكر تسجيل بصمة الانصراف`}
  $('greetingTitle').textContent=title;$('greetingText').textContent=text;
}
updateGreeting();

function speak(text){
  if(!('speechSynthesis' in window))return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);u.lang='ar-SA';u.rate=.9;u.pitch=1.12;
  const voices=window.speechSynthesis.getVoices();
  const candidates=voices.filter(v=>/^ar/i.test(v.lang));
  u.voice=candidates.find(v=>/female|أنث|امرأة|Google العربية|Arabic/i.test(v.name))||candidates.find(v=>/SA|AE|EG/i.test(v.lang))||candidates[0]||null;
  window.speechSynthesis.speak(u);
}
function speakGreeting(){
  const h=new Date().getHours();
  const msg=h>=17&&h<21?`مساء الخير يا ${employeeName}. تأكد من تسجيل بصمة الانصراف قبل مغادرة العمل.`:`أهلاً بك يا ${employeeName}. يمكنك الآن استخدام خدمات المراقب برو.`;
  speak(msg);
}
if('speechSynthesis' in window){speechSynthesis.onvoiceschanged=()=>{};setTimeout(speakGreeting,700)}

function requireIdentity(){
  if(!employeeId){toast('⚠️ لم يتم تمرير رقم الموظف. افتح الخدمات من داخل حساب الموظف.','error');return false}
  if(!deviceId){toast('⚠️ لم يتم العثور على معرّف الجهاز المرتبط. ارجع إلى صفحة البصمة ثم افتح الخدمات من جديد.','error');return false}
  return true;
}

async function submitService(type,payload,buttonId,modalId,successText){
  if(!requireIdentity())return;
  setButtonLoading(buttonId,true);
  try{
    const data=await api('/api/employee/service-request',{method:'POST',body:JSON.stringify({employeeId,deviceId,type,...payload})});
    toast(`✅ ${data.message||successText}`,'success');
    closeModal(modalId); speak('تم إرسال طلبك إلى الإدارة بنجاح.');
  }catch(e){toast('❌ '+e.message,'error');speak('تعذر إرسال الطلب. يرجى المحاولة مرة أخرى.');}
  finally{setButtonLoading(buttonId,false,buttonId==='loanSubmit'?'إرسال الطلب':'إرسال الطلب')}
}

function submitLoan(){
  const amount=Number($('loanAmount').value);const reason=$('loanReason').value.trim();
  if(!Number.isFinite(amount)||amount<=0){toast('⚠️ أدخل مبلغ سلفة صحيحاً','error');return}
  if(!reason){toast('⚠️ اكتب سبب السلفة','error');return}
  submitService('loan',{amount,reason},'loanSubmit','loanModal','تم إرسال طلب السلفة');
}
function submitLeave(){
  const date=$('leaveDate').value;const reason=`نوع الإجازة: ${$('leaveType').value} – ${$('leaveReason').value.trim()}`;
  if(!date){toast('⚠️ حدد تاريخ الإجازة','error');return}
  if($('leaveReason').value.trim().length<2){toast('⚠️ اكتب سبب الإجازة','error');return}
  submitService('leave',{reason,requestedDate:date},'leaveSubmit','leaveModal','تم إرسال طلب الإجازة');
}
function openLoanModal(){ $('loanAmount').value='';$('loanReason').value='';openModal('loanModal') }
function openLeaveModal(){ $('leaveDate').value='';$('leaveReason').value='';openModal('leaveModal') }

function showData(title,body){$('dataTitle').textContent=title;$('dataBody').innerHTML=body;openModal('dataModal')}
function loadingData(){return '<div class="loading"><span class="spinner"></span> جارٍ جلب البيانات من السيرفر...</div>'}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function formatDate(v){if(!v)return '—';const d=new Date(v);return Number.isNaN(d.getTime())?'—':d.toLocaleString('ar-IQ',{dateStyle:'medium',timeStyle:'short'})}
function statusBadge(s){if(s==='approved')return '<span class="badge green">مقبول</span>';if(s==='rejected')return '<span class="badge red">مرفوض</span>';return '<span class="badge amber">قيد الانتظار</span>'}

async function fetchNotifications(open=true){
  if(!requireIdentity())return;
  if(open)showData('🔔 إشعارات المدير',loadingData());
  try{
    const data=await api(`/api/employee/notifications?employeeId=${encodeURIComponent(employeeId)}&deviceId=${encodeURIComponent(deviceId)}`);
    const items=data.notifications||[];
    if(!items.length){if(open)showData('🔔 إشعارات المدير','<div class="empty">لا توجد إشعارات جديدة من الإدارة.</div>');return}
    const html=items.map(n=>`<div class="record"><div class="record-top"><strong>${n.type==='voice'?'🎙️ رسالة صوتية':'📩 رسالة من الإدارة'}</strong><span class="badge blue">${formatDate(n.createdAt)}</span></div><div>${esc(n.message||'')}</div>${n.audioUrl?`<audio controls style="width:100%;margin-top:8px" src="${esc(n.audioUrl)}"></audio>`:''}</div>`).join('');
    $('tickerText').innerHTML='<span>📢</span> '+items.slice(0,3).map(n=>esc(n.message||'تنبيه من الإدارة')).join(' <span>•</span> ');
    if(open)showData('🔔 إشعارات المدير',html);
  }catch(e){if(open)showData('🔔 إشعارات المدير',`<div class="empty">❌ ${esc(e.message)}</div>`);toast('تعذر جلب الإشعارات','error')}
}

async function fetchAttendanceLog(open=true){
  if(!employeeId){toast('⚠️ رقم الموظف غير موجود','error');return}
  if(open)showData('📋 سجل الحضور والانصراف',loadingData());
  try{
    const data=await api(`/api/employees/${encodeURIComponent(employeeId)}/attendance`);const items=data.attendance||[];
    if(!items.length){if(open)showData('📋 سجل الحضور والانصراف','<div class="empty">لا توجد حركات بصمة محفوظة حتى الآن.</div>');return}
    const html=items.map(a=>`<div class="record"><div class="record-top"><strong>${a.type==='exit'||a.type==='انصراف'?'🔴 انصراف':'🟢 حضور / بصمة'}</strong><span class="badge green">مسجل</span></div><div>الوقت: ${formatDate(a.timestamp)}</div><div>طريقة التحقق: ${esc(a.verificationMethod||'device-biometric')}</div>${Number.isFinite(Number(a.latitude))?`<div>الموقع: ${Number(a.latitude).toFixed(5)}, ${Number(a.longitude).toFixed(5)}</div>`:''}</div>`).join('');
    if(open)showData('📋 سجل الحضور والانصراف',html);
  }catch(e){if(open)showData('📋 سجل الحضور والانصراف',`<div class="empty">❌ ${esc(e.message)}</div>`);toast('تعذر جلب سجل الحضور','error')}
}

async function checkAccountStatus(open=true){
  if(open)showData('📶 حالة الحساب',loadingData());
  try{
    const ping=await api('/api/ping');
    let linked='غير قابل للتحقق';
    if(employeeId&&deviceId){
      try{await api(`/api/employee/notifications?employeeId=${encodeURIComponent(employeeId)}&deviceId=${encodeURIComponent(deviceId)}`);linked='الجهاز مرتبط والحساب قابل للوصول'}catch(e){linked=e.message}
    }else linked='معرّف الموظف أو الجهاز غير موجود في الرابط/التخزين المحلي';
    $('accountView').textContent=linked.startsWith('الجهاز')?'نشط':'تحقق مطلوب';$('connection').textContent='● متصل';$('connection').className='connection ok';
    if(open)showData('📶 حالة الحساب',`<div class="record"><div class="record-top"><strong>السيرفر</strong><span class="badge green">${esc(ping.status||'connected')}</span></div><div>${esc(ping.message||'السيرفر يعمل')}</div></div><div class="record"><strong>الشركة:</strong> ${esc(companyId||'غير محددة')}</div><div class="record"><strong>الموظف:</strong> ${esc(employeeName)}<br><strong>Employee ID:</strong> ${esc(employeeId||'غير موجود')}</div><div class="record"><strong>الجهاز:</strong> ${esc(deviceId||'غير موجود')}<br><strong>الحالة:</strong> ${esc(linked)}</div>`);
  }catch(e){$('connection').textContent='● غير متصل';$('connection').className='connection bad';$('accountView').textContent='غير متصل';if(open)showData('📶 حالة الحساب',`<div class="empty">❌ ${esc(e.message)}</div>`)}
}

async function fetchRewards(open=true){
  const html='<div class="empty">ℹ️ لا يوجد في <b>server.js</b> حالياً API مستقل للمكافآت والخصومات. لم أعد أعرض بيانات وهمية. عند إضافة مسار المكافآت إلى السيرفر يمكن ربط هذه البطاقة مباشرة.</div>';
  if(open)showData('🎁 المكافآت والخصومات',html);
}

function setTickerDefault(){
  const h=new Date().getHours();
  const messages=h>=17&&h<21?['📢 تذكير: سجل بصمة الانصراف قبل مغادرة العمل','🛡️ تأكد من إغلاق الأجهزة ومصادر الطاقة','📋 يمكنك متابعة سجل حضورك من خدمات الموظف']:['📢 مرحباً بك في خدمات المراقب برو','🛡️ تأكد من تسجيل بصمة الحضور عند الوصول','📅 يمكنك إرسال طلبات الإجازة والسلف من هنا'];
  $('tickerText').innerHTML=messages.map((m,i)=>`${i?' <span>•</span> ':''}${esc(m)}`).join('');
}
setTickerDefault();

function goBackToMain(){
  const q=new URLSearchParams();if(companyId)q.set('company',companyId);if(employeeId)q.set('employeeId',employeeId);if(employeeName)q.set('name',employeeName);if(deviceId)q.set('deviceId',deviceId);
  location.href='attachment.html'+(q.toString()?'?'+q.toString():'');
}

window.addEventListener('online',()=>{ $('connection').textContent='● متصل';$('connection').className='connection ok';toast('✅ عاد اتصال الإنترنت','success');checkAccountStatus(false)});
window.addEventListener('offline',()=>{ $('connection').textContent='● بدون إنترنت';$('connection').className='connection bad';toast('⚠️ لا يوجد اتصال بالإنترنت','error')});

(async function init(){
  try{await checkAccountStatus(false)}catch{}
  if(employeeId&&deviceId){fetchNotifications(false)}
})();
</script>

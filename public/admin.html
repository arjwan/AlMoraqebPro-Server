<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">المراقب برو - لوحة التحكم الرئيسية</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #2e1a47 0%, #1f1135 50%, #100820 100%); color: #1e293b; min-height: 100vh; padding: 40px; }
        .container { max-width: 1400px; margin: 0 auto; }
        header { background: #ffffff; padding: 25px 35px; border-radius: 24px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4); display: flex; justify-content: space-between; align-items: center; margin-bottom: 35px; }
        h1 { color: #0284c7; font-size: 24px; font-weight: 800; }
        #company-title-display { color: #0369a1; font-size: 16px; background: #f0f9ff; padding: 5px 12px; border-radius: 8px; margin-right: 15px; display: inline-block; border: 1px solid #bae6fd; }
        .logout-btn { background: #ef4444; color: white; padding: 10px 20px; border-radius: 12px; text-decoration: none; font-weight: 700; transition: 0.2s; cursor: pointer; border: none; }
        .logout-btn:hover { background: #dc2626; }
        .grid-menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; }
        .menu-card { background: #ffffff; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3); text-decoration: none; color: #1e293b; display: flex; flex-direction: column; align-items: center; text-align: center; transition: 0.3s; border: 2px solid transparent; }
        .menu-card:hover { transform: translateY(-8px); border-color: #0284c7; }
        .icon { font-size: 40px; margin-bottom: 12px; }
        .menu-card h3 { font-size: 18px; font-weight: 700; color: #0369a1; margin-bottom: 6px; }
        .menu-card p { font-size: 13px; color: #64748b; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>🛡️ نظام المراقب برو <span id="company-title-display">جاري التحميل...</span></h1>
            </div>
            <button onclick="logoutAdmin()" class="logout-btn">تسجيل الخروج</button>
        </header>

        <div class="grid-menu">
            <a href="admin-employee.html" class="menu-card dynamic-link">
                <span class="icon">➕</span>
                <h3>إضافة موظف جديد</h3>
                <p>تسجيل موظف جديد وبصمة الوجه</p>
            </a>
            <a href="admin-manage-emp.html" class="menu-card dynamic-link">
                <span class="icon">👥</span>
                <h3>إدارة الموظفين</h3>
                <p>عرض وتعديل بيانات الموظفين</p>
            </a>
            <a href="activity-log.html" class="menu-card dynamic-link">
                <span class="icon">📝</span>
                <h3>سجل الحركات</h3>
                <p>متابعة حركة العمليات والنشاطات</p>
            </a>
        </div>
    </div>

    <script>
        // التحقق من حماية الصفحة وجلسة الدخول المرتبطة بالمعرف
        const urlParams = new URLSearchParams(window.location.search);
        const companyId = urlParams.get('company') || localStorage.getItem('activeCompanyId');

        if (!localStorage.getItem('isLoggedIn') || !companyId) {
            alert('⚠️ يجب تسجيل الدخول أولاً للوصول إلى لوحة التحكم!');
            window.location.href = 'company-activate.html';
        }

        window.addEventListener('DOMContentLoaded', () => {
            localStorage.setItem('activeCompanyId', companyId);
            const titleSpan = document.getElementById('company-title-display');

            // تمرير معرف الشركة تلقائياً لجميع الروابط الفرعية لضمان عدم ضياعه
            document.querySelectorAll('.dynamic-link').forEach(link => {
                const currentHref = link.getAttribute('href');
                if (currentHref && !currentHref.includes('company=')) {
                    link.setAttribute('href', `${currentHref}?company=${companyId}`);
                }
            });

            // جلب اسم الشركة وعرضه
            let companiesList = JSON.parse(localStorage.getItem('registeredCompanies')) || [];
            let matched = companiesList.find(c => c.id === companyId);
            if (matched) {
                titleSpan.textContent = `(${matched.name})`;
                document.getElementById('page-title').textContent = `المراقب برو - ${matched.name}`;
            } else {
                titleSpan.textContent = `(${companyId})`;
            }
        });

        function logoutAdmin() {
            localStorage.removeItem('isLoggedIn');
            const comp = urlParams.get('company') || localStorage.getItem('activeCompanyId');
            window.location.href = comp ? `company-activate.html?company=${encodeURIComponent(comp)}` : 'company-activate.html';
        }
    </script>
</body>
</html>

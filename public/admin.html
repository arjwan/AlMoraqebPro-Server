<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المراقب برو - إدارة الرواتب والربط المتقدم</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #2e1a47 0%, #1f1135 50%, #100820 100%);
            color: #1e293b;
            min-height: 100vh;
            padding: 10px;
        }

        .main-card {
            width: 100%;
            max-width: 100%;
            background: #ffffff;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        }

        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }

        h2 {
            font-size: 18px;
            font-weight: 800;
            color: #d97706;
        }

        .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn {
            background: #0284c7;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn:hover { opacity: 0.9; }

        .btn-dashboard { background: #475569; }
        .btn-success { background: #10b981; }
        .btn-print { background: #6366f1; }
        .btn-danger { background: #ef4444; padding: 4px 8px; font-size: 11px; }

        .filter-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
            align-items: center;
            background: #f8fafc;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }

        input, select {
            padding: 6px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            background: #fff;
        }

        input:focus, select:focus {
            border-color: #d97706;
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
            max-height: 72vh;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            min-width: 1250px;
            background: #fff;
        }

        th {
            background: #0ea5e9;
            color: #fff;
            padding: 8px 4px;
            font-size: 11px;
            font-weight: 700;
            position: sticky;
            top: 0;
            z-index: 10;
            white-space: nowrap;
        }

        td {
            padding: 4px 3px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 11px;
            color: #334155;
            white-space: nowrap;
        }

        tr:hover { background: #f1f5f9; }

        /* تصغير الحقول بناءً على طلبك لتناسب الشاشة والطباعة */
        td input, td select {
            width: 100%;
            padding: 3px 4px;
            font-size: 11px;
            text-align: center;
            border: 1px solid #94a3b8;
            border-radius: 4px;
            background: #f8fafc;
        }

        /* حقول الأرقام والتواريخ المصغرة */
        td input[type="number"] { max-width: 55px; }
        /* حقول النصوص المصغرة (رقم وظيفي، فرع، تحقق، إلخ) */
        td input.small-text { max-width: 75px; }
        td input.name-text { max-width: 110px; }

        .empty-msg {
            text-align: center;
            padding: 30px;
            color: #64748b;
            font-weight: bold;
            font-size: 13px;
        }

        @media print {
            body { background: #fff; padding: 0; }
            .main-card { box-shadow: none; padding: 0; border: none; }
            .filter-bar, .top-header, .btn-danger, th:last-child, td:last-child { display: none !important; }
            @page { size: A4 landscape; margin: 4mm; }
            table { min-width: 100% !important; font-size: 9px !important; }
            th, td { padding: 2px 1px !important; }
            td input, td select { border: none; background: transparent; font-size: 9px !important; }
        }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="top-header">
            <h2>💰 إدارة الرواتب والربط المتقدم (تصميم A4 أفقي ومضغوط)</h2>
            <div class="header-actions">
                <button type="button" class="btn btn-dashboard" onclick="goToDashboard()">🏠 العودة للوحة التحكم</button>
            </div>
        </div>

        <!-- شريط الفلاتر والتحكم والطباعة -->
        <div class="filter-bar">
            <select id="filterShift" onchange="filterTable()">
                <option value="">-- كل الشفتات --</option>
                <option value="صباحي">صباحي</option>
                <option value="مسائي">مسائي</option>
                <option value="ليلي">ليلي</option>
                <option value="استثنائي">استثنائي</option>
            </select>

            <select id="filterType" onchange="filterTable()">
                <option value="">-- التصنيف --</option>
                <option value="شهري">شهري</option>
                <option value="أسبوعي">أسبوعي</option>
                <option value="يومي">يومي</option>
            </select>

            <input type="text" id="searchInput" placeholder="بحث بالاسم أو الرقم أو الفرع..." onkeyup="filterTable()" style="flex: 1; min-width: 180px;">

            <button type="button" class="btn btn-success" onclick="addNewSalaryRow()">➕ إضافة موظف</button>
            <button type="button" class="btn btn-print" onclick="openPrintModal()">🖨️ طباعة الكشف</button>
        </div>

        <!-- جدول الرواتب الرئيسي -->
        <div class="table-container">
            <table id="salariesTable">
                <thead>
                    <tr>
                        <th>ت</th>
                        <th>اسم الموظف</th>
                        <th>رقم وظيفي</th>
                        <th>الفرع</th>
                        <th>التصنيف</th>
                        <th>التحقق</th>
                        <th>الضمان</th>
                        <th>أيام</th>
                        <th>الشفت</th>
                        <th>إضافي</th>
                        <th>الأساسي</th>
                        <th>مخصصات</th>
                        <th>مكافآت</th>
                        <th>سلفة سلعة</th>
                        <th>اس. سلفة</th>
                        <th>اس. ضمان</th>
                        <th>خصم غياب</th>
                        <th>الصافي النهائي</th>
                        <th>الإجراء</th>
                    </tr>
                </thead>
                <tbody id="salariesTableBody">
                    <!-- البيانات تُعبأ ديناميكياً -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- نافذة منسدلة لخيارات الطباعة -->
    <div id="printModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); justify-content:center; align-items:center; z-index:1000;">
        <div style="background:#fff; padding:25px; border-radius:12px; width:380px; display:flex; flex-direction:column; gap:12px;">
            <h3 style="color:#0284c7; font-size:16px;">خيارات طباعة كشف الراتب</h3>
            <label style="font-size:13px; font-weight:bold;">النطاق:</label>
            <select id="printScope">
                <option value="all">كل الشركة</option>
                <option value="branch">فرع معين</option>
                <option value="individual">موظف فرد</option>
            </select>
            <input type="text" id="printBranchName" placeholder="اسم الفرع (إذا اخترت فرع)">
            <input type="text" id="printEmpName" placeholder="اسم الموظف (إذا اخترت موظف)">
            
            <label style="font-size:13px; font-weight:bold;">من تاريخ:</label>
            <input type="date" id="printDateFrom">
            <label style="font-size:13px; font-weight:bold;">إلى تاريخ:</label>
            <input type="date" id="printDateTo">

            <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:8px;">
                <button class="btn btn-dashboard" onclick="closePrintModal()">إلغاء</button>
                <button class="btn btn-success" onclick="executePrint()">طباعة</button>
            </div>
        </div>
    </div>

    <script>
        let currentCompanyId = '';

        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            currentCompanyId = urlParams.get('company') || localStorage.getItem('activeCompanyId') || 'B-2026';
            loadSalariesData();
        };

        function goToDashboard() {
            window.location.href = `admin.html?company=${encodeURIComponent(currentCompanyId)}`;
        }

        function getStorageKey() {
            return `salaries_manual_${currentCompanyId}`;
        }

        function loadSalariesData() {
            const tbody = document.getElementById('salariesTableBody');
            tbody.innerHTML = '';
            
            let data = JSON.parse(localStorage.getItem(getStorageKey()) || '[]');

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="19" class="empty-msg">لا توجد سجلات. اضغط على "إضافة موظف" لإدخال البيانات يدوياً.</td></tr>`;
                return;
            }

            data.forEach((item, index) => {
                let row = document.createElement('tr');
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td><input type="text" class="name-text" value="${item.name || ''}" onchange="updateField(${index}, 'name', this.value)"></td>
                    <td><input type="text" class="small-text" value="${item.empId || ''}" onchange="updateField(${index}, 'empId', this.value)"></td>
                    <td><input type="text" class="small-text" value="${item.workplace || ''}" onchange="updateField(${index}, 'workplace', this.value)"></td>
                    <td>
                        <select onchange="updateField(${index}, 'type', this.value)">
                            <option value="شهري" ${item.type === 'شهري' ? 'selected' : ''}>شهري</option>
                            <option value="أسبوعي" ${item.type === 'أسبوعي' ? 'selected' : ''}>أسبوعي</option>
                            <option value="يومي" ${item.type === 'يومي' ? 'selected' : ''}>يومي</option>
                        </select>
                    </td>
                    <td><input type="text" class="small-text" value="${item.verifiedTo || 'معتمد'}" onchange="updateField(${index}, 'verifiedTo', this.value)"></td>
                    <td>
                        <select onchange="updateField(${index}, 'socialStatus', this.value)">
                            <option value="مسجل" ${item.socialStatus === 'مسجل' ? 'selected' : ''}>مسجل</option>
                            <option value="غير مسجل" ${item.socialStatus === 'غير مسجل' ? 'selected' : ''}>غير مسجل</option>
                        </select>
                    </td>
                    <td><input type="number" value="${item.days || 30}" onchange="updateField(${index}, 'days', this.value)"></td>
                    <td>
                        <select onchange="updateField(${index}, 'shift', this.value)">
                            <option value="صباحي" ${item.shift === 'صباحي' ? 'selected' : ''}>صباحي</option>
                            <option value="مسائي" ${item.shift === 'مسائي' ? 'selected' : ''}>مسائي</option>
                            <option value="ليلي" ${item.shift === 'ليلي' ? 'selected' : ''}>ليلي</option>
                            <option value="استثنائي" ${item.shift === 'استثنائي' ? 'selected' : ''}>استثنائي</option>
                        </select>
                    </td>
                    <td><input type="number" value="${item.overtime || 0}" onchange="updateField(${index}, 'overtime', this.value)"></td>
                    <td><input type="number" value="${item.basicSalary || 0}" onchange="updateField(${index}, 'basicSalary', this.value)"></td>
                    <td><input type="number" value="${item.allowances || 0}" onchange="updateField(${index}, 'allowances', this.value)"></td>
                    <td><input type="number" value="${item.rewards || 0}" onchange="updateField(${index}, 'rewards', this.value)"></td>
                    <td><input type="number" value="${item.goodsLoan || 0}" onchange="updateField(${index}, 'goodsLoan', this.value)"></td>
                    <td><input type="number" value="${item.loanDeduction || 0}" onchange="updateField(${index}, 'loanDeduction', this.value)"></td>
                    <td><input type="number" value="${item.socialDeduction || 0}" onchange="updateField(${index}, 'socialDeduction', this.value)"></td>
                    <td><input type="number" value="${item.absenceDeduction || 0}" onchange="updateField(${index}, 'absenceDeduction', this.value)"></td>
                    <td style="font-weight:bold; color:#059669; font-size:12px;">${calculateNet(item)}</td>
                    <td>
                        <button class="btn btn-danger" onclick="deleteSalaryRow(${index})">حذف</button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function calculateNet(item) {
            let basic = parseFloat(item.basicSalary) || 0;
            let allow = parseFloat(item.allowances) || 0;
            let rew = parseFloat(item.rewards) || 0;
            let over = parseFloat(item.overtime) || 0;
            let gLoan = parseFloat(item.goodsLoan) || 0;
            let lDeduct = parseFloat(item.loanDeduction) || 0;
            let sDeduct = parseFloat(item.socialDeduction) || 0;
            let absDeduct = parseFloat(item.absenceDeduction) || 0;

            let totalNet = (basic + allow + rew + over) - (gLoan + lDeduct + sDeduct + absDeduct);
            return totalNet.toFixed(2);
        }

        function addNewSalaryRow() {
            let data = JSON.parse(localStorage.getItem(getStorageKey()) || '[]');
            data.push({
                name: 'موظف جديد',
                empId: 'EMP-' + Math.floor(Math.random() * 1000),
                workplace: 'الفرع الرئيسي',
                type: 'شهري',
                verifiedTo: 'معتمد',
                socialStatus: 'مسجل',
                days: 30,
                shift: 'صباحي',
                overtime: 0,
                basicSalary: 500000,
                allowances: 0,
                rewards: 0,
                goodsLoan: 0,
                loanDeduction: 0,
                socialDeduction: 0,
                absenceDeduction: 0
            });
            localStorage.setItem(getStorageKey(), JSON.stringify(data));
            loadSalariesData();
        }

        function updateField(index, field, value) {
            let data = JSON.parse(localStorage.getItem(getStorageKey()) || '[]');
            if (data[index]) {
                data[index][field] = value;
                localStorage.setItem(getStorageKey(), JSON.stringify(data));
                loadSalariesData();
            }
        }

        function deleteSalaryRow(index) {
            if (confirm('هل أنت متأكد من حذف هذا السجل نهائياً؟')) {
                let data = JSON.parse(localStorage.getItem(getStorageKey()) || '[]');
                data.splice(index, 1);
                localStorage.setItem(getStorageKey(), JSON.stringify(data));
                loadSalariesData();
            }
        }

        function filterTable() {
            let search = document.getElementById('searchInput').value.toLowerCase();
            let shiftFilter = document.getElementById('filterShift').value;
            let typeFilter = document.getElementById('filterType').value;
            
            let rows = document.getElementById('salariesTableBody').getElementsByTagName('tr');
            
            for (let i = 0; i < rows.length; i++) {
                let row = rows[i];
                if (row.classList.contains('empty-msg')) continue;
                
                let name = row.cells[1].getElementsByTagName('input')[0].value.toLowerCase();
                let empId = row.cells[2].getElementsByTagName('input')[0].value.toLowerCase();
                let branch = row.cells[3].getElementsByTagName('input')[0].value.toLowerCase();
                let type = row.cells[4].getElementsByTagName('select')[0].value;
                let shift = row.cells[8].getElementsByTagName('select')[0].value;

                let matchesSearch = name.includes(search) || empId.includes(search) || branch.includes(search);
                let matchesShift = !shiftFilter || shift === shiftFilter;
                let matchesType = !typeFilter || type === typeFilter;

                if (matchesSearch && matchesShift && matchesType) {
                    row.style.display = '';
                } else {
                    row.style.display = 'none';
                }
            }
        }

        function openPrintModal() {
            document.getElementById('printModal').style.display = 'flex';
        }

        function closePrintModal() {
            document.getElementById('printModal').style.display = 'none';
        }

        function executePrint() {
            let scope = document.getElementById('printScope').value;
            let dFrom = document.getElementById('printDateFrom').value;
            let dTo = document.getElementById('printDateTo').value;

            alert(`جاري تهيئة الطباعة بتنسيق A4 أفقي ومضغوط...\nالنطاق: ${scope}\nالفترة: من ${dFrom || 'البداية'} إلى ${dTo || 'الآن'}`);
            closePrintModal();
            window.print();
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم العليا - المطور الرئيسي</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
            min-height: 100vh;
            padding: 20px;
        }

        /* نافذة طلب كلمة المرور السرية للمطور */
        #authOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .auth-card {
            background: #1e293b;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid #334155;
        }

        .auth-card h3 {
            margin-bottom: 20px;
            color: #38bdf8;
            font-size: 20px;
        }

        .auth-card input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 10px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-size: 16px;
            text-align: center;
            outline: none;
        }

        .auth-card button {
            background: #0284c7;
            color: #fff;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .auth-card button:hover {
            background: #0369a1;
        }

        /* المحتوى الرئيسي للوحة المطور */
        #mainContent {
            display: none;
            max-width: 900px;
            margin: 30px auto;
            background: #ffffff;
            color: #1e293b;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 15px;
        }

        h2 {
            font-size: 22px;
            color: #0284c7;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 700;
            margin-bottom: 8px;
            color: #334155;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            background: #f8fafc;
        }

        .status-box {
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 14px;
            text-align: center;
        }

        .status-active { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
        .status-expired { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }

        .btn-save {
            background: #16a34a;
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
        }

        .btn-save:hover { background: #15803d; }
    </style>
</head>
<body>

    <!-- نافذة الحماية بكلمة السر -->
    <div id="authOverlay">
        <div class="auth-card">
            <h3>🔐 بوابة المطور الرئيسي</h3>
            <p style="font-size: 13px; color: #94a3b8; margin-bottom: 15px;">منطقة سرية محظورة على العملاء</p>
            <input type="password" id="devPassword" placeholder="أدخل كلمة مرور المطور">
            <button onclick="verifyDeveloper()">دخول آمن</button>
        </div>
    </div>

    <!-- لوحة تحكم التراخيص الفعلية -->
    <div id="mainContent">
        <div class="top-nav">
            <h2>🛡️ نظام إدارة تراخيص واشتراكات العملاء</h2>
            <button onclick="lockOut()" style="background:#ef4444; color:#fff; border:none; padding:8px 15px; border-radius:8px; cursor:pointer; font-weight:bold;">قفل الخروج</button>
        </div>

        <div id="statusContainer" class="status-box status-active">
            حالة الاشتراك: جاري الفحص...
        </div>

        <div class="form-group">
            <label>اسم الشركة العميل:</label>
            <input type="text" id="clientName" placeholder="أدخل اسم الشركة المشتري">
        </div>

        <div class="form-group">
            <label>تاريخ تفعيل النسخة:</label>
            <input type="date" id="startDate">
        </div>

        <div class="form-group">
            <label>تاريخ انتهاء الاشتراك السنوي:</label>
            <input type="date" id="endDate">
        </div>

        <div class="form-group">
            <label>حالة النظام لدى العميل:</label>
            <select id="systemState">
                <option value="active">مفعل وطبيعي</option>
                <option value="expired">منتهي الصلاحية (إيقاف مؤقت للخدمات)</option>
            </select>
        </div>

        <button class="btn-save" onclick="saveLicenseSettings()">💾 حفظ تحديثات الترخيص السنوي</button>
    </div>

    <script>
        // كلمة المرور الخاصة بك كمطور (يمكنك تغييرها كما تريد)
        const MASTER_SECRET = "AliAlObeidi_2026_MasterKey";

        function verifyDeveloper() {
            const pass = document.getElementById('devPassword').value;
            if (pass === MASTER_SECRET) {
                document.getElementById('authOverlay').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
                loadLicenseData();
            } else {
                alert('❌ كلمة المرور غير صحيحة! تم رفض الدخول.');
            }
        }

        function lockOut() {
            document.getElementById('mainContent').style.display = 'none';
            document.getElementById('authOverlay').style.display = 'flex';
            document.getElementById('devPassword').value = '';
        }

        function loadLicenseData() {
            const license = JSON.parse(localStorage.getItem('companyLicense')) || {
                clientName: "الشركة المستخدمة الحالية",
                startDate: "2026-08-03",
                endDate: "2027-08-03",
                systemState: "active"
            };

            document.getElementById('clientName').value = license.clientName;
            document.getElementById('startDate').value = license.startDate;
            document.getElementById('endDate').value = license.endDate;
            document.getElementById('systemState').value = license.systemState;

            checkExpiration(license);
        }

        function checkExpiration(license) {
            const statusBox = document.getElementById('statusContainer');
            const today = new Date();
            const expiryDate = new Date(license.endDate);

            if (license.systemState === 'expired' || today > expiryDate) {
                statusBox.className = "status-box status-expired";
                statusBox.innerHTML = `⚠️ تنبيه: الاشتراك السنوي لهذه الشركة منتهي الصلاحية (انتهى في ${license.endDate}).`;
            } else {
                statusBox.className = "status-box status-active";
                statusBox.innerHTML = `✅ الاشتراك السنوي فعال ومستمر حتى تاريخ: ${license.endDate}`;
            }
        }

        function saveLicenseSettings() {
            const licenseData = {
                clientName: document.getElementById('clientName').value,
                startDate: document.getElementById('startDate').value,
                endDate: document.getElementById('endDate').value,
                systemState: document.getElementById('systemState').value
            };

            localStorage.setItem('companyLicense', JSON.stringify(licenseData));
            checkExpiration(licenseData);
            alert('✅ تم حفظ وتحديث الترخيص بنجاح!');
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الموظفين - نظام المراقب برو</title>
    <style>
        *{box-sizing:border-box}body{margin:0;background:#1e1b4b;color:#0f172a;font-family:'Segoe UI',Tahoma,sans-serif;padding:18px}.wrap{max-width:1500px;margin:auto;background:#fff;border-radius:18px;padding:20px;box-shadow:0 12px 35px #0005}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border:1px solid #e2e8f0;border-radius:14px;padding:14px 18px;margin-bottom:16px}.brand{font-size:24px;font-weight:900}.badge{font-size:12px;background:#0284c7;color:#fff;padding:6px 10px;border-radius:8px;margin-right:8px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 15px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;gap:7px;align-items:center;transition:transform .18s ease,box-shadow .18s ease}.btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px #0f172a26}.btn:active{transform:translateY(0) scale(.98)}.btn-blue{background:#0284c7;color:#fff}.btn-green{background:#10b981;color:#fff}.btn-red{background:#ef4444;color:#fff}.btn-orange{background:#f59e0b;color:#fff}.btn-purple{background:#8b5cf6;color:#fff}.filter-bar{display:flex;gap:10px;margin-bottom:20px;background:#f8fafc;padding:12px;border-radius:10px;border:1px solid #cbd5e1;flex-wrap:wrap;align-items:center}.filter-bar input,.filter-bar select{padding:9px 12px;border:2px solid #94a3b8;border-radius:8px;font-size:14px;outline:none;background:#fff;font-weight:600;flex:1;min-width:180px}.filter-bar input:focus,.filter-bar select:focus{border-color:#0284c7}.table-container{width:100%;overflow-x:auto;border-radius:8px;border:1px solid #cbd5e1;margin-bottom:20px}table{width:100%;border-collapse:collapse;text-align:center;background:#fff}th{background:#1e293b;color:#fff;padding:12px;font-size:14px;font-weight:800;text-align:center}td{padding:10px 12px;border-bottom:1px solid #e2e8f0;font-size:14px;color:#1e293b;font-weight:600;text-align:center}tr:hover{background:#f1f5f9}.status-badge{padding:4px 10px;border-radius:20px;font-size:12px;font-weight:bold;display:inline-block}.status-active{background:#d1fae5;color:#065f46}.status-inactive{background:#f1f5f9;color:#64748b}.status-pending{background:#fef3c7;color:#92400e}.status-approved{background:#d1fae5;color:#065f46}.status-rejected{background:#fee2e2;color:#991b1b}.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);justify-content:center;align-items:center;z-index:999}.modal.show{display:flex}.modal-box{background:#fff;border-radius:16px;padding:30px;max-width:550px;width:90%;max-height:90vh;overflow-y:auto}.modal-box h3{margin-bottom:15px}.modal-box .form-group{margin-bottom:12px}.modal-box .form-group label{display:block;font-weight:bold;margin-bottom:4px}.modal-box .form-group input,.modal-box .form-group select{width:100%;padding:9px 12px;border:2px solid #94a3b8;border-radius:8px;font-size:14px;outline:none}.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}.status{margin-top:16px;background:#10b981;color:#fff;padding:12px;border-radius:10px;text-align:center;font-weight:900}.status.error{background:#ef4444}.status.warning{background:#f59e0b}.loading-spinner{display:inline-block;width:24px;height:24px;border:3px solid #f3f3f3;border-top:3px solid #0284c7;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:700px){body{padding:8px}.wrap{padding:12px}.top{padding:12px}.brand{font-size:20px}}
    </style>
</head>
<body>
<div class="wrap">
    <div class="top">
        <div class="brand">👥 إدارة الموظفين <span id="companyBadge" class="badge">...</span></div>
        <div class="actions">
            <button class="btn btn-green" onclick="showAddModal()">➕ إضافة موظف</button>
            <button class="btn btn-blue" onclick="loadEmployees()">🔄 تحديث</button>
            <button class="btn btn-purple" onclick="goHome()">🏠 العودة للرئيسية</button>
        </div>
    </div>

    <div class="filter-bar">
        <input type="text" id="searchInput" placeholder="🔍 بحث عن موظف..." onkeyup="filterEmployees()">
        <select id="statusFilter" onchange="filterEmployees()">
            <option value="">جميع الحالات</option>
            <option value="active">نشط</option>
            <option value="inactive">غير نشط</option>
        </select>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr><th>#</th><th>اسم الطلب</th><th>رمز الشركة</th><th>الموقع</th><th>الجهاز</th><th>تاريخ الطلب</th><th>الحالة</th><th>إجراء</th></tr>
            </thead>
            <tbody id="pendingRequestsTable"><tr><td colspan="8"><div class="loading-spinner"></div> جاري تحميل الطلبات...</td></tr></tbody>
        </table>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr><th>#</th><th>رمز الشركة</th><th>الاسم</th><th>رقم الهاتف</th><th>البريد</th><th>الراتب</th><th>الاختصاص</th><th>الحالة</th><th>الإجراءات</th></tr>
            </thead>
            <tbody id="employeesTable"><tr><td colspan="9"><div class="loading-spinner"></div> جاري التحميل...</td></tr></tbody>
        </table>
    </div>

    <div id="status" class="status">✓ جاري تحميل البيانات...</div>
</div>

<!-- مودال إضافة/تعديل -->
<div class="modal" id="employeeModal">
    <div class="modal-box">
        <h3 id="modalTitle">➕ إضافة موظف جديد</h3>
        <form id="employeeForm" onsubmit="saveEmployee(event)">
            <input type="hidden" id="editId" value="">
            <div class="form-group"><label>رمز الشركة</label><input type="text" id="empCompanyId" required></div>
            <div class="form-group"><label>الاسم الكامل</label><input type="text" id="empName" required></div>
            <div class="form-group"><label>رقم الهاتف</label><input type="tel" id="empPhone" placeholder="مثال: 07XX XXX XXXX"></div>
            <div class="form-group"><label>البريد الإلكتروني</label><input type="email" id="empEmail" required></div>
            <div class="form-group"><label>الراتب الأساسي</label><input type="number" id="empSalary" required></div>
            <div class="form-group"><label>الاختصاص</label><input type="text" id="empSpecialty" required></div>
            <div class="form-group"><label>مكان العمل</label><input type="text" id="empLocation" required></div>
            <div class="form-group"><label>اسم المستخدم</label><input type="text" id="empUsername" required></div>
            <div class="form-group"><label>كلمة المرور</label><input type="password" id="empPassword" placeholder="اتركه فارغاً للتعديل"></div>
            <div class="form-group"><label>الحالة</label>
                <select id="empStatus"><option value="active">نشط</option><option value="inactive">غير نشط</option></select>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-red" onclick="closeModal()">إلغاء</button>
                <button type="submit" class="btn btn-green">💾 حفظ</button>
            </div>
        </form>
    </div>
</div>

<script>
    const API = location.origin;
    let token = '', companyId = '';

    function getSession() {
        try { return JSON.parse(localStorage.getItem('almoraqeb_admin_session') || '{}'); } 
        catch { return {}; }
    }

    function getCompanyId() {
        const s = getSession();
        return String(s.companyId || new URLSearchParams(location.search).get('company') || localStorage.getItem('companyId') || '').trim();
    }

    async function auth() {
        token = sessionStorage.getItem('almoraqeb_admin_token') || '';
        companyId = getCompanyId();
        if (!token || !companyId) { location.href = 'admin_login.html'; return false; }
        try {
            const r = await fetch(API + '/api/admin/session', {
                headers: { 'Authorization': 'Bearer ' + token },
                cache: 'no-store'
            });
            const d = await r.json();
            if (!r.ok || !d.success) throw 0;
            document.getElementById('companyBadge').textContent = companyId;
            return true;
        } catch {
            location.href = 'admin_login.html';
            return false;
        }
    }

    function goHome() {
        location.href = 'index.html?company=' + encodeURIComponent(companyId);
    }

    function closeModal() {
        document.getElementById('employeeModal').classList.remove('show');
    }

    function showStatus(text, type = '') {
        const el = document.getElementById('status');
        el.textContent = text;
        el.className = 'status' + (type ? ' ' + type : '');
    }

    async function loadPendingRequests() {
        const tbody = document.getElementById('pendingRequestsTable');
        tbody.innerHTML = `<tr><td colspan="8"><div class="loading-spinner"></div> جاري تحميل الطلبات...</td></tr>`;
        try {
            const r = await fetch(API + '/api/employee/requests/' + encodeURIComponent(companyId) + '/pending', {
                headers: { 'Authorization': 'Bearer ' + token },
                cache: 'no-store'
            });
            const d = await r.json();
            if (r.ok && d.success) {
                const requests = d.requests || [];
                tbody.innerHTML = requests.length === 0 ?
                    `<tr><td colspan="8" style="color:#64748b;">لا توجد طلبات معلقة</td></tr>` :
                    requests.map((req, i) => `
                        <tr>
                            <td>${i + 1}</td>
                            <td><b>${req.name || '—'}</b></td>
                            <td>${req.companyId || companyId}</td>
                            <td>${req.workLocation || req.location || '—'}</td>
                            <td>${req.deviceId ? String(req.deviceId).slice(0, 18) : '—'}</td>
                            <td>${req.createdAt ? new Date(req.createdAt).toLocaleDateString('ar-EG') : '—'}</td>
                            <td><span class="status-badge status-pending">⏳ معلقة</span></td>
                            <td>
                                <button class="btn btn-green" style="padding:4px 10px;font-size:11px;" onclick="approveRequest('${req._id}')">✅ اعتماد</button>
                            </td>
                        </tr>
                    `).join('');
                showStatus('✅ تم تحميل ' + requests.length + ' طلب معلّق', '');
            } else {
                tbody.innerHTML = `<tr><td colspan="8" style="color:#ef4444;">❌ فشل تحميل الطلبات</td></tr>`;
            }
        } catch {
            tbody.innerHTML = `<tr><td colspan="8" style="color:#ef4444;">❌ فشل الاتصال بالسيرفر</td></tr>`;
        }
    }

    async function approveRequest(requestId) {
        if (!confirm('هل تريد اعتماد هذا الطلب؟')) return;
        try {
            const r = await fetch(API + '/api/employee/request/' + encodeURIComponent(requestId) + '/approve', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify({ email: '' })
            });
            const d = await r.json();
            if (r.ok && d.success) {
                showStatus('✅ تم اعتماد الطلب بنجاح', '');
                await Promise.all([loadPendingRequests(), loadEmployees()]);
            } else {
                alert('❌ ' + (d.message || 'فشل الاعتماد'));
            }
        } catch {
            alert('❌ فشل الاتصال بالسيرفر');
        }
    }

    // ============================================================
    // تحميل الموظفين من MongoDB
    // ============================================================
    async function loadEmployees() {
        const tbody = document.getElementById('employeesTable');
        tbody.innerHTML = `<tr><td colspan="8"><div class="loading-spinner"></div></td></tr>`;
        try {
            const r = await fetch(API + '/api/employees?companyId=' + encodeURIComponent(companyId), {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            const d = await r.json();
            if (r.ok && d.success) {
                const employees = d.employees || [];
                tbody.innerHTML = employees.length === 0 ?
                    `<tr><td colspan="9" style="color:#64748b;">لا يوجد موظفون</td></tr>` :
                    employees.map((e, i) => `
                        <tr data-status="${e.status || 'active'}">
                            <td>${i+1}</td>
                            <td>${e.companyId || '—'}</td>
                            <td><b>${e.name}</b></td>
                            <td>${e.phoneNumber || '—'}</td>
                            <td>${e.email || '—'}</td>
                            <td>${e.salary ? Number(e.salary).toLocaleString() + ' د.ع' : '—'}</td>
                            <td>${e.specialty || '—'}</td>
                            <td><span class="status-badge ${e.status === 'active' ? 'status-active' : 'status-inactive'}">${e.status === 'active' ? '✅ نشط' : '⛔ غير نشط'}</span></td>
                            <td>
                                <button class="btn btn-blue" style="padding:4px 10px;font-size:11px;" onclick="editEmployee('${e._id}')">✏️</button>
                                <button class="btn btn-red" style="padding:4px 10px;font-size:11px;" onclick="deleteEmployee('${e._id}')">🗑️</button>
                            </td>
                        </tr>
                    `).join('');
                showStatus('✅ تم تحميل ' + employees.length + ' موظف', '');
            } else {
                tbody.innerHTML = `<tr><td colspan="9" style="color:#ef4444;">❌ فشل التحميل</td></tr>`;
            }
        } catch {
            tbody.innerHTML = `<tr><td colspan="8" style="color:#ef4444;">❌ فشل الاتصال بالسيرفر</td></tr>`;
        }
    }

    function filterEmployees() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        const statusFilter = document.getElementById('statusFilter').value;
        document.querySelectorAll('#employeesTable tr').forEach(row => {
            if (row.cells && row.cells.length > 0) {
                const text = row.textContent.toLowerCase();
                const status = row.dataset.status || 'active';
                row.style.display = text.includes(q) && (statusFilter === '' || status === statusFilter) ? '' : 'none';
            }
        });
    }

    // ============================================================
    // إضافة / تعديل موظف
    // ============================================================
    function showAddModal() {
        document.getElementById('modalTitle').textContent = '➕ إضافة موظف جديد';
        document.getElementById('editId').value = '';
        document.getElementById('employeeForm').reset();
        document.getElementById('empCompanyId').value = companyId;
        document.getElementById('empPassword').placeholder = 'أدخل كلمة المرور';
        document.getElementById('empStatus').value = 'active';
        document.getElementById('employeeModal').classList.add('show');
    }

    async function editEmployee(id) {
        try {
            const r = await fetch(API + '/api/employees/' + id, {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            const d = await r.json();
            if (d.success && d.employee) {
                const e = d.employee;
                document.getElementById('modalTitle').textContent = '✏️ تعديل موظف';
                document.getElementById('editId').value = id;
                document.getElementById('empCompanyId').value = e.companyId || '';
                document.getElementById('empName').value = e.name || '';
                document.getElementById('empPhone').value = e.phoneNumber || '';
                document.getElementById('empEmail').value = e.email || '';
                document.getElementById('empSalary').value = e.salary || '';
                document.getElementById('empSpecialty').value = e.specialty || '';
                document.getElementById('empLocation').value = e.location || '';
                document.getElementById('empUsername').value = e.username || '';
                document.getElementById('empPassword').value = '';
                document.getElementById('empPassword').placeholder = 'اتركه فارغاً للتعديل';
                document.getElementById('empStatus').value = e.status || 'active';
                document.getElementById('employeeModal').classList.add('show');
            }
        } catch {
            alert('❌ فشل تحميل بيانات الموظف');
        }
    }

    async function saveEmployee(e) {
        e.preventDefault();
        const id = document.getElementById('editId').value;
        const data = {
            companyId: document.getElementById('empCompanyId').value,
            name: document.getElementById('empName').value,
            phoneNumber: document.getElementById('empPhone').value.trim(),
            email: document.getElementById('empEmail').value,
            salary: parseInt(document.getElementById('empSalary').value),
            specialty: document.getElementById('empSpecialty').value,
            location: document.getElementById('empLocation').value,
            username: document.getElementById('empUsername').value,
            status: document.getElementById('empStatus').value
        };
        const password = document.getElementById('empPassword').value;
        if (password) data.password = password;

        const url = id ? API + '/api/employees/' + id : API + '/api/employees';
        const method = id ? 'PUT' : 'POST';

        try {
            const r = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify(data)
            });
            const result = await r.json();
            if (r.ok && result.success) {
                alert(id ? '✅ تم التعديل' : '✅ تم الإضافة');
                closeModal();
                loadEmployees();
            } else {
                alert('❌ ' + (result.message || 'فشل الحفظ'));
            }
        } catch {
            alert('❌ فشل الاتصال بالسيرفر');
        }
    }

    // ============================================================
    // حذف موظف
    // ============================================================
    async function deleteEmployee(id) {
        if (!confirm('هل أنت متأكد من حذف هذا الموظف؟')) return;
        try {
            const r = await fetch(API + '/api/employees/' + id, {
                method: 'DELETE',
                headers: { 'Authorization': 'Bearer ' + token }
            });
            const result = await r.json();
            if (r.ok && result.success) {
                alert('✅ تم الحذف');
                loadEmployees();
            } else {
                alert('❌ ' + (result.message || 'فشل الحذف'));
            }
        } catch {
            alert('❌ فشل الاتصال بالسيرفر');
        }
    }

    // ============================================================
    // التهيئة
    // ============================================================
    (async () => {
        if (await auth()) {
            await Promise.all([loadPendingRequests(), loadEmployees()]);
        }
    })();
</script>
</body>
</html>

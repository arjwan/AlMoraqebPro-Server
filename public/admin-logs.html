<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المراقب برو - سجل الحركات والأحداث</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #2e1a47 0%, #1f1135 50%, #100820 100%); color: #1e293b; min-height: 100vh; padding: 40px; }
        .container { max-width: 1300px; margin: 0 auto; }
        
        header { background: #ffffff; padding: 25px 35px; border-radius: 24px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4); display: flex; justify-content: space-between; align-items: center; margin-bottom: 35px; flex-wrap: wrap; gap: 15px; }
        h1 { color: #0284c7; font-size: 22px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
        
        .back-btn { background: #64748b; color: white; padding: 10px 18px; border-radius: 12px; text-decoration: none; font-weight: 700; transition: 0.2s; cursor: pointer; border: none; }
        .back-btn:hover { background: #475569; }

        .section-card { background: #ffffff; padding: 30px; border-radius: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); margin-bottom: 30px; }
        .section-card h3 { color: #0369a1; margin-bottom: 20px; font-size: 18px; display: flex; align-items: center; gap: 8px; }

        table { width: 100%; border-collapse: collapse; text-align: right; font-size: 14px; }
        th { background: #f0f9ff; color: #0369a1; padding: 12px; font-weight: 700; border-bottom: 2px solid #bae6fd; }
        td { padding: 12px; border-bottom: 1px solid #e2e8f0; color: #334155; }
        tr:hover { background: #f8fafc; }

        .badge-pending { background: #f59e0b; color: #1e293b; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; }
        .badge-approved { background: #10b981; color: white; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; }
        .badge-rejected { background: #ef4444; color: white; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; }

        .btn-action { padding: 6px 14px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; font-size: 13px; transition: 0.2s; }
        .btn-approve { background: #10b981; color: white; margin-left: 5px; }
        .btn-approve:hover { background: #059669; }
        .btn-reject { background: #ef4444; color: white; }
        .btn-reject:hover { background: #dc2626; }

        .empty-text { color: #64748b; font-size: 14px; text-align: center; padding: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>📝 سجل الحركات والنشاطات الشامل</h1>
            <button onclick="history.back()" class="back-btn">⬅️ العودة لوحة التحكم</button>
        </header>

        <!-- قسم طلبات الموظفين الواردة (سلف وإجازات) -->
        <div class="section-card">
            <h3>📥 طلبات وإشعارات الموظفين الواردة (مع إمكانية القبول والرفض)</h3>
            <div id="managerRequestsContainer">
                <p class="empty-text">جاري تحميل الطلبات الواردة...</p>
            </div>
        </div>

        <!-- قسم سجل حركات النظام العامة -->
        <div class="section-card">
            <h3>📊 سجل نشاطات وحركات النظام</h3>
            <div id="systemLogsContainer">
                <table id="logsTable">
                    <thead>
                        <tr>
                            <th>نوع الحركة / الحدث</th>
                            <th>التفاصيل</th>
                            <th>المستخدم / الجهة</th>
                            <th>الوقت والتاريخ</th>
                        </tr>
                    </thead>
                    <tbody id="logsTableBody">
                        <tr>
                            <td colspan="4" class="empty-text">لا توجد حركات مسجلة حديثاً في النظام.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const currentCompany = localStorage.getItem('activeCompanyId') || 'default_company';

        // تحميل وعرض طلبات الموظفين المعلقة
        function loadManagerRequests() {
            const requests = JSON.parse(localStorage.getItem(`manager_requests_${currentCompany}`)) || [];
            const container = document.getElementById('managerRequestsContainer');

            if(requests.length === 0) {
                container.innerHTML = '<p class="empty-text">لا توجد طلبات معلقة من الموظفين حالياً.</p>';
                return;
            }

            let html = '<table>';
            html += '<tr><th>الموظف</th><th>نوع الطلب</th><th>التفاصيل والملاحظات</th><th>حالة الطلب</th><th>الإجراءات الفورية</th></tr>';

            requests.forEach((req) => {
                let statusBadge = `<span class="badge-pending">قيد الانتظار</span>`;
                if(req.status === 'approved') statusBadge = `<span class="badge-approved">تم القبول ✅</span>`;
                if(req.status === 'rejected') statusBadge = `<span class="badge-rejected">تم الرفض ❌</span>`;

                html += `<tr>
                    <td style="font-weight: bold;">${req.employeeName}</td>
                    <td>${req.type}</td>
                    <td>${req.details} <br><small style="color: #64748b;">${req.notes || 'بدون ملاحظات'}</small></td>
                    <td>${statusBadge}</td>
                    <td>
                        ${req.status === 'pending' ? `
                            <button class="btn-action btn-approve" onclick="updateRequestStatus('${req.id}', 'approved')">قبول ✅</button>
                            <button class="btn-action btn-reject" onclick="updateRequestStatus('${req.id}', 'rejected')">رفض ❌</button>
                        ` : '<span style="color: #64748b; font-size: 13px;">تم اتخاذ قرار</span>'}
                    </td>
                </tr>`;
            });
            html += '</table>';
            container.innerHTML = html;
        }

        // تحديث حالة الطلب وإرسال الإشعار الفوري للموظف وتسجيل الحدث
        function updateRequestStatus(requestId, newStatus) {
            let requests = JSON.parse(localStorage.getItem(`manager_requests_${currentCompany}`)) || [];
            const reqIndex = requests.findIndex(r => r.id === requestId);

            if(reqIndex !== -1) {
                requests[reqIndex].status = newStatus;
                localStorage.setItem(`manager_requests_${currentCompany}`, JSON.stringify(requests));

                // إضافة الحدث إلى سجل النظام العام
                logSystemEvent(
                    newStatus === 'approved' ? 'قبول طلب موظف' : 'رفض طلب موظف',
                    `تم ${newStatus === 'approved' ? 'قبول' : 'رفض'} (${requests[reqIndex].type}) للموظف: ${requests[reqIndex].employeeName}`,
                    'المدير (Admin)'
                );

                alert(newStatus === 'approved' ? '✅ تم قبول الطلب وإرسال الإشعار للموظف بنجاح!' : '❌ تم رفض الطلب وإبلاغ الموظف.');
                loadManagerRequests();
                loadSystemLogs();
            }
        }

        // تسجيل حدث في النظام
        function logSystemEvent(actionType, details, user) {
            const logs = JSON.parse(localStorage.getItem(`system_logs_${currentCompany}`)) || [];
            logs.unshift({
                type: actionType,
                details: details,
                user: user,
                timestamp: new Date().toLocaleString()
            });
            localStorage.setItem(`system_logs_${currentCompany}`, JSON.stringify(logs));
        }

        // تحميل سجل حركات النظام العامة
        function loadSystemLogs() {
            const logs = JSON.parse(localStorage.getItem(`system_logs_${currentCompany}`)) || [];
            const tbody = document.getElementById('logsTableBody');

            if(logs.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="empty-text">لا توجد حركات مسجلة حديثاً في النظام.</td></tr>';
                return;
            }

            let html = '';
            logs.forEach(log => {
                html += `<tr>
                    <td style="font-weight: bold; color: #0284c7;">${log.type}</td>
                    <td>${log.details}</td>
                    <td>${log.user}</td>
                    <td style="font-size: 12px; color: #64748b;">${log.timestamp}</td>
                </tr>`;
            });
            tbody.innerHTML = html;
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadManagerRequests();
            loadSystemLogs();
        });
    </script>
</body>
</html>

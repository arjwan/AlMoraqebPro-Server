<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>إشعارات الموظفين - المراقب برو</title>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#1e1b4b,#0c4a6e);font-family:"Segoe UI",Tahoma,sans-serif;color:#0f172a;padding:18px;min-height:100vh}.wrap{max-width:1250px;margin:auto;background:#fff;border-radius:20px;padding:20px;box-shadow:0 18px 45px #0005}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid #e2e8f0;padding-bottom:15px;margin-bottom:18px}.top h1{margin:0;font-size:25px}.actions,.form-actions,.filters{display:flex;gap:9px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:10px 15px;font-weight:800;cursor:pointer}.blue{background:#0284c7;color:#fff}.green{background:#10b981;color:#fff}.red{background:#ef4444;color:#fff}.gray{background:#e2e8f0;color:#334155}.grid{display:grid;grid-template-columns:minmax(320px,430px) 1fr;gap:18px}.panel{border:1px solid #e2e8f0;border-radius:16px;padding:17px;background:#fff}.panel h2{font-size:18px;margin:0 0 15px}.field{margin-bottom:13px}.field label{display:block;font-weight:800;color:#475569;font-size:13px;margin-bottom:6px}.field input,.field select,.field textarea,.filters input,.filters select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px;background:#fff}.field textarea{min-height:115px;resize:vertical}.audio-box{background:#f8fafc;border:1px dashed #94a3b8;border-radius:13px;padding:13px;margin-bottom:13px}.recording{color:#b91c1c;font-weight:900}.filters{margin-bottom:12px}.filters>*{flex:1;min-width:150px}.list{display:grid;gap:10px;max-height:650px;overflow:auto}.item{border:1px solid #e2e8f0;border-radius:13px;padding:13px;background:#f8fafc}.item.urgent{border-right:5px solid #ef4444;background:#fff7f7}.item-top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:7px}.item small{color:#64748b}.item p{white-space:pre-wrap;margin:7px 0}.item audio{width:100%;margin-top:8px}.status-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.tag{font-size:10px;font-weight:800;padding:4px 7px;border-radius:20px;background:#e2e8f0}.tag.ok{background:#dcfce7;color:#166534}.tag.wait{background:#fef3c7;color:#92400e}.mini{padding:6px 9px;font-size:11px}.empty{text-align:center;padding:35px;color:#64748b}.toast{position:fixed;bottom:15px;left:15px;right:15px;display:none;padding:13px;border-radius:12px;background:#0f172a;color:#fff;text-align:center;font-weight:800;z-index:9}.toast.show{display:block}@media(max-width:850px){.grid{grid-template-columns:1fr}.wrap{padding:13px}.top h1{font-size:20px}}
@media(max-width:850px){body{background:#f1f5f9;padding:7px;color:#0f172a}.wrap{padding:12px;border-radius:12px;box-shadow:0 4px 16px #0f172a20}.panel{background:#fff;padding:12px}.field input,.field select,.field textarea{background:#fff;color:#0f172a;border-color:#94a3b8}.top{color:#0f172a}}
</style>
</head>
<body>
<main class="wrap">
<header class="top"><h1>🔔 إشعارات الموظفين <small id="companyBadge"></small></h1><div class="actions"><button class="btn gray" onclick="loadAll()">🔄 تحديث</button><button class="btn blue" onclick="goHome()">🏠 الرئيسية</button></div></header>
<div class="grid">
<section class="panel">
<h2>إرسال إشعار جديد</h2>
<div class="field"><label for="recipientType">المستلمون</label><select id="recipientType" onchange="recipientChanged()"><option value="employee">موظف محدد</option><option value="branch">فرع محدد</option><option value="all">جميع الموظفين</option></select></div>
<div class="field" id="employeeField"><label for="employee">الموظف</label><select id="employee"><option value="">اختر الموظف</option></select></div>
<div class="field" id="branchField" style="display:none"><label for="branch">الفرع</label><select id="branch"><option value="">اختر الفرع</option></select></div>
<div class="field"><label for="priority">الأولوية</label><select id="priority"><option value="normal">عادي</option><option value="urgent">🚨 عاجل</option></select></div>
<div class="field"><label for="scheduledAt">موعد الإرسال (اختياري)</label><input id="scheduledAt" type="datetime-local"></div>
<div class="field"><label for="message">الرسالة الكتابية</label><textarea id="message" maxlength="2000" placeholder="اكتب رسالة المدير للموظف..."></textarea></div>
<div class="audio-box">
<div class="field"><label for="audioFile">رسالة صوتية (اختياري، حتى 5 MB)</label><input id="audioFile" type="file" accept="audio/*"></div>
<div class="form-actions"><button class="btn red" id="recordBtn" onclick="toggleRecording()">🎙️ بدء التسجيل</button><button class="btn gray" onclick="clearAudio()">مسح الصوت</button></div>
<div id="recordState" style="margin-top:9px;color:#64748b">يمكن رفع ملف صوتي أو التسجيل مباشرة.</div>
<audio id="audioPreview" controls style="display:none;width:100%;margin-top:10px"></audio>
</div>
<button class="btn green" id="sendBtn" style="width:100%" onclick="sendNotification()">إرسال الإشعار</button>
</section>
<section class="panel">
<h2>سجل الإشعارات المرسلة</h2>
<div class="filters"><input id="search" placeholder="بحث بالموظف أو الرسالة" oninput="renderHistory()"><select id="typeFilter" onchange="renderHistory()"><option value="">كل الأنواع</option><option value="text">كتابي</option><option value="voice">صوتي</option></select></div>
<div id="history" class="list"><div class="empty">جارٍ التحميل...</div></div>
</section>
</div>
</main>
<div id="toast" class="toast"></div>
<script>
const API=location.origin;let token='',companyId='',employees=[],notifications=[],recorder=null,recordedBlob=null,recordingStream=null;
const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function toast(msg,error=false){const e=$('toast');e.textContent=msg;e.style.background=error?'#991b1b':'#166534';e.classList.add('show');clearTimeout(window.__t);window.__t=setTimeout(()=>e.classList.remove('show'),3500)}
function goHome(){location.href='admin.html?company='+encodeURIComponent(companyId)}
async function auth(){token=sessionStorage.getItem('almoraqeb_admin_token')||'';companyId=new URLSearchParams(location.search).get('company')||localStorage.getItem('companyId')||'';for(let i=0;i<60&&!window.AlMoraqebOfflineAuth;i++)await new Promise(r=>setTimeout(r,50));if(!window.AlMoraqebOfflineAuth)return false;const result=await AlMoraqebOfflineAuth.authorizePage({companyId});if(!result.ok){location.href='admin_login.html';return false}companyId=result.companyId||companyId;$('companyBadge').textContent=companyId;return true}
async function get(path){const r=await fetch(API+path,{headers:{Authorization:'Bearer '+token},cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok||d.success===false)throw new Error(d.message||d.error||'تعذر الاتصال');return d}
async function loadEmployees(){try{const d=await get('/api/employees?companyId='+encodeURIComponent(companyId));employees=d.employees||[];$('employee').innerHTML='<option value="">اختر الموظف</option>'+employees.sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'ar')).map(e=>`<option value="${esc(e._id||e.id)}">${esc(e.name)} — ${esc(e.workplace||e.branch||'بدون فرع')}</option>`).join('');const branches=[...new Set(employees.map(e=>String(e.workplace||e.branch||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ar'));$('branch').innerHTML='<option value="">اختر الفرع</option>'+branches.map(b=>`<option value="${esc(b)}">${esc(b)}</option>`).join('')}catch(e){toast(e.message,true)}}
function recipientChanged(){const type=$('recipientType').value;$('employeeField').style.display=type==='employee'?'block':'none';$('branchField').style.display=type==='branch'?'block':'none'}
async function loadHistory(){try{const d=await get('/api/admin/notifications');notifications=d.notifications||[];renderHistory()}catch(e){$('history').innerHTML=`<div class="empty">❌ ${esc(e.message)}</div>`}}
async function loadAll(){await Promise.all([loadEmployees(),loadHistory()])}
function renderHistory(){const q=$('search').value.trim().toLowerCase(),type=$('typeFilter').value;const items=notifications.filter(n=>(!type||n.type===type)&&(!q||`${n.employeeName||''} ${n.message||''} ${n.targetLabel||''}`.toLowerCase().includes(q)));$('history').innerHTML=items.length?items.map(n=>{const scheduled=n.scheduledAt&&new Date(n.scheduledAt)>new Date();return `<article class="item ${n.priority==='urgent'?'urgent':''}"><div class="item-top"><strong>${n.priority==='urgent'?'🚨 ':''}${n.type==='voice'?'🎙️':'📩'} ${esc(n.employeeName||'موظف')}</strong><small>${new Date(n.createdAt).toLocaleString('ar-IQ')}</small></div><small>${esc(n.workplace||'')} — المستهدف: ${esc(n.targetLabel||n.employeeName||'')}</small>${n.message?`<p>${esc(n.message)}</p>`:''}${n.audioUrl?`<audio controls src="${esc(n.audioUrl)}"></audio>`:''}<div class="status-tags"><span class="tag ${scheduled?'wait':'ok'}">${scheduled?'⏳ مجدول '+new Date(n.scheduledAt).toLocaleString('ar-IQ'):'✅ تم الإرسال'}</span><span class="tag ${n.readAt?'ok':'wait'}">${n.readAt?'👁 تمت القراءة':'لم يُقرأ'}</span>${n.type==='voice'?`<span class="tag ${n.listenedAt?'ok':'wait'}">${n.listenedAt?'🎧 تم الاستماع':'لم يُستمع'}</span>`:''}</div><div class="form-actions" style="margin-top:9px"><button class="btn blue mini" onclick="editNotification('${esc(n._id)}')">تعديل</button><button class="btn red mini" onclick="deleteNotification('${esc(n._id)}')">حذف</button></div></article>`}).join(''):'<div class="empty">لا توجد إشعارات مطابقة.</div>'}
async function toggleRecording(){if(recorder&&recorder.state==='recording'){recorder.stop();return}if(!navigator.mediaDevices?.getUserMedia){toast('التسجيل الصوتي غير مدعوم في هذا المتصفح',true);return}try{recordingStream=await navigator.mediaDevices.getUserMedia({audio:true});const chunks=[];recorder=new MediaRecorder(recordingStream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{recordedBlob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});$('audioPreview').src=URL.createObjectURL(recordedBlob);$('audioPreview').style.display='block';$('recordState').textContent='✅ التسجيل جاهز للإرسال';$('recordState').className='';$('recordBtn').textContent='🎙️ بدء تسجيل جديد';recordingStream.getTracks().forEach(t=>t.stop())};recorder.start();$('recordBtn').textContent='⏹ إيقاف التسجيل';$('recordState').textContent='● جارٍ التسجيل...';$('recordState').className='recording'}catch(e){toast('تعذر الوصول إلى الميكروفون',true)}}
function clearAudio(){if(recorder?.state==='recording')recorder.stop();recordedBlob=null;$('audioFile').value='';$('audioPreview').removeAttribute('src');$('audioPreview').style.display='none';$('recordState').textContent='يمكن رفع ملف صوتي أو التسجيل مباشرة.'}
async function sendNotification(){const targetType=$('recipientType').value,employeeId=$('employee').value,branch=$('branch').value,message=$('message').value.trim(),file=$('audioFile').files[0];if(targetType==='employee'&&!employeeId){toast('اختر الموظف',true);return}if(targetType==='branch'&&!branch){toast('اختر الفرع',true);return}if(!message&&!file&&!recordedBlob){toast('اكتب رسالة أو أضف تسجيلًا صوتيًا',true);return}const form=new FormData();form.append('targetType',targetType);form.append('employeeId',employeeId);form.append('branch',branch);form.append('priority',$('priority').value);form.append('scheduledAt',$('scheduledAt').value);form.append('message',message);if(file)form.append('audio',file);else if(recordedBlob)form.append('audio',recordedBlob,'manager-voice.webm');const btn=$('sendBtn');btn.disabled=true;btn.textContent='جارٍ الإرسال...';try{const r=await fetch(API+'/api/admin/notifications',{method:'POST',headers:{Authorization:'Bearer '+token},body:form});const d=await r.json().catch(()=>({}));if(!r.ok||d.success===false)throw new Error(d.message||d.error||'تعذر الإرسال');$('message').value='';$('scheduledAt').value='';clearAudio();toast(`✅ تم تجهيز الإشعار لـ ${d.count||1} موظف`);await loadHistory()}catch(e){toast(e.message,true)}finally{btn.disabled=false;btn.textContent='إرسال الإشعار'}}
async function editNotification(id){const n=notifications.find(x=>String(x._id)===String(id));if(!n)return;const message=prompt('نص الإشعار',n.message||'');if(message===null)return;const urgent=confirm('هل تريد جعل الإشعار عاجلًا؟');try{const r=await fetch(API+'/api/admin/notifications/'+encodeURIComponent(id),{method:'PUT',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({message,priority:urgent?'urgent':'normal'})});const d=await r.json().catch(()=>({}));if(!r.ok||d.success===false)throw new Error(d.message||d.error||'تعذر التعديل');toast('✅ تم تعديل الإشعار');await loadHistory()}catch(e){toast(e.message,true)}}
async function deleteNotification(id){if(!confirm('هل تريد حذف هذا الإشعار؟'))return;try{const r=await fetch(API+'/api/admin/notifications/'+encodeURIComponent(id),{method:'DELETE',headers:{Authorization:'Bearer '+token}});const d=await r.json().catch(()=>({}));if(!r.ok||d.success===false)throw new Error(d.message||d.error||'تعذر الحذف');toast('✅ تم حذف الإشعار');await loadHistory()}catch(e){toast(e.message,true)}}
(async()=>{if(await auth())await loadAll()})();
</script>
<script src="/offline_db.js"></script><script src="/offline_sync.js"></script><script src="/offline_auth.js"></script><script src="/offline_boot.js"></script>
</body></html>

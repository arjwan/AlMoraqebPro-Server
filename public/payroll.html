<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة الرواتب - نظام المراقب برو</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0f172a;
            --secondary: #312e81;
            --accent: #6366f1;
            --success: #10b981;
            --danger: #ef4444;
            --bg-light: #f1f5f9;
            --card-bg: #ffffff;
            --border: #cbd5e1;
            --text-main: #1e293b;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-light);
            margin: 0;
            padding: 30px 15px;
            color: var(--text-main);
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.08);
        }

        /* شريط التنقل الموحد */
        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            background: #e2e8f0;
            padding: 12px;
            border-radius: 12px;
            flex-wrap: wrap;
        }
        .nav-link {
            text-decoration: none;
            padding: 10px 18px;
            background: #fff;
            border-radius: 8px;
            font-weight: 700;
            color: #1e293b;
            font-size: 14px;
            transition: all 0.2s;
        }
        .nav-link:hover, .nav-link.active {
            background: var(--accent);
            color: white;
        }

        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--bg-light);
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        h2 {
            color: var(--primary);
            font-weight: 900;
            margin: 0;
            font-size: 26px;
        }

        .form-section {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            border: 1.5px solid var(--border);
        }

        .section-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--secondary);
            margin-bottom: 18px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--bg-light);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width { grid-column: span 3; }

        label {
            margin-bottom: 8px;
            font-weight: 700;
            font-size: 13px;
            color: #334155;
        }

        input, select {
            padding: 12px 14px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            font-family: 'Cairo', sans-serif;
            background-color: #f8fafc;
            outline: none;
            transition: all 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--accent);
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
        }

        .result-box {
            margin-top: 30px;
            background: #f8fafc;
            border: 2px dashed var(--border);
            padding: 25px;
            border-radius: 14px;
            display: none;
        }

        .result-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 15px;
        }

        .result-item {
            background: white;
            padding: 15px;
            border-radius: 10px;
            border: 1.5px solid var(--border);
            text-align: center;
        }

        .result-item span {
            display: block;
            font-size: 12px;
            color: #64748b;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .result-item strong {
            font-size: 18px;
            color: var(--primary);
        }

        .net-salary {
            background: #d1fae5 !important;
            border-color: #10b981 !important;
        }
        .net-salary strong {
            color: #065f46 !important;
            font-size: 22px !important;
        }

        .btn-calc {
            grid-column: span 3;
            padding: 14px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 15px;
            font-family: 'Cairo', sans-serif;
        }
        .btn-calc:hover { background-color: #4f46e5; }
    </style>
</head>
<body>

<div class="container">
    <!-- شريط التنقل الموحد -->
    <div class="nav-tabs">
        <a href="dashboard.html" class="nav-link">🏠 الرئيسية</a>
        <a href="add-employee.html" class="nav-link">➕ إضافة موظف</a>
        <a href="update-employee.html" class="nav-link">🔄 تحديث بيانات</a>
        <a href="fingerprints.html" class="nav-link">📍 سجل البصمات</a>
        <a href="payroll.html" class="nav-link active">🧮 حاسبة الرواتب</a>
        <a href="payroll-report.html" class="nav-link">📊 كشف الرواتب</a>
        <a href="settings.html" class="nav-link">⚙️ الإعدادات</a>
    </div>

    <div class="header-flex">
        <h2>حاسبة الرواتب والخصومات الشهرية</h2>
    </div>

    <form id="payrollForm" class="form-section" onsubmit="calculatePayroll(event)">
        <div class="form-group full-width" style="margin-bottom: 20px;">
            <label style="font-size: 15px; color: var(--primary);">اختر الموظف لحساب راتبه:</label>
            <select id="selectEmpPayroll" onchange="loadEmpSalary()" required style="background: #e2e8f0; font-weight: bold;">
                <option value="">-- اضغط لاختيار الموظف --</option>
            </select>
        </div>

        <div class="section-title">بيانات الحساب الشهري</div>
        <div class="form-grid">
            <div class="form-group">
                <label>الراتب الأساسي الشهري (د.ع):</label>
                <input type="number" id="base_salary" step="0.01" readonly style="background: #e2e8f0;">
            </div>
            <div class="form-group">
                <label>أيام الحضور الفعلية:</label>
                <input type="number" id="present_days" value="30" min="0" max="31" required>
            </div>
            <div class="form-group">
                <label>أيام الغياب:</label>
                <input type="number" id="absent_days" value="0" min="0" max="31" required>
            </div>
            <div class="form-group">
                <label>ساعات العمل الإضافي:</label>
                <input type="number" id="overtime_hours" value="0" min="0" step="0.5" required>
            </div>
            <div class="form-group">
                <label>الخصومات أو السلف الإضافية (د.ع):</label>
                <input type="number" id="deductions" value="0" min="0" step="0.01" required>
            </div>
            <div class="form-group">
                <label>المكافآت والحوافز (د.ع):</label>
                <input type="number" id="bonuses" value="0" min="0" step="0.01" required>
            </div>
            <button type="submit" class="btn-calc">🧮 حساب صافي الراتب بدقة</button>
        </div>

        <!-- صندوق النتيجة -->
        <div id="resultBox" class="result-box">
            <div class="section-title" style="margin-bottom: 10px;">نتيجة الحساب التفصيلية</div>
            <div class="result-grid">
                <div class="result-item"><span>إجمالي الاستحقاق</span><strong id="resGross">0 د.ع</strong></div>
                <div class="result-item"><span>إجمالي الاستقطاعات</span><strong id="resDeductions">0 د.ع</strong></div>
                <div class="result-item net-salary"><span>صافي الراتب النهائي</span><strong id="resNet">0 د.ع</strong></div>
            </div>
        </div>
    </form>
</div>

<script>
    if (localStorage.getItem('isLoggedIn') !== 'true') {
        window.location.href = 'login.html';
    }

    const apiUrl = '/api/employees';
    let employeesData = [];

    async function fetchEmployeesForPayroll() {
        try {
            const res = await fetch(apiUrl);
            employeesData = await res.json();
            const select = document.getElementById('selectEmpPayroll');
            select.innerHTML = '<option value="">-- اضغط لاختيار الموظف --</option>';
            employeesData.forEach(emp => {
                select.innerHTML += `<option value="${emp.id}" data-salary="${emp.salary || 0}">${emp.name} (${emp.job_title}) - راتب: ${emp.salary || 0}</option>`;
            });
        } catch (err) {
            console.error('Error loading employees:', err);
        }
    }

    function loadEmpSalary() {
        const select = document.getElementById('selectEmpPayroll');
        const selectedOption = select.options[select.selectedIndex];
        const salary = selectedOption.getAttribute('data-salary') || 0;
        document.getElementById('base_salary').value = salary;
        document.getElementById('resultBox').style.display = 'none';
    }

    function calculatePayroll(e) {
        e.preventDefault();
        const baseSalary = parseFloat(document.getElementById('base_salary').value) || 0;
        const presentDays = parseFloat(document.getElementById('present_days').value) || 0;
        const absentDays = parseFloat(document.getElementById('absent_days').value) || 0;
        const overtimeHours = parseFloat(document.getElementById('overtime_hours').value) || 0;
        const manualDeductions = parseFloat(document.getElementById('deductions').value) || 0;
        const bonuses = parseFloat(document.getElementById('bonuses').value) || 0;

        // افتراض احتساب اليوم بناء على 30 يوم
        const dailyRate = baseSalary / 30;
        const hourlyRate = dailyRate / 8; // افتراض 8 ساعات عمل يومياً

        // حساب خصم الغياب
        const absenceDeduction = absentDays * dailyRate;
        
        // حساب أجر الساعات الإضافية (باعتبار الساعة بضربها في 1.5 كمثال أو حسب رغبة المدير)
        const overtimePay = overtimeHours * (hourlyRate * 1.5);

        // إجمالي الاستقطاعات
        const totalDeductions = absenceDeduction + manualDeductions;

        // إجمالي الإضافات
        const totalAdditions = bonuses + overtimePay;

        // صافي الراتب
        const netSalary = (baseSalary - totalDeductions) + totalAdditions;

        // عرض النتائج
        document.getElementById('resGross').innerText = (baseSalary + totalAdditions).toFixed(2) + ' د.ع';
        document.getElementById('resDeductions').innerText = totalDeductions.toFixed(2) + ' د.ع';
        document.getElementById('resNet').innerText = netSalary.toFixed(2) + ' د.ع';
        document.getElementById('resultBox').style.display = 'block';
    }

    fetchEmployeesForPayroll();
</script>

</body>
</html>

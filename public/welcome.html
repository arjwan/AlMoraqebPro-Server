<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المراقب برو - مرحباً بك</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1b2e;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .welcome-card {
            background-color: #262338;
            border-radius: 16px;
            padding: 40px 30px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }
        .logo-container img {
            width: 70px;
            height: 70px;
            margin-bottom: 15px;
        }
        .logo-placeholder {
            font-size: 40px;
            margin-bottom: 15px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #f3f4f6;
        }
        p {
            font-size: 14px;
            color: #9ca3af;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            margin-bottom: 15px;
            transition: background 0.3s;
        }
        .btn-primary {
            background-color: #0284c7;
            color: #ffffff;
            border: none;
        }
        .btn-primary:hover {
            background-color: #0369a1;
        }
        .btn-outline {
            background-color: transparent;
            color: #e5e7eb;
            border: 1px solid #4b5563;
        }
        .btn-outline:hover {
            background-color: #374151;
        }
        .developer-info {
            margin-top: 30px;
            font-size: 12px;
            color: #6b7280;
            border-top: 1px solid #374151;
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <div class="welcome-card">
        <!-- شعار البرنامج -->
        <div class="logo-container">
            <div class="logo-placeholder">🛡️</div>
        </div>

        <h1>المراقب برو</h1>
        <p>النظام الذكي لإدارة الحضور، المنشآت، وبيانات الموظفين بكل كفاءة وأمان عبر بصمة الوجه والموقع الجغرافي.</p>

        <!-- أزرار التوجيه الموحدة -->
        <a href="login.html" class="btn btn-primary">تسجيل الدخول</a>
        <a href="register.html" class="btn btn-outline">إنشاء حساب جديد</a>

        <!-- معلومات المطور -->
        <div class="developer-info">
            تطوير وبرمجة: محمد العبيدي<br>
            mohmmed1626@gmail.com
        </div>
    </div>

</body>
</html>

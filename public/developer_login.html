<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#312e81">
<title>دخول المطور | المراقب برو</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at top right,#4338ca 0,#1e1b4b 35%,#0f172a 100%);font-family:Tahoma,"Segoe UI",Arial,sans-serif;color:#0f172a}.card{width:min(430px,100%);background:#fff;border-radius:24px;padding:32px;box-shadow:0 24px 70px rgba(0,0,0,.42)}.logo{width:70px;height:70px;margin:0 auto 16px;display:grid;place-items:center;border-radius:22px;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;font-size:32px}.title{text-align:center;font-size:25px;font-weight:900}.sub{text-align:center;color:#64748b;font-size:13px;line-height:1.8;margin:7px 0 25px}.field{text-align:right}.field label{display:block;margin-bottom:7px;color:#334155;font-size:13px;font-weight:800}.password-wrap{position:relative}.field input{width:100%;height:50px;border:2px solid #cbd5e1;border-radius:13px;padding:0 14px 0 52px;font-size:16px;outline:none;background:#f8fafc}.field input:focus{border-color:#6366f1;background:#fff;box-shadow:0 0 0 4px #e0e7ff}.show{position:absolute;left:6px;top:6px;width:39px;height:38px;border:0;border-radius:9px;background:#eef2ff;cursor:pointer;font-size:17px}.submit{width:100%;height:50px;margin-top:17px;border:0;border-radius:13px;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;font-size:16px;font-weight:900;cursor:pointer}.submit:disabled{opacity:.65;cursor:wait}.message{display:none;margin-top:14px;padding:12px;border-radius:11px;font-size:13px;font-weight:800;line-height:1.6}.message.error{display:block;background:#fef2f2;color:#991b1b}.message.info{display:block;background:#eef2ff;color:#3730a3}.back{display:block;text-align:center;margin-top:20px;color:#64748b;font-size:12px;text-decoration:none}.back:hover{color:#4338ca}.security{text-align:center;color:#94a3b8;font-size:11px;margin-top:15px}
</style>
</head>
<body>
<main class="card">
    <div class="logo" aria-hidden="true">🛠️</div>
    <div class="title">بوابة المطور</div>
    <div class="sub">واجهة خاصة بإدارة النظام والشركات<br>وليست مخصصة لمديري الشركات أو الموظفين.</div>
    <form id="developerLogin">
        <div class="field">
            <label for="username">اسم مستخدم المطور</label>
            <input id="username" name="username" type="text" autocomplete="username" required autofocus placeholder="اسم المستخدم">
        </div>
        <div class="field" style="margin-top:14px">
            <label for="password">كلمة مرور المطور</label>
            <div class="password-wrap">
                <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="أدخل كلمة المرور">
                <button class="show" type="button" id="togglePassword" aria-label="إظهار كلمة المرور">👁️</button>
            </div>
        </div>
        <div class="field" style="margin-top:14px">
            <label for="otp">رمز المصادقة</label>
            <input id="otp" name="otp" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required placeholder="000000">
        </div>
        <button class="submit" id="submitButton" type="submit">دخول آمن</button>
        <div class="message" id="message" role="alert" aria-live="polite"></div>
    </form>
    <a class="back" href="/admin_login.html">العودة إلى دخول المدير</a>
    <div class="security">🔐 كلمة المرور + FIDO2 / WebAuthn</div>
</main>
<script>
(function(){
'use strict';
const form=document.getElementById('developerLogin'), username=document.getElementById('username'), password=document.getElementById('password'), button=document.getElementById('submitButton'), message=document.getElementById('message');
const next=new URLSearchParams(location.search).get('next');
const destination=next&&next.startsWith('/developer/')&&!next.startsWith('//')?next:'/developer/create-company';
const b64ToBytes=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/').padEnd(Math.ceil(s.length/4)*4,'=')),c=>c.charCodeAt(0));
const bytesToB64=b=>{let s='';new Uint8Array(b).forEach(x=>s+=String.fromCharCode(x));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
function prepCreate(o){o.challenge=b64ToBytes(o.challenge);o.user.id=b64ToBytes(o.user.id);(o.excludeCredentials||[]).forEach(x=>x.id=b64ToBytes(x.id));return o}
function prepGet(o){o.challenge=b64ToBytes(o.challenge);(o.allowCredentials||[]).forEach(x=>x.id=b64ToBytes(x.id));return o}
function credentialJSON(c){const r={id:c.id,rawId:bytesToB64(c.rawId),type:c.type,response:{clientDataJSON:bytesToB64(c.response.clientDataJSON)}};if(c.response.attestationObject)r.response.attestationObject=bytesToB64(c.response.attestationObject);if(c.response.authenticatorData)r.response.authenticatorData=bytesToB64(c.response.authenticatorData);if(c.response.signature)r.response.signature=bytesToB64(c.response.signature);if(c.response.userHandle)r.response.userHandle=bytesToB64(c.response.userHandle);if(c.response.getTransports)r.response.transports=c.response.getTransports();return r}
async function post(url,body){const r=await fetch(url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json().catch(()=>({}));if(!r.ok||!d.success)throw Error(d.message||'تعذر التحقق');return d}
document.getElementById('togglePassword').onclick=function(){const v=password.type==='text';password.type=v?'password':'text';this.textContent=v?'👁️':'🙈'};
form.addEventListener('submit',async e=>{
 e.preventDefault();button.disabled=true;message.className='message info';message.textContent='المرحلة الأولى: التحقق من بيانات المطور...';
 try{
  if(!window.PublicKeyCredential)throw Error('هذا المتصفح لا يدعم FIDO2 / WebAuthn');
  const first=await post('/api/developer/webauthn/password',{username:username.value.trim(),password:password.value});
  if(first.registered){
   message.textContent='استخدم مفتاح الأمان أو بصمة/قفل الجهاز...';
   const o=await post('/api/developer/webauthn/auth/options',{ticket:first.ticket});
   const cred=await navigator.credentials.get({publicKey:prepGet(o.options)});
   await post('/api/developer/webauthn/auth/verify',{ticket:first.ticket,response:credentialJSON(cred)});
  }else{
   message.textContent='الإعداد الأول: سجّل مفتاح FIDO2 أو بصمة/قفل هذا الجهاز...';
   const o=await post('/api/developer/webauthn/register/options',{ticket:first.ticket});
   const cred=await navigator.credentials.create({publicKey:prepCreate(o.options)});
   await post('/api/developer/webauthn/register/verify',{ticket:first.ticket,response:credentialJSON(cred)});
  }
  message.textContent='تم التحقق بـ FIDO2، جارٍ فتح لوحة المطور...';location.replace(destination);
 }catch(err){message.className='message error';message.textContent='❌ '+(err.message||'فشل التحقق');button.disabled=false}
});
}());
</script>
</body>
</html>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>أرشيف النظام - المراقب برو</title>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#1e1b4b,#0c4a6e);font-family:"Segoe UI",Tahoma,sans-serif;color:#0f172a;padding:18px;min-height:100vh}.wrap{max-width:1500px;margin:auto;background:#fff;border-radius:20px;padding:20px;box-shadow:0 18px 45px #0005}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid #e2e8f0;padding-bottom:14px;margin-bottom:16px}.top h1{margin:0}.actions,.filters,.types,.archive-form{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.blue{background:#0284c7;color:#fff}.green{background:#10b981;color:#fff}.red{background:#ef4444;color:#fff}.orange{background:#f59e0b;color:#fff}.gray{background:#e2e8f0;color:#334155}.type.active{background:#1e293b;color:#fff}.filters,.document-panel{padding:13px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:13px;margin:14px 0}.filters input,.document-panel input,.document-panel select{padding:10px;border:1px solid #cbd5e1;border-radius:9px;min-width:150px;flex:1}.document-panel{display:none}.document-panel.show{display:block}.document-panel h3{margin:0 0 10px}.profile-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:12px 0}.profile-grid label{font-size:11px;font-weight:800;color:#475569}.profile-grid input,.profile-grid select{display:block;width:100%;margin-top:5px}.profile-photo{width:90px;height:90px;border-radius:16px;object-fit:cover;background:#e2e8f0;border:1px solid #cbd5e1}.profile-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.archive-warning{padding:11px;border-radius:10px;background:#fff7ed;color:#9a3412;border:1px solid #fdba74;font-weight:800;margin:12px 0}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.stat{padding:13px;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc}.stat small{display:block;color:#64748b;font-weight:700}.stat b{font-size:20px}.table-wrap{overflow:auto;border:1px solid #e2e8f0;border-radius:13px}table{width:100%;border-collapse:collapse;min-width:950px}th{background:#1e293b;color:#fff;padding:11px;text-align:right}td{padding:10px;border-bottom:1px solid #e2e8f0}tr:hover td{background:#f8fafc}.file-link{color:#0369a1;font-weight:800}.mini{padding:6px 9px;font-size:11px}.empty{text-align:center;padding:35px;color:#64748b}.notice{margin-top:12px;padding:11px;border-radius:10px;background:#e0f2fe;color:#075985;text-align:center;font-weight:800}@media(max-width:1000px){.profile-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.summary,.profile-grid{grid-template-columns:1fr}.wrap{padding:12px}.top h1{font-size:20px}}@media print{body{background:#fff;padding:0}.wrap{box-shadow:none;max-width:none}.top .actions,.types,.filters,.notice,.document-panel,.archive-warning{display:none}table{min-width:0;font-size:10px}}
@media(max-width:700px){body{background:#f1f5f9;padding:7px;color:#0f172a}.wrap{padding:12px;border-radius:12px;box-shadow:0 4px 16px #0f172a20}.types{display:grid;grid-template-columns:1fr 1fr}.types .btn{width:100%}.filters,.archive-form{display:grid;grid-template-columns:1fr}.filters input,.document-panel input,.document-panel select{min-width:0;width:100%}.profile-head{align-items:stretch}.profile-head select,.profile-head input{width:100%}}
</style>
</head>
<body><main class="wrap">
<header class="top"><h1>📁 أرشيف النظام <small id="companyBadge"></small></h1><div class="actions"><button class="btn orange" id="snapshotBtn" onclick="createSnapshot()">🔒 حفظ نسخة شاملة</button><button class="btn green" onclick="window.print()">🖨 طباعة</button><button class="btn blue" onclick="goHome()">🏠 الرئيسية</button></div></header>
<div class="archive-warning">🔒 المعلومات والعمليات المؤرشفة دائمة ولا تُحذف. ملف الموظف ووثائقه فقط يمكن تعديلهما أو حذف الوثيقة.</div>
<nav class="types">
<button class="btn gray type" data-type="documents" onclick="chooseType('documents',this)">وثائق الموظفين</button>
<button class="btn gray type" data-type="information" onclick="chooseType('information',this)">المعلومات المحفوظة</button>
<button class="btn gray type" data-type="operations" onclick="chooseType('operations',this)">عمليات الأرشفة</button>
<button class="btn gray type active" data-type="salary" onclick="chooseType('salary',this)">الرواتب</button>
<button class="btn gray type" data-type="batches" onclick="chooseType('batches',this)">دفعات الصرف</button>
<button class="btn gray type" data-type="attendance" onclick="chooseType('attendance',this)">الحضور</button>
<button class="btn gray type" data-type="delegation" onclick="chooseType('delegation',this)">الإيفادات</button>
<button class="btn gray type" data-type="evaluation" onclick="chooseType('evaluation',this)">التقييمات</button>
<button class="btn gray type" data-type="notifications" onclick="chooseType('notifications',this)">الإشعارات</button>
</nav>
<section id="documentPanel" class="document-panel">
<h3>ملف الموظف ووثائقه</h3>
<div class="profile-head"><img id="profilePhotoPreview" class="profile-photo" alt="صورة الموظف"><select id="profileEmployee" onchange="fillEmployeeProfile()"><option value="">اختر الموظف لعرض ملفه</option></select><input id="profilePhoto" type="file" accept="image/*" onchange="previewProfilePhoto()"></div>
<div class="profile-grid">
<label>الاسم<input id="profileName"></label><label>الاختصاص<input id="profileSpecialty"></label><label>مكان العمل<input id="profileWorkplace"></label><label>الراتب<input id="profileSalary" type="number"></label>
<label>تاريخ البدء<input id="profileHireDate" type="date"></label><label>الشهادة<input id="profileCertificate"></label><label>البلد<input id="profileNationality"></label><label>المحافظة<input id="profileProvince"></label>
<label>المدينة<input id="profileCity"></label><label>القضاء أو الحي<input id="profileDistrict"></label><label>المحلة<input id="profileNeighborhood"></label><label>الشارع<input id="profileStreet"></label>
<label>الزقاق<input id="profileAlley"></label><label>الدار أو البناية<input id="profileBuildingNumber"></label><label>رقم الهاتف<input id="profilePhoneNumber"></label><label>أقرب نقطة دالة<input id="profileNearestLandmark"></label>
<label style="grid-column:1/-1">العنوان الكامل<input id="profileFullAddress"></label>
</div>
<h3>أرقام ووثائق الموظف الرسمية</h3>
<div class="profile-grid">
<label>رقم البطاقة الموحدة<input id="profileUnifiedCardNumber"></label><label>جهة إصدار الموحدة<input id="profileUnifiedCardIssuer"></label><label>تاريخ إصدار الموحدة<input id="profileUnifiedCardIssueDate" type="date"></label><label>تاريخ نفاذ الموحدة<input id="profileUnifiedCardExpiryDate" type="date"></label>
<label>رقم بطاقة السكن<input id="profileResidenceCardNumber"></label><label>جهة إصدار بطاقة السكن<input id="profileResidenceCardIssuer"></label><label>تاريخ إصدار بطاقة السكن<input id="profileResidenceCardIssueDate" type="date"></label><label>تاريخ نفاذ بطاقة السكن<input id="profileResidenceCardExpiryDate" type="date"></label>
<label>رقم جواز السفر<input id="profilePassportNumber"></label><label>جهة إصدار الجواز<input id="profilePassportIssuer"></label><label>تاريخ إصدار الجواز<input id="profilePassportIssueDate" type="date"></label><label>تاريخ نفاذ الجواز<input id="profilePassportExpiryDate" type="date"></label>
</div>
<div class="actions"><button class="btn blue" id="saveProfileBtn" onclick="saveEmployeeProfile()">حفظ تعديلات ملف الموظف</button><button class="btn green" onclick="printEmployeeProfile()">🖨 طباعة ورقة معلومات الموظف</button></div>
<hr style="border:0;border-top:1px solid #cbd5e1;margin:18px 0">
<h3>إضافة وثيقة للموظف</h3>
<div class="archive-form"><select id="documentEmployee"><option value="">اختر الموظف</option></select><select id="documentType"><option value="identity">هوية</option><option value="contract">عقد</option><option value="certificate">شهادة</option><option value="medical">تقرير طبي</option><option value="other">أخرى</option></select><input id="documentTitle" placeholder="عنوان الوثيقة"><input id="documentFile" type="file" accept="image/*,.pdf,.doc,.docx"><input id="documentNote" placeholder="ملاحظة اختيارية"><button class="btn green" id="uploadBtn" onclick="uploadDocument()">حفظ الوثيقة</button></div>
</section>
<section class="filters"><input id="search" placeholder="بحث في الأرشيف" oninput="render()"><input id="from" type="date"><input id="to" type="date"><button class="btn blue" onclick="loadArchive()">عرض</button><button class="btn gray" onclick="clearFilters()">مسح الفلاتر</button></section>
<section class="summary"><div class="stat"><small>القسم</small><b id="sumType">الرواتب</b></div><div class="stat"><small>عدد السجلات</small><b id="sumCount">0</b></div><div class="stat"><small>إجمالي القيمة</small><b id="sumAmount">—</b></div></section>
<div class="table-wrap"><table><thead id="head"></thead><tbody id="body"><tr><td class="empty">جارٍ تحميل الأرشيف...</td></tr></tbody></table></div>
<div id="notice" class="notice">جاهز</div>
</main>
<script>
const API=location.origin;let token='',companyId='',archiveType='salary',records=[],employees=[];const $=id=>document.getElementById(id);const labels={documents:'وثائق الموظفين',information:'المعلومات المحفوظة',operations:'عمليات الأرشفة',salary:'الرواتب',batches:'دفعات الصرف',attendance:'الحضور',delegation:'الإيفادات',evaluation:'التقييمات',notifications:'الإشعارات'};
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function money(v){return Number(v||0).toLocaleString('ar-IQ')}function date(v,withTime=false){if(!v)return '—';const d=new Date(v);if(Number.isNaN(d.getTime()))return '—';return withTime?d.toLocaleString('ar-IQ'):d.toLocaleDateString('ar-IQ')}function goHome(){location.href='admin.html?company='+encodeURIComponent(companyId)}
async function auth(){token=sessionStorage.getItem('almoraqeb_admin_token')||'';companyId=new URLSearchParams(location.search).get('company')||localStorage.getItem('companyId')||'';for(let i=0;i<60&&!window.AlMoraqebOfflineAuth;i++)await new Promise(r=>setTimeout(r,50));if(!window.AlMoraqebOfflineAuth)return false;const result=await AlMoraqebOfflineAuth.authorizePage({companyId});if(!result.ok){location.href='admin_login.html';return false}companyId=result.companyId||companyId;$('companyBadge').textContent=companyId;return true}
async function api(path){const r=await fetch(API+path,{headers:{Authorization:'Bearer '+token},cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok||d.success===false)throw new Error(d.message||d.error||'تعذر تحميل الأرشيف');return d}
function chooseType(type,button){archiveType=type;document.querySelectorAll('.type').forEach(x=>x.classList.remove('active'));button.classList.add('active');$('sumType').textContent=labels[type];$('documentPanel').classList.toggle('show',type==='documents');loadArchive()}
function rangeParams(){const q=new URLSearchParams({type:archiveType,scope:'company'});if($('from').value)q.set('from',$('from').value);if($('to').value)q.set('to',$('to').value);return q}
async function loadArchive(){const n=$('notice');n.textContent='جارٍ تحميل البيانات...';try{let d;if(['documents','information','operations'].includes(archiveType)){const category=archiveType==='documents'?'employee_document':archiveType==='information'?'information':'operation';d=await api('/api/admin/archive?category='+category);records=d.records||[]}else if(archiveType==='batches'){d=await api('/api/admin/payroll-batches');records=d.batches||[]}else if(archiveType==='notifications'){d=await api('/api/admin/notifications');records=d.notifications||[]}else{d=await api('/api/admin/reports?'+rangeParams());records=archiveType==='attendance'?(d.attendance||[]):(d.records||[])}render();n.textContent='✅ تم تحميل الأرشيف';n.style.background='#dcfce7';n.style.color='#166534'}catch(e){records=[];render();n.textContent='❌ '+e.message;n.style.background='#fee2e2';n.style.color='#991b1b'}}
function filtered(){const q=$('search').value.trim().toLowerCase(),from=$('from').value?new Date($('from').value+'T00:00:00'):null,to=$('to').value?new Date($('to').value+'T23:59:59'):null;return records.filter(r=>{const text=Object.values(r).filter(v=>typeof v==='string'||typeof v==='number').join(' ').toLowerCase();const raw=r.createdAt||r.timestamp||r.approvedAt||r.fromDate||r.from;const d=raw?new Date(raw):null;return(!q||text.includes(q))&&(!from||!d||d>=from)&&(!to||!d||d<=to)})}
function render(){const data=filtered();$('sumCount').textContent=data.length;$('sumAmount').textContent=['salary','batches'].includes(archiveType)?money(data.reduce((s,r)=>s+Number(r.netSalary||r.totalAmount||0),0))+' د.ع':'—';const configs={documents:{h:['الموظف','نوع الوثيقة','العنوان','ملاحظة','الملف','تاريخ الحفظ','الإجراءات'],r:x=>[x.employeeName,x.documentType,x.title,x.note,{html:`<a class="file-link" href="${esc(x.fileUrl)}" target="_blank">فتح الوثيقة</a>`},date(x.createdAt,true),{html:`<button class="btn blue mini" onclick="editDocument('${esc(x._id)}')">تعديل</button> <button class="btn red mini" onclick="deleteDocument('${esc(x._id)}')">حذف</button>`}]},information:{h:['المصدر','الموظف','العنوان','رقم النسخة','تاريخ الحفظ'],r:x=>[x.sourceType,x.employeeName||'—',x.title,x.snapshotId,date(x.createdAt,true)]},operations:{h:['العملية','رقم النسخة','المنفذ','ملاحظة','التاريخ'],r:x=>[x.title,x.snapshotId,x.archivedBy,x.note,date(x.createdAt,true)]},salary:{h:['الموظف','الفرع','الأساسي','الاستقطاعات','الصافي','حالة الصرف','التاريخ'],r:x=>[x.employeeName,x.workplace,money(x.basicSalary),money(x.totalDeductions),money(x.netSalary),x.payoutStatus||'—',date(x.createdAt)]},batches:{h:['رقم الدفعة','النوع','الفرع','الموظفون','الإجمالي','الحالة','تاريخ الاعتماد'],r:x=>[x.batchNumber,x.payoutType,x.branch||'كل الفروع',x.employeesCount,money(x.totalAmount),x.status,date(x.approvedAt,true)]},attendance:{h:['الموظف','النوع','الشفت','الموقع','الحالة','التاريخ'],r:x=>[x.employeeName||x.employeeId,x.type,x.shiftName,x.workplace,x.attendanceStatus||'—',date(x.timestamp,true)]},delegation:{h:['الموظف','الفرع','من','إلى','المكان','السبب'],r:x=>[x.employeeName,x.branch,date(x.from),date(x.to),x.locationName,x.reason]},evaluation:{h:['الموظف','الفترة','المجموع','التقدير','من','إلى'],r:x=>[x.employeeName,x.periodType,x.totalScore,x.grade,date(x.fromDate),date(x.toDate)]},notifications:{h:['الموظف','الفرع','النوع','الرسالة','الصوت','التاريخ'],r:x=>[x.employeeName,x.workplace,x.type==='voice'?'صوتي':'كتابي',x.message,x.audioUrl?'مرفق':'—',date(x.createdAt,true)]}};const c=configs[archiveType];$('head').innerHTML='<tr>'+c.h.map(h=>`<th>${h}</th>`).join('')+'</tr>';$('body').innerHTML=data.length?data.map(x=>'<tr>'+c.r(x).map(v=>typeof v==='object'&&v.html?`<td>${v.html}</td>`:`<td>${esc(v??'')}</td>`).join('')+'</tr>').join(''):`<tr><td colspan="${c.h.length}" class="empty">لا توجد سجلات مطابقة</td></tr>`}
function clearFilters(){$('search').value='';$('from').value='';$('to').value='';loadArchive()}
async function loadEmployees(){const d=await api('/api/employees?companyId='+encodeURIComponent(companyId));employees=d.employees||[];const options=employees.map(e=>`<option value="${esc(e._id||e.id)}">${esc(e.name)} — ${esc(e.workplace||e.branch||'')}</option>`).join('');$('documentEmployee').innerHTML='<option value="">اختر الموظف</option>'+options;$('profileEmployee').innerHTML='<option value="">اختر الموظف لعرض ملفه</option>'+options}
function fillEmployeeProfile(){const e=employees.find(x=>String(x._id||x.id)===$('profileEmployee').value);const map={Name:'name',Specialty:'specialty',Workplace:'workplace',Salary:'salary',Certificate:'certificate',Nationality:'nationality',Province:'province',City:'city',District:'district',Neighborhood:'neighborhood',Street:'street',Alley:'alley',BuildingNumber:'buildingNumber',PhoneNumber:'phoneNumber',NearestLandmark:'nearestLandmark',FullAddress:'fullAddress',UnifiedCardNumber:'unifiedCardNumber',UnifiedCardIssuer:'unifiedCardIssuer',ResidenceCardNumber:'residenceCardNumber',ResidenceCardIssuer:'residenceCardIssuer',PassportNumber:'passportNumber',PassportIssuer:'passportIssuer'};for(const [suffix,key]of Object.entries(map))$('profile'+suffix).value=e?.[key]??'';const dates={HireDate:'hireDate',UnifiedCardIssueDate:'unifiedCardIssueDate',UnifiedCardExpiryDate:'unifiedCardExpiryDate',ResidenceCardIssueDate:'residenceCardIssueDate',ResidenceCardExpiryDate:'residenceCardExpiryDate',PassportIssueDate:'passportIssueDate',PassportExpiryDate:'passportExpiryDate'};for(const [suffix,key]of Object.entries(dates))$('profile'+suffix).value=e?.[key]?String(e[key]).slice(0,10):'';$('profilePhotoPreview').src=e?.photoUrl||'';$('documentEmployee').value=e?String(e._id||e.id):''}
function previewProfilePhoto(){const file=$('profilePhoto').files[0];if(file)$('profilePhotoPreview').src=URL.createObjectURL(file)}
async function saveEmployeeProfile(){const id=$('profileEmployee').value;if(!id){$('notice').textContent='❌ اختر الموظف';return}const form=new FormData();const map={name:'Name',specialty:'Specialty',workplace:'Workplace',salary:'Salary',hireDate:'HireDate',certificate:'Certificate',nationality:'Nationality',province:'Province',city:'City',district:'District',neighborhood:'Neighborhood',street:'Street',alley:'Alley',buildingNumber:'BuildingNumber',phoneNumber:'PhoneNumber',nearestLandmark:'NearestLandmark',fullAddress:'FullAddress',unifiedCardNumber:'UnifiedCardNumber',unifiedCardIssuer:'UnifiedCardIssuer',unifiedCardIssueDate:'UnifiedCardIssueDate',unifiedCardExpiryDate:'UnifiedCardExpiryDate',residenceCardNumber:'ResidenceCardNumber',residenceCardIssuer:'ResidenceCardIssuer',residenceCardIssueDate:'ResidenceCardIssueDate',residenceCardExpiryDate:'ResidenceCardExpiryDate',passportNumber:'PassportNumber',passportIssuer:'PassportIssuer',passportIssueDate:'PassportIssueDate',passportExpiryDate:'PassportExpiryDate'};for(const [key,suffix]of Object.entries(map))form.append(key,$('profile'+suffix).value);if($('profilePhoto').files[0])form.append('photo',$('profilePhoto').files[0]);const b=$('saveProfileBtn');b.disabled=true;b.textContent='جارٍ الحفظ...';try{const r=await fetch(API+'/api/admin/archive/employee-profiles/'+encodeURIComponent(id),{method:'PUT',headers:{Authorization:'Bearer '+token},body:form});const d=await r.json().catch(()=>({}));if(!r.ok||d.success===false)throw new Error(d.message||d.error||'تعذر الحفظ');const i=employees.findIndex(x=>String(x._id||x.id)===id);if(i>=0)employees[i]=d.employee;$('profilePhoto').value='';fillEmployeeProfile();$('notice').textContent='✅ تم تحديث ملف الموظف'}catch(e){$('notice').textContent='❌ '+e.message}finally{b.disabled=false;b.textContent='حفظ تعديلات ملف الموظف'}}
function printEmployeeProfile(){if(!$('profileEmployee').value){$('notice').textContent='❌ اختر الموظف أولًا';return}const v=id=>esc($(id).value||'—'),d=id=>$(id).value?date($(id).value):'—';const photo=$('profilePhotoPreview').src?`<img class="photo" src="${esc($('profilePhotoPreview').src)}">`:'<div class="photo empty-photo">بدون صورة</div>';const row=(label,value)=>`<div class="cell"><small>${label}</small><strong>${value}</strong></div>`;const w=window.open('','_blank','width=1000,height=800');if(!w){$('notice').textContent='❌ اسمح بالنوافذ المنبثقة للطباعة';return}w.document.write(`<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>ورقة معلومات الموظف</title><style>@page{size:A4;margin:12mm}*{box-sizing:border-box}body{font-family:Tahoma,Arial;color:#111;margin:0}.sheet{border:2px solid #1e3a5f;padding:18px;min-height:270mm}.header{display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid #0284c7;padding-bottom:13px}.header h1{margin:0;color:#1e3a5f}.photo{width:115px;height:135px;border:2px solid #94a3b8;border-radius:8px;object-fit:cover}.empty-photo{display:flex;align-items:center;justify-content:center;color:#64748b}.section{margin-top:16px}.section h2{font-size:16px;background:#e0f2fe;color:#075985;padding:8px 10px;margin:0 0 8px;border-right:5px solid #0284c7}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.cell{border:1px solid #cbd5e1;padding:8px;min-height:51px}.cell small{display:block;color:#64748b;margin-bottom:5px}.cell strong{font-size:13px}.full{grid-column:1/-1}.signatures{display:flex;justify-content:space-between;margin-top:35px;font-weight:bold}.footer{text-align:center;color:#64748b;font-size:10px;margin-top:25px}button{margin-top:15px;padding:8px 20px}@media print{button{display:none}}</style></head><body><div class="sheet"><div class="header"><div><h1>ورقة معلومات الموظف</h1><p>نظام المراقب برو — ${esc(companyId)}</p></div>${photo}</div><section class="section"><h2>المعلومات الشخصية والوظيفية</h2><div class="grid">${row('الاسم',v('profileName'))}${row('الاختصاص',v('profileSpecialty'))}${row('مكان العمل',v('profileWorkplace'))}${row('الراتب',v('profileSalary'))}${row('تاريخ بدء العمل',d('profileHireDate'))}${row('الشهادة',v('profileCertificate'))}${row('رقم الهاتف',v('profilePhoneNumber'))}${row('البلد',v('profileNationality'))}${row('المحافظة',v('profileProvince'))}</div></section><section class="section"><h2>العنوان</h2><div class="grid">${row('المدينة',v('profileCity'))}${row('القضاء أو الحي',v('profileDistrict'))}${row('المحلة',v('profileNeighborhood'))}${row('الشارع',v('profileStreet'))}${row('الزقاق',v('profileAlley'))}${row('الدار أو البناية',v('profileBuildingNumber'))}${row('أقرب نقطة دالة',v('profileNearestLandmark'))}<div class="cell full"><small>العنوان الكامل</small><strong>${v('profileFullAddress')}</strong></div></div></section><section class="section"><h2>الوثائق الرسمية</h2><div class="grid">${row('رقم البطاقة الموحدة',v('profileUnifiedCardNumber'))}${row('جهة الإصدار',v('profileUnifiedCardIssuer'))}${row('الإصدار / النفاذ',d('profileUnifiedCardIssueDate')+' / '+d('profileUnifiedCardExpiryDate'))}${row('رقم بطاقة السكن',v('profileResidenceCardNumber'))}${row('جهة الإصدار',v('profileResidenceCardIssuer'))}${row('الإصدار / النفاذ',d('profileResidenceCardIssueDate')+' / '+d('profileResidenceCardExpiryDate'))}${row('رقم جواز السفر',v('profilePassportNumber'))}${row('جهة الإصدار',v('profilePassportIssuer'))}${row('الإصدار / النفاذ',d('profilePassportIssueDate')+' / '+d('profilePassportExpiryDate'))}</div></section><div class="signatures"><span>توقيع الموظف: __________________</span><span>توقيع مسؤول الإدارة: __________________</span></div><div class="footer">تاريخ الطباعة: ${esc(new Date().toLocaleString('ar-IQ'))}</div><button onclick="window.print()">طباعة</button></div></body></html>`);w.document.close();w.focus()}
async function uploadDocument(){const employeeId=$('documentEmployee').value,file=$('documentFile').files[0];if(!employeeId||!file){$('notice').textContent='❌ اختر الموظف وملف الوثيقة';return}const form=new FormData();form.append('employeeId',employeeId);form.append('documentType',$('documentType').value);form.append('title',$('documentTitle').value.trim()||file.name);form.append('note',$('documentNote').value.trim());form.append('document',file);const b=$('uploadBtn');b.disabled=true;b.textContent='جارٍ الحفظ...';try{const r=await fetch(API+'/api/admin/archive/employee-documents',{method:'POST',headers:{Authorization:'Bearer '+token},body:form});const d=await r.json().catch(()=>({}));if(!r.ok||d.success===false)throw new Error(d.message||d.error||'تعذر الحفظ');$('documentFile').value='';$('documentTitle').value='';$('documentNote').value='';$('notice').textContent='✅ حُفظت الوثيقة في الأرشيف الدائم';await loadArchive()}catch(e){$('notice').textContent='❌ '+e.message}finally{b.disabled=false;b.textContent='حفظ الوثيقة نهائيًا'}}
async function createSnapshot(){if(!confirm('سيتم حفظ نسخة دائمة من جميع معلومات وعمليات النظام، ولا يمكن حذفها. هل تريد المتابعة؟'))return;const b=$('snapshotBtn');b.disabled=true;b.textContent='جارٍ حفظ النسخة...';try{const r=await fetch(API+'/api/admin/archive/snapshots',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:'{}'});const d=await r.json().catch(()=>({}));if(!r.ok||d.success===false)throw new Error(d.message||d.error||'تعذر حفظ النسخة');$('notice').textContent=`✅ حُفظت النسخة الدائمة (${d.archivedCount} سجل)`;if(['information','operations'].includes(archiveType))await loadArchive()}catch(e){$('notice').textContent='❌ '+e.message}finally{b.disabled=false;b.textContent='🔒 حفظ نسخة شاملة'}}
async function editDocument(id){const x=records.find(r=>String(r._id)===String(id));if(!x)return;const title=prompt('عنوان الوثيقة',x.title||'');if(title===null)return;const note=prompt('ملاحظة الوثيقة',x.note||'');if(note===null)return;try{const r=await fetch(API+'/api/admin/archive/employee-documents/'+encodeURIComponent(id),{method:'PUT',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({title,documentType:x.documentType,note})});const d=await r.json().catch(()=>({}));if(!r.ok||d.success===false)throw new Error(d.message||d.error||'تعذر التعديل');$('notice').textContent='✅ تم تعديل الوثيقة';await loadArchive()}catch(e){$('notice').textContent='❌ '+e.message}}
async function deleteDocument(id){if(!confirm('هل تريد حذف هذه الوثيقة من ملف الموظف؟'))return;try{const r=await fetch(API+'/api/admin/archive/employee-documents/'+encodeURIComponent(id),{method:'DELETE',headers:{Authorization:'Bearer '+token}});const d=await r.json().catch(()=>({}));if(!r.ok||d.success===false)throw new Error(d.message||d.error||'تعذر الحذف');$('notice').textContent='✅ تم حذف الوثيقة';await loadArchive()}catch(e){$('notice').textContent='❌ '+e.message}}

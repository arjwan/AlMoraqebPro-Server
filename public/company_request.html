<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلب تسجيل شركة | المراقب برو</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#172554;font-family:Tahoma,Arial,sans-serif;color:#0f172a;padding:20px}.card{background:#fff;border-radius:20px;padding:30px;width:min(480px,100%);box-shadow:0 20px 50px #0004}h1{font-size:23px;margin:0 0 8px}p{color:#64748b;line-height:1.7}label{display:block;font-weight:bold;margin:13px 0 5px}input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}button{width:100%;padding:13px;margin-top:20px;border:0;border-radius:9px;background:#0369a1;color:white;font:inherit;font-weight:bold;cursor:pointer}button:disabled{opacity:.6}#message{margin-top:14px;line-height:1.6}a{color:#0369a1}</style></head>
<body><main class="card"><h1>طلب تسجيل شركة</h1><p>اختر بيانات دخول المدير بنفسك. يراجع المطور الطلب ويصدر رمز الشركة بعد الموافقة.</p>
<form id="requestForm"><label>اسم الشركة</label><input name="name" required maxlength="100"><label>اسم المدير</label><input name="managerName" required maxlength="100"><label>رقم الهاتف</label><input name="phone" type="tel" required minlength="8" maxlength="20"><label>البريد الإلكتروني (اختياري)</label><input name="email" type="email"><label>اسم مستخدم المدير</label><input name="adminUsername" required minlength="3" maxlength="32" pattern="[A-Za-z0-9_.-]+" autocomplete="username"><label>كلمة مرور المدير</label><input name="adminPassword" required type="password" minlength="8" maxlength="128" autocomplete="new-password"><button id="submit">إرسال الطلب للمطور</button></form><div id="message" role="status"></div><p><a href="/admin_login.html">العودة إلى الدخول</a></p></main>
<script>document.getElementById('requestForm').addEventListener('submit',async e=>{e.preventDefault();const form=e.currentTarget,button=document.getElementById('submit'),message=document.getElementById('message');button.disabled=true;message.textContent='جارٍ الإرسال...';try{const r=await fetch('/api/company-requests',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});const d=await r.json();message.textContent=d.message||'تعذر إرسال الطلب';message.style.color=r.ok?'#15803d':'#b91c1c';if(r.ok)form.reset()}catch{message.textContent='تعذر الاتصال بالخادم';message.style.color='#b91c1c'}finally{button.disabled=false}})</script></body></html>

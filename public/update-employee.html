<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحديث بيانات موظف - نظام المراقب برو</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0f172a;
            --secondary: #312e81;
            --accent: #6366f1;
            --success: #10b981;
            --danger: #ef4444;
            --bg-light: #f1f5f9;
            --card-bg: #ffffff;
            --border: #cbd5e1;
            --text-main: #1e293b;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-light);
            margin: 0;
            padding: 30px 15px;
            color: var(--text-main);
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.08);
        }

        /* شريط التنقل الموحد */
        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            background: #e2e8f0;
            padding: 12px;
            border-radius: 12px;
            flex-wrap: wrap;
        }
        .nav-link {
            text-decoration: none;
            padding: 10px 18px;
            background: #fff;
            border-radius: 8px;
            font-weight: 700;
            color: #1e293b;
            font-size: 14px;
            transition: all 0.2s;
        }
        .nav-link:hover, .nav-link.active {
            background: var(--accent);
            color: white;
        }

        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--bg-light);
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        h2 {
            color: var(--primary);
            font-weight: 900;
            margin: 0;
            font-size: 26px;
        }

        .form-section {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            border: 1.5px solid var(--border);
        }

        .section-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--secondary);
            margin-bottom: 18px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--bg-light);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width { grid-column: span 4; }
        .form-group.span-2 { grid-column: span 2; }

        label {
            margin-bottom: 8px;
            font-weight: 700;
            font-size: 13px;
            color: #334155;
        }

        input, select {
            padding: 12px 14px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            font-family: 'Cairo', sans-serif;
            background-color: #f8fafc;
            outline: none;
            transition: all 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--accent);
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
        }

        .btn-submit {
            grid-column: span 4;
            padding: 14px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 15px;
            font-family: 'Cairo', sans-serif;
        }
        .btn-submit:hover { background-color: #4f46e5; }
    </style>
</head>
<body>

<div class="container">
    <!-- شريط التنقل الموحد -->
    <div class="nav-tabs">
        <a href="dashboard.html" class="nav-link">🏠 الرئيسية</a>
        <a href="add-employee.html" class="nav-link">➕ إضافة موظف</a>
        <a href="update-employee.html" class="nav-link active">🔄 تحديث بيانات</a>
        <a href="fingerprints.html" class="nav-link">📍 سجل البصمات</a>
        <a href="payroll.html" class="nav-link">🧮 حاسبة الرواتب</a>
        <a href="payroll-report.html" class="nav-link">📊 كشف الرواتب</a>
        <a href="settings.html" class="nav-link">⚙️ الإعدادات</a>
    </div>

    <div class="header-flex">
        <h2>تعديل وتحديث بيانات موظف</h2>
    </div>

    <form id="updateForm" class="form-section">
        <div class="form-group full-width" style="margin-bottom: 20px;">
            <label style="font-size: 15px; color: var(--primary);">اختر الموظف المستهدف للتعديل:</label>
            <select id="selectEmployee" onchange="fillUpdateForm()" required style="background: #e2e8f0; font-weight: bold;">
                <option value="">-- اضغط هنا لاختيار الموظف من القائمة --</option>
            </select>
        </div>

        <div class="section-title">تحديث البيانات الأساسية</div>
        <div class="form-grid">
            <div class="form-group span-2"><label>اسم الموظف الكامل:</label><input type="text" id="up_name" required></div>
            <div class="form-group span-2"><label>المسمى الوظيفي:</label><input type="text" id="up_job_title" required></div>
            <div class="form-group"><label>الراتب الشهري:</label><input type="number" id="up_salary" step="0.01" required></div>
            <div class="form-group"><label>ساعات العمل / الشفت:</label><input type="text" id="up_shift_hours" required></div>
            <div class="form-group"><label>رقم الهاتف:</label><input type="text" id="up_phone" required></div>
            <div class="form-group"><label>تاريخ بدء العمل:</label><input type="date" id="up_start_date" required></div>
        </div>

        <div class="section-title" style="margin-top: 30px;">تحديث العنوان السكني</div>
        <div class="form-grid">
            <div class="form-group span-2"><label>المحافظة:</label><input type="text" id="up_prov" required></div>
            <div class="form-group span-2"><label>المدينة / القضاء:</label><input type="text" id="up_city" required></div>
            <div class="form-group span-2"><label>الحي:</label><input type="text" id="up_district" required></div>
            <div class="form-group"><label>المحلة:</label><input type="text" id="up_mahalla" required></div>
            <div class="form-group"><label>الزقاق:</label><input type="text" id="up_alley" required></div>
            <div class="form-group span-2"><label>الدار / الشقة:</label><input type="text" id="up_house" required></div>
        </div>

        <div class="section-title" style="margin-top: 30px;">تحديث الوثائق الثبوتية</div>
        <div class="form-grid">
            <div class="form-group">
                <label>نوع الهوية:</label>
                <select id="up_id_type" required>
                    <option value="بطاقة الوطنية الموحدة">بطاقة الوطنية الموحدة</option>
                    <option value="هوية الأحوال المدنية">هوية الأحوال المدنية</option>
                    <option value="جواز السفر">جواز السفر</option>
                </select>
            </div>
            <div class="form-group"><label>رقم الهوية:</label><input type="text" id="up_id_number" required></div>
            <div class="form-group span-2"><label>رقم بطاقة السكن:</label><input type="text" id="up_housing_card" required></div>
            <button type="submit" class="btn-submit">تحديث وحفظ التعديلات بنجاح</button>
        </div>
    </form>
</div>

<script>
    if (localStorage.getItem('isLoggedIn') !== 'true') {
        window.location.href = 'login.html';
    }

    const apiUrl = '/api/employees';
    let employeesData = [];

    async function fetchEmployeesForUpdate() {
        try {
            const res = await fetch(apiUrl);
            employeesData = await res.json();
            const select = document.getElementById('selectEmployee');
            select.innerHTML = '<option value="">-- اضغط هنا لاختيار الموظف من القائمة --</option>';
            employeesData.forEach(emp => {
                select.innerHTML += `<option value="${emp.id}">الموظف: ${emp.name} (${emp.job_title}) - رقم #${emp.id}</option>`;
            });
        } catch (err) {
            console.error('Error loading employees:', err);
        }
    }

    function fillUpdateForm() {
        const id = document.getElementById('selectEmployee').value;
        if (!id) return;
        const emp = employeesData.find(e => e.id == id);
        if (!emp) return;

        document.getElementById('up_name').value = emp.name || '';
        document.getElementById('up_job_title').value = emp.job_title || '';
        document.getElementById('up_salary').value = emp.salary || '';
        document.getElementById('up_shift_hours').value = emp.shift_hours || '';
        document.getElementById('up_phone').value = emp.phone || '';
        document.getElementById('up_start_date').value = emp.start_date ? new Date(emp.start_date).toISOString().split('T')[0] : '';

        document.getElementById('up_prov').value = emp.province || '';
        document.getElementById('up_city').value = emp.city || '';
        document.getElementById('up_district').value = emp.district || '';
        document.getElementById('up_mahalla').value = emp.mahalla || '';
        document.getElementById('up_alley').value = emp.alley || '';
        document.getElementById('up_house').value = emp.house_no || '';
        
        document.getElementById('up_id_type').value = emp.id_type || 'بطاقة الوطنية الموحدة';
        document.getElementById('up_id_number').value = emp.id_number || '';
        document.getElementById('up_housing_card').value = emp.housing_card || '';
    }

    document.getElementById('updateForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('selectEmployee').value;
        if (!id) {
            alert('⚠️ الرجاء اختيار الموظف أولاً');
            return;
        }

        const updatedEmp = {
            name: document.getElementById('up_name').value.trim(),
            job_title: document.getElementById('up_job_title').value,
            salary: parseFloat(document.getElementById('up_salary').value) || 0,
            shift_hours: document.getElementById('up_shift_hours').value,
            phone: document.getElementById('up_phone').value,
            start_date: document.getElementById('up_start_date').value,
            province: document.getElementById('up_prov').value,
            city: document.getElementById('up_city').value,
            district: document.getElementById('up_district').value,
            mahalla: document.getElementById('up_mahalla').value,
            alley: document.getElementById('up_alley').value,
            house_no: document.getElementById('up_house').value,
            id_type: document.getElementById('up_id_type').value,
            id_number: document.getElementById('up_id_number').value,
            housing_card: document.getElementById('up_housing_card').value
        };

        try {
            const res = await fetch(`${apiUrl}/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(updatedEmp)
            });

            if (res.ok) {
                alert('✅ تم تحديث بيانات الموظف بنجاح!');
                fetchEmployeesForUpdate();
            } else {
                alert('❌ حدث خطأ أثناء التحديث');
            }
        } catch (err) {
            console.error('Error updating employee:', err);
            alert('❌ حدث خطأ في الاتصال بالخادم');
        }
    });

    fetchEmployeesForUpdate();
</script>

</body>
</html>

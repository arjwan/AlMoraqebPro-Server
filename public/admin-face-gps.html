<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المراقب برو - مراقبة سجلات الحضور والتقارير المتقدمة</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #2e1a47 0%, #1f1135 50%, #100820 100%);
            color: #1e293b;
            min-height: 100vh;
            padding: 30px;
        }

        .main-card {
            max-width: 1850px;
            margin: 0 auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 28px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 20px;
        }

        h2 {
            font-size: 24px;
            font-weight: 800;
            color: #0284c7;
        }

        .back-btn {
            background: #f1f5f9;
            color: #0284c7;
            padding: 12px 24px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            border: 1px solid #cbd5e1;
            transition: 0.2s;
        }

        .back-btn:hover {
            background: #0284c7;
            color: #fff;
        }

        /* شريط البحث والفلترة السريع */
        .filter-toolbar {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            background: #f8fafc;
            padding: 20px;
            border-radius: 18px;
            border: 1px solid #e2e8f0;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
            min-width: 200px;
        }

        .filter-group label {
            font-size: 13px;
            font-weight: 700;
            color: #475569;
        }

        .filter-group input, .filter-group select {
            padding: 10px 14px;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            font-size: 14px;
            background: #fff;
            outline: none;
        }

        .filter-group input:focus, .filter-group select:focus {
            border-color: #0284c7;
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #f8fafc;
            white-space: nowrap;
        }

        th, td {
            padding: 14px 12px;
            text-align: center;
            font-size: 13px;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background: #e0f2fe;
            color: #0369a1;
            font-weight: 800;
        }

        .badge-match {
            background: #dcfce7;
            color: #16a34a;
            padding: 5px 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 12px;
        }

        .badge-status {
            background: #ccfbf1;
            color: #0f766e;
            padding: 5px 10px;
            border-radius: 8px;
            font-weight: bold;
        }

        .badge-shift {
            background: #e0e7ff;
            color: #3730a3;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: bold;
        }

        .overtime-badge {
            background: #fef3c7;
            color: #b45309;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: bold;
        }

        .days-complete {
            color: #16a34a;
            font-weight: 800;
            background: #f0fdf4;
            padding: 4px 8px;
            border-radius: 6px;
        }

        .days-missing {
            color: #dc2626;
            font-weight: 800;
            background: #fef2f2;
            padding: 4px 8px;
            border-radius: 6px;
        }

        .btn-row-delete {
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            transition: 0.2s;
        }

        .btn-row-delete:hover {
            background: #dc2626;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="top-nav">
            <h2>📸 مراقبة سجلات الحضور بالصورة الحية، الشفتات وتقارير البصمة المتقدمة</h2>
            <a href="admin.html" class="back-btn">← العودة إلى لوحة التحكم الرئيسية</a>
        </div>

        <!-- شريط البحث والفلترة السريع -->
        <div class="filter-toolbar">
            <div class="filter-group">
                <label>بحث بالموظف أو الشفت أو الموقع:</label>
                <input type="text" id="searchInput" placeholder="🔍 اكتب اسم الموظف أو الفرع..." onkeyup="loadAttendanceRecords()">
            </div>
            <div class="filter-group">
                <label>تصفية حسب التاريخ:</label>
                <input type="date" id="dateFilter" onchange="loadAttendanceRecords()">
            </div>
            <div class="filter-group" style="flex: 0; justify-content: flex-end;">
                <label>&nbsp;</label>
                <button onclick="resetFilters()" style="padding: 10px 20px; background: #64748b; color: #fff; border: none; border-radius: 10px; cursor: pointer; font-weight: bold;">إعادة تعيين</button>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ت</th>
                        <th>اسم الموظف</th>
                        <th>موقع العمل</th>
                        <th>الشفت المُضاف إليه</th>
                        <th>حالة البصمة والـ GPS</th>
                        <th>التاريخ</th>
                        <th>وقت الحضور</th>
                        <th>وقت الانصراف</th>
                        <th>الوقت الإضافي</th>
                        <th>أيام العمل الكاملة</th>
                        <th>الأيام الناقصة</th>
                        <th>حالة الانصراف</th>
                        <th>الإجراءات</th>
                    </tr>
                </thead>
                <tbody id="attendanceTableBody">
                    <!-- يتم حقن البيانات ديناميكياً هنا -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const currentCompany = localStorage.getItem('activeCompanyId') || 'default_company';

        const sampleAttendance = [
            {
                id: "att_1",
                name: "أحمد محمد علي",
                workplace: "المقر الرئيسي",
                shiftName: "الشفت الصباحي الأساسي",
                faceStatus: "مقبول (في النطاق)",
                date: "2026-08-02",
                attTime: "08:00 ص",
                depTime: "04:15 م",
                overtime: "ساعة و 15 دقيقة",
                completeDays: 22,
                missingDays: 1,
                depStatus: "منصرف نظامي"
            },
            {
                id: "att_2",
                name: "محمد عبد علي",
                workplace: "فرع البصرة",
                shiftName: "الشفت المسائي",
                faceStatus: "مقبول (في النطاق)",
                date: "2026-08-02",
                attTime: "03:00 م",
                depTime: "11:00 م",
                overtime: "لا يوجد",
                completeDays: 20,
                missingDays: 3,
                depStatus: "منصرف نظامي"
            },
            {
                id: "att_3",
                name: "علي الزيدي",
                workplace: "المخزن الرئيسي",
                shiftName: "شفت استثنائي/خاص",
                faceStatus: "مرفوض (خارج النطاق)",
                date: "2026-08-02",
                attTime: "06:30 ص",
                depTime: "01:00 م",
                overtime: "45 دقيقة",
                completeDays: 23,
                missingDays: 0,
                depStatus: "منصرف مبكر"
            }
        ];

        function loadAttendanceRecords() {
            const tableBody = document.getElementById('attendanceTableBody');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const dateVal = document.getElementById('dateFilter').value;

            let records = JSON.parse(localStorage.getItem(`companyAttendanceLogs_${currentCompany}`));
            
            if (!records || !Array.isArray(records) || records.length === 0) {
                records = JSON.parse(JSON.stringify(sampleAttendance));
                localStorage.setItem(`companyAttendanceLogs_${currentCompany}`, JSON.stringify(records));
            }

            tableBody.innerHTML = '';

            const filtered = records.filter(item => {
                const matchText = (item.name || '').toLowerCase().includes(searchVal) ||
                                  (item.workplace || '').toLowerCase().includes(searchVal) ||
                                  (item.shiftName || '').toLowerCase().includes(searchVal);
                const matchDate = dateVal ? item.date === dateVal : true;
                return matchText && matchDate;
            });

            if (filtered.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="13" style="padding: 30px; color: #64748b; font-size: 15px;">لا توجد سجلات حضور مطابقة للبحث</td></tr>`;
                return;
            }

            filtered.forEach((rec, index) => {
                let badgeClass = rec.faceStatus.includes('مرفوض') ? 'background: #fee2e2; color: #dc2626;' : 'background: #dcfce7; color: #16a34a;';
                
                tableBody.innerHTML += `
                    <tr>
                        <td><b>${index + 1}</b></td>
                        <td style="font-weight: 700; color: #0f172a;">${rec.name}</td>
                        <td>${rec.workplace}</td>
                        <td><span class="badge-shift">${rec.shiftName || 'شفت قياسي عام'}</span></td>
                        <td><span class="badge-match" style="${badgeClass}">${rec.faceStatus}</span></td>
                        <td dir="ltr" style="font-weight: bold;">${rec.date}</td>
                        <td dir="ltr" style="color: #0284c7; font-weight: bold;">${rec.attTime}</td>
                        <td dir="ltr" style="color: #0369a1; font-weight: bold;">${rec.depTime || '-- : --'}</td>
                        <td><span class="overtime-badge">${rec.overtime || 'لا يوجد'}</span></td>
                        <td><span class="days-complete">${rec.completeDays || 0} يوم</span></td>
                        <td><span class="days-missing">${rec.missingDays || 0} يوم</span></td>
                        <td><span class="badge-status">${rec.depStatus}</span></td>
                        <td>
                            <button class="btn-row-delete" onclick="deleteAttendanceRecord('${rec.id}')">🗑️ حذف</button>
                        </td>
                    </tr>
                `;
            });
        }

        // دالة التحقق الذكي الحقيقي من الـ GPS، الشفت، وتحديث الرواتب آلياً اليومي
        function verifyAndProcessEmployeeAttendance(employeeId, employeeName, workplaceLat, workplaceLng, allowedRadiusMeters = 100) {
            if (!navigator.geolocation) {
                alert("⚠️ خدمة تحديد الموقع غير متوفرة.");
                return;
            }

            // 1. التحقق من ربط الموظف بشفت مخصص لهذا اليوم
            const employeeShifts = JSON.parse(localStorage.getItem(`employee_shifts_${employeeId}`)) || [];
            const todayDateStr = new Date().toISOString().split('T')[0];
            const assignedShift = employeeShifts.find(s => s.date === todayDateStr);

            if (!assignedShift) {
                alert(`⚠️ تنبيه: الموظف (${employeeName}) غير مضاف إلى شفت مخصص لهذا اليوم. يرجى إضافته عبر لوحة الشفتات.`);
                sendNotificationToEmployee(employeeName, "عذراً، لم يتم إضافتك إلى شفت عمل فعال اليوم. يراجى مراجعة المدير.");
                return;
            }

            // 2. التحقق من إحداثيات الموقع الفعلي للموظف عبر GPS
            navigator.geolocation.getCurrentPosition((position) => {
                const empLat = position.coords.latitude;
                const empLng = position.coords.longitude;
                const distance = calculateDistanceMeters(empLat, empLng, workplaceLat, workplaceLng);
                const isOutOfBounds = distance > allowedRadiusMeters;

                let records = JSON.parse(localStorage.getItem(`companyAttendanceLogs_${currentCompany}`)) || [];
                const newRecordId = 'att_' + Date.now();
                const currentTimeStr = new Date().toLocaleTimeString();

                if (isOutOfBounds) {
                    // رفض البصمة وتأشير الرفض في النظام
                    alert(`❌ تم رفض البصمة لـ (${employeeName}) - خارج النطاق بمسافة ${Math.round(distance)} متر.`);
                    
                    records.unshift({
                        id: newRecordId,
                        name: employeeName,
                        workplace: assignedShift.workplace || "المقر الرئيسي",
                        shiftName: assignedShift.shiftName || "الشفت المخصص",
                        faceStatus: `مرفوض (خارج النطاق ${Math.round(distance)}م)`,
                        date: todayDateStr,
                        attTime: currentTimeStr,
                        depTime: "-- : --",
                        overtime: "لا يوجد",
                        completeDays: 0,
                        missingDays: 1,
                        depStatus: "مرفوض بصمة"
                    });

                    sendNotificationToEmployee(employeeName, "❌ تم رفض بصمة الحضور لوجودك خارج النطاق الجغرافي المسموح.");
                } else {
                    // قبول البصمة وتأشير النجاح وتحديث الرواتب اليومية آلياً
                    alert(`✅ تم قبول بصمة الحضور بنجاح للموظف (${employeeName}).`);

                    records.unshift({
                        id: newRecordId,
                        name: employeeName,
                        workplace: assignedShift.workplace || "المقر الرئيسي",
                        shiftName: assignedShift.shiftName || "الشفت المخصص",
                        faceStatus: "مقبول (في النطاق)",
                        date: todayDateStr,
                        attTime: currentTimeStr,
                        depTime: "قيد العمل",
                        overtime: "قيد الاحتساب",
                        completeDays: 1,
                        missingDays: 0,
                        depStatus: "حضور نظامي"
                    });

                    sendNotificationToEmployee(employeeName, "✅ تم قبول تسجيل حضورك بنجاح اليوم ضمن النطاق الجغرافي والشفت المخصص.");
                    
                    // تحديث صفحة و جدول الرواتب اليومي آلياً
                    updatePayrollAutomatically(employeeName);
                }

                localStorage.setItem(`companyAttendanceLogs_${currentCompany}`, JSON.stringify(records));
                loadAttendanceRecords();

            }, (error) => {
                alert("❌ تعذر الوصول إلى بيانات الـ GPS الخاصة بجهازك.");
            }, { enableHighAccuracy: true, timeout: 10000 });
        }

        // حساب المسافة بالأمتار
        function calculateDistanceMeters(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI/180;
            const φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1) * Math.PI/180;
            const Δλ = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) * Math.sin(Δλ/2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        }

        // إرسال الإشعارات التفاعلية للموظف
        function sendNotificationToEmployee(empName, message) {
            let notifs = JSON.parse(localStorage.getItem(`employee_notifications_${empName}`)) || [];
            notifs.unshift({
                id: 'NOTIF_' + Date.now(),
                text: message,
                time: new Date().toLocaleString(),
                read: false
            });
            localStorage.setItem(`employee_notifications_${empName}`, JSON.stringify(notifs));
        }

        // تحديث الرواتب اليومية تلقائياً
        function updatePayrollAutomatically(empName) {
            let payrollData = JSON.parse(localStorage.getItem(`company_payroll_${currentCompany}`)) || [];
            let empRecord = payrollData.find(p => p.name === empName);
            if (empRecord) {
                empRecord.daysPresent = (empRecord.daysPresent || 0) + 1;
            } else {
                payrollData.push({
                    name: empName,
                    daysPresent: 1,
                    daysAbsent: 0,
                    baseSalary: 600000
                });
            }
            localStorage.setItem(`company_payroll_${currentCompany}`, JSON.stringify(payrollData));
        }

        function deleteAttendanceRecord(recordId) {
            if (confirm('⚠️ هل أنت متأكد من رغبتك في حذف سجل الحضور هذا نهائياً؟')) {
                let records = JSON.parse(localStorage.getItem(`companyAttendanceLogs_${currentCompany}`)) || [];
                const updatedRecords = records.filter(item => String(item.id) !== String(recordId));
                
                if (updatedRecords.length === 0) {
                    localStorage.setItem(`companyAttendanceLogs_${currentCompany}`, JSON.stringify(sampleAttendance));
                } else {
                    localStorage.setItem(`companyAttendanceLogs_${currentCompany}`, JSON.stringify(updatedRecords));
                }
                loadAttendanceRecords();
            }
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('dateFilter').value = '';
            loadAttendanceRecords();
        }

        window.onload = () => {
            if (!localStorage.getItem(`companyAttendanceLogs_${currentCompany}`)) {
                localStorage.setItem(`companyAttendanceLogs_${currentCompany}`, JSON.stringify(sampleAttendance));
            }
            loadAttendanceRecords();
        };
    </script>
</body>
</html>

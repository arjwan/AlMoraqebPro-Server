<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المراقب برو - إدارة الموظفين والحضور الحقيقي</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #2e1a47 0%, #1f1135 50%, #100820 100%); color: #1e293b; min-height: 100vh; padding: 20px; }
        .container { max-width: 1300px; margin: 0 auto; background: #ffffff; padding: 25px; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; flex-wrap: wrap; gap: 15px; }
        .btn { background: #0284c7; color: #fff; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; font-weight: bold; text-decoration: none; transition: 0.2s; }
        .btn:hover { opacity: 0.9; }
        .btn-success { background: #16a34a; }
        .btn-warning { background: #ca8a04; }
        .controls-bar { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        .controls-bar input { flex: 1; min-width: 250px; padding: 12px 15px; border: 2px solid #cbd5e1; border-radius: 10px; font-size: 14px; outline: none; }
        .controls-bar input:focus { border-color: #0284c7; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; text-align: center; }
        th, td { padding: 12px 10px; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
        th { background: #f8fafc; color: #475569; font-weight: 700; }
        .badge { padding: 5px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; }
        .badge-success { background: #dcfce7; color: #166534; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #fff; padding: 30px; border-radius: 15px; width: 100%; max-width: 450px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .modal-content h3 { margin-bottom: 15px; color: #0284c7; }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; text-align: right; }
        .form-group label { font-size: 13px; font-weight: bold; margin-bottom: 5px; color: #475569; }
        .form-group input { padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; width: 100%; outline: none; }
    </style>
</head>
<body onload="loadRealEmployees()">

    <div class="container">
        <div class="top-bar">
            <h2>🏢 إدارة موظفي ومراقب الحضور الحقيقي (قاعدة البيانات)</h2>
            <div>
                <button class="btn btn-success" onclick="openAddModal()">➕ إضافة موظف حقيقي</button>
                <button class="btn btn-warning" onclick="loadRealEmployees()">🔄 مزامنة وجلب البيانات</button>
                <a href="admin.html" class="btn">← العودة للوحة التحكم</a>
            </div>
        </div>

        <div class="controls-bar">
            <input type="text" id="searchInput" placeholder="🔍 ابحث في الجدول الحقيقي..." onkeyup="filterTable()">
        </div>

        <table>
            <thead>
                <tr>
                    <th>#ID</th>
                    <th>اسم الموظف</th>
                    <th>موقع العمل / الفرع</th>
                    <th>اسم المستخدم</th>
                    <th>تاريخ التسجيل</th>
                    <th>الإجراءات</th>
                </tr>
            </thead>
            <tbody id="realTableBody">
                <!-- سيتم تعبئة البيانات الحقيقية تلقائياً من السيرفر -->
            </tbody>
        </table>
    </div>

    <!-- نافذة الإضافة الحقيقية -->
    <div class="modal" id="addEmployeeModal">
        <div class="modal-content">
            <h3>إضافة موظف جديد حقيقي</h3>
            <form id="manualAddForm" onsubmit="saveRealEmployee(event)">
                <div class="form-group">
                    <label>اسم الموظف:</label>
                    <input type="text" id="empName" required placeholder="الاسم الكامل...">
                </div>
                <div class="form-group">
                    <label>موقع العمل / الفرع:</label>
                    <input type="text" id="empWorkplace" required placeholder="مثال: الفرع الرئيسي">
                </div>
                <div class="form-group">
                    <label>اسم المستخدم:</label>
                    <input type="text" id="empUsername" required placeholder="اسم المستخدم للدخول...">
                </div>
                <div class="form-group">
                    <label>كلمة المرور:</label>
                    <input type="password" id="empPassword" required placeholder="••••••••">
                </div>
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="submit" class="btn btn-success" style="flex: 1;">حفظ في القاعدة</button>
                    <button type="button" class="btn" style="background: #64748b; flex: 1;" onclick="closeAddModal()">إلغاء</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // جلب البيانات الحقيقية من السيرفر وعرضها في الجدول فور فتح الصفحة أو الضغط على المزامنة
        function loadRealEmployees() {
            fetch('/api/v1/employees')
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    const tbody = document.getElementById('realTableBody');
                    tbody.innerHTML = '';
                    
                    if (data.employees.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="6" style="padding: 20px; color: #64748b;">لا يوجد موظفون مسجلون في القاعدة حتى الآن.</td></tr>`;
                        return;
                    }

                    data.employees.forEach((emp, index) => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${emp.id || index + 1}</td>
                            <td><b>${emp.name}</b></td>
                            <td>${emp.workplace || 'الفرع الرئيسي'}</td>
                            <td>${emp.username}</td>
                            <td>${emp.start_date || 'مباشر'}</td>
                            <td><button class="btn" style="padding: 5px 10px; background: #dc2626;" onclick="deleteEmployee(${emp.id})">حذف</button></td>
                        `;
                        tbody.appendChild(row);
                    });
                }
            })
            .catch(err => {
                console.error('فشل الاتصال بالسيرفر لجلب البيانات الحقيقية:', err);
            });
        }

        function filterTable() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const rows = document.querySelectorAll('#realTableBody tr');
            rows.forEach(row => {
                const text = row.textContent.toLowerCase();
                row.style.display = text.includes(input) ? '' : 'none';
            });
        }

        function openAddModal() {
            document.getElementById('addEmployeeModal').style.display = 'flex';
        }
        function closeAddModal() {
            document.getElementById('addEmployeeModal').style.display = 'none';
            document.getElementById('manualAddForm').reset();
        }

        // الحفظ الحقيقي وإرسال البيانات للسيرفر وقاعدة البيانات
        function saveRealEmployee(e) {
            e.preventDefault();
            const name = document.getElementById('empName').value.trim();
            const workplace = document.getElementById('empWorkplace').value.trim();
            const username = document.getElementById('empUsername').value.trim();
            const password = document.getElementById('empPassword').value;
            const companyId = 'B-22334'; // معرف الشركه الثابت الفعلي

            const employeeData = { companyId, name, workplace, username, password, deviceId: 'Real-Field-Device' };

            fetch('/api/v1/employees', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(employeeData)
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert('✅ تم حفظ الموظف في قاعدة البيانات الحقيقية بنجاح!');
                    closeAddModal();
                    loadRealEmployees(); // تحديث الجدول تلقائياً بالبيانات الحقيقية
                } else {
                    alert('⚠️ خطأ: ' + (data.message || 'فشل الحفظ'));
                }
            })
            .catch(err => {
                alert('❌ خطأ في الاتصال بالسيرفر');
            });
        }

        function deleteEmployee(id) {
            if(confirm('هل أنت متأكد من حذف هذا الموظف من قاعدة البيانات؟')) {
                // يمكنك ربطه بمسار حذف حقيقي في السيرفر لاحقاً
                alert('تم إرسال طلب الحذف.');
                loadRealEmployees();
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>متابعة الموظف على الخريطة - المراقب برو</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="/vendor/maplibre/maplibre-gl.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/vendor/maplibre/maplibre-gl.js"></script>
    <script src="/vendor/maplibre/leaflet-maplibre-gl.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body {
            background: linear-gradient(160deg, #0f172a, #172554 55%, #0c4a6e);
            min-height: 100vh;
            padding: 20px;
            color: #f8fafc;
        }
        .container {
            max-width: 1300px;
            margin: auto;
            background: rgba(30,41,59,0.92);
            backdrop-filter: blur(14px);
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 1.8rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header h1 i { color: #38bdf8; }
        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 30px;
            background: #0284c7;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }
        .btn:hover { background: #0369a1; transform: translateY(-2px); }
        .btn-outline { background: transparent; border: 1px solid #38bdf8; color: #38bdf8; }
        .btn-outline:hover { background: rgba(56,189,248,0.1); }
        .map-wrapper {
            position: relative;
            border-radius: 18px;
            overflow: hidden;
            height: 500px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        #map { width: 100%; height: 100%; }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            margin-bottom: 20px;
        }
        .employee-selector {
            flex: 1;
            min-width: 250px;
        }
        .employee-selector label {
            font-weight: 800;
            margin-bottom: 5px;
            display: block;
            color: #cbd5e1;
        }
        .employee-selector select {
            width: 100%;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-size: 0.9rem;
        }
        .selected-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .selected-chip {
            background: #0284c7;
            color: #fff;
            border-radius: 20px;
            padding: 5px 12px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .selected-chip i {
            cursor: pointer;
        }
        .areas-list {
            background: rgba(15,23,42,0.7);
            border-radius: 14px;
            padding: 15px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 8px;
        }
        .area-item {
            color: #f8fafc;
            background: rgba(255,255,255,0.05);
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .area-item i { color: #38bdf8; }
        .current-location { display:flex; flex-wrap:wrap; gap:8px; align-items:center; width:100%; }
        .current-location input { flex:1; min-width:230px; padding:10px; border-radius:10px; border:1px solid #475569; background:#0f172a; color:#fff; direction:ltr; text-align:left; }
        .loader {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 768px) {
            .map-wrapper { height: 350px; }
            .header h1 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1><i class="fas fa-map-marker-alt"></i> متابعة الموظف على الخريطة</h1>
        <button class="btn" onclick="location.href='admin_notifications.html?company='+encodeURIComponent(getCompanyId())+'&tab=tracking'"><i class="fas fa-bell"></i> تنبيهات حركة الموظفين</button>
        <button class="btn btn-outline" onclick="history.back()">⬅ رجوع للوحة</button>
    </div>

    <div class="controls">
        <div class="employee-selector">
            <label>اختر الموظفين (بحد أقصى 5):</label>
            <select id="employeeSelect" onchange="addEmployee()">
                <option value="">— اختر موظف —</option>
            </select>
        </div>
        <button class="btn" onclick="loadLocations()"><i class="fas fa-sync-alt"></i> تحديث المواقع</button>
        <button class="btn btn-outline" id="getMapLocationBtn" onclick="getMapLocation()"><i class="fas fa-location-crosshairs"></i> جلب موقع الموظف</button>
        <div class="current-location" id="currentLocationBox" hidden>
            <input id="currentLocationText" readonly aria-label="إحداثيات موقع الموظف">
            <button class="btn btn-outline" onclick="copyCurrentLocation()"><i class="fas fa-copy"></i> نسخ الموقع</button>
        </div>
    </div>

    <div class="selected-list" id="selectedList"></div>

    <div class="map-wrapper">
        <div id="map"></div>
    </div>

    <h3 style="margin-bottom:10px"><i class="fas fa-map-marker-alt"></i> مواقع الشركة المسجلة</h3>
    <div class="areas-list" id="sitesList">جارٍ تحميل المواقع...</div>

    <h3 style="margin-bottom:10px"><i class="fas fa-list-ul"></i> المناطق المتواجدون فيها</h3>
    <div class="areas-list" id="areasList"></div>
</div>

<script>
const API = location.origin;
let map = null;
let selectedEmployees = []; // قائمة معرفات الموظفين المختارين
let employees = []; // كل الموظفين
let trackedMarkers = null;
let siteMarkers = null;
const visibleSites = [];
const trackedLocations = new Map();
const reverseGeoCache = new Map();

function getMapLocation(){
    const button = document.getElementById('getMapLocationBtn');
    if (selectedEmployees.length === 0) {
        alert('اختر موظفاً أولاً');
        return;
    }
    const employeeId = String(selectedEmployees[0]);
    button.disabled = true;
    button.innerHTML = '<span class="loader"></span> جارٍ جلب موقع الموظف';
    loadLocations().then(() => {
        const point = trackedLocations.get(employeeId);
        if (!point || !map) {
            alert('لا يوجد موقع مسجل لهذا الموظف');
            return;
        }
        document.getElementById('currentLocationText').value =
            point.lat.toFixed(7) + ', ' + point.lon.toFixed(7);
        document.getElementById('currentLocationBox').hidden = false;
        map.setView([point.lat, point.lon], 17, { animate: true });
        if (point.marker) point.marker.openPopup();
    }).catch(error => {
        alert(error?.message || 'تعذر جلب موقع الموظف');
    }).finally(() => {
        button.disabled = false;
        button.innerHTML = '<i class="fas fa-location-crosshairs"></i> تحديث موقع الموظف';
    });
}

async function copyCurrentLocation(){
    const value=document.getElementById('currentLocationText').value;
    if(!value) return;
    try{
        await navigator.clipboard.writeText(value);
        alert('تم نسخ الإحداثيات');
    }catch{
        const field=document.getElementById('currentLocationText');
        field.focus();
        field.select();
        alert('تعذر النسخ التلقائي؛ الإحداثيات محددة ويمكن نسخها يدويًا');
    }
}

function getToken() {
    return sessionStorage.getItem('almoraqeb_admin_token') || '';
}
function getCompanyId() {
    return new URLSearchParams(location.search).get('company') || localStorage.getItem('companyId') || '';
}

async function auth(){

    const companyId =
        getCompanyId();

    if(!companyId){
        alert(
            'يرجى تسجيل الدخول كمدير'
        );

        location.href =
            'admin_login.html';

        return false;
    }

    for(
        let i = 0;
        i < 60 &&
        !window.AlMoraqebOfflineAuth;
        i++
    ){
        await new Promise(
            resolve =>
                setTimeout(resolve, 50)
        );
    }

    if(!window.AlMoraqebOfflineAuth){
        alert(
            'تعذر تحميل نظام الدخول المحلي'
        );

        return false;
    }

    const result =
        await AlMoraqebOfflineAuth
            .authorizePage({
                companyId
            });

    if(!result.ok){

        alert(
            result.offline
                ? 'لا توجد جلسة Offline صالحة'
                : 'انتهت جلسة المدير'
        );

        location.href =
            'admin_login.html';

        return false;
    }

    document.documentElement.dataset.offline =
        result.offline
            ? 'true'
            : 'false';

    return true;
}

async function loadEmployees() {
    const companyId = getCompanyId();
    const res = await fetch(API + '/api/employees?companyId=' + encodeURIComponent(companyId));
    const data = await res.json();
    if (data.success) {
        employees = data.employees || [];
        renderEmployeeOptions();
    }
}

function renderEmployeeOptions() {
    const select = document.getElementById('employeeSelect');
    select.innerHTML = '<option value="">— اختر موظف —</option>';
    employees.forEach(emp => {
        const option = document.createElement('option');
        option.value = emp._id || emp.id;
        option.textContent = emp.name + ' (' + (emp.specialty || emp.workplace || '') + ')';
        select.appendChild(option);
    });
}

function addEmployee() {
    const select = document.getElementById('employeeSelect');
    const id = select.value;
    if (!id) return;
    if (selectedEmployees.length >= 5) {
        alert('الحد الأقصى 5 موظفين للمتابعة');
        return;
    }
    if (selectedEmployees.includes(id)) {
        alert('تمت إضافة هذا الموظف بالفعل');
        return;
    }
    selectedEmployees.push(id);
    updateSelectedList();
    select.value = '';
}

function removeEmployee(id) {
    selectedEmployees = selectedEmployees.filter(e => e !== id);
    trackedLocations.delete(String(id));
    if (trackedMarkers) {
        trackedMarkers.eachLayer(layer => {
            if (String(layer.employeeId || '') === String(id)) trackedMarkers.removeLayer(layer);
        });
    }
    updateSelectedList();
}

function focusEmployee(id) {
    const point = trackedLocations.get(String(id));
    if (!point || !map) {
        loadLocations().then(() => {
            const refreshed = trackedLocations.get(String(id));
            if (refreshed && map) {
                map.setView([refreshed.lat, refreshed.lon], 17, { animate: true });
                if (refreshed.marker) refreshed.marker.openPopup();
            }
        }).catch(() => {});
        return;
    }
    map.setView([point.lat, point.lon], 17, { animate: true });
    if (point.marker) point.marker.openPopup();
}

function updateSelectedList() {
    const container = document.getElementById('selectedList');
    container.innerHTML = '';
    selectedEmployees.forEach(id => {
        const emp = employees.find(e => (e._id || e.id) === id);
        if (emp) {
            const chip = document.createElement('span');
            chip.className = 'selected-chip';
            chip.innerHTML = `<button type="button" onclick="focusEmployee('${id}')" title="الانتقال إلى موقع الموظف" style="all:unset;cursor:pointer">${escapeHtml(emp.name)}</button> <i class="fas fa-times" title="إغلاق" onclick="event.stopPropagation();removeEmployee('${id}')"></i>`;
            container.appendChild(chip);
        }
    });
}

async function loadLocations() {
    // أبقِ خريطة Leaflet وطبقة البلاطات محمّلتين؛ حدّث علامات الموظفين فقط.
    if (!map) {
        map = L.map('map').setView([33.3128, 44.3615], 6);
        addBaseMap(map);
    }
    if (!trackedMarkers) trackedMarkers = L.layerGroup().addTo(map);
    if (!siteMarkers) siteMarkers = L.layerGroup().addTo(map);
    trackedMarkers.clearLayers();
    siteMarkers.clearLayers();
    trackedLocations.clear();
    visibleSites.length = 0;

    const areas = [];
    const bounds = [];

    try {
        const sitesResponse = await fetch(API + '/api/admin/locations', {
            credentials: 'include', headers: getToken() ? { Authorization: 'Bearer ' + getToken() } : {}
        });
        const sitesData = await sitesResponse.json();
        if (sitesResponse.ok && sitesData.success) {
            for (const site of sitesData.locations || []) {
                const lat = Number(site.latitude), lon = Number(site.longitude);
                if (site.active === false || !validMapPoint(site.latitude, site.longitude)) continue;
                const color = site.demoData ? '#a855f7' : '#16a34a';
                L.circle([lat, lon], { radius: Number(site.radiusMeters) || 200,
                    color, fillColor: color, fillOpacity: 0.12, weight: 2 })
                    .addTo(siteMarkers).bindPopup(`${site.demoData ? 'موقع تجريبي: ' : 'موقع الشركة: '}${escapeHtml(site.name)}<br>نطاق البصمة: ${Math.round(Number(site.radiusMeters) || 200)}م`);
                const marker = L.circleMarker([lat, lon], {
                    radius: 9, color: '#fff', weight: 2, fillColor: color, fillOpacity: 1
                }).addTo(siteMarkers).bindPopup(`<b>${escapeHtml(site.name || 'موقع الشركة')}</b><br>نطاق البصمة: ${Math.round(Number(site.radiusMeters) || 200)}م`);
                marker.bindTooltip(String(site.name || 'موقع الشركة'), { direction: 'top' });
                visibleSites.push({ site, lat, lon, marker });
                bounds.push([lat, lon]);
            }
        }
        renderSites();
    } catch (error) {
        console.warn('تعذر تحميل مواقع الشركة', error);
        document.getElementById('sitesList').textContent = 'تعذر تحميل مواقع الشركة. اضغط تحديث المواقع للمحاولة مجددًا.';
    }
    if (selectedEmployees.length === 0) {
        if (bounds.length) map.fitBounds(bounds);
        renderAreas([]);
        return;
    }

    try {
        const res = await fetch(API + '/api/admin/employee-locations', {
            credentials: 'include',
            headers: getToken()
                ? { Authorization: 'Bearer ' + getToken() }
                : {}
        });
        const data = await res.json();
        if (!res.ok || !data.success) {
            throw new Error(data.message || 'تعذر جلب المواقع');
        }

        const selected = (data.employees || []).filter(emp =>
            selectedEmployees.includes(String(emp.employeeId))
        );

        for (const tracked of selected) {
            const last = tracked.lastLocation;
            if (!last) {
                const site = tracked.workLocation;
                if (site && validMapPoint(site.latitude, site.longitude)) {
                    const point = [Number(site.latitude), Number(site.longitude)];
                    const marker = L.circleMarker(point, { radius: 7, color: '#b45309', fillColor: '#fbbf24', fillOpacity: 1 })
                        .addTo(trackedMarkers).bindPopup(`<b>${escapeHtml(tracked.name || 'موظف')}</b><br>موقع العمل المعتمد: ${escapeHtml(site.name || 'غير مسمى')}<br>لا يوجد موقع GPS مسجل للموظف`);
                    marker.employeeId = String(tracked.employeeId);
                    bounds.push(point);
                }
                areas.push({
                    name: tracked.name || 'موظف',
                    area: `${site ? 'موقع العمل المعتمد: ' + (site.name || 'غير مسمى') + ' — ' : ''}${tracked.unavailableReason || 'لم يتم تسجيل موقع GPS للموظف بعد'}`
                });
                continue;
            }

            const lat = Number(last.latitude);
            const lon = Number(last.longitude);
            if (!Number.isFinite(lat) || !Number.isFinite(lon)) {
                areas.push({
                    name: tracked.name || 'موظف',
                    area: 'إحداثيات الموقع غير صالحة'
                });
                continue;
            }
            const mode = tracked.trackingAllowed
                ? tracked.trackingMode === 'delegation'
                    ? 'تكليف فعّال'
                    : 'ضمن وقت الدوام'
                : 'آخر موقع مسجل';
            const updatedAt = last.timestamp
                ? new Date(last.timestamp).toLocaleString('ar-IQ') : 'غير معروف';
            const site = tracked.workLocation;
            const distance = Number.isFinite(tracked.distanceMeters)
                ? `${tracked.distanceMeters} م` : 'غير معروف';
            const status = tracked.locationStatus === 'inside' ? 'داخل الموقع'
                : tracked.locationStatus === 'outside' ? 'خارج الموقع' : 'الموقع قديم أو غير محدد';
            const siteDetails = site
                ? `<br>الموقع المعتمد: ${escapeHtml(site.name || 'غير مسمى')} · نطاق ${Math.round(Number(site.radiusMeters || 200))}م`
                    + `<br><a href="admin_shifts.html">راجع موقع الشفت</a> · <a href="admin_locations.html">صحح إحداثيات الموقع</a>`
                : '<br>لا يوجد موقع معتمد مرتبط بالشفت';
            const accuracy = Number(last.accuracyMeters);
            const accuracyDetails = Number.isFinite(accuracy) && accuracy > 0
                ? `<br>دقة GPS: ±${Math.round(accuracy)}م` : '';
            const marker = L.marker([lat, lon]).addTo(trackedMarkers)
                .bindPopup(`<b>${escapeHtml(tracked.name || 'موظف')}</b><br>${mode}<br>آخر تحديث: ${updatedAt}${accuracyDetails}<br>${status} — ${distance}${siteDetails}`);
            marker.employeeId = String(tracked.employeeId);
            trackedLocations.set(String(tracked.employeeId), { lat, lon, marker });
            bounds.push([lat, lon]);
            if (tracked.trackingAllowed) {
                try {
                    const cycleRes = await fetch(API + '/api/admin/tracking-cycles?employeeId=' + encodeURIComponent(tracked.employeeId), {
                        credentials: 'include', headers: getToken() ? { Authorization: 'Bearer ' + getToken() } : {}
                    });
                    const cycleData = await cycleRes.json();
                    const cycle = cycleData.cycles?.[0];
                    if (cycle && cycle.mode === 'mobile') {
                        const routeRes = await fetch(API + '/api/admin/tracking-cycles/' + encodeURIComponent(cycle._id) + '/route', {
                            credentials: 'include', headers: getToken() ? { Authorization: 'Bearer ' + getToken() } : {}
                        });
                        const routeData = await routeRes.json();
                        const routePoints = (routeData.points || []).map(p => [Number(p.latitude), Number(p.longitude)])
                            .filter(p => p.every(Number.isFinite));
                        if (routePoints.length > 1) {
                            const routeLine = L.polyline(routePoints, { color: '#ef4444', weight: 4 }).addTo(trackedMarkers);
                            routeLine.employeeId = String(tracked.employeeId);
                        }
                        const elapsed = Math.max(0, Math.round((Date.now() - new Date(cycle.startedAt)) / 60000));
                        const routeInfo = `مسار اليوم: ${Math.round(Number(cycle.distanceMeters || 0))} م · البداية: ${new Date(cycle.startedAt).toLocaleString('ar-IQ')} · ${elapsed} دقيقة`;
                        const downloadUrl = '/api/admin/tracking-cycles/' + encodeURIComponent(cycle._id) + '/route?download=1';
                        marker.setPopupContent(marker.getPopup().getContent() + '<br>' + escapeHtml(routeInfo) +
                            '<br><a href="' + downloadUrl + '" download>حفظ مسار اليوم</a>');
                        areas.push({ name: tracked.name || 'موظف', area: routeInfo });
                    }
                } catch (error) { console.warn('تعذر تحميل مسار الموظف', error); }
            }
            if (site && validMapPoint(site.latitude, site.longitude)) {
                const sitePoint = [Number(site.latitude), Number(site.longitude)];
                const siteMarker = L.circleMarker(sitePoint, {
                    radius: 8, color: '#f59e0b', fillColor: '#fbbf24', fillOpacity: 0.9
                }).addTo(trackedMarkers).bindPopup(`موقع العمل: ${escapeHtml(site.name || '')}<br>${status} — ${distance}`);
                siteMarker.employeeId = String(tracked.employeeId);
                const line = L.polyline([[lat, lon], sitePoint], { color: '#38bdf8', weight: 3, dashArray: '6 5' })
                    .addTo(trackedMarkers);
                line.employeeId = String(tracked.employeeId);
                bounds.push(sitePoint);
            }

            // Reverse geocoding is an external service and must not hold up the map.
            const areaName = site?.name || `${lat.toFixed(5)}, ${lon.toFixed(5)}`;
            areas.push({ name: tracked.name || 'موظف', area: `${areaName} — ${mode} — ${status} — ${distance} — ${updatedAt}` });
        }
    } catch (error) {
        alert(error.message || 'تعذر جلب مواقع الموظفين');
    }

    // توسيع حدود الخريطة لتناسب جميع النقاط
    if (bounds.length > 0) {
        map.fitBounds(bounds);
    } else {
        alert('لا توجد مواقع مسجلة للموظفين المختارين');
    }

    // عرض المناطق
    renderAreas(areas);
}

function renderAreas(areas) {
    const container = document.getElementById('areasList');
    if (areas.length === 0) {
        container.innerHTML = '<div style="color:#94a3b8">لا توجد بيانات</div>';
        return;
    }
    container.innerHTML = areas.map(a => `<div class="area-item"><i class="fas fa-location-dot"></i> ${escapeHtml(a.name)}: ${escapeHtml(a.area)}</div>`).join('');
}

function validMapPoint(latitude, longitude) {
    if (latitude == null || longitude == null || latitude === '' || longitude === '') return false;
    const lat = Number(latitude), lon = Number(longitude);
    return Number.isFinite(lat) && Number.isFinite(lon) && Math.abs(lat) <= 90 && Math.abs(lon) <= 180 && (lat !== 0 || lon !== 0);
}

function renderSites() {
    const container = document.getElementById('sitesList');
    container.replaceChildren();
    if (!visibleSites.length) {
        container.textContent = 'لا توجد مواقع نشطة بإحداثيات صالحة. أضف موقعًا من صفحة مواقع الشركة.';
        return;
    }
    visibleSites.forEach(({ site, lat, lon, marker }) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'area-item';
        button.style.cursor = 'pointer';
        button.textContent = `${site.demoData ? 'تجريبي: ' : ''}${site.name || 'موقع الشركة'} — نطاق ${Math.round(Number(site.radiusMeters) || 200)}م`;
        button.addEventListener('click', () => {
            map.setView([lat, lon], 16, { animate: true });
            marker.openPopup();
        });
        container.appendChild(button);
    });
}

function escapeHtml(value) {
    return String(value || '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
}

function addBaseMap(target) {
    target.attributionControl.addAttribution(
        '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a> | OpenFreeMap'
    );
    return L.maplibreGL({
        style: 'https://tiles.openfreemap.org/styles/liberty',
        interactive: false
    }).addTo(target);
}

// تهيئة الصفحة
(async function init() {
    if (await auth()) {
        // تهيئة الخريطة بعد تحميل المكتبة
        if (typeof L === 'undefined') {
            alert('تعذر تحميل مكتبة الخريطة');
        } else {
            map = L.map('map').setView([33.3128, 44.3615], 6);
            addBaseMap(map);
            trackedMarkers = L.layerGroup().addTo(map);
            // Company sites can appear without waiting for the employee list.
            await Promise.allSettled([loadLocations(), loadEmployees()]);
        }
    }
})();
</script>

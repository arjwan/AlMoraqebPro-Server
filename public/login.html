<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - نظام المراقب برو</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0f172a;
            --accent: #6366f1;
            --danger: #ef4444;
            --bg-light: #f1f5f9;
            --card-bg: #ffffff;
            --border: #cbd5e1;
            --text-main: #1e293b;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-light);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: var(--text-main);
        }

        .login-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            border: 1.5px solid var(--border);
        }

        h2 {
            text-align: center;
            color: var(--primary);
            font-weight: 900;
            margin-bottom: 25px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }

        label {
            margin-bottom: 8px;
            font-weight: 700;
            font-size: 13px;
            color: #334155;
        }

        input {
            padding: 12px 14px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            font-family: 'Cairo', sans-serif;
            background-color: #f8fafc;
            outline: none;
            transition: all 0.2s;
        }

        input:focus {
            border-color: var(--accent);
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s;
            font-family: 'Cairo', sans-serif;
            margin-top: 10px;
        }

        .btn-login:hover {
            background-color: #4f46e5;
        }

        .error-msg {
            color: var(--danger);
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h2>تسجيل الدخول</h2>
    <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
            <label>اسم المستخدم:</label>
            <input type="text" id="username" required placeholder="أدخل اسم المستخدم">
        </div>
        <div class="form-group">
            <label>كلمة المرور:</label>
            <input type="password" id="password" required placeholder="أدخل كلمة المرور">
        </div>
        <button type="submit" class="btn-login">دخول للنظام</button>
        <div id="errorMsg" class="error-msg">اسم المستخدم أو كلمة المرور غير صحيحة!</div>
    </form>
</div>

<script>
    function handleLogin(e) {
        e.preventDefault();
        const user = document.getElementById('username').value.trim();
        const pass = document.getElementById('password').value.trim();

        // قراءة البيانات المخزنة في الإعدادات إن وجدت، وإلا استخدام القيم الافتراضية
        const savedUser = localStorage.getItem('adminUser') || 'admin';
        const savedPass = localStorage.getItem('adminPass') || 'admin123';

        if (user === savedUser && pass === savedPass) {
            localStorage.setItem('isLoggedIn', 'true');
            window.location.href = 'dashboard.html';
        } else {
            document.getElementById('errorMsg').style.display = 'block';
        }
    }
</script>

</body>
</html>

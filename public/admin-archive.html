<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المراقب برو - أرشيف وملف الموظف</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #2e1a47 0%, #1f1135 50%, #100820 100%); color: #1e293b; min-height: 100vh; padding: 25px; display: flex; justify-content: center; align-items: center; }
        .main-card { width: 100%; max-width: 1200px; background: #ffffff; padding: 30px; border-radius: 24px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4); }
        .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #e2e8f0; padding-bottom: 12px; }
        h2 { font-size: 22px; font-weight: 800; color: #0284c7; }
        .btn { background: #0284c7; color: #fff; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .btn:hover { opacity: 0.9; }
        .form-section { background: #f8fafc; border: 1px solid #e2e8f0; padding: 20px; border-radius: 14px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 6px; color: #334155; }
        select, input[type="file"] { width: 100%; padding: 10px; border: 2px solid #cbd5e1; border-radius: 8px; font-size: 13px; background: #fff; outline: none; }
        .files-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 15px; }
        .file-card { background: #fff; border: 1px dashed #94a3b8; padding: 12px; border-radius: 10px; text-align: center; }
        table { width: 100%; border-collapse: collapse; background: #f8fafc; border-radius: 10px; overflow: hidden; border: 1px solid #e2e8f0; margin-top: 15px; }
        th, td { padding: 12px; text-align: center; font-size: 13px; border-bottom: 1px solid #e2e8f0; }
        th { background: #f1f5f9; color: #334155; font-weight: 700; }
        .success-msg { display: none; background: #d1fae5; color: #065f46; padding: 10px; border-radius: 8px; text-align: center; font-weight: bold; margin-bottom: 15px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="top-nav">
            <h2>📁 أرشيف وملف الموظف (المستندات والوثائق الرسمية)</h2>
            <button class="btn" onclick="window.location.href='admin.html'">← العودة لوحة التحكم</button>
        </div>

        <div id="successMsg" class="success-msg">✅ تم حفظ وثائق الموظف ومزامنتها بنجاح محلياً!</div>

        <div class="form-section">
            <div class="form-group">
                <label>اختر الموظف لعرض أو رفع أوراقه الشخصية:</label>
                <select id="employeeSelect" onchange="loadEmployeeArchive()">
                    <!-- يتم تعبئتها تلقائياً -->
                </select>
            </div>

            <div class="files-grid">
                <div class="file-card">
                    <label>الصورة الشخصية:</label>
                    <input type="file" id="personalPhoto" accept="image/*">
                </div>
                <div class="file-card">
                    <label>البطاقة التعريفية:</label>
                    <input type="file" id="idCard" accept="image/*,.pdf">
                </div>
                <div class="file-card">
                    <label>العقد الوظيفي:</label>
                    <input type="file" id="workContract" accept="image/*,.pdf">
                </div>
                <div class="file-card">
                    <label>الشهادات:</label>
                    <input type="file" id="certificates" accept="image/*,.pdf">
                </div>
            </div>

            <button class="btn" style="background: #10b981; width: 100%; padding: 12px; font-size: 15px;" onclick="saveArchiveLocally()">💾 حفظ ومزامنة الملفات مع قاعدة بيانات النظام</button>
        </div>

        <div>
            <h3 style="font-size: 16px; color: #334155; margin-bottom: 10px;">📋 المستندات المؤرشفة الفعالة:</h3>
            <table>
                <thead>
                    <tr>
                        <th>نوع المستند</th>
                        <th>اسم الملف</th>
                        <th>التصنيف</th>
                        <th>تاريخ الرفع</th>
                        <th>الإجراءات</th>
                    </tr>
                </thead>
                <tbody id="archiveTableBody">
                    <tr><td colspan="5" style="color: #64748b; padding: 20px;">اختر موظفاً لعرض مستنداته المؤرشفة.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let currentCompanyId = '';
        let employeesList = [];

        function initArchive() {
            const urlParams = new URLSearchParams(window.location.search);
            currentCompanyId = urlParams.get('company') || localStorage.getItem('activeCompanyId') || 'B-2060';

            const storageKey = `company_employees_${currentCompanyId}`;
            employeesList = JSON.parse(localStorage.getItem(storageKey)) || JSON.parse(localStorage.getItem('company_employees')) || [];

            const select = document.getElementById('employeeSelect');
            select.innerHTML = '<option value="">-- اختر موظفاً من القائمة --</option>';

            employeesList.forEach((emp, index) => {
                select.innerHTML += `<option value="${emp.username || index}">${emp.name || emp.fullName || 'موظف بدون اسم'}</option>`;
            });
        }

        function loadEmployeeArchive() {
            const selectVal = document.getElementById('employeeSelect').value;
            if (!selectVal) return;

            const emp = employeesList.find(e => (e.username || '') === selectVal || employeesList.indexOf(e).toString() === selectVal);
            if (!emp) return;

            const archiveKey = `archive_${currentCompanyId}_${emp.username || selectVal}`;
            const savedFiles = JSON.parse(localStorage.getItem(archiveKey)) || [];

            renderArchiveTable(savedFiles);
        }

        function renderArchiveTable(files) {
            const tbody = document.getElementById('archiveTableBody');
            tbody.innerHTML = '';

            if (!files || files.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="color: #64748b; padding: 20px;">لا توجد مستندات مرفوعة لهذا الموظف حالياً.</td></tr>`;
                return;
            }

            files.forEach((file, index) => {
                tbody.innerHTML += `
                    <tr>
                        <td><b>${file.type}</b></td>
                        <td>${file.name}</td>
                        <td>مستند رسمي معتمد</td>
                        <td>${file.date}</td>
                        <td><button style="background:#ef4444; color:#fff; border:none; padding:5px 10px; border-radius:6px; cursor:pointer;" onclick="deleteArchiveFile(${index})">حذف</button></td>
                    </tr>
                `;
            });
        }

        function saveArchiveLocally() {
            const selectVal = document.getElementById('employeeSelect').value;
            if (!selectVal) {
                alert("⚠️ يرجى اختيار موظف أولاً.");
                return;
            }

            const emp = employeesList.find(e => (e.username || '') === selectVal || employeesList.indexOf(e).toString() === selectVal);
            const archiveKey = `archive_${currentCompanyId}_${emp.username || selectVal}`;
            let existingFiles = JSON.parse(localStorage.getItem(archiveKey)) || [];

            const fileInputs = [
                { id: 'personalPhoto', label: 'الصورة الشخصية' },
                { id: 'idCard', label: 'البطاقة التعريفية' },
                { id: 'workContract', label: 'العقد الوظيفي' },
                { id: 'certificates', label: 'الشهادات' }
            ];

            let addedCount = 0;
            fileInputs.forEach(item => {
                const input = document.getElementById(item.id);
                if (input.files && input.files[0]) {
                    existingFiles.push({
                        type: item.label,
                        name: input.files[0].name,
                        date: new Date().toLocaleDateString('ar-EG')
                    });
                    addedCount++;
                }
            });

            if (addedCount === 0) {
                alert("⚠️ يرجى اختيار ملف واحد على الأقل للرفع.");
                return;
            }

            localStorage.setItem(archiveKey, JSON.stringify(existingFiles));
            
            const msg = document.getElementById('successMsg');
            msg.style.display = 'block';
            setTimeout(() => { msg.style.display = 'none'; }, 3000);

            loadEmployeeArchive();
        }

        function deleteArchiveFile(index) {
            const selectVal = document.getElementById('employeeSelect').value;
            const archiveKey = `archive_${currentCompanyId}_${selectVal}`;
            let existingFiles = JSON.parse(localStorage.getItem(archiveKey)) || [];
            
            existingFiles.splice(index, 1);
            localStorage.setItem(archiveKey, JSON.stringify(existingFiles));
            renderArchiveTable(existingFiles);
        }

        window.onload = initArchive;
    </script>
</body>
</html>

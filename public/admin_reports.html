<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>التقارير الشاملة - المراقب برو</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#1e1b4b;color:#0f172a;font-family:"Segoe UI",Tahoma,sans-serif;padding:18px}
.wrap{max-width:1600px;margin:auto;background:#fff;border-radius:18px;padding:20px;box-shadow:0 12px 35px #0005}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border:1px solid #e2e8f0;border-radius:14px;padding:14px 18px;margin-bottom:16px}
.brand{font-size:24px;font-weight:900}
.badge{font-size:12px;background:#0284c7;color:#fff;padding:6px 10px;border-radius:8px}
.actions,.filters,.report-types{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}
.blue{background:#0284c7;color:#fff}.green{background:#10b981;color:#fff}.purple{background:#8b5cf6;color:#fff}.orange{background:#f59e0b;color:#fff}
.report-types{margin-bottom:14px}
.report-btn{background:#e2e8f0;color:#334155}
.report-btn.active{background:#0284c7;color:#fff}
.filters{background:#f8fafc;border:1px solid #cbd5e1;border-radius:12px;padding:12px;margin-bottom:15px}
.filters select,.filters input{padding:10px;border:1px solid #94a3b8;border-radius:8px;background:#fff;min-width:170px}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:15px}
.stat{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:15px}
.stat span{display:block;color:#64748b;font-size:12px;font-weight:800}.stat b{font-size:22px}
.table-wrap{overflow:auto;border:1px solid #e2e8f0;border-radius:12px}
table{width:100%;border-collapse:collapse;min-width:1100px}
th{background:#1e293b;color:#fff;padding:11px;font-size:13px}
td{padding:10px;border-bottom:1px solid #e2e8f0;text-align:center;font-size:13px}
.notice{margin-top:14px;padding:12px;border-radius:10px;text-align:center;background:#e0f2fe;color:#075985;font-weight:800}
@media print{
 body{background:#fff;padding:0}
 .top,.report-types,.filters,.notice{display:none!important}
 .wrap{box-shadow:none;max-width:none;padding:0}
 table{min-width:0;font-size:10px}
}
@media(max-width:900px){.summary{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

<body>
<div class="wrap">

<div class="top">
    <div class="brand">📈 التقارير الشاملة <span id="companyBadge" class="badge">...</span></div>
    <div class="actions">
        <button class="btn blue" onclick="loadReport()">🔄 عرض التقرير</button>
        <button class="btn green" onclick="window.print()">🖨 طباعة</button>
        <button class="btn purple" onclick="goHome()">🏠 العودة للرئيسية</button>
    </div>
</div>

<div class="report-types">
    <button class="btn report-btn active" data-type="salary" onclick="selectType('salary',this)">💰 الرواتب</button>
    <button class="btn report-btn" data-type="attendance" onclick="selectType('attendance',this)">🕒 الحضور والغياب</button>
    <button class="btn report-btn" data-type="delegation" onclick="selectType('delegation',this)">✈️ الإيفادات</button>
    <button class="btn report-btn" data-type="locations" onclick="selectType('locations',this)">📍 المواقع</button>
    <button class="btn report-btn" data-type="evaluation" onclick="selectType('evaluation',this)">⭐ تقييم الموظفين</button>
</div>

<div class="filters">
    <select id="scope" onchange="scopeChanged()">
        <option value="company">الشركة بالكامل</option>
        <option value="branch">فرع محدد</option>
        <option value="employee">موظف محدد</option>
    </select>

    <select id="branch" disabled>
        <option value="">اختر الفرع</option>
    </select>

    <select id="employee" disabled>
        <option value="">اختر الموظف</option>
    </select>

    <input id="from" type="date">
    <input id="to" type="date">
</div>

<div class="summary">
    <div class="stat"><span>نوع التقرير</span><b id="sumType">الرواتب</b></div>
    <div class="stat"><span>عدد السجلات</span><b id="sumCount">0</b></div>
    <div class="stat"><span>من</span><b id="sumFrom">—</b></div>
    <div class="stat"><span>إلى</span><b id="sumTo">—</b></div>
</div>

<div class="table-wrap">
<table>
<thead id="reportHead"></thead>
<tbody id="reportBody">
<tr><td>اختر نوع التقرير ثم اضغط عرض التقرير</td></tr>
</tbody>
</table>
</div>

<div id="notice" class="notice">جاهز لعرض التقارير</div>
</div>

<script>
const API=location.origin;
let token='';
let companyId='';
let reportType='salary';
let employees=[];
let locations=[];

function session(){
    try{return JSON.parse(localStorage.getItem('almoraqeb_admin_session')||'{}')}
    catch{return{}}
}

function goHome(){
    location.href='admin.html?company='+encodeURIComponent(companyId);
}

async function auth(){

    token =
        sessionStorage.getItem(
            'almoraqeb_admin_token'
        ) || '';

    const s =
        typeof session === 'function'
            ? session()
            : (
                typeof getSession === 'function'
                    ? getSession()
                    : {}
            );

    companyId = String(
        s.companyId ||
        new URLSearchParams(
            location.search
        ).get('company') ||
        localStorage.getItem(
            'companyId'
        ) ||
        ''
    ).trim();

    if(!companyId){
        location.href =
            'admin_login.html';
        return false;
    }

    /*
     * ملفات Offline موجودة بعد السكربت الرئيسي في بعض الصفحات.
     * ننتظر تحميلها بدلاً من إخراج المدير مباشرة.
     */
    for(
        let i = 0;
        i < 60 &&
        !window.AlMoraqebOfflineAuth;
        i++
    ){
        await new Promise(
            resolve =>
                setTimeout(resolve, 50)
        );
    }

    if(!window.AlMoraqebOfflineAuth){
        console.error(
            'Offline authentication module unavailable'
        );

        location.href =
            'admin_login.html';

        return false;
    }

    const result =
        await AlMoraqebOfflineAuth
            .authorizePage({
                companyId
            });

    if(!result.ok){
        location.href =
            'admin_login.html';
        return false;
    }

    companyId =
        result.companyId ||
        companyId;

    /*
     * أثناء Offline لا نستخدم Token وهمي
     * في طلبات الشبكة إلا أن بعض الدوال
     * تحتاج القيمة لمعرفة وجود الجلسة.
     */
    token =
        sessionStorage.getItem(
            'almoraqeb_admin_token'
        ) || '';

    const badge =
        document.getElementById(
            'companyBadge'
        );

    if(badge)
        badge.textContent =
            companyId;

    const companyLabel =
        document.getElementById(
            'company'
        );

    if(companyLabel)
        companyLabel.textContent =
            companyId;

    const companyStat =
        document.getElementById(
            'companyStat'
        );

    if(companyStat)
        companyStat.textContent =
            companyId;

    document.documentElement.dataset.offline =
        result.offline
            ? 'true'
            : 'false';

    return true;
}

async function api(path){
    const r=await fetch(API+path,{
        headers:{Authorization:'Bearer '+token},
        cache:'no-store'
    });

    const d=await r.json().catch(()=>({}));

    if(!r.ok||d.success===false){
        throw new Error(d.message||d.error||'تعذر جلب التقرير');
    }

    return d;
}

function selectType(type,btn){
    reportType=type;
    document.querySelectorAll('.report-btn').forEach(x=>x.classList.remove('active'));
    btn.classList.add('active');

    const names={
        salary:'الرواتب',
        attendance:'الحضور والغياب',
        delegation:'الإيفادات',
        locations:'المواقع',
        evaluation:'تقييم الموظفين'
    };

    document.getElementById('sumType').textContent=names[type]||type;
}

function scopeChanged(){
    const scope=document.getElementById('scope').value;
    document.getElementById('branch').disabled=scope!=='branch';
    document.getElementById('employee').disabled=scope!=='employee';
}

async function loadBaseData(){
    const emp=await api('/api/employees?companyId='+encodeURIComponent(companyId));
    employees=emp.employees||[];

    const empSelect=document.getElementById('employee');
    empSelect.innerHTML='<option value="">اختر الموظف</option>';

    const branches=new Set();

    employees.forEach(e=>{
        const id=e._id||e.id;
        const o=document.createElement('option');
        o.value=id;
        o.textContent=e.name||id;
        empSelect.appendChild(o);

        if(e.branch) branches.add(e.branch);
    });

    const branchSelect=document.getElementById('branch');
    branchSelect.innerHTML='<option value="">اختر الفرع</option>';

    [...branches].sort().forEach(b=>{
        const o=document.createElement('option');
        o.value=b;
        o.textContent=b;
        branchSelect.appendChild(o);
    });
}

function qparams(){
    const q=new URLSearchParams();
    q.set('type',reportType);
    q.set('scope',document.getElementById('scope').value);

    const branch=document.getElementById('branch').value;
    const employee=document.getElementById('employee').value;
    const from=document.getElementById('from').value;
    const to=document.getElementById('to').value;

    if(branch)q.set('branch',branch);
    if(employee)q.set('employeeId',employee);
    if(from)q.set('from',from);
    if(to)q.set('to',to);

    return q;
}

function fmtDate(v){
    if(!v)return '—';
    const d=new Date(v);
    return Number.isNaN(d.getTime())?'—':d.toLocaleDateString('ar-IQ');
}

function fmtMoney(v){
    return Number(v||0).toLocaleString('ar-IQ');
}

function renderSalary(records){
    reportHead.innerHTML=`
    <tr>
    <th>#</th><th>الموظف</th><th>الفرع/الموقع</th><th>نوع الأجر</th>
    <th>الأساسي</th><th>المخصصات</th><th>الإضافي</th><th>المكافآت</th>
    <th>السلف</th><th>استقطاع السلفة</th><th>البديل</th><th>استقطاع البديل</th>
    <th>استقطاع الغياب</th><th>استقطاع الضمان</th><th>إجمالي الاستقطاع</th><th>الصافي</th>
    </tr>`;

    reportBody.innerHTML=records.length?records.map((x,i)=>`
    <tr>
    <td>${i+1}</td>
    <td>${x.employeeName||''}</td>
    <td>${x.workplace||''}</td>
    <td>${x.wageType||''}</td>
    <td>${fmtMoney(x.basicSalary)}</td>
    <td>${fmtMoney(x.allowances)}</td>
    <td>${fmtMoney(x.overtimeAmount)}</td>
    <td>${fmtMoney(x.bonuses)}</td>
    <td>${fmtMoney(x.loans)}</td>
    <td>${fmtMoney(x.loanDeduction)}</td>
    <td>${x.replacementActive ? (x.replacementName || 'لديه بديل') + ' (' + fmtDate(x.replacementFrom) + ' - ' + fmtDate(x.replacementTo) + ')' : '—'}</td>
    <td>${fmtMoney(x.replacementDeduction)}</td>
    <td>${fmtMoney(x.absenceDeduction)}</td>
    <td>${fmtMoney(x.socialSecurityDeduction)}</td>
    <td>${fmtMoney(x.totalDeductions)}</td>
    <td><b>${fmtMoney(x.netSalary)}</b></td>
    </tr>`).join(''):'<tr><td colspan="15">لا توجد بيانات</td></tr>';
}

function renderAttendance(data){
    reportHead.innerHTML=`
    <tr>
    <th>#</th><th>الموظف</th><th>الحضور</th><th>الانصراف</th>
    <th>الإجازات</th><th>الإيفاد</th><th>الشفت</th><th>الموقع</th>
    </tr>`;

    const map={};

    (data.employees||[]).forEach(e=>{
        map[String(e._id||e.id)]={
            name:e.name||'',
            attendance:0,
            exit:0,
            leave:0,
            delegation:0,
            shift:'',
            workplace:e.workplace||''
        };
    });

    (data.attendance||[]).forEach(a=>{
        const id=String(a.employeeId);
        if(!map[id])return;

        if(a.type==='attendance')map[id].attendance++;
        else map[id].exit++;

        if(a.delegationApplied)map[id].delegation++;
        if(a.shiftName)map[id].shift=a.shiftName;
        if(a.workplace)map[id].workplace=a.workplace;
    });

    (data.leaves||[]).forEach(l=>{
        const id=String(l.employeeId);
        if(map[id])map[id].leave++;
    });

    const rows=Object.values(map);

    reportBody.innerHTML=rows.length?rows.map((x,i)=>`
    <tr>
    <td>${i+1}</td><td>${x.name}</td><td>${x.attendance}</td>
    <td>${x.exit}</td><td>${x.leave}</td><td>${x.delegation}</td>
    <td>${x.shift||'—'}</td><td>${x.workplace||'—'}</td>
    </tr>`).join(''):'<tr><td colspan="8">لا توجد بيانات</td></tr>';
}

function renderDelegation(records){
    reportHead.innerHTML=`
    <tr><th>#</th><th>الموظف</th><th>الفرع</th><th>من</th><th>إلى</th>
    <th>المدة</th><th>المحافظة</th><th>المكان</th><th>السبب</th></tr>`;

    reportBody.innerHTML=records.length?records.map((x,i)=>{
        const f=x.from?new Date(x.from):null;
        const t=x.to?new Date(x.to):null;
        const days=f&&t?Math.max(1,Math.ceil((t-f)/86400000)):'—';

        return `<tr>
        <td>${i+1}</td><td>${x.employeeName||''}</td><td>${x.branch||''}</td>
        <td>${fmtDate(x.from)}</td><td>${fmtDate(x.to)}</td><td>${days}</td>
        <td>${x.province||''}</td><td>${x.locationName||''}</td><td>${x.reason||''}</td>
        </tr>`;
    }).join(''):'<tr><td colspan="9">لا توجد إيفادات</td></tr>';
}

function renderLocations(records){
    reportHead.innerHTML=`
    <tr><th>#</th><th>الموقع</th><th>النوع</th><th>المحافظة</th>
    <th>العنوان</th><th>خط العرض</th><th>خط الطول</th><th>النطاق</th><th>الحالة</th></tr>`;

    reportBody.innerHTML=records.length?records.map((x,i)=>`
    <tr>
    <td>${i+1}</td><td>${x.name||''}</td><td>${x.type||''}</td>
    <td>${x.province||''}</td><td>${x.fullAddress||''}</td>
    <td>${x.latitude??''}</td><td>${x.longitude??''}</td>
    <td>${x.radiusMeters||0} م</td><td>${x.active===false?'موقوف':'فعال'}</td>
    </tr>`).join(''):'<tr><td colspan="9">لا توجد مواقع</td></tr>';
}

function renderEvaluation(records){
    reportHead.innerHTML=`
    <tr><th>#</th><th>الموظف</th><th>الفترة</th><th>من</th><th>إلى</th>
    <th>الحضور</th><th>الانضباط</th><th>الالتزام</th><th>الأداء</th>
    <th>المدير</th><th>المجموع</th><th>التقدير</th></tr>`;

    reportBody.innerHTML=records.length?records.map((x,i)=>`
    <tr>
    <td>${i+1}</td><td>${x.employeeName||''}</td><td>${x.periodType||''}</td>
    <td>${fmtDate(x.fromDate)}</td><td>${fmtDate(x.toDate)}</td>
    <td>${x.attendanceScore||0}</td><td>${x.disciplineScore||0}</td>
    <td>${x.punctualityScore||0}</td><td>${x.performanceScore||0}</td>
    <td>${x.managerScore||0}</td><td><b>${x.totalScore||0}</b></td>
    <td>${x.grade||''}</td>
    </tr>`).join(''):'<tr><td colspan="12">لا توجد تقييمات محفوظة</td></tr>';
}

async function loadReport(){
    const notice=document.getElementById('notice');

    try{
        const q=qparams();
        const data=await api('/api/admin/reports?'+q.toString());

        if(reportType==='salary')renderSalary(data.records||[]);
        if(reportType==='attendance')renderAttendance(data);
        if(reportType==='delegation')renderDelegation(data.records||[]);
        if(reportType==='locations')renderLocations(data.records||[]);
        if(reportType==='evaluation')renderEvaluation(data.records||[]);

        const count=
            data.total ??
            data.records?.length ??
            data.attendance?.length ??
            0;

        document.getElementById('sumCount').textContent=count;
        document.getElementById('sumFrom').textContent=document.getElementById('from').value||'—';
        document.getElementById('sumTo').textContent=document.getElementById('to').value||'—';

        notice.textContent='✅ تم تحميل التقرير';
        notice.style.background='#dcfce7';
        notice.style.color='#166534';
    }catch(e){
        notice.textContent='❌ '+e.message;
        notice.style.background='#fee2e2';
        notice.style.color='#991b1b';
    }
}

(async()=>{
    if(await auth()){
        await loadBaseData();
        await loadReport();
    }
})();
</script>

<script src="/offline_db.js"></script>
<script src="/offline_sync.js"></script>
<script src="/offline_auth.js"></script>
<script src="/offline_boot.js"></script>

</body>
</html>

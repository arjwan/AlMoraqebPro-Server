<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التقارير - نظام المراقب برو</title>
    <style>
        *{box-sizing:border-box}body{margin:0;background:#1e1b4b;color:#0f172a;font-family:'Segoe UI',Tahoma,sans-serif;padding:18px}.wrap{max-width:1500px;margin:auto;background:#fff;border-radius:18px;padding:20px;box-shadow:0 12px 35px #0005}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border:1px solid #e2e8f0;border-radius:14px;padding:14px 18px;margin-bottom:16px}.brand{font-size:24px;font-weight:900}.badge{font-size:12px;background:#0284c7;color:#fff;padding:6px 10px;border-radius:8px;margin-right:8px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 15px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;gap:7px;align-items:center;transition:transform .18s ease,box-shadow .18s ease}.btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px #0f172a26}.btn:active{transform:translateY(0) scale(.98)}.btn-blue{background:#0284c7;color:#fff}.btn-green{background:#10b981;color:#fff}.btn-red{background:#ef4444;color:#fff}.btn-orange{background:#f59e0b;color:#fff}.btn-purple{background:#8b5cf6;color:#fff}.filter-bar{display:flex;gap:10px;margin-bottom:20px;background:#f8fafc;padding:12px;border-radius:10px;border:1px solid #cbd5e1;flex-wrap:wrap;align-items:center}.filter-bar input,.filter-bar select{padding:9px 12px;border:2px solid #94a3b8;border-radius:8px;font-size:14px;outline:none;background:#fff;font-weight:600;flex:1;min-width:180px}.filter-bar input:focus,.filter-bar select:focus{border-color:#0284c7}.tab-bar{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;border-bottom:2px solid #e2e8f0;padding-bottom:10px}.tab-btn{padding:10px 20px;border:0;border-radius:10px 10px 0 0;font-weight:800;cursor:pointer;background:#f1f5f9;color:#64748b;transition:all .2s ease}.tab-btn.active{background:#0284c7;color:#fff}.tab-btn:hover{background:#e2e8f0;transform:translateY(-2px)}.tab-content{display:none}.tab-content.active{display:block}.table-container{width:100%;overflow-x:auto;border-radius:8px;border:1px solid #cbd5e1;margin-bottom:20px}table{width:100%;border-collapse:collapse;text-align:center;background:#fff}th{background:#1e293b;color:#fff;padding:12px;font-size:14px;font-weight:800;text-align:center}td{padding:10px 12px;border-bottom:1px solid #e2e8f0;font-size:14px;color:#1e293b;font-weight:600;text-align:center}tr:hover{background:#f1f5f9}.status-badge{padding:4px 10px;border-radius:20px;font-size:12px;font-weight:bold;display:inline-block}.status-active{background:#d1fae5;color:#065f46}.status-inactive{background:#f1f5f9;color:#64748b}.status-pending{background:#fef3c7;color:#92400e}.status-approved{background:#d1fae5;color:#065f46}.status-rejected{background:#fee2e2;color:#991b1b}.status{margin-top:16px;background:#10b981;color:#fff;padding:12px;border-radius:10px;text-align:center;font-weight:900}.status.error{background:#ef4444}.status.warning{background:#f59e0b}.loading-spinner{display:inline-block;width:24px;height:24px;border:3px solid #f3f3f3;border-top:3px solid #0284c7;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.gps-card{background:#f8fafc;border:1px solid #cbd5e1;border-radius:12px;padding:15px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}.gps-card .name{font-weight:bold;font-size:16px}.gps-card .location{color:#0284c7;font-weight:600}.gps-card .time{color:#64748b;font-size:13px}.settings-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;background:#f8fafc;padding:20px;border-radius:12px;border:1px solid #cbd5e1}.settings-grid .form-group{margin-bottom:12px}.settings-grid .form-group label{display:block;font-weight:bold;margin-bottom:4px}.settings-grid .form-group input,.settings-grid .form-group textarea{width:100%;padding:9px 12px;border:2px solid #94a3b8;border-radius:8px;font-size:14px;outline:none}.settings-grid .form-group input:focus,.settings-grid .form-group textarea:focus{border-color:#0284c7}.settings-grid .full-width{grid-column:span 2}@media(max-width:700px){body{padding:8px}.wrap{padding:12px}.top{padding:12px}.brand{font-size:20px}.settings-grid{grid-template-columns:1fr}.settings-grid .full-width{grid-column:span 1}}
    </style>
</head>
<body>
<div class="wrap">
    <div class="top">
        <div class="brand">📊 التقارير <span id="companyBadge" class="badge">...</span></div>
        <div class="actions">
            <button class="btn btn-purple" onclick="goHome()">🏠 العودة للرئيسية</button>
        </div>
    </div>

    <div class="tab-bar">
        <button class="tab-btn active" data-tab="attendance" onclick="switchTab('attendance')">📍 البصمة</button>
        <button class="tab-btn" data-tab="gps" onclick="switchTab('gps')">🗺️ GPS</button>
        <button class="tab-btn" data-tab="reports" onclick="switchTab('reports')">📈 التقارير</button>
        <button class="tab-btn" data-tab="settings" onclick="switchTab('settings')">⚙️ الإعدادات</button>
        <button class="tab-btn" data-tab="archive" onclick="switchTab('archive')">📁 الأرشيف</button>
    </div>

    <!-- تبويب البصمة -->
    <div id="tab-attendance" class="tab-content active">
        <div class="filter-bar">
            <button class="btn btn-blue" onclick="loadAttendance()">🔄 تحديث</button>
        </div>
        <div class="table-container">
            <table>
                <thead><tr><th>#</th><th>الموظف</th><th>نوع البصمة</th><th>الموقع</th><th>التاريخ والوقت</th></tr></thead>
                <tbody id="attendanceTable"><tr><td colspan="5">جاري تحميل البصمات...</td></tr></tbody>
            </table>
        </div>
    </div>

    <div id="tab-gps" class="tab-content"><div id="gpsRecords"></div></div>
    <div id="tab-reports" class="tab-content">
        <div class="filter-bar"><button class="btn btn-blue" onclick="loadAttendance()">تحديث التقارير</button></div>
        <div id="reportSummary" class="gps-card"></div>
    </div>
    <div id="tab-settings" class="tab-content"><div class="gps-card"><span class="name">إعدادات الشركة</span><span id="settingsCompany" class="location"></span></div></div>
    <div id="tab-archive" class="tab-content"><div id="archiveRecords" class="table-container"></div></div>
    <div id="status" class="status">جاري تحميل بيانات الشركة...</div>
</div>

<script>
const API = location.origin;
let token = sessionStorage.getItem('almoraqeb_admin_token') || '';
let companyId = '';
let attendanceRecords = [];

function escapeHtml(value) {
    const node = document.createElement('span');
    node.textContent = String(value ?? '');
    return node.innerHTML;
}

function showStatus(message, error = false) {
    const status = document.getElementById('status');
    status.textContent = message;
    status.className = 'status' + (error ? ' error' : '');
}

function goHome() {
    location.href = 'admin.html?company=' + encodeURIComponent(companyId);
}

function switchTab(tab) {
    const selected = document.getElementById('tab-' + tab);
    if (!selected) return;
    document.querySelectorAll('.tab-content').forEach(item => item.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(item => item.classList.remove('active'));
    selected.classList.add('active');
    document.querySelector('.tab-btn[data-tab="' + tab + '"]')?.classList.add('active');
}

function renderAttendance() {
    const rows = attendanceRecords.map((record, index) => {
        const type = record.type === 'attendance' ? 'حضور' : 'انصراف';
        const location = Number(record.latitude).toFixed(5) + ', ' + Number(record.longitude).toFixed(5);
        return `<tr><td>${index + 1}</td><td>${escapeHtml(record.employeeName)}</td><td>${type}</td><td>${escapeHtml(record.workplace || location)}</td><td>${new Date(record.timestamp).toLocaleString('ar-IQ')}</td></tr>`;
    }).join('');
    document.getElementById('attendanceTable').innerHTML = rows || '<tr><td colspan="5">لا توجد سجلات حضور أو انصراف</td></tr>';
    document.getElementById('archiveRecords').innerHTML = `<table><thead><tr><th>#</th><th>الموظف</th><th>العملية</th><th>الموقع</th><th>الوقت</th></tr></thead><tbody>${rows || '<tr><td colspan="5">لا توجد سجلات مؤرشفة</td></tr>'}</tbody></table>`;
    document.getElementById('gpsRecords').innerHTML = attendanceRecords.map(record => `<div class="gps-card"><span class="name">${escapeHtml(record.employeeName)}</span><span class="location">${Number(record.latitude).toFixed(5)}, ${Number(record.longitude).toFixed(5)}</span><span class="time">${new Date(record.timestamp).toLocaleString('ar-IQ')}</span></div>`).join('') || '<div class="gps-card">لا توجد مواقع مسجلة</div>';
    const arrivals = attendanceRecords.filter(record => record.type === 'attendance').length;
    document.getElementById('reportSummary').innerHTML = `<span class="name">إجمالي السجلات: ${attendanceRecords.length}</span><span class="location">الحضور: ${arrivals} | الانصراف: ${attendanceRecords.length - arrivals}</span>`;
}

async function loadAttendance() {
    try {
        const response = await fetch(API + '/api/admin/attendance', {
            headers: { Authorization: 'Bearer ' + token }, cache: 'no-store'
        });
        const data = await response.json();
        if (!response.ok || !data.success) throw new Error(data.message || 'تعذر تحميل سجلات الحضور');
        attendanceRecords = data.attendance || [];
        renderAttendance();
        showStatus('تم تحديث ' + attendanceRecords.length + ' سجل حضور وانصراف');
    } catch (error) {
        showStatus(error.message, true);
    }
}

(async () => {
    let session = {};
    try { session = JSON.parse(localStorage.getItem('almoraqeb_admin_session') || '{}'); } catch (_) {}
    companyId = String(session.companyId || new URLSearchParams(location.search).get('company') || localStorage.getItem('companyId') || '').trim();
    if (!token || !companyId) { location.href = 'admin_login.html'; return; }
    try {
        const response = await fetch(API + '/api/admin/session', { headers: { Authorization: 'Bearer ' + token }, cache: 'no-store' });
        const data = await response.json();
        if (!response.ok || !data.success) throw new Error('انتهت جلسة المدير');
        document.getElementById('companyBadge').textContent = companyId;
        document.getElementById('settingsCompany').textContent = companyId;
        switchTab(new URLSearchParams(location.search).get('tab') || 'attendance');
        await loadAttendance();
        setInterval(loadAttendance, 30000);
    } catch (_) {
        location.href = 'admin_login.html';
    }
})();
</script>
</body>
</html>

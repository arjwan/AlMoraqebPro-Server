<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المراقب برو - بصمة الحضور والانصراف الذكية</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); color: #f8fafc; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        
        .card { background: #1e293b; padding: 30px; border-radius: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); width: 100%; max-width: 420px; text-align: center; border: 1px solid #334155; }
        h2 { color: #38bdf8; font-size: 22px; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .subtitle { color: #94a3b8; font-size: 13px; margin-bottom: 25px; }

        .time-box { background: #0f172a; border: 1px solid #334155; padding: 15px; border-radius: 14px; font-size: 26px; font-weight: bold; color: #f8fafc; margin-bottom: 25px; letter-spacing: 1px; }

        .btn { width: 100%; padding: 14px; border-radius: 14px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
        .btn-checkin { background: #10b981; color: white; }
        .btn-checkin:hover { background: #059669; }
        .btn-checkout { background: #ef4444; color: white; }
        .btn-checkout:hover { background: #dc2626; }
        
        .btn-services { background: #0ea5e9; color: white; margin-top: 5px; }
        .btn-services:hover { background: #0284c7; }

        #alertBox { margin-top: 15px; padding: 12px; border-radius: 10px; font-size: 13px; font-weight: bold; display: none; text-align: right; line-height: 1.5; }
        .alert-success { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #10b981; }
        .alert-danger { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }
    </style>
</head>
<body>

    <div class="card">
        <h2>⏱️ بصمة الحضور والانصراف</h2>
        <p class="subtitle" id="companySubtitle">جاري تحميل بيانات الموظف...</p>

        <div class="time-box" id="liveClock">00:00:00</div>

        <button class="btn btn-checkin" onclick="verifyAndRegisterAttendance('تسجيل حضور')">
            🟢 تسجيل حضور (مع التحقق الجغرافي)
        </button>
        
        <button class="btn btn-checkout" onclick="verifyAndRegisterAttendance('تسجيل انصراف')">
            🔴 تسجيل انصراف (مع التحقق الجغرافي)
        </button>

        <!-- زر الانتقال المباشر لصفحة الخدمات والطلبات -->
        <a href="services.html" class="btn btn-services">
            🗂️ الانتقال إلى صفحة الخدمات والطلبات
        </a>

        <div id="alertBox"></div>
    </div>

    <script>
        // تحديث الساعة الحية
        setInterval(() => {
            const now = new Date();
            document.getElementById('liveClock').textContent = now.toLocaleTimeString();
        }, 1000);

        const currentEmployee = localStorage.getItem('activeEmployee') || 'موظف تجريبي';
        const currentCompany = localStorage.getItem('activeCompanyId') || 'default_company';

        document.getElementById('companySubtitle').textContent = `الموظف: ${currentEmployee} | الشركة المرتبطة`;

        // دالة مساعدة لحساب المسافة بالأمتار بين إحداثيات الموظف وإحداثيات مقر العمل
        function calculateDistanceMeters(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI/180;
            const φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1) * Math.PI/180;
            const Δλ = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) * Math.sin(Δλ/2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        }

        // دالة التحقق الذكي الحقيقي من الـ GPS، الشفت، وتحديث السجلات والرواتب آلياً
        function verifyAndRegisterAttendance(type) {
            const alertBox = document.getElementById('alertBox');
            
            if (!navigator.geolocation) {
                showAlert("⚠️ خدمة تحديد الموقع الجغرافي (GPS) غير متوفرة في هذا المتصفح أو الجهاز.", "danger");
                return;
            }

            // 1. التحقق من وجود الموظف ضمن شفت مخصص لهذا اليوم
            const employeeShifts = JSON.parse(localStorage.getItem(`employee_shifts_${currentEmployee}`)) || [];
            const todayDateStr = new Date().toISOString().split('T')[0];
            const assignedShift = employeeShifts.find(s => s.date === todayDateStr);

            // افتراض إحداثيات مركز العمل (يمكن جلبها من إعدادات الشركة أو تعيين افتراضي للمقر الرئيسي)
            // المقر الافتراضي (مثلاً بغداد)
            const workplaceLat = 33.3152;
            const workplaceLng = 44.3661;
            const allowedRadiusMeters = 150; // النطاق المسموح 150 متر

            if (!assignedShift) {
                showAlert(`⚠️ عذراً (${currentEmployee})، أنت غير مضاف إلى شفت عمل مخصص لهذا اليوم. يرجى مراجعة الإدارة لإضافتك للشفت.`, "danger");
                logSystemAction(type, `رفض (${type}): غير مضاف لشفت اليوم`, "danger");
                return;
            }

            showAlert("⏳ جاري تحديد موقعك الجغرافي والتحقق من النطاق...", "success");

            navigator.geolocation.getCurrentPosition((position) => {
                const empLat = position.coords.latitude;
                const empLng = position.coords.longitude;
                
                const distance = calculateDistanceMeters(empLat, empLng, workplaceLat, workplaceLng);
                const isOutOfBounds = distance > allowedRadiusMeters;
                const nowTimeStr = new Date().toLocaleTimeString('ar-EG');
                const fullDateTimeStr = new Date().toLocaleString('ar-EG');

                let logs = JSON.parse(localStorage.getItem(`companyAttendanceLogs_${currentCompany}`)) || [];
                const recordId = 'ATT_' + Date.now();

                if (isOutOfBounds) {
                    // رفض البصمة لكون الموظف خارج النطاق الجغرافي
                    const errorMsg = `❌ تم رفض (${type})! أنت خارج النطاق الجغرافي للعمل بمسافة ${Math.round(distance)} متر (المسموح ${allowedRadiusMeters}م).`;
                    showAlert(errorMsg, "danger");

                    // تسجيل حالة الرفض في سجلات المدير العامة والتقارير المتقدمة
                    logs.unshift({
                        id: recordId,
                        name: currentEmployee,
                        workplace: assignedShift.workplace || "المقر الرئيسي",
                        shiftName: assignedShift.shiftName || "الشفت المخصص",
                        faceStatus: `مرفوض (خارج النطاق ${Math.round(distance)}م)`,
                        date: todayDateStr,
                        attTime: type === 'تسجيل حضور' ? nowTimeStr : '-- : --',
                        depTime: type === 'تسجيل انصراف' ? nowTimeStr : '-- : --',
                        overtime: "لا يوجد",
                        completeDays: 0,
                        missingDays: 1,
                        depStatus: "مرفوض بصمة"
                    });
                    
                    logSystemAction(type, `رفض الموظف (${currentEmployee}) بسبب وجوده خارج النطاق بمسافة ${Math.round(distance)}م`, "danger");
                } else {
                    // قبول البصمة وتسجيل الحضور والانصراف بنجاح وتحديث الرواتب آلياً
                    const successMsg = `✅ تم قبول (${type}) بنجاح ضمن النطاق الجغرافي (${Math.round(distance)} متر) والشفت المخصص!`;
                    showAlert(successMsg, "success");

                    logs.unshift({
                        id: recordId,
                        name: currentEmployee,
                        workplace: assignedShift.workplace || "المقر الرئيسي",
                        shiftName: assignedShift.shiftName || "الشفت المخصص",
                        faceStatus: "مقبول (في النطاق)",
                        date: todayDateStr,
                        attTime: type === 'تسجيل حضور' ? nowTimeStr : '08:00 ص',
                        depTime: type === 'تسجيل انصراف' ? nowTimeStr : 'قيد العمل',
                        overtime: "لا يوجد",
                        completeDays: 1,
                        missingDays: 0,
                        depStatus: type === 'تسجيل انصراف' ? "منصرف نظامي" : "حضور نظامي"
                    });

                    logSystemAction(type, `قام الموظف (${currentEmployee}) بعملية ${type} بنجاح داخل النطاق الجغرافي`, "success");

                    // تحديث صفحة الرواتب آلياً عند تسجيل الحضور
                    if (type === 'تسجيل حضور') {
                        updateDailyPayroll(currentEmployee);
                    }
                }

                localStorage.setItem(`companyAttendanceLogs_${currentCompany}`, JSON.stringify(logs));

            }, (error) => {
                showAlert("❌ تعذر الوصول إلى الـ GPS. تأكد من إذن الموقع في المتصفح وجهازك.", "danger");
            }, {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            });
        }

        // تسجيل الحركات في نظام المدير
        function logSystemAction(type, details, statusType) {
            const systemLogs = JSON.parse(localStorage.getItem(`system_logs_${currentCompany}`)) || [];
            systemLogs.unshift({
                type: type,
                details: details,
                user: currentEmployee,
                timestamp: new Date().toLocaleString('ar-EG')
            });
            localStorage.setItem(`system_logs_${currentCompany}`, JSON.stringify(systemLogs));
        }

        // تحديث الرواتب اليومية آلياً
        function updateDailyPayroll(empName) {
            let payrollData = JSON.parse(localStorage.getItem(`company_payroll_${currentCompany}`)) || [];
            let empRecord = payrollData.find(p => p.name === empName);
            if (empRecord) {
                empRecord.daysPresent = (empRecord.daysPresent || 0) + 1;
            } else {
                payrollData.push({
                    name: empName,
                    daysPresent: 1,
                    daysAbsent: 0,
                    baseSalary: 600000
                });
            }
            localStorage.setItem(`company_payroll_${currentCompany}`, JSON.stringify(payrollData));
        }

        function showAlert(message, type) {
            const alertBox = document.getElementById('alertBox');
            alertBox.style.display = 'block';
            alertBox.className = type === 'success' ? 'alert-success' : 'alert-danger';
            alertBox.textContent = message;

            setTimeout(() => {
                alertBox.style.display = 'none';
            }, 6000);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المراقب برو - لوحة تحكم المطور المركزية</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header-card {
            background: #1e293b;
            padding: 20px 25px;
            border-radius: 16px;
            border: 2px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,.4);
            gap: 15px;
        }

        .header-card h1 {
            font-size: 22px;
            color: #38bdf8;
            font-weight: 900;
        }

        .dev-badge {
            background: #0284c7;
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
        }

        .dev-badge.verified {
            background: #059669;
        }

        .dev-badge.failed {
            background: #dc2626;
        }

        .actions-bar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: .2s;
            box-shadow: 0 4px 10px rgba(0,0,0,.2);
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn:disabled {
            opacity: .6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-primary {
            background: #0284c7;
            color: white;
        }

        .btn-primary:hover {
            background: #0ea5e9;
        }

        .btn-success {
            background: #10b981;
            color: white;
        }

        .btn-success:hover {
            background: #059669;
        }

        .btn-warning {
            background: #f59e0b;
            color: white;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .form-section {
            background: #1e293b;
            padding: 25px;
            border-radius: 16px;
            border: 2px solid #334155;
        }

        .form-section h3,
        .table-section h3 {
            font-size: 18px;
            color: #38bdf8;
            margin-bottom: 16px;
            font-weight: 800;
        }

        .grid-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 14px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 13px;
            color: #94a3b8;
            font-weight: 600;
        }

        input,
        select {
            padding: 12px;
            border: 2px solid #475569;
            border-radius: 10px;
            background: #0f172a;
            color: #fff;
            font-size: 14px;
            outline: none;
            width: 100%;
        }

        input:focus,
        select:focus {
            border-color: #38bdf8;
        }

        .required {
            color: #f87171;
        }

        .table-section {
            background: #1e293b;
            padding: 20px;
            border-radius: 16px;
            border: 2px solid #334155;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
            font-size: 13px;
            min-width: 800px;
        }

        th,
        td {
            padding: 12px 15px;
            border-bottom: 1px solid #334155;
        }

        th {
            color: #94a3b8;
            font-weight: 700;
            background: #0f172a;
        }

        .status-badge {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            display: inline-block;
        }

        .status-active {
            background: #dcfce7;
            color: #166534;
        }

        .status-stopped {
            background: #fee2e2;
            color: #991b1b;
        }

        .status-trial {
            background: #fef3c7;
            color: #92400e;
        }

        .status-monthly {
            background: #dbeafe;
            color: #1e40af;
        }

        .status-annual {
            background: #ede9fe;
            color: #5b21b6;
        }

        .gemini-box {
            background: #0f172a;
            border: 2px dashed #38bdf8;
            padding: 15px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            gap: 15px;
        }

        .gemini-text {
            font-size: 13px;
            color: #38bdf8;
            font-weight: bold;
        }

        .security-box {
            padding: 12px 15px;
            border-radius: 10px;
            background: #172033;
            border: 1px solid #334155;
            margin-bottom: 15px;
            color: #cbd5e1;
            font-size: 13px;
        }

        .security-box.success {
            border-color: #10b981;
            color: #6ee7b7;
        }

        .security-box.error {
            border-color: #ef4444;
            color: #fca5a5;
        }

        .empty-row {
            text-align: center;
            color: #94a3b8;
            padding: 25px !important;
        }

        @media (max-width: 700px) {
            body {
                padding: 10px;
            }

            .header-card {
                flex-direction: column;
                align-items: stretch;
            }

            .header-card h1 {
                font-size: 18px;
            }

            .actions-bar {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }

            .gemini-box {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- رأس الصفحة -->
    <div class="header-card">
        <h1>🛠️ لوحة تحكم وتأسيس الشركات المركزية (المطور)</h1>

        <span id="developerBadge" class="dev-badge">
            🔒 جارٍ التحقق...
        </span>
    </div>

    <!-- حالة الأمان -->
    <div id="securityStatus" class="security-box">
        🔐 جارٍ التحقق من صلاحيات المطور...
    </div>

    <!-- الإجراءات -->
    <div class="actions-bar">

        <button class="btn btn-primary"
                onclick="backupAllSystem()">
            📦 أخذ نسخة احتياطية لكافة الشركات والنظام
        </button>

        <button class="btn btn-success"
                onclick="backupSelectedCompany()">
            📥 نسخة احتياطية لشركة محددة
        </button>

        <button class="btn btn-warning"
                onclick="verifyDeveloperAuth(true)">
            🔐 التحقق من صلاحيات الأمان
        </button>

    </div>

    <!-- إنشاء شركة -->
    <div class="form-section">

        <h3>✨ تأسيس وتسجيل شركة جديدة في النظام</h3>

        <div class="grid-form">

            <div class="form-group">
                <label>
                    معرف الشركة (Company ID)
                    <span class="required">*</span>
                </label>

                <input
                    type="text"
                    id="regCompanyId"
                    placeholder="مثال: B-2070">
            </div>

            <div class="form-group">
                <label>
                    اسم الشركة بالعربي
                    <span class="required">*</span>
                </label>

                <input
                    type="text"
                    id="regCompanyNameAr"
                    placeholder="شركة الأرجوان للبرمجيات">
            </div>

            <div class="form-group">
                <label>اسم الشركة بالانجليزي</label>

                <input
                    type="text"
                    id="regCompanyNameEn"
                    placeholder="Al-Argouan Software">
            </div>

            <div class="form-group">
                <label>اسم المدير المسؤول ورقم الهاتف</label>

                <input
                    type="text"
                    id="regManagerName"
                    placeholder="الاسم ورقم الاتصال للتواصل">
            </div>

            <div class="form-group">
                <label>
                    اسم المستخدم لمدير الشركة
                    <span class="required">*</span>
                </label>

                <input
                    type="text"
                    id="regUsername"
                    value="admin"
                    autocomplete="off">
            </div>

            <div class="form-group">
                <label>
                    كلمة مرور مدير الشركة
                    <span class="required">*</span>
                </label>

                <input
                    type="password"
                    id="regPassword"
                    placeholder="كلمة المرور الإدارية"
                    autocomplete="new-password">
            </div>

            <div class="form-group">
                <label>البريد الإلكتروني للشركة</label>

                <input
                    type="email"
                    id="regEmail"
                    placeholder="company@domain.com">
            </div>

            <div class="form-group">
                <label>مدة الاشتراك</label>

                <select id="regSubscriptionType">

                    <option value="trial">
                        اشتراك تجريبي محدود (7 أيام)
                    </option>

                    <option value="monthly">
                        اشتراك شهر كامل
                    </option>

                    <option value="annual">
                        اشتراك سنوي شامل
                    </option>

                </select>
            </div>

        </div>

        <button
            id="registerButton"
            class="btn btn-success"
            style="margin-top:15px;width:100%;"
            onclick="registerNewCompany()">

            🚀 اعتماد وتأسيس الشركة وحفظها بقاعدة البيانات

        </button>

    </div>

    <!-- Gemini -->
    <div class="gemini-box">

        <span
            class="gemini-text"
            id="geminiStatus">

            ✨ مساعد الصيانة والتطوير جاهز.

        </span>

        <button
            class="btn btn-primary"
            style="padding:8px 15px;font-size:12px;"
            onclick="runGeminiDiagnostics()">

            🤖 تشخيص وصيانة بالذكاء الاصطناعي

        </button>

    </div>

    <!-- الشركات -->
    <div class="table-section">

        <h3>📋 سجل الشركات المسجلة وقواعد البيانات</h3>

        <table>

            <thead>

                <tr>
                    <th>معرف الشركة</th>
                    <th>اسم الشركة</th>
                    <th>نوع الاشتراك</th>
                    <th>حالة النظام</th>
                    <th>الإجراءات</th>
                </tr>

            </thead>

            <tbody id="companiesTableBody">

                <tr>
                    <td colspan="5" class="empty-row">
                        جارٍ تحميل الشركات...
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

</div>


<script>

    /*
     * =========================================================
     * إعدادات المطور
     * =========================================================
     */

    let developerToken =
        sessionStorage.getItem('almoraqeb_developer_token') || '';

    let companiesCache = [];

    let developerVerified = false;


    /*
     * =========================================================
     * طلبات API الخاصة بالمطور
     * =========================================================
     */

    async function developerRequest(url, options = {}) {

        if (!developerToken) {

            developerVerified = false;

            throw new Error(
                'جلسة المطور غير موجودة. يجب تسجيل دخول المطور أولاً.'
            );
        }

        const headers = {
            'Content-Type': 'application/json',

            ...(options.headers || {}),

            'Authorization': `Bearer ${developerToken}`
        };

        const response = await fetch(url, {
            ...options,
            headers
        });

        const data =
            await response.json().catch(() => ({}));


        /*
         * إذا رفض السيرفر التوكن
         */
        if (response.status === 401 ||
            response.status === 403) {

            developerToken = '';

            developerVerified = false;

            sessionStorage.removeItem(
                'almoraqeb_developer_token'
            );

            updateSecurityUI(false);

            throw new Error(
                'تم رفض صلاحيات المطور. يرجى تسجيل الدخول من جديد.'
            );
        }


        if (!response.ok || data.success === false) {

            throw new Error(
                data.message ||
                data.error ||
                'تعذر تنفيذ العملية'
            );
        }

        return data;
    }


    /*
     * =========================================================
     * تسجيل دخول المطور
     * =========================================================
     */

    async function authenticateDeveloper(forceLogin = false) {

        if (developerToken && !forceLogin) {

            /*
             * نتحقق فعلياً من التوكن مع السيرفر
             */
            try {

                await developerRequest(
                    '/api/developer/companies',
                    {
                        method: 'GET'
                    }
                );

                developerVerified = true;

                updateSecurityUI(true);

                return true;

            } catch (error) {

                console.warn(
                    'Developer token validation failed:',
                    error
                );

                developerToken = '';

                sessionStorage.removeItem(
                    'almoraqeb_developer_token'
                );

                developerVerified = false;
            }
        }


        const password = prompt(
            '🔒 أدخل كلمة مرور المطور للمتابعة:'
        );


        if (!password) {

            updateSecurityUI(false);

            return false;
        }


        try {

            const response = await fetch(
                '/api/developer/login',
                {
                    method: 'POST',

                    headers: {
                        'Content-Type':
                            'application/json'
                    },

                    body: JSON.stringify({
                        password
                    })
                }
            );


            const result =
                await response.json().catch(() => ({}));


            if (!response.ok ||
                !result.success ||
                !result.token) {

                throw new Error(
                    result.message ||
                    'تم رفض دخول المطور'
                );
            }


            developerToken = result.token;


            sessionStorage.setItem(
                'almoraqeb_developer_token',
                developerToken
            );


            /*
             * تحقق إضافي من أن التوكن يستطيع الوصول
             * إلى API المطور.
             */

            await developerRequest(
                '/api/developer/companies',
                {
                    method: 'GET'
                }
            );


            developerVerified = true;

            updateSecurityUI(true);

            return true;


        } catch (error) {

            console.error(error);

            developerToken = '';

            developerVerified = false;

            sessionStorage.removeItem(
                'almoraqeb_developer_token'
            );

            updateSecurityUI(false);

            alert(
                `❌ ${error.message}`
            );

            return false;
        }
    }


    /*
     * =========================================================
     * واجهة حالة الحماية
     * =========================================================
     */

    function updateSecurityUI(verified) {

        const badge =
            document.getElementById(
                'developerBadge'
            );

        const box =
            document.getElementById(
                'securityStatus'
            );


        if (verified) {

            badge.className =
                'dev-badge verified';

            badge.innerText =
                '🔐 المطور موثّق';


            box.className =
                'security-box success';

            box.innerText =
                '✅ تم التحقق من صلاحيات المطور بنجاح. جميع عمليات الإدارة محمية بالتوكن.';

        } else {

            badge.className =
                'dev-badge failed';

            badge.innerText =
                '🔒 غير موثّق';


            box.className =
                'security-box error';

            box.innerText =
                '❌ لم يتم التحقق من صلاحيات المطور.';
        }
    }


    /*
     * =========================================================
     * تحقق يدوي
     * =========================================================
     */

    async function verifyDeveloperAuth(showMessage = false) {

        const verified =
            await authenticateDeveloper(true);


        if (verified) {

            await loadCompaniesTable();

            if (showMessage) {

                alert(
                    '✅ تم التحقق من صلاحيات المطور بنجاح.'
                );
            }

            return true;
        }


        return false;
    }


    /*
     * =========================================================
     * عند فتح الصفحة
     * =========================================================
     */

    window.addEventListener(
        'load',
        async function () {

            updateSecurityUI(false);

            const verified =
                await authenticateDeveloper(false);


            if (!verified) {

                document.getElementById(
                    'companiesTableBody'
                ).innerHTML = `
                    <tr>
                        <td colspan="5"
                            class="empty-row">
                            🔒 يجب تسجيل دخول المطور للوصول إلى هذه الصفحة.
                        </td>
                    </tr>
                `;

                return;
            }


            await loadCompaniesTable();


            playGeminiVoice(
                'أهلاً بك يا مطور النظام في لوحة التحكم المركزية.'
            );

        }
    );


    /*
     * =========================================================
     * الصوت
     * =========================================================
     */

    function playGeminiVoice(text) {

        if (!('speechSynthesis' in window))
            return;


        window.speechSynthesis.cancel();


        const utterance =
            new SpeechSynthesisUtterance(text);


        utterance.lang = 'ar-SA';

        utterance.rate = 1.0;


        const voices =
            window.speechSynthesis.getVoices();


        const voice =
            voices.find(v =>
                v.name.includes('Google Arabic') ||
                v.lang === 'ar-SA' ||
                v.lang.startsWith('ar')
            );


        if (voice)
            utterance.voice = voice;


        window.speechSynthesis.speak(
            utterance
        );
    }


    /*
     * =========================================================
     * إنشاء شركة جديدة
     * =========================================================
     */

    async function registerNewCompany() {

        /*
         * أهم إصلاح:
         * لا ننفذ التسجيل قبل التحقق من المطور.
         */

        if (!developerVerified) {

            const verified =
                await authenticateDeveloper(false);


            if (!verified) {

                alert(
                    '🔒 يجب التحقق من صلاحيات المطور أولاً.'
                );

                return;
            }
        }


        const compId =
            document.getElementById(
                'regCompanyId'
            ).value.trim();


        const nameAr =
            document.getElementById(
                'regCompanyNameAr'
            ).value.trim();


        const nameEn =
            document.getElementById(
                'regCompanyNameEn'
            ).value.trim();


        const email =
            document.getElementById(
                'regEmail'
            ).value.trim();


        const managerDetails =
            document.getElementById(
                'regManagerName'
            ).value.trim();


        const adminUsername =
            document.getElementById(
                'regUsername'
            ).value.trim();


        const adminPassword =
            document.getElementById(
                'regPassword'
            ).value;


        const subType =
            document.getElementById(
                'regSubscriptionType'
            ).value;


        /*
         * التحقق من الحقول
         */

        if (!compId) {

            alert(
                '⚠️ أدخل معرف الشركة.'
            );

            return;
        }


        if (!nameAr) {

            alert(
                '⚠️ أدخل اسم الشركة بالعربي.'
            );

            return;
        }


        if (!adminUsername) {

            alert(
                '⚠️ أدخل اسم مستخدم مدير الشركة.'
            );

            return;
        }


        if (!adminPassword) {

            alert(
                '⚠️ أدخل كلمة مرور مدير الشركة.'
            );

            return;
        }


        if (adminPassword.length < 6) {

            alert(
                '⚠️ كلمة المرور يجب ألا تقل عن 6 أحرف.'
            );

            return;
        }


        /*
         * حساب تاريخ الانتهاء
         */

        const startDate =
            new Date();


        const expiryDate =
            new Date();


        if (subType === 'trial') {

            expiryDate.setDate(
                expiryDate.getDate() + 7
            );

        } else if (subType === 'monthly') {

            expiryDate.setMonth(
                expiryDate.getMonth() + 1
            );

        } else {

            expiryDate.setFullYear(
                expiryDate.getFullYear() + 1
            );
        }


        const registerButton =
            document.getElementById(
                'registerButton'
            );


        registerButton.disabled = true;

        registerButton.innerText =
            '⏳ جارٍ التحقق وحفظ الشركة...';


        try {

            /*
             * =================================================
             * الإصلاح المهم:
             *
             * التسجيل الآن يمر عبر developerRequest
             * وبالتالي يتم إرسال:
             *
             * Authorization: Bearer developerToken
             *
             * =================================================
             */

            const result =
                await developerRequest(
                    '/api/companies/register',
                    {
                        method: 'POST',

                        body: JSON.stringify({

                            companyId: compId,

                            name: nameAr,

                            /*
                             * إرسال الاسم الإنجليزي أيضاً
                             * إذا كان السيرفر يدعمه.
                             */

                            nameEn: nameEn,

                            email: email,

                            phone: managerDetails,

                            adminUsername:
                                adminUsername,

                            /*
                             * بعض إصدارات الـ API القديمة
                             * تستخدم password بدلاً من adminPassword.
                             *
                             * لذلك نرسل الاثنين.
                             */

                            adminPassword:
                                adminPassword,

                            password:
                                adminPassword,

                            subscription:
                                subType,

                            systemState:
                                'active',

                            subscriptionStartDate:
                                startDate.toISOString(),

                            subscriptionEndDate:
                                expiryDate.toISOString()
                        })
                    }
                );


            console.log(
                'Company registration result:',
                result
            );


            alert(
                `✅ تم تأسيس الشركة بنجاح\n\n` +
                `الشركة: ${nameAr}\n` +
                `المعرف: ${compId}\n` +
                `نوع الاشتراك: ${subType}`
            );


            playGeminiVoice(
                'تم تسجيل الشركة بنجاح في قاعدة البيانات.'
            );


            /*
             * تفريغ النموذج
             */

            document.getElementById(
                'regCompanyId'
            ).value = '';


            document.getElementById(
                'regCompanyNameAr'
            ).value = '';


            document.getElementById(
                'regCompanyNameEn'
            ).value = '';


            document.getElementById(
                'regManagerName'
            ).value = '';


            document.getElementById(
                'regEmail'
            ).value = '';


            document.getElementById(
                'regPassword'
            ).value = '';


            document.getElementById(
                'regUsername'
            ).value = 'admin';


            /*
             * تحديث الجدول
             */

            await loadCompaniesTable();


        } catch (error) {

            console.error(
                'Company registration error:',
                error
            );


            alert(
                `❌ لم يتم حفظ الشركة\n\n${error.message}`
            );


            /*
             * إذا كان الخطأ متعلقاً بالتوثيق
             * نعيد التحقق.
             */

            if (
                error.message.includes('صلاحيات') ||
                error.message.includes('تسجيل الدخول') ||
                error.message.includes('توكن') ||
                error.message.includes('401') ||
                error.message.includes('403')
            ) {

                developerVerified = false;

                updateSecurityUI(false);
            }


        } finally {

            registerButton.disabled = false;

            registerButton.innerText =
                '🚀 اعتماد وتأسيس الشركة وحفظها بقاعدة البيانات';
        }
    }


    /*
     * =========================================================
     * تحميل الشركات
     * =========================================================
     */

    async function loadCompaniesTable() {

        const tbody =
            document.getElementById(
                'companiesTableBody'
            );


        try {

            const result =
                await developerRequest(
                    '/api/developer/companies',
                    {
                        method: 'GET'
                    }
                );


            companiesCache =
                Array.isArray(result.companies)
                    ? result.companies
                    : [];


            developerVerified = true;

            updateSecurityUI(true);


        } catch (error) {

            console.error(error);


            tbody.innerHTML = `
                <tr>
                    <td colspan="5"
                        class="empty-row">
                        ❌ ${escapeHtml(error.message)}
                    </td>
                </tr>
            `;

            return;
        }


        if (companiesCache.length === 0) {

            tbody.innerHTML = `
                <tr>
                    <td colspan="5"
                        class="empty-row">
                        لا توجد شركات مسجلة حالياً.
                    </td>
                </tr>
            `;

            return;
        }


        tbody.innerHTML = '';


        companiesCache.forEach(
            (comp, index) => {

                const isExpired =
                    comp.subscriptionEndDate &&
                    new Date(
                        comp.subscriptionEndDate
                    ) < new Date();


                const active =
                    comp.systemState === 'active' &&
                    !isExpired;


                const statusClass =
                    active
                        ? 'status-active'
                        : 'status-stopped';


                const statusText =
                    isExpired
                        ? 'منتهي الاشتراك'
                        : (
                            comp.systemState === 'active'
                                ? 'نشطة'
                                : 'متوقفة يدوياً'
                        );


                let subscriptionClass =
                    'status-trial';


                if (comp.subscription === 'monthly')
                    subscriptionClass = 'status-monthly';


                if (comp.subscription === 'annual')
                    subscriptionClass = 'status-annual';


                const subscriptionText =
                    comp.subscription === 'trial'
                        ? 'تجريبي'
                        : (
                            comp.subscription === 'monthly'
                                ? 'شهري'
                                : 'سنوي'
                        );


                tbody.innerHTML += `

                    <tr>

                        <td>
                            <b>
                                ${escapeHtml(
                                    comp.companyId || ''
                                )}
                            </b>
                        </td>

                        <td>
                            ${escapeHtml(
                                comp.name || ''
                            )}
                        </td>

                        <td>
                            <span class="status-badge ${subscriptionClass}">
                                ${subscriptionText}
                            </span>
                        </td>

                        <td>
                            <span class="status-badge ${statusClass}">
                                ${statusText}
                            </span>
                        </td>

                        <td>

                            <button
                                class="btn btn-warning"
                                style="padding:5px 10px;font-size:11px;"
                                onclick="toggleCompanyStatus(${index})">

                                ${
                                    comp.systemState === 'active'
                                        ? '⏸️ إيقاف'
                                        : '▶️ تفعيل'
                                }

                            </button>


                            <button
                                class="btn btn-primary"
                                style="padding:5px 10px;font-size:11px;"
                                onclick="editCompany(${index})">

                                ✏️ تعديل

                            </button>


                            <button
                                class="btn btn-danger"
                                style="padding:5px 10px;font-size:11px;"
                                onclick="deleteCompany(${index})">

                                🗑️ حذف

                            </button>

                        </td>

                    </tr>
                `;
            }
        );
    }


    /*
     * =========================================================
     * تغيير حالة الشركة
     * =========================================================
     */

    async function toggleCompanyStatus(index) {

        const company =
            companiesCache[index];


        if (!company)
            return;


        try {

            await developerRequest(
                `/api/developer/companies/${encodeURIComponent(
                    company.companyId
                )}`,
                {
                    method: 'PATCH',

                    body: JSON.stringify({

                        systemState:
                            company.systemState === 'active'
                                ? 'stopped'
                                : 'active'
                    })
                }
            );


            await loadCompaniesTable();


            alert(
                '🔄 تم تغيير حالة الشركة في MongoDB.'
            );


        } catch (error) {

            alert(
                `❌ ${error.message}`
            );
        }
    }


    /*
     * =========================================================
     * تعديل الشركة
     * =========================================================
     */

    async function editCompany(index) {

        const company =
            companiesCache[index];


        if (!company)
            return;


        const newName =
            prompt(
                'أدخل الاسم الجديد للشركة:',
                company.name || ''
            );


        if (!newName)
            return;


        const adminUsername =
            prompt(
                'اسم مستخدم مدير الشركة:',
                company.adminUsername || 'admin'
            );


        if (
            adminUsername === null ||
            !adminUsername.trim()
        )
            return;


        const adminPassword =
            prompt(
                'كلمة مرور مدير الشركة الجديدة (اتركها فارغة للاحتفاظ بالحالية):',
                ''
            );


        try {

            const update = {

                name:
                    newName.trim(),

                adminUsername:
                    adminUsername.trim()
            };


            if (adminPassword)
                update.adminPassword =
                    adminPassword;


            await developerRequest(
                `/api/developer/companies/${encodeURIComponent(
                    company.companyId
                )}`,
                {
                    method: 'PATCH',

                    body: JSON.stringify(
                        update
                    )
                }
            );


            await loadCompaniesTable();


            alert(
                '✅ تم تعديل بيانات الشركة في MongoDB.'
            );


        } catch (error) {

            alert(
                `❌ ${error.message}`
            );
        }
    }


    /*
     * =========================================================
     * حذف الشركة
     * =========================================================
     */

    async function deleteCompany(index) {

        const company =
            companiesCache[index];


        if (!company)
            return;


        const confirmed =
            confirm(
                '⚠️ تحذير صارم:\n\n' +
                'هل أنت متأكد من الحذف النهائي للشركة وسجلاتها؟\n\n' +
                'لا يمكن التراجع عن هذا الإجراء.'
            );


        if (!confirmed)
            return;


        try {

            await developerRequest(
                `/api/developer/companies/${encodeURIComponent(
                    company.companyId
                )}`,
                {
                    method: 'DELETE'
                }
            );


            await loadCompaniesTable();


            alert(
                '🗑️ تم حذف الشركة وسجلاتها من MongoDB.'
            );


        } catch (error) {

            alert(
                `❌ ${error.message}`
            );
        }
    }


    /*
     * =========================================================
     * النسخة الاحتياطية
     * =========================================================
     */

    function backupAllSystem() {

        if (!developerVerified) {

            alert(
                '🔒 يجب التحقق من صلاحيات المطور أولاً.'
            );

            return;
        }


        const allData = {

            system:
                'AlMoraqebPro Full System Backup',

            timestamp:
                new Date().toISOString(),

            companies:
                companiesCache,

            storage:
                {
                    ...localStorage
                }
        };


        downloadJSON(
            allData,
            `AlMoraqebPro_Full_System_Backup_${new Date()
                .toISOString()
                .slice(0, 10)}.json`
        );


        alert(
            '📦 تم تنزيل النسخة الاحتياطية.'
        );
    }


    function backupSelectedCompany() {

        if (!developerVerified) {

            alert(
                '🔒 يجب التحقق من صلاحيات المطور أولاً.'
            );

            return;
        }


        const compId =
            prompt(
                'أدخل معرف الشركة (Company ID):'
            );


        if (!compId)
            return;


        const companyLogs =
            localStorage.getItem(
                `attendance_history_${compId}`
            ) || '[]';


        let attendance = [];


        try {

            attendance =
                JSON.parse(companyLogs);

        } catch {

            attendance = [];
        }


        const companyData = {

            companyId:
                compId,

            timestamp:
                new Date().toISOString(),

            attendance
        };


        downloadJSON(
            companyData,
            `Company_Backup_${compId}_${new Date()
                .toISOString()
                .slice(0, 10)}.json`
        );


        alert(
            `📥 تم تنزيل النسخة الاحتياطية الخاصة بشركة (${compId}).`
        );
    }


    function downloadJSON(data, filename) {

        const dataStr =
            'data:application/json;charset=utf-8,' +
            encodeURIComponent(
                JSON.stringify(
                    data,
                    null,
                    4
                )
            );


        const dlAnchor =
            document.createElement('a');


        dlAnchor.setAttribute(
            'href',
            dataStr
        );


        dlAnchor.setAttribute(
            'download',
            filename
        );


        document.body.appendChild(
            dlAnchor
        );


        dlAnchor.click();


        dlAnchor.remove();
    }


    /*
     * =========================================================
     * تشخيص Gemini
     * =========================================================
     */

    function runGeminiDiagnostics() {

        if (!developerVerified) {

            alert(
                '🔒 يجب التحقق من صلاحيات المطور أولاً.'
            );

            return;
        }


        playGeminiVoice(
            'جاري فحص سلامة النظام وقواعد البيانات.'
        );


        document.getElementById(
            'geminiStatus'
        ).innerText =
            '🤖 فحص الذكاء الاصطناعي: جلسة المطور موثقة، والحماية مفعلة.';


        alert(
            '🤖 تم فحص واجهة لوحة المطور. جلسة المطور موثقة حالياً.'
        );
    }


    /*
     * =========================================================
     * حماية عرض البيانات داخل HTML
     * =========================================================
     */

    function escapeHtml(value) {

        return String(value)
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#039;');
    }

</script>

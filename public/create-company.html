<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المطور - اعتماد الشركات</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; min-height: 100vh; padding: 40px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .header { background: #1e293b; padding: 25px; border-radius: 16px; margin-bottom: 30px; border: 1px solid #334155; }
        .header h2 { color: #38bdf8; font-size: 24px; margin-bottom: 8px; }
        .header p { color: #94a3b8; font-size: 14px; }
        .card { background: #1e293b; border: 1px solid #334155; padding: 25px; border-radius: 16px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .info p { margin-bottom: 8px; font-size: 15px; color: #cbd5e1; }
        .info p span { color: #38bdf8; font-weight: bold; }
        .btn-approve { background: #10b981; color: white; border: none; padding: 14px 24px; border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(16,185,129,0.3); }
        .btn-approve:hover { background: #059669; transform: translateY(-2px); }
        .empty-msg { text-align: center; color: #64748b; font-size: 18px; margin-top: 60px; background: #1e293b; padding: 40px; border-radius: 16px; border: 1px solid #334155; }
        .dev-footer { margin-top: 40px; text-align: center; color: #64748b; font-size: 13px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>🛡️ لوحة المطور - تفعيل وإنشاء حسابات الشركات</h2>
            <p>شركة الأرجوان للبرمجيات | إدارة طلبات العملاء المعلقة بانتظار الموافقة</p>
        </div>

        <div id="requestsContainer">
            <!-- يتم تحميل الطلبات هنا ديناميكياً -->
        </div>

        <div class="dev-footer">
            الدعم الفني: 07807807491 (واتساب) | البريد: mohmed1628@gmail.com
        </div>
    </div>

    <script>
        function loadPendingRequests() {
            const container = document.getElementById('requestsContainer');
            let pendingList = JSON.parse(localStorage.getItem('pendingCompanies')) || [];

            // إزالة أي تكرار محتمل بناءً على معرف الشركة (id)
            const uniquePending = [];
            const seenIds = new Set();
            for (const comp of pendingList) {
                if (comp && comp.id && !seenIds.has(comp.id)) {
                    seenIds.add(comp.id);
                    uniquePending.push(comp);
                }
            }
            // حفظ القائمة النظيفة بدون تكرار في التخزين المحلي
            localStorage.setItem('pendingCompanies', JSON.stringify(uniquePending));

            if (uniquePending.length === 0) {
                container.innerHTML = '<div class="empty-msg">📭 لا توجد طلبات تسجيل شركات معلقة حالياً.</div>';
                return;
            }

            container.innerHTML = '';
            uniquePending.forEach((comp, index) => {
                container.innerHTML += `
                    <div class="card">
                        <div class="info">
                            <p>1. اسم الشركة بالإنجليزية (ID): <span>${comp.id}</span></p>
                            <p>2. اسم الشركة العربي: <span>${comp.name}</span></p>
                            <p>3. اسم المدير: <span>${comp.manager}</span></p>
                            <p>4. رقم الهاتف: <span>${comp.phone}</span></p>
                            <p>5. البريد الإلكتروني: <span>${comp.email}</span></p>
                            <p>6. اسم المستخدم: <span>${comp.username}</span></p>
                        </div>
                        <button class="btn-approve" onclick="approveCompany('${comp.id}')">✔ موافقة وتفعيل النظام</button>
                    </div>
                `;
            });
        }

        function approveCompany(companyId) {
            let pendingList = JSON.parse(localStorage.getItem('pendingCompanies')) || [];
            
            // العثور على الشركة المستهدفة وحذفها من المعلق
            const index = pendingList.findIndex(c => c.id === companyId);
            if (index === -1) return;
            
            let approvedComp = pendingList.splice(index, 1)[0];

            let activeCompanies = JSON.parse(localStorage.getItem('registeredCompanies')) || [];
            
            // التأكد من عدم إضافتها مسبقاً للنشطين
            if (!activeCompanies.some(c => c.id === approvedComp.id)) {
                activeCompanies.push(approvedComp);
            }

            localStorage.setItem('registeredCompanies', JSON.stringify(activeCompanies));
            localStorage.setItem('pendingCompanies', JSON.stringify(pendingList));

            alert(`🎉 تم تفعيل النظام بنجاح لشركة (${approvedComp.name})!\n📩 يمكنه تسجيل الدخول الآن.`);
            loadPendingRequests();
        }

        window.onload = loadPendingRequests;
    </script>
</body>
</html>

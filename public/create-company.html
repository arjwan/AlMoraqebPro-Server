<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المطور - إدارة الشركات المسجلة</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; min-height: 100vh; padding: 40px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .header { background: #1e293b; padding: 25px; border-radius: 16px; margin-bottom: 25px; border: 1px solid #334155; }
        .header h2 { color: #38bdf8; font-size: 24px; margin-bottom: 8px; }
        .header p { color: #94a3b8; font-size: 14px; }
        
        .search-box { margin-bottom: 25px; }
        .search-box input { width: 100%; padding: 15px 20px; font-size: 16px; background: #1e293b; border: 1px solid #334155; border-radius: 12px; color: #fff; outline: none; }
        .search-box input:focus { border-color: #38bdf8; }

        .card { background: #1e293b; border: 1px solid #334155; padding: 25px; border-radius: 16px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .info p { margin-bottom: 6px; font-size: 14px; color: #cbd5e1; }
        .info p span { color: #38bdf8; font-weight: bold; }
        
        .actions { display: flex; flex-direction: column; gap: 10px; min-width: 140px; }
        .btn { padding: 10px 16px; border-radius: 10px; font-weight: bold; cursor: pointer; border: none; transition: 0.3s; color: white; text-align: center; font-size: 13px; }
        .btn-pause { background: #f59e0b; }
        .btn-pause:hover { background: #d97706; }
        .btn-play { background: #10b981; }
        .btn-play:hover { background: #059669; }
        .btn-delete { background: #ef4444; }
        .btn-delete:hover { background: #dc2626; }
        
        .status-badge { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; margin-bottom: 8px; }
        .status-active { background: rgba(16, 185, 129, 0.2); color: #34d399; }
        .status-stopped { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }

        .empty-msg { text-align: center; color: #64748b; font-size: 18px; margin-top: 60px; background: #1e293b; padding: 40px; border-radius: 16px; border: 1px solid #334155; }
        .dev-footer { margin-top: 40px; text-align: center; color: #64748b; font-size: 13px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>🛡️ لوحة المطور - إدارة الشركات المسجلة</h2>
            <p>شركة الأرجوان للبرمجيات | التحكم الكامل بالشركات المفعلة (إيقاف، تشغيل، حذف، وبحث حقيقي عبر السيرفر)</p>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 ابحث عن شركة (بالاسم، المعرف، أو اسم المستخدم)..." oninput="filterCompaniesLocally()">
        </div>

        <div id="companiesContainer">
            <div class="empty-msg">⏳ جاري تحميل الشركات المسجلة من السيرفر...</div>
        </div>

        <div class="dev-footer">
            الدعم الفني: 07807807491 (واتساب) | البريد: mohmed1628@gmail.com
        </div>
    </div>

    <script>
        let allCompanies = [];

        async function loadCompanies() {
            const container = document.getElementById('companiesContainer');
            try {
                const response = await fetch('/api/developer/companies');
                const data = await response.json();

                if (data.success && data.companies) {
                    allCompanies = data.companies;
                    renderCompanies(allCompanies);
                } else {
                    container.innerHTML = '<div class="empty-msg">📭 لا توجد أي شركات مسجلة في النظام حالياً.</div>';
                }
            } catch (err) {
                console.error("فشل جلب الشركات من السيرفر:", err);
                container.innerHTML = '<div class="empty-msg" style="color: #ef4444;">❌ تعذر الاتصال بالسيرفر لجلب قائمة الشركات.</div>';
            }
        }

        function renderCompanies(list) {
            const container = document.getElementById('companiesContainer');
            if (!list || list.length === 0) {
                container.innerHTML = '<div class="empty-msg">🔍 لم يتم العثور على أي شركة تطابق بحثك.</div>';
                return;
            }

            container.innerHTML = '';
            list.forEach((comp) => {
                const isActive = comp.status !== 'stopped';
                const statusClass = isActive ? 'status-active' : 'status-stopped';
                const statusText = isActive ? '🟢 مفعل (يعمل)' : '🟡 متوقف مؤقتاً';

                container.innerHTML += `
                    <div class="card" id="comp-card-${comp.id}">
                        <div class="info">
                            <span class="status-badge ${statusClass}">${statusText}</span>
                            <p>معرف الشركة (ID): <span>${comp.id}</span></p>
                            <p>اسم الشركة العربي: <span>${comp.name || comp.company_name || 'غير متوفر'}</span></p>
                            <p>اسم المدير: <span>${comp.manager || 'غير متوفر'}</span></p>
                            <p>رقم الهاتف: <span>${comp.phone || 'غير متوفر'}</span></p>
                            <p>اسم المستخدم: <span>${comp.username || 'غير متوفر'}</span></p>
                        </div>
                        <div class="actions">
                            ${isActive ? 
                                `<button class="btn btn-pause" onclick="toggleStatus('${comp.id}', 'stop')">⏸️ إيقاف مؤقت</button>` : 
                                `<button class="btn btn-play" onclick="toggleStatus('${comp.id}', 'start')">▶️ تشغيل النظام</button>`
                            }
                            <button class="btn btn-delete" onclick="deleteCompany('${comp.id}')">🗑️ حذف الشركة</button>
                        </div>
                    </div>
                `;
            });
        }

        function filterCompaniesLocally() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const filtered = allCompanies.filter(c => 
                (c.id && c.id.toLowerCase().includes(query)) || 
                (c.name && c.name.toLowerCase().includes(query)) || 
                (c.company_name && c.company_name.toLowerCase().includes(query)) || 
                (c.username && c.username.toLowerCase().includes(query)) ||
                (c.manager && c.manager.toLowerCase().includes(query))
            );
            renderCompanies(filtered);
        }

        async function toggleStatus(companyId, action) {
            try {
                const response = await fetch(`/api/developer/company-status`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ companyId, status: (action === 'stop' ? 'stopped' : 'active') })
                });
                const data = await response.json();
                if (data.success) {
                    loadCompanies(); // إعادة تحميل القائمة لتحديث الحالة حقيقياً
                } else {
                    alert('❌ ' + (data.message || 'فشل تغيير حالة الشركة.'));
                }
            } catch (err) {
                console.error("Error updating status:", err);
                alert('❌ حدث خطأ أثناء الاتصال بالسيرفر.');
            }
        }

        async function deleteCompany(companyId) {
            if (confirm('⚠️ هل أنت متأكد من رغبتك في حذف هذه الشركة نهائياً من السيرفر وقاعدة البيانات؟')) {
                try {
                    const response = await fetch(`/api/developer/company-delete`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ companyId })
                    });
                    const data = await response.json();
                    if (data.success) {
                        loadCompanies(); // إعادة تحديث القائمة بعد الحذف
                    } else {
                        alert('❌ ' + (data.message || 'فشل حذف الشركة.'));
                    }
                } catch (err) {
                    console.error("Error deleting company:", err);
                    alert('❌ حدث خطأ أثناء الاتصال بالسيرفر للحذف.');
                }
            }
        }

        window.onload = loadCompanies;
    </script>
</body>
</html>

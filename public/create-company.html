<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>المراقب برو - الإدارة المركزية</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: radial-gradient(circle at top right, #1e1b4b, #0f172a, #020617); color: #f8fafc; min-height: 100vh; padding: 50px 20px; }
        .container { max-width: 1100px; margin: 0 auto; }
        .header-section { text-align: center; margin-bottom: 50px; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); padding: 45px; border-radius: 28px; }
        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 25px; }
        input { padding: 16px; background: rgba(15, 23, 42, 0.8); border: 1px solid #38bdf8; border-radius: 12px; color: white; }
        .company-card { background: rgba(30, 41, 59, 0.6); padding: 25px; border-radius: 20px; display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1); }
        .comp-info { display: flex; align-items: center; gap: 20px; }
        .comp-photo { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 2px solid #38bdf8; }
        .logo-action-area { display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .btn-upload { background: #6366f1; color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; }
        .actions { display: flex; flex-direction: column; gap: 8px; }
        .btn-action { padding: 10px; border: none; border-radius: 8px; cursor: pointer; color: white; }
        .btn-edit { background: #0284c7; }
        .btn-del { background: #ef4444; }
    </style>
</head>
<body>
<div class="container">
    <div class="header-section"><h1>🛡️ لوحة المطورين - المراقب برو</h1></div>
    <div class="glass-card">
        <form id="regForm" class="form-grid">
            <input type="text" id="cId" placeholder="رمز الشركة (ID)" required>
            <input type="text" id="cName" placeholder="اسم الشركة" required>
            <button type="submit" style="grid-column: span 2; background: #38bdf8; color: #000; font-weight: bold; padding: 15px; border: none; border-radius: 12px; cursor: pointer;">إضافة شركة</button>
        </form>
    </div>
    <div id="compList"></div>
</div>

<script>
    async function renderList() {
        const res = await fetch('/api/developer/companies');
        const data = await res.json();
        const container = document.getElementById('compList');
        container.innerHTML = data.companies.map((c, index) => `
            <div class="company-card">
                <div class="comp-info">
                    <img src="${c.photo || 'https://via.placeholder.com/80'}" class="comp-photo">
                    <div>
                        <h3>${c.companyName || c.name}</h3>
                        <p>ID: ${c.companyId || c.id}</p>
                    </div>
                </div>
                <div class="logo-action-area">
                    <button class="btn-upload" onclick="alert('تفعيل ميزة الرفع قريباً!')">📷 الشعار</button>
                </div>
                <div class="actions">
                    <button class="btn-action btn-edit">✏️ تعديل</button>
                    <button class="btn-action btn-del">🗑️ حذف</button>
                </div>
            </div>
        `).join('');
    }
    renderList();
</script>
</body>
</html>

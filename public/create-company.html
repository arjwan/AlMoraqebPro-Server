<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المراقب برو - تسجيل وتأسيس شركة جديدة</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* خلفية مبهجة ومضيئة متناسقة مع الهوية الجديدة */
            background: linear-gradient(135deg, #fef08a 0%, #bae6fd 50%, #c7d2fe 100%);
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .company-container {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.8);
            padding: 35px;
            border-radius: 32px;
            box-shadow: 0 25px 50px rgba(14, 116, 144, 0.2);
            width: 100%;
            max-width: 850px;
            position: relative;
        }

        .company-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .company-header h1 {
            color: #0284c7;
            font-size: 26px;
            font-weight: 900;
            margin-bottom: 6px;
            text-shadow: 0 2px 4px rgba(2, 132, 199, 0.1);
        }

        .company-header p {
            color: #64748b;
            font-size: 13px;
            font-weight: 600;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group.full {
            grid-column: span 2;
        }

        label {
            font-size: 12px;
            font-weight: 700;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e2e8f0;
            background: #f8fafc;
            color: #0f172a;
            border-radius: 14px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }

        input:focus {
            border-color: #0284c7;
            background: #ffffff;
            box-shadow: 0 0 12px rgba(2, 132, 199, 0.2);
        }

        .submit-btn {
            grid-column: span 2;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3);
            transition: transform 0.2s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
        }

        .alert-box {
            display: none;
            grid-column: span 2;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            font-weight: bold;
            font-size: 13px;
            margin-top: 10px;
        }

        .alert-success { background: rgba(16, 185, 129, 0.15); color: #047857; border: 1px solid #10b981; }
        .alert-error { background: rgba(239, 68, 68, 0.15); color: #b91c1c; border: 1px solid #ef4444; }

        .footer-note {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #64748b;
            border-top: 1px solid rgba(203, 213, 225, 0.6);
            padding-top: 12px;
        }

        @media (max-width: 768px) {
            .grid-layout { grid-template-columns: 1fr; }
            .input-group.full, .submit-btn, .alert-box { grid-column: span 1; }
        }
    </style>
</head>
<body>

    <div class="company-container">
        <div class="company-header">
            <h1>✨ تسجيل وتأسيس شركة جديدة</h1>
            <p>نظام الإدارة والسيطرة المركزية للشركات - المراقب برو</p>
        </div>

        <form onsubmit="registerCompany(event)" class="grid-layout">
            <div class="input-group full">
                <label>رمز الشركة (المعرف الأساسي - ID):</label>
                <input type="text" id="compId" placeholder="مثال: comp01" required>
            </div>

            <div class="input-group">
                <label>اسم الشركة بالعربي:</label>
                <input type="text" id="compNameAr" placeholder="مثال: شركة الأرجوان للبرمجيات" required>
            </div>

            <div class="input-group">
                <label>اسم الشركة بالإنجليزي (English Name):</label>
                <input type="text" id="compNameEn" placeholder="Example: Al-Argouan Software" required>
            </div>

            <div class="input-group">
                <label>اسم المدير المسؤول:</label>
                <input type="text" id="managerName" placeholder="الاسم الكامل للمدير" required>
            </div>

            <div class="input-group">
                <label>رقم الهاتف:</label>
                <input type="tel" id="managerPhone" placeholder="رقم الهاتف للتواصل" required>
            </div>

            <div class="input-group">
                <label>اسم المستخدم:</label>
                <input type="text" id="adminUser" value="admin" required>
            </div>

            <div class="input-group">
                <label>كلمة المرور:</label>
                <input type="password" id="adminPass" placeholder="كلمة المرور الإدارية" required>
            </div>

            <div class="input-group full">
                <label>إيميل الشركة (البريد الإلكتروني):</label>
                <input type="email" id="compEmail" placeholder="company@domain.com" required>
            </div>

            <button type="submit" class="submit-btn">🚀 اعتماد وتأسيس الشركة فوراً</button>
            <div id="successMsg" class="alert-box alert-success">✅ تم تأسيس الشركة بنجاح وتم تفعيل لوحة التحكم!</div>
            <div id="errorMsg" class="alert-box alert-error">⚠️ حدث خطأ أثناء التسجيل، يرجى التحقق من الحقول.</div>
        </form>

        <div class="footer-note">
            جميع الحقوق محفوظة © 2026 - <strong>المراقب برو</strong>
        </div>
    </div>

    <script>
        async function registerCompany(e) {
            e.preventDefault();
            const compId = document.getElementById('compId').value.trim();
            const successBox = document.getElementById('successMsg');
            
            // تخزين رمز الشركة النشط محلياً للربط السريع
            localStorage.setItem('activeCompanyId', compId);

            let companyData = {
                companyId: compId,
                nameAr: document.getElementById('compNameAr').value.trim(),
                nameEn: document.getElementById('compNameEn').value.trim(),
                manager: document.getElementById('managerName').value.trim(),
                phone: document.getElementById('managerPhone').value.trim(),
                username: document.getElementById('adminUser').value.trim(),
                password: document.getElementById('adminPass').value.trim(),
                email: document.getElementById('compEmail').value.trim()
            };

            try {
                let res = await fetch('/api/company/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(companyData)
                });
                
                successBox.style.display = 'block';
                setTimeout(() => {
                    window.location.href = `admin.html?company=${encodeURIComponent(compId)}`;
                }, 1500);
            } catch(err) {
                // تفعيل التخزين المحلي الاحتياطي لضمان استمرارية العمل في حال انقطاع السيرفر اللحظي
                localStorage.setItem(`company_profile_${compId}`, JSON.stringify(companyData));
                successBox.style.display = 'block';
                setTimeout(() => {
                    window.location.href = `admin.html?company=${encodeURIComponent(compId)}`;
                }, 1500);
            }
        }
    </script>
</body>
</html>

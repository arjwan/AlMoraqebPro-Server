<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المراقب برو - إدارة الشركات وقواعد البيانات المستقلة</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #2e1a47 0%, #1f1135 50%, #100820 100%);
            color: #1e293b;
            min-height: 100vh;
            padding: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main-card {
            width: 100%;
            max-width: 950px;
            background: #ffffff;
            padding: 45px;
            border-radius: 28px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 20px;
        }

        h2 {
            font-size: 26px;
            font-weight: 800;
            color: #0284c7;
        }

        .back-btn {
            background: #f1f5f9;
            color: #0284c7;
            padding: 10px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            border: 1px solid #cbd5e1;
            transition: 0.2s;
        }

        .back-btn:hover {
            background: #0284c7;
            color: #fff;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-weight: 700;
            font-size: 14px;
            color: #334155;
        }

        .form-group input, .form-group select {
            padding: 12px 16px;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            font-size: 15px;
            background: #f8fafc;
            outline: none;
            transition: 0.2s;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: #0284c7;
            background: #fff;
            box-shadow: 0 0 10px rgba(2, 132, 199, 0.15);
        }

        .section-title {
            grid-column: 1 / -1;
            font-size: 18px;
            font-weight: 800;
            color: #0f172a;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 8px;
            margin-top: 10px;
        }

        .btn-submit {
            background: #0284c7;
            color: white;
            border: none;
            padding: 16px;
            width: 100%;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-submit:hover {
            background: #0369a1;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="top-nav">
            <h2>🏢 إدارة وتسجيل الشركة وإنشاء قاعدة بياناتها المستقلة</h2>
            <a href="admin.html" class="back-btn">← العودة للوحة التحكم</a>
        </div>

        <form id="companyDbForm" onsubmit="createNewCompanyDatabase(event)">
            <div class="form-grid">
                <div class="section-title">📌 بيانات الشركة الأساسية (معرّف قاعدة البيانات)</div>
                
                <div class="form-group">
                    <label>معرّف الشركة الإنجليزي الفريد (Company ID):</label>
                    <input type="text" id="companyId" placeholder="مثال: tech_solutions_iq" required>
                </div>
                <div class="form-group">
                    <label>اسم الشركة أو المؤسسة الرسمي:</label>
                    <input type="text" id="companyName" placeholder="مثال: شركة التقنية والحلول الذكية" required>
                </div>

                <div class="section-title">👤 بيانات المدير المسؤول / الموظف الأول في قاعدة البيانات</div>

                <div class="form-group">
                    <label>اسم المسؤول / المدير:</label>
                    <input type="text" id="managerName" placeholder="الاسم الكامل" required>
                </div>
                <div class="form-group">
                    <label>العنوان الوظيفي:</label>
                    <input type="text" id="specialty" value="مدير النظام / المؤسس" required>
                </div>
                <div class="form-group">
                    <label>فرع العمل:</label>
                    <input type="text" id="workplace" value="المقر الرئيسي - بغداد" required>
                </div>
                <div class="form-group">
                    <label>الراتب الأساسي (د.ع):</label>
                    <input type="number" id="salary" value="1500000" required>
                </div>
                <div class="form-group">
                    <label>المحافظة:</label>
                    <input type="text" id="province" value="بغداد" required>
                </div>
                <div class="form-group">
                    <label>العنوان التفصيلي (المنطقة / المحلة):</label>
                    <input type="text" id="district" value="الكرادة / حي مظفر" required>
                </div>
            </div>

            <button type="submit" class="btn-submit">🚀 إنشاء قاعدة البيانات المستقلة للشركة</button>
        </form>
    </div>

    <script>
        function createNewCompanyDatabase(event) {
            event.preventDefault();

            const cId = document.getElementById('companyId').value.trim().toLowerCase().replace(/\s+/g, '_');
            const cName = document.getElementById('companyName').value.trim();
            
            const adminData = {
                name: document.getElementById('managerName').value,
                specialty: document.getElementById('specialty').value,
                workplace: document.getElementById('workplace').value,
                salary: document.getElementById('salary').value,
                province: document.getElementById('province').value,
                city: document.getElementById('district').value,
                district: 'مكتب رئيسي',
                mahalla: '1',
                alley: '1',
                houseNo: '1',
                photo: 'https://via.placeholder.com/150'
            };

            // حفظ البيانات محلياً للربط الفوري
            let companiesList = JSON.parse(localStorage.getItem('registeredCompanies')) || [];
            if (!companiesList.some(c => c.id === cId)) {
                companiesList.push({ id: cId, name: cName });
                localStorage.setItem('registeredCompanies', JSON.stringify(companiesList));
            }

            const companyDbKey = `company_employees_${cId}`;
            let companyEmployees = [adminData];
            localStorage.setItem(companyDbKey, JSON.stringify(companyEmployees));
            localStorage.setItem('activeCompanyId', cId);

            alert(`تم إنشاء قاعدة البيانات المستقلة للشركة "${cName}" (المعرف: ${cId}) بنجاح!`);
            
            // الانتقال المباشر للوحة التحكم مع ثبات المعرف في الرابط لضمان عدم ضياع البيانات
            window.location.href = `admin.html?company=${encodeURIComponent(cId)}`;
        }
    </script>
</body>
</html>

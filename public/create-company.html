<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المراقب برو - إنشاء شركة جديدة وقاعدة بيانات مستقلة</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #2e1a47 0%, #1f1135 50%, #100820 100%);
            color: #1e293b;
            min-height: 100vh;
            padding: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .main-card {
            width: 100%;
            max-width: 900px;
            background: #ffffff;
            padding: 40px;
            border-radius: 28px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
        }
        h2 {
            font-size: 24px;
            font-weight: 800;
            color: #0284c7;
            margin-bottom: 25px;
            text-align: center;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        label {
            font-weight: 700;
            font-size: 14px;
            color: #334155;
        }
        input {
            padding: 12px 16px;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            font-size: 15px;
            background: #f8fafc;
            outline: none;
            transition: 0.2s;
        }
        input:focus {
            border-color: #0284c7;
            background: #fff;
        }
        .btn-submit {
            background: #0284c7;
            color: white;
            border: none;
            padding: 16px;
            width: 100%;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-submit:hover {
            background: #0369a1;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <h2>🏢 تسجيل شركة جديدة وبناء بيئتها المستقلة</h2>

        <form onsubmit="registerCompany(event)">
            <div class="form-grid">
                <div class="form-group">
                    <label>معرّف الشركة الإنجليزي الفريد (Company ID):</label>
                    <input type="text" id="companyId" placeholder="مثال: alhadi_company" required>
                </div>
                <div class="form-group">
                    <label>اسم الشركة أو المؤسسة الرسمي:</label>
                    <input type="text" id="companyName" placeholder="مثال: شركة الهادي التجارية" required>
                </div>
                <div class="form-group">
                    <label>اسم المدير المسؤول:</label>
                    <input type="text" id="managerName" placeholder="الاسم الكامل" required>
                </div>
                <div class="form-group">
                    <label>البريد أو اسم المستخدم للدخول:</label>
                    <input type="text" id="adminUser" placeholder="admin" required>
                </div>
                <div class="form-group">
                    <label>كلمة المرور:</label>
                    <input type="password" id="adminPass" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn-submit">🚀 إنشاء البيئة المستقلة والانتقال للوحة التحكم</button>
        </form>
    </div>

    <script>
        function registerCompany(event) {
            event.preventDefault();

            const cId = document.getElementById('companyId').value.trim().toLowerCase().replace(/\s+/g, '_');
            const cName = document.getElementById('companyName').value.trim();
            const manager = document.getElementById('managerName').value.trim();
            const user = document.getElementById('adminUser').value.trim();
            const pass = document.getElementById('adminPass').value.trim();

            // 1. حفظ بيانات الشركة العامة في سجل النظام
            let companiesList = JSON.parse(localStorage.getItem('registeredCompanies')) || [];
            if (!companiesList.some(c => c.id === cId)) {
                companiesList.push({ id: cId, name: cName });
                localStorage.setItem('registeredCompanies', JSON.stringify(companiesList));
            }

            // 2. عزل قاعدة بيانات خاصة بالموظفين لهذه الشركة حصراً
            const dbKeyEmployees = `company_employees_${cId}`;
            if (!localStorage.getItem(dbKeyEmployees)) {
                const initialEmployee = [{
                    name: manager,
                    specialty: 'مدير النظام',
                    workplace: 'المقر الرئيسي',
                    salary: '1500000',
                    province: 'بغداد',
                    city: 'المركز',
                    photo: 'https://via.placeholder.com/150'
                }];
                localStorage.setItem(dbKeyEmployees, JSON.stringify(initialEmployee));
            }

            // 3. عزل بيانات الاعتماد الخاصة بتسجيل الدخول لهذه الشركة
            const dbKeyAuth = `company_auth_${cId}`;
            localStorage.setItem(dbKeyAuth, JSON.stringify({ user, pass, companyName: cName }));

            // 4. تعيين الجلسة الحالية والانتقال الفوري بالرابط الثابت المضمون
            localStorage.setItem('activeCompanyId', cId);
            alert(`تم إنشاء البيئة المستقلة لشركة "${cName}" بنجاح!`);
            
            window.location.href = `admin.html?company=${encodeURIComponent(cId)}`;
        }
    </script>
</body>
</html>

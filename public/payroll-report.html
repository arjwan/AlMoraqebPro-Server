<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كشف الرواتب الشامل - نظام المراقب برو</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0f172a;
            --secondary: #312e81;
            --accent: #6366f1;
            --success: #10b981;
            --danger: #ef4444;
            --bg-light: #f1f5f9;
            --card-bg: #ffffff;
            --border: #cbd5e1;
            --text-main: #1e293b;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-light);
            margin: 0;
            padding: 30px 15px;
            color: var(--text-main);
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.08);
        }

        /* شريط التنقل الموحد */
        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            background: #e2e8f0;
            padding: 12px;
            border-radius: 12px;
            flex-wrap: wrap;
        }
        .nav-link {
            text-decoration: none;
            padding: 10px 18px;
            background: #fff;
            border-radius: 8px;
            font-weight: 700;
            color: #1e293b;
            font-size: 14px;
            transition: all 0.2s;
        }
        .nav-link:hover, .nav-link.active {
            background: var(--accent);
            color: white;
        }

        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--bg-light);
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        h2 {
            color: var(--primary);
            font-weight: 900;
            margin: 0;
            font-size: 26px;
        }

        .summary-cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .sum-card {
            background: #f8fafc;
            border: 1.5px solid var(--border);
            padding: 20px;
            border-radius: 14px;
            text-align: center;
        }
        .sum-card span {
            display: block;
            font-size: 14px;
            color: #64748b;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .sum-card strong {
            font-size: 24px;
            color: var(--primary);
        }

        .table-container {
            overflow-x: auto;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
            font-size: 14px;
        }

        th, td {
            padding: 14px 16px;
            border-bottom: 1.5px solid var(--bg-light);
        }

        th {
            background-color: #f8fafc;
            color: var(--primary);
            font-weight: 800;
        }

        tr:hover {
            background-color: #f8fafc;
        }

        .btn-print {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            transition: background 0.2s;
            display: block;
            width: 100%;
            font-size: 16px;
        }
        .btn-print:hover { background-color: #4f46e5; }

        @media print {
            .nav-tabs, .btn-print, .header-flex button {
                display: none !important;
            }
            body { background: white; padding: 0; }
            .container { box-shadow: none; border: none; padding: 0; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- شريط التنقل الموحد -->
    <div class="nav-tabs">
        <a href="dashboard.html" class="nav-link">🏠 الرئيسية</a>
        <a href="add-employee.html" class="nav-link">➕ إضافة موظف</a>
        <a href="update-employee.html" class="nav-link">🔄 تحديث بيانات</a>
        <a href="fingerprints.html" class="nav-link">📍 سجل البصمات</a>
        <a href="payroll.html" class="nav-link">🧮 حاسبة الرواتب</a>
        <a href="payroll-report.html" class="nav-link active">📊 كشف الرواتب</a>
        <a href="settings.html" class="nav-link">⚙️ الإعدادات</a>
    </div>

    <div class="header-flex">
        <h2>كشف الرواتب الشهري الشامل</h2>
    </div>

    <!-- بطاقات الملخص المالي -->
    <div class="summary-cards">
        <div class="sum-card">
            <span>إجمالي عدد الموظفين المسجلين</span>
            <strong id="totalCount">0</strong>
        </div>
        <div class="sum-card" style="background: #d1fae5; border-color: #10b981;">
            <span style="color: #065f46;">إجمالي كتلة الرواتب الأساسية</span>
            <strong id="totalPayroll" style="color: #065f46;">0 د.ع</strong>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th># المعرف</th>
                    <th>اسم الموظف</th>
                    <th>المسمى الوظيفي</th>
                    <th>رقم الهاتف</th>
                    <th>الراتب الشهري الأساسي</th>
                </tr>
            </thead>
            <tbody id="reportTableBody">
                <tr>
                    <td colspan="5" style="text-align: center; color: #64748b; font-weight: 600; padding: 30px;">جاري تحميل كشف الرواتب...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <button class="btn-print" onclick="window.print()">🖨️ طباعة كشف الرواتب الرسمي</button>
</div>

<script>
    if (localStorage.getItem('isLoggedIn') !== 'true') {
        window.location.href = 'login.html';
    }

    const apiUrl = '/api/employees';

    async function fetchPayrollReport() {
        try {
            const res = await fetch(apiUrl);
            const data = await res.json();
            const tbody = document.getElementById('reportTableBody');
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #64748b; font-weight: 600; padding: 30px;">لا توجد سجلات موظفين متاحة لإصدار الكشف.</td></tr>';
                document.getElementById('totalCount').innerText = '0';
                document.getElementById('totalPayroll').innerText = '0 د.ع';
                return;
            }

            let totalSum = 0;
            data.forEach(emp => {
                let sal = parseFloat(emp.salary) || 0;
                totalSum += sal;

                tbody.innerHTML += `
                    <tr>
                        <td>#${emp.id}</td>
                        <td style="font-weight: 700;">${emp.name || ''}</td>
                        <td>${emp.job_title || '-'}</td>
                        <td>${emp.phone || '-'}</td>
                        <style>td { font-family: 'Cairo', sans-serif; }</style>
                        <td style="font-weight: 800; color: var(--success);">${sal.toLocaleString()} د.ع</td>
                    </tr>
                `;
            });

            document.getElementById('totalCount').innerText = data.length;
            document.getElementById('totalPayroll').innerText = totalSum.toLocaleString() + ' د.ع';
        } catch (err) {
            console.error('Error loading payroll report:', err);
        }
    }

    fetchPayrollReport();
</script>

</body>
</html>

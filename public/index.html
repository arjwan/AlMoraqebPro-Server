<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المراقب برو - تسجيل الدخول</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-container {
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 850px;
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            align-items: center;
        }
        .form-section {
            flex: 1;
            min-width: 300px;
        }
        .camera-section {
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 {
            margin-bottom: 25px;
            color: #1e293b;
            font-size: 26px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: right;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #334155;
            font-size: 16px;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: #0284c7;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.1);
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: #0f172a;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }
        .btn:hover {
            background: #1e293b;
        }
        .btn-face {
            background: #16a34a;
            margin-top: 15px;
        }
        .btn-face:hover {
            background: #15803d;
        }
        #video-container {
            width: 100%;
            height: 240px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            border: 3px solid #cbd5e1;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .status-msg {
            margin-top: 15px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            min-height: 24px;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- قسم إدخال بيانات النص -->
        <div class="form-section">
            <h2>🔑 تسجيل الدخول</h2>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">اسم المستخدم</label>
                    <input type="text" id="username" required placeholder="أدخل اسم المستخدم">
                </div>
                
                <div class="form-group">
                    <label for="password">كلمة المرور</label>
                    <input type="password" id="password" required placeholder="أدخل كلمة المرور">
                </div>

                <button type="submit" class="btn">دخول بكلمة المرور</button>
            </form>
        </div>

        <!-- قسم الكاميرا والتعرف على الوجه -->
        <div class="camera-section">
            <h2 style="font-size: 20px; margin-bottom: 15px;">📷 الدخول بالبصمة البصرية</h2>
            <div id="video-container">
                <video id="video" autoplay playsinline></video>
            </div>
            
            <button id="faceLoginBtn" class="btn btn-face">التقاط وتسجيل الدخول بالوجه</button>
        </div>

        <!-- رسائل الحالة العامة -->
        <div style="width: 100%;">
            <div class="status-msg" id="statusMsg"></div>
        </div>
    </div>

    <script>
        // تشغيل الكاميرا
        const video = document.getElementById('video');
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => {
                video.srcObject = stream;
            })
            .catch(err => {
                console.error("خطأ في تشغيل الكاميرا:", err);
            });

        // تسجيل الدخول العادي
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const statusMsg = document.getElementById('statusMsg');

            statusMsg.style.color = "#0284c7";
            statusMsg.textContent = "جاري التحقق من البيانات...";

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();
                if (data.success) {
                    statusMsg.style.color = "#16a34a";
                    statusMsg.textContent = "تم تسجيل الدخول بنجاح، جاري التحويل...";
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                } else {
                    statusMsg.style.color = "#dc2626";
                    statusMsg.textContent = data.message || "اسم المستخدم أو كلمة المرور غير صحيحة";
                }
            } catch (err) {
                console.error("خطأ في الاتصال:", err);
                statusMsg.style.color = "#dc2626";
                statusMsg.textContent = "حدث خطأ في الاتصال بالسيرفر";
            }
        });

        // التقاط الوجه وإرساله للسيرفر
        document.getElementById('faceLoginBtn').addEventListener('click', async function() {
            const statusMsg = document.getElementById('statusMsg');
            statusMsg.style.color = "#0284c7";
            statusMsg.textContent = "تم التقاط الوجه بنجاح، جاري مطابقة البيانات...";

            try {
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imageBase64 = canvas.toDataURL('image/jpeg');

                const response = await fetch('/api/auth/face-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: imageBase64 })
                });

                const data = await response.json();
                if (data.success) {
                    statusMsg.style.color = "#16a34a";
                    statusMsg.textContent = "تمت المطابقة بنجاح، جاري التحويل...";
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                } else {
                    statusMsg.style.color = "#dc2626";
                    statusMsg.textContent = data.message || "لم يتم التعرف على الوجه، حاول مجدداً";
                }
            } catch (err) {
                console.error("خطأ في الاتصال بالسيرفر:", err);
                statusMsg.style.color = "#dc2626";
                statusMsg.textContent = "خطأ: تأكد من إضافة مسار الوجه في السيرفر";
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المراقب برو - تسجيل الدخول</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #2c3c50, #4calaf);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 {
            margin-bottom: 20px;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: right;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
        }
        .btn {
            width: 100%;
            padding: 11px;
            background: #2c3c50;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }
        .btn:hover {
            background: #1a252f;
        }
        #video-container {
            margin-top: 15px;
            width: 100%;
            height: 150px;
            background: #000;
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .status-msg {
            margin-top: 10px;
            font-size: 14px;
            color: #007bff;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>🔑 تسجيل الدخول</h2>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="username">اسم المستخدم</label>
                <input type="text" id="username" required placeholder="أدخل اسم المستخدم">
            </div>
            
            <div class="form-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" required placeholder="أدخل كلمة المرور">
            </div>

            <button type="submit" class="btn">دخول بكلمة المرور</button>
        </form>

        <div class="status-msg" id="statusMsg"></div>

        <div id="video-container">
            <video id="video" autoplay playsinline></video>
        </div>
        
        <button id="faceLoginBtn" class="btn" style="background: #28a745; margin-top: 10px;">تسجيل الدخول بالوجه</button>
    </div>

    <script>
        // تشغيل الكاميرا للوجه
        const video = document.getElementById('video');
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => {
                video.srcObject = stream;
            })
            .catch(err => {
                console.error("خطأ في تشغيل الكاميرا:", err);
            });

        // تسجيل الدخول العادي (اسم المستخدم وكلمة المرور)
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const statusMsg = document.getElementById('statusMsg');

            statusMsg.textContent = "جاري التحقق من البيانات...";

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();
                console.log("استجابة السيرفر:", data);

                if (data.success) {
                    statusMsg.style.color = "green";
                    statusMsg.textContent = "تم تسجيل الدخول بنجاح، جاري التحويل...";
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                } else {
                    statusMsg.style.color = "red";
                    statusMsg.textContent = data.message || "اسم المستخدم أو كلمة المرور غير صحيحة";
                }
            } catch (err) {
                console.error("خطأ في الاتصال:", err);
                statusMsg.style.color = "red";
                statusMsg.textContent = "حدث خطأ في الاتصال بالسيرفر";
            }
        });

        // زر تسجيل الدخول بالوجه
        document.getElementById('faceLoginBtn').addEventListener('click', async function() {
            const statusMsg = document.getElementById('statusMsg');
            statusMsg.style.color = "#007bff";
            statusMsg.textContent = "تم التقاط الوجه بنجاح، جاري مطابقة البيانات...";

            // هنا يتم ربط دالة المطابقة لاحقاً وتجنب استخدام الـ alert لتفادي التعليق
            setTimeout(() => {
                console.log("إرسال بيانات المطابقة للسيرفر...");
            }, 1000);
        });
    </script>
</body>
</html>

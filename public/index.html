<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المراقب برو - تسجيل الدخول</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2c3e50, #4ca1af);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }
        .login-card {
            background: #ffffff;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 440px;
            width: 100%;
        }
        .icon {
            font-size: 38px;
            margin-bottom: 5px;
        }
        h2 {
            color: #2c3e50;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #7f8c8d;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .form-group {
            text-align: right;
            margin-bottom: 12px;
        }
        label {
            display: block;
            margin-bottom: 4px;
            font-size: 13px;
            font-weight: bold;
            color: #34495e;
        }
        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: #3498db;
        }
        .btn-submit {
            width: 100%;
            background: #3498db;
            color: white;
            padding: 11px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.3s;
        }
        .btn-submit:hover {
            background: #2980b9;
        }
        .btn-face {
            width: 100%;
            background: #27ae60;
            color: white;
            padding: 11px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.3s;
        }
        .btn-face:hover {
            background: #219653;
        }
        .developer-info {
            margin-top: 20px;
            padding-top: 12px;
            border-top: 1px solid #eee;
            text-align: center;
            font-size: 12px;
            color: #555;
        }
        .developer-info p {
            margin: 3px 0;
        }
        .developer-name {
            font-weight: bold;
            color: #2c3e50;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="icon">🔑</div>
        <h2>تسجيل الدخول</h2>
        <div class="subtitle">أدخل بيانات شركتك، أو استخدم بصمة الوجه السريعة</div>

        <form action="/api/auth/login" method="POST">
            <div class="form-group">
                <label for="username">معرف الشركة، اسم المستخدم، أو الإيميل:</label>
                <input type="text" id="username" name="username" required placeholder="أدخل بيانات الدخول...">
            </div>

            <div class="form-group">
                <label for="password">كلمة المرور:</label>
                <input type="password" id="password" name="password" required placeholder="أدخل كلمة المرور...">
            </div>

            <button type="submit" class="btn-submit">🚀 دخول بكلمة المرور</button>
            <button type="button" class="btn-face" onclick="alert('خاصية بصمة الوجه قيد التشغيل...')">📸 تسجيل الدخول ببصمة الوجه</button>
        </form>

        <!-- معلومات المطور والشركة -->
        <div class="developer-info">
            <p class="developer-name">شركة الأرجوان للبرمجيات</p>
            <p>المطور: محمد العبيدي</p>
            <p>واتساب: <span dir="ltr">07807807491</span></p>
            <p>الإيميل: <span dir="ltr">mohmmed1628@gmail.com</span></p>
        </div>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المراقب برو - تسجيل الدخول</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #1e293b, #0f172a); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .login-container { background: #ffffff; padding: 35px; border-radius: 16px; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3); width: 100%; max-width: 450px; }
        h2 { margin-bottom: 20px; color: #1e293b; font-size: 24px; text-align: center; }
        .form-group { margin-bottom: 15px; text-align: right; }
        label { display: block; margin-bottom: 6px; color: #334155; font-size: 15px; font-weight: 600; }
        input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; outline: none; transition: border-color 0.3s; }
        input:focus { border-color: #0284c7; box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.1); }
        .btn { width: 100%; padding: 12px; background: #0f172a; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.3s; margin-top: 8px; }
        .btn:hover { background: #1e293b; }
        .status-msg { margin-top: 12px; font-size: 15px; font-weight: bold; text-align: center; min-height: 22px; width: 100%; }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>🔑 تسجيل الدخول للشركة</h2>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="companyCode">رمز أو معرف الشركة (مثال: company_123)</label>
                <input type="text" id="companyCode" required placeholder="أدخل رمز الشركة الخاص بك[cite: 1]">
            </div>

            <div class="form-group">
                <label for="username">اسم المستخدم</label>
                <input type="text" id="username" required placeholder="أدخل اسم المستخدم">
            </div>
            
            <div class="form-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" required placeholder="أدخل كلمة المرور">
            </div>

            <button type="submit" class="btn">دخول لوحة التحكم</button>
        </form>

        <div class="status-msg" id="statusMsg"></div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const companyCode = document.getElementById('companyCode').value.trim();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const statusMsg = document.getElementById('statusMsg');

            statusMsg.style.color = "#0284c7";
            statusMsg.textContent = "جاري التحقق من بيانات الشركة...";

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ companyCode, username, password })
                });

                const data = await response.json();
                if (data.success) {
                    statusMsg.style.color = "#16a34a";
                    statusMsg.textContent = "تم تسجيل الدخول بنجاح، جاري التحويل...";
                    
                    // تخزين معرف الشركة في المتصفح والتحويل المباشر لصفحة الأدمن الخاصة بالشركة
                    localStorage.setItem('activeCompanyId', data.companyCode);
                    setTimeout(() => { 
                        window.location.href = `admin.html?company=${encodeURIComponent(data.companyCode)}`; 
                    }, 1000);
                } else {
                    statusMsg.style.color = "#dc2626";
                    statusMsg.textContent = data.message || "بيانات الدخول أو رمز الشركة غير صحيح";
                }
            } catch (err) {
                statusMsg.style.color = "#dc2626";
                statusMsg.textContent = "حدث خطأ في الاتصال بالخادم";
            }
        });
    </script>
</body>
</html>

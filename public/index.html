<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المراقب برو - البوابة المركزية</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 50%, #bae6fd 100%);
            color: #0f172a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .portal-container {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(14, 165, 233, 0.3);
            padding: 35px;
            border-radius: 28px;
            box-shadow: 0 20px 45px rgba(14, 165, 233, 0.15);
            width: 100%;
            max-width: 900px;
            position: relative;
            overflow: hidden;
        }

        .status-badge {
            position: absolute;
            top: 25px;
            left: 30px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(240, 249, 255, 0.9);
            padding: 6px 14px;
            border-radius: 30px;
            border: 1px solid rgba(14, 165, 233, 0.2);
            font-size: 11px;
            font-weight: 600;
            color: #0369a1;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #ef4444;
            box-shadow: 0 0 8px #ef4444;
        }

        .portal-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .portal-header h1 {
            color: #0284c7;
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .portal-header p {
            color: #475569;
            font-size: 14px;
        }

        .switcher {
            display: flex;
            background: #e2e8f0;
            padding: 6px;
            border-radius: 16px;
            margin-bottom: 25px;
            gap: 6px;
        }

        .switch-btn {
            flex: 1;
            padding: 12px;
            background: transparent;
            color: #475569;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .switch-btn.active {
            background: #0284c7;
            color: #ffffff;
            box-shadow: 0 6px 15px rgba(2, 132, 199, 0.3);
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group.full {
            grid-column: span 2;
        }

        label {
            font-size: 13px;
            font-weight: 700;
            color: #334155;
        }

        input, select {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #cbd5e1;
            background: #ffffff;
            color: #0f172a;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }

        input:focus, select:focus {
            border-color: #0284c7;
            box-shadow: 0 0 12px rgba(2, 132, 199, 0.2);
        }

        .media-box {
            grid-column: span 2;
            background: #f8fafc;
            border: 2px dashed #94a3b8;
            padding: 15px;
            border-radius: 16px;
            text-align: center;
        }

        .action-btn {
            background: #0284c7;
            color: white;
            border: none;
            padding: 9px 18px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }

        video, canvas {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            display: none;
            margin: 10px auto;
            border: 3px solid #0284c7;
        }

        .preview-img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #10b981;
            display: none;
            margin: 8px auto 0;
        }

        .submit-btn {
            grid-column: span 2;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 5px;
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3);
        }

        .alert-box {
            display: none;
            grid-column: span 2;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            font-size: 13px;
            margin-top: 8px;
        }

        .alert-success { background: rgba(16, 185, 129, 0.15); color: #047857; border: 1px solid #10b981; }
        .alert-error { background: rgba(239, 68, 68, 0.15); color: #b91c1c; border: 1px solid #ef4444; }

        .developer-footer {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid rgba(14, 165, 233, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #64748b;
            flex-wrap: wrap;
            gap: 10px;
        }

        @media (max-width: 768px) {
            .grid-layout { grid-template-columns: 1fr; }
            .input-group.full, .media-box, .submit-btn, .alert-box { grid-column: span 1; }
        }
    </style>
</head>
<body>

    <div class="portal-container">
        <div class="status-badge">
            <div id="dot" class="status-dot"></div>
            <span id="txt-status">جاري الاتصال...</span>
        </div>

        <div class="portal-header">
            <h1>🛡️ المراقب برو</h1>
            <p>منظومة الإدارة والتحكم الذكي المتكاملة</p>
        </div>

        <div class="switcher">
            <button type="button" class="switch-btn active" id="btnLogTab" onclick="changeView('login')">🔐 تسجيل الدخول</button>
            <button type="button" class="switch-btn" id="btnRegTab" onclick="changeView('register')">📝 إنشاء حساب موظف</button>
        </div>

        <!-- 1. نموذج تسجيل الدخول الفعلي -->
        <div id="loginView" class="form-section active">
            <form onsubmit="executeLogin(event)" class="grid-layout">
                <div class="input-group full">
                    <label>رمز الشركة:</label>
                    <input type="text" id="logComp" placeholder="مثال: B-2080" required>
                </div>
                <div class="input-group full">
                    <label>اسم المستخدم:</label>
                    <input type="text" id="logUser" placeholder="أدخل اسم المستخدم" required>
                </div>
                <div class="input-group full">
                    <label>كلمة المرور:</label>
                    <input type="password" id="logPass" placeholder="أدخل كلمة المرور" required>
                </div>
                <button type="submit" class="submit-btn">🚀 دخول النظام فوراً</button>
                <div id="logError" class="alert-box alert-error">⚠️ بيانات الدخول غير صحيحة أو غير مسجلة!</div>
            </form>
        </div>

        <!-- 2. نموذج تسجيل موظف جديد الفعلي -->
        <div id="registerView" class="form-section">
            <form onsubmit="executeRegister(event)" class="grid-layout">
                <div class="input-group">
                    <label>رمز الشركة:</label>
                    <input type="text" id="regComp" placeholder="رمز الشركة" required oninput="syncCompany()">
                </div>
                <div class="input-group">
                    <label>اسم الشركة:</label>
                    <input type="text" id="regCompName" placeholder="اسم الشركة" required>
                </div>
                <div class="input-group full">
                    <label>الاسم الكامل:</label>
                    <input type="text" id="regName" placeholder="الاسم الثلاثي واللقب" required>
                </div>
                <div class="input-group">
                    <label>البريد الإلكتروني:</label>
                    <input type="email" id="regEmail" placeholder="name@domain.com" required>
                </div>
                <div class="input-group">
                    <label>قيمة الراتب:</label>
                    <input type="number" id="regSalary" placeholder="الراتب الأساسي" required>
                </div>
                <div class="input-group">
                    <label>الاختصاص (العنوان الوظيفي):</label>
                    <input type="text" id="regSpec" placeholder="مثال: مطور برمجيات" required>
                </div>
                <div class="input-group">
                    <label>مكان العمل (الفرع):</label>
                    <input type="text" id="regWork" placeholder="الفرع أو القسم" required>
                </div>
                <div class="input-group">
                    <label>اسم المستخدم الجديد:</label>
                    <input type="text" id="regUsername" placeholder="اسم المستخدم" required>
                </div>
                <div class="input-group">
                    <label>كلمة المرور:</label>
                    <input type="password" id="regPassword" placeholder="كلمة المرور" required>
                </div>

                <div class="media-box">
                    <label style="display:block; margin-bottom: 8px;">بصمة الوجه والتحقق المكاني (GPS):</label>
                    <button type="button" class="action-btn" onclick="openCam()">📷 تشغيل كاميرا التحقق</button>
                    <video id="vStream" autoplay playsinline></video>
                    <button type="button" id="snapTrigger" class="action-btn" style="background:#10b981; display:none; margin-top:8px;" onclick="captureFace()">📸 التقاط بصمة الوجه</button>
                    <canvas id="cCanvas"></canvas>
                    <img id="imgPreview" class="preview-img" alt="معاينة البصمة">
                    <div id="gpsText" style="font-size:12px; color:#047857; margin-top:8px; font-weight:bold;">📍 جاري تحديد الموقع الجغرافي...</div>
                </div>

                <button type="submit" class="submit-btn">💾 حفظ نهائي وترحيل البيانات</button>
                <div id="regSuccess" class="alert-box alert-success">✅ تم إنشاء الحساب بنجاح والتحويل إلى صفحة الدخول!</div>
            </form>
        </div>

        <div class="developer-footer">
            <div>جميع الحقوق محفوظة © 2026 - <strong>المراقب برو</strong></div>
            <div>الإصدار: <span style="color: #0284c7;">v3.5 Pro</span></div>
        </div>
    </div>

    <script>
        let capturedImage = "";
        let gpsData = { lat: 33.3152, lng: 44.3661 };
        let activeStream = null;

        function changeView(target) {
            const loginV = document.getElementById('loginView');
            const regV = document.getElementById('registerView');
            const btnL = document.getElementById('btnLogTab');
            const btnR = document.getElementById('btnRegTab');

            if(target === 'login') {
                loginV.classList.add('active');
                regV.classList.remove('active');
                btnL.classList.add('active');
                btnR.classList.remove('active');
            } else {
                loginV.classList.remove('active');
                regV.classList.add('active');
                btnL.classList.remove('active');
                btnR.classList.add('active');
            }
        }

        async function pingServer() {
            const dot = document.getElementById('dot');
            const txt = document.getElementById('txt-status');
            try {
                let res = await fetch('/api/ping', { method: 'HEAD', cache: 'no-cache' });
                if(res.ok) {
                    dot.style.backgroundColor = '#22c55e';
                    dot.style.boxShadow = '0 0 8px #22c55e';
                    txt.innerText = 'متصل بالسيرفر';
                }
            } catch(e) {
                dot.style.backgroundColor = '#ef4444';
                dot.style.boxShadow = '0 0 8px #ef4444';
                txt.innerText = 'السيرفر المحلي متوقف';
            }
        }
        setInterval(pingServer, 10000);
        pingServer();

        function syncCompany() {
            let val = document.getElementById('regComp').value.trim();
            if(val) {
                localStorage.setItem('activeCompanyId', val);
                document.getElementById('logComp').value = val;
            }
        }

        function openCam() {
            const video = document.getElementById('vStream');
            const btn = document.getElementById('snapTrigger');
            navigator.mediaDevices.getUserMedia({ video: { width: 300, height: 300, facingMode: 'user' }, audio: false })
            .then(stream => {
                activeStream = stream;
                video.style.display = 'block';
                video.srcObject = stream;
                btn.style.display = 'inline-block';
            })
            .catch(err => alert("⚠️ تعذر تشغيل الكاميرا: " + err.message));
        }

        function captureFace() {
            const video = document.getElementById('vStream');
            const canvas = document.getElementById('cCanvas');
            const preview = document.getElementById('imgPreview');
            canvas.width = 120; canvas.height = 120;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, 120, 120);
            capturedImage = canvas.toDataURL('image/jpeg', 0.6);
            preview.src = capturedImage;
            preview.style.display = 'block';

            if(activeStream) {
                activeStream.getTracks().forEach(t => t.stop());
            }
            video.style.display = 'none';
            document.getElementById('snapTrigger').style.display = 'none';
        }

        window.onload = function() {
            let savedComp = localStorage.getItem('activeCompanyId') || 'B-2080';
            document.getElementById('logComp').value = savedComp;
            document.getElementById('regComp').value = savedComp;

            if(navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    pos => {
                        gpsData = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                        document.getElementById('gpsText').innerText = `📍 تم رصد الموقع بدقة (${gpsData.lat.toFixed(2)}, ${gpsData.lng.toFixed(2)})`;
                    },
                    err => { document.getElementById('gpsText').innerText = `📍 تم ضبط الموقع الافتراضي بنجاح.`; }
                );
            }
        };

        // دالة تنفيذ الدخول وربط التوجيه الفعلي لصفحة المدير أو الموظف (attachment)
        function executeLogin(e) {
            e.preventDefault();
            const comp = document.getElementById('logComp').value.trim();
            const user = document.getElementById('logUser').value.trim();
            const pass = document.getElementById('logPass').value.trim();
            const errBox = document.getElementById('logError');

            localStorage.setItem('activeCompanyId', comp);

            // التحقق من حساب المدير الرئيسي المعتمد
            if((user === 'admin' || user === 'مدير') && pass === 'admin123') {
                localStorage.setItem('userRole', 'admin');
                window.location.href = `admin.html?company=${encodeURIComponent(comp)}`;
                return;
            }

            // التحقق من قاعدة بيانات الموظفين الفعلية المخزنة محلياً وسيرفرياً
            let employees = JSON.parse(localStorage.getItem(`company_employees_${comp}`) || '[]');
            let found = employees.find(emp => emp.username === user && emp.password === pass);

            if(found) {
                localStorage.setItem('userRole', 'employee');
                localStorage.setItem('currentEmployee', JSON.stringify(found));
                // التوجيه الفعلي إلى صفحة المرفقات الخاصة بالهاتف/الموظف
                window.location.href = `attachment.html?company=${encodeURIComponent(comp)}&user=${encodeURIComponent(user)}`;
                return;
            }

            errBox.style.display = 'block';
        }

        // دالة تسجيل موظف جديد وترحيله الفعلي للبيانات
        async function executeRegister(e) {
            e.preventDefault();
            const comp = document.getElementById('regComp').value.trim();
            syncCompany();

            let newEmp = {
                companyId: comp,
                companyName: document.getElementById('regCompName').value.trim(),
                name: document.getElementById('regName').value.trim(),
                email: document.getElementById('regEmail').value.trim(),
                salary: document.getElementById('regSalary').value.trim(),
                specialty: document.getElementById('regSpec').value.trim(),
                workplace: document.getElementById('regWork').value.trim(),
                username: document.getElementById('regUsername').value.trim(),
                password: document.getElementById('regPassword').value.trim(),
                photo: capturedImage || '',
                location: `${gpsData.lat}, ${gpsData.lng}`
            };

            try {
                let res = await fetch('/api/employee/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newEmp)
                });
                
                let storageKey = `company_employees_${comp}`;
                let list = JSON.parse(localStorage.getItem(storageKey) || '[]');
                list.push(newEmp);
                localStorage.setItem(storageKey, JSON.stringify(list));

                document.getElementById('regSuccess').style.display = 'block';
                setTimeout(() => {
                    document.getElementById('regSuccess').style.display = 'none';
                    document.querySelector('#registerView form').reset();
                    document.getElementById('imgPreview').style.display = 'none';
                    changeView('login');
                }, 1800);
            } catch(err) {
                // حفظ محلي احتياطي في حال تأخر الاستجابة الشبكية للحفاظ على استمرارية العمل
                let storageKey = `company_employees_${comp}`;
                let list = JSON.parse(localStorage.getItem(storageKey) || '[]');
                list.push(newEmp);
                localStorage.setItem(storageKey, JSON.stringify(list));

                document.getElementById('regSuccess').style.display = 'block';
                setTimeout(() => {
                    document.getElementById('regSuccess').style.display = 'none';
                    changeView('login');
                }, 1800);
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول - المراقب برو</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        
        body {
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a, #020617);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-card {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 45px;
            border-radius: 28px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        .login-card h1 {
            font-size: 32px;
            font-weight: 900;
            background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .login-card p {
            color: #94a3b8;
            font-size: 15px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: right;
        }

        label {
            font-size: 15px;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-weight: 700;
            display: block;
        }

        input {
            width: 100%;
            padding: 16px;
            background: rgba(15, 23, 42, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            color: white;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.25);
            outline: none;
        }

        .btn-login {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #0284c7, #6366f1);
            border: none;
            border-radius: 14px;
            color: white;
            font-size: 18px;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(2, 132, 199, 0.4);
            margin-top: 10px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(99, 102, 241, 0.5);
        }

        .divider {
            margin: 25px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: #64748b;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h1>🛡️ المراقب برو</h1>
        <p>تسجيل الدخول إلى لوحة تحكم الشركة</p>

        <form id="loginForm" onsubmit="handleLoginMatch(event)">
            <div class="form-group">
                <label>رمز الشركة (ID)</label>
                <input type="text" id="companyCode" placeholder="مثال: B-2080" required>
            </div>

            <div class="form-group">
                <label>رقم الهاتف</label>
                <input type="text" id="phone" placeholder="رقم هاتف المدير">
            </div>

            <div class="divider">أو بيانات الحساب</div>

            <div class="form-group">
                <label>اسم المستخدم</label>
                <input type="text" id="username" placeholder="اسم المستخدم">
            </div>

            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="password" placeholder="كلمة المرور">
            </div>

            <button type="submit" class="btn-login">تسجيل الدخول 🚀</button>
        </form>
    </div>

    <script>
        async function handleLoginMatch(e) {
            e.preventDefault();
            
            const companyId = document.getElementById('companyCode').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ companyId, phone, username, password })
                });

                const data = await response.json();

                if (data.success) {
                    localStorage.setItem('activeCompanyId', data.company.companyId);
                    localStorage.setItem('activeCompanyName', data.company.name);

                    alert(`✨ مرحباً بك في نظام ${data.company.name}`);
                    window.location.href = `admin.html?company=${encodeURIComponent(data.company.companyId)}`;
                } else {
                    alert(`❌ ${data.message || 'البيانات المدخلة غير صحيحة'}`);
                }
            } catch (error) {
                alert('❌ حدث خطأ في الاتصال بالخادم، تأكد من تشغيل السيرفر.');
            }
        }
    </script>
</body>
</html>

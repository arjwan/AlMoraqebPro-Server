<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>المراقب برو | بوابة الموظف</title>

<style>
*{
    box-sizing:border-box
}

body{
    margin:0;
    font-family:Tahoma,'Segoe UI',sans-serif;
    background:linear-gradient(160deg,#eff6ff,#f8fafc 55%,#e0f2fe);
    color:#0f172a;
    min-height:100vh;
    padding:18px;
}

.app{
    width:100%;
    max-width:480px;
    margin:auto;
}

.hero{
    background:linear-gradient(135deg,#0369a1,#0284c7 55%,#38bdf8);
    color:#fff;
    border-radius:28px;
    padding:24px 20px;
    box-shadow:0 18px 45px rgba(2,132,199,.25);
    position:relative;
    overflow:hidden;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.hero:after{
    content:'';
    position:absolute;
    width:150px;
    height:150px;
    border-radius:50%;
    background:rgba(255,255,255,.09);
    left:-45px;
    top:-55px;
}

.brand{
    font-size:25px;
    font-weight:900;
    display:flex;
    align-items:center;
    gap:10px;
}

.info-btn{
    background:rgba(255,255,255,.2);
    border:0;
    color:#fff;
    font-size:20px;
    width:40px;
    height:40px;
    border-radius:50%;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
}

.hero p{
    margin:7px 0 0;
    color:#e0f2fe;
    font-size:12px;
}

.server{
    margin-top:18px;
    display:inline-flex;
    align-items:center;
    gap:7px;
    background:rgba(255,255,255,.14);
    padding:7px 11px;
    border-radius:999px;
    font-size:11px;
}

.dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#fbbf24;
}

.panel{
    margin-top:14px;
    display:block;
    background:#fff;
    border:1px solid #e2e8f0;
    border-radius:24px;
    padding:20px;
    box-shadow:0 12px 30px rgba(15,23,42,.08);
}

.section-title{
    font-size:18px;
    font-weight:900;
    margin-bottom:5px;
}

.section-sub{
    font-size:11px;
    color:#64748b;
    margin-bottom:18px;
}

.form{
    display:grid;
    gap:12px;
}

.field label{
    display:block;
    font-size:11px;
    font-weight:900;
    color:#475569;
    margin:0 0 6px;
}

.field input{
    width:100%;
    height:46px;
    border:1px solid #cbd5e1;
    border-radius:13px;
    padding:0 13px;
    font-size:13px;
    background:#f8fafc;
    outline:none;
}

.field input:focus{
    border-color:#0284c7;
    background:#fff;
    box-shadow:0 0 0 3px #e0f2fe;
}

.primary{
    width:100%;
    height:48px;
    border:0;
    border-radius:14px;
    background:linear-gradient(135deg,#0284c7,#0369a1);
    color:#fff;
    font-weight:900;
    cursor:pointer;
}

.error{
    display:none;
    margin-top:12px;
    padding:11px;
    border-radius:12px;
    font-size:12px;
    font-weight:800;
    background:#fee2e2;
    color:#991b1b;
}

.footer{
    text-align:center;
    color:#64748b;
    font-size:10px;
    margin:18px 0;
}
</style>
</head>

<body>

<div class="app">

    <!-- الهيدر الأصلي -->
    <section class="hero">

        <div class="brand">
            ☀️ المراقب برو
        </div>

        <div>
            <p>بوابة الموظف الذكية</p>
        </div>

    </section>

    <!-- حالة السيرفر -->
    <div class="server">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">جاري فحص الاتصال...</span>
    </div>

    <!-- تسجيل الدخول فقط -->
    <section id="loginPanel" class="panel">

        <div class="section-title">
            تسجيل دخول الموظف
        </div>

        <div class="section-sub">
            أدخل بيانات الحساب المعتمدة من إدارة الشركة.
        </div>

        <form class="form" onsubmit="login(event)">

            <div class="field">
                <label>رمز الشركة</label>
                <input
                    id="companyId"
                    required
                    autocomplete="organization"
                    placeholder="مثال: B-2080"
                >
            </div>

            <div class="field">
                <label>اسم المستخدم</label>
                <input
                    id="username"
                    required
                    autocomplete="username"
                    placeholder="اسم المستخدم"
                >
            </div>

            <div class="field">
                <label>كلمة المرور</label>
                <input
                    id="password"
                    type="password"
                    required
                    autocomplete="current-password"
                    placeholder="كلمة المرور"
                >
            </div>

            <button
                class="primary"
                id="loginBtn"
                type="submit"
            >
                🚀 دخول إلى حسابي
            </button>

        </form>

        <div id="loginMsg" class="error"></div>

    </section>

    <!-- طلب إضافة موظف جديد (بنفس التصميم) -->
    <section class="panel">

        <div class="section-title">
            طلب إضافة موظف جديد
        </div>

        <div class="section-sub">
            أرسل طلبك إلى مدير الشركة للموافقة عليه.
        </div>

        <form class="form" onsubmit="sendEmployeeRequest(event)">

            <div class="field">
                <label>رمز الشركة</label>
                <input
                    id="reqCompanyId"
                    required
                    placeholder="مثال: B-2080"
                >
            </div>

            <div class="field">
                <label>الاسم الكامل</label>
                <input
                    id="reqName"
                    required
                    placeholder="الاسم الثلاثي"
                >
            </div>

            <div class="field">
                <label>رقم الهاتف</label>
                <input
                    id="reqPhone"
                    type="tel"
                    placeholder="05xxxxxxxx"
                >
            </div>

            <div class="field">
                <label>المسمى الوظيفي</label>
                <input
                    id="reqJobTitle"
                    placeholder="مثال: محاسب"
                >
            </div>

            <div class="field">
                <label>الراتب الأساسي (اختياري)</label>
                <input
                    id="reqSalary"
                    type="number"
                    min="0"
                    step="0.01"
                    placeholder="0.00"
                >
            </div>

            <div class="field">
                <label>موقع العمل</label>
                <input
                    id="reqLocation"
                    placeholder="مثال: الرياض"
                >
            </div>

            <button
                class="primary"
                id="reqBtn"
                type="submit"
            >
                📤 إرسال طلب الإضافة
            </button>

        </form>

        <div id="reqMsg" class="error"></div>

    </section>

    <div class="footer">
        المراقب برو © 2026 — شركة الارجوان للبرمجيات
    </div>

</div>

<script>

const SERVER_URL = location.origin;

/*
=========================================================
 Device ID
=========================================================
*/

function deviceId() {

    let id = localStorage.getItem('almoraqeb_device_id');

    if (!id) {

        id =
            crypto.randomUUID
                ? crypto.randomUUID()
                : 'device-' +
                  Date.now() +
                  '-' +
                  Math.random()
                      .toString(36)
                      .slice(2);

        localStorage.setItem(
            'almoraqeb_device_id',
            id
        );
    }

    return id;
}


/*
=========================================================
 Server Ping
=========================================================
*/

async function ping() {

    try {

        const r =
            await fetch(
                SERVER_URL + '/api/ping',
                {
                    cache:'no-store'
                }
            );

        const dot =
            document.getElementById('statusDot');

        const text =
            document.getElementById('statusText');

        if (r.ok) {

            dot.style.background =
                '#22c55e';

            text.textContent =
                'متصل بالسيرفر المركزي';

        } else {

            dot.style.background =
                '#fbbf24';

            text.textContent =
                'السيرفر غير متاح';

        }

    } catch(e) {

        document.getElementById(
            'statusDot'
        ).style.background =
            '#ef4444';

        document.getElementById(
            'statusText'
        ).textContent =
            'غير متصل حالياً';

    }
}


/*
=========================================================
 Employee Login
=========================================================
*/

async function login(event) {

    event.preventDefault();

    const button =
        document.getElementById('loginBtn');

    const message =
        document.getElementById('loginMsg');

    const companyId =
        document
            .getElementById('companyId')
            .value
            .trim();

    const username =
        document
            .getElementById('username')
            .value
            .trim();

    const password =
        document
            .getElementById('password')
            .value;

    message.style.display =
        'none';

    button.disabled = true;

    button.textContent =
        '⏳ جارٍ تسجيل الدخول...';

    try {

        const response =
            await fetch(
                SERVER_URL + '/api/mobile/login',  // ✅ تم إصلاح المسار
                {
                    method:'POST',
                    headers:{
                        'Content-Type':
                            'application/json'
                    },
                    body:JSON.stringify({

                        companyId,

                        username,

                        password,

                        deviceId:
                            deviceId()

                    })
                }
            );

        let data = {};

        try {

            data =
                await response.json();

        } catch (_) {

            data = {};

        }

        if (!response.ok || !data.success) {

            throw new Error(
                data.message ||
                data.error ||
                'فشل تسجيل الدخول'
            );

        }

        if (data.employee) {

            localStorage.setItem(
                'almoraqeb_employee',
                JSON.stringify(
                    data.employee
                )
            );

        }

        message.className =
            'error';

        message.style.display =
            'block';

        message.style.background =
            '#dcfce7';

        message.style.color =
            '#166534';

        message.textContent =
            'تم تسجيل الدخول بنجاح';

        if (data.redirect) {

            setTimeout(() => {
                window.location.href =
                    data.redirect;
            }, 1000);

        }

    } catch (error) {

        message.className =
            'error';

        message.style.display =
            'block';

        message.style.background =
            '#fee2e2';

        message.style.color =
            '#991b1b';

        message.textContent =
            error.message ||
            'تعذر الاتصال بالسيرفر';

    } finally {

        button.disabled =
            false;

        button.textContent =
            '🚀 دخول إلى حسابي';

    }
}


/*
=========================================================
 Send Employee Request
=========================================================
*/

async function sendEmployeeRequest(event) {

    event.preventDefault();

    const button =
        document.getElementById('reqBtn');

    const message =
        document.getElementById('reqMsg');

    const companyId =
        document.getElementById('reqCompanyId')
            .value
            .trim();

    const name =
        document.getElementById('reqName')
            .value
            .trim();

    const phoneNumber =
        document.getElementById('reqPhone')
            .value
            .trim();

    const jobTitle =
        document.getElementById('reqJobTitle')
            .value
            .trim();

    const salary =
        document.getElementById('reqSalary')
            .value;

    const location =
        document.getElementById('reqLocation')
            .value
            .trim();

    message.style.display =
        'none';

    if (!companyId || !name) {
        message.textContent = 'رمز الشركة واسم الموظف مطلوبان';
        message.style.display = 'block';
        return;
    }

    button.disabled = true;
    button.textContent = '⏳ جارٍ إرسال الطلب...';

    try {

        const response = await fetch(
            SERVER_URL + '/api/employee/request',
            {
                method:'POST',
                headers:{
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    companyId,
                    name,
                    phoneNumber,
                    jobTitle,
                    salary: salary ? Number(salary) : undefined,
                    location,
                    deviceId: deviceId()
                })
            }
        );

        let data = {};
        try {
            data = await response.json();
        } catch (_) {
            data = {};
        }

        if (!response.ok || !data.success) {
            throw new Error(data.message || data.error || 'فشل إرسال الطلب');
        }

        // نجاح
        message.className = 'error';
        message.style.display = 'block';
        message.style.background = '#dcfce7';
        message.style.color = '#166534';
        message.textContent = '✅ ' + (data.message || 'تم إرسال الطلب بنجاح إلى لوحة المدير');

        // تفريغ الحقول ما عدا رمز الشركة
        document.getElementById('reqName').value = '';
        document.getElementById('reqPhone').value = '';
        document.getElementById('reqJobTitle').value = '';
        document.getElementById('reqSalary').value = '';
        document.getElementById('reqLocation').value = '';

    } catch (error) {
        message.className = 'error';
        message.style.display = 'block';
        message.style.background = '#fee2e2';
        message.style.color = '#991b1b';
        message.textContent = error.message || 'تعذر الاتصال بالسيرفر';
    } finally {
        button.disabled = false;
        button.textContent = '📤 إرسال طلب الإضافة';
    }
}


/*
=========================================================
 Initialization
=========================================================
*/

ping();

setInterval(
    ping,
    30000
);

</script>
</body>
</html>

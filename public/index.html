<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الذكية - نظام المراقب برو</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0f172a;
            --secondary: #312e81;
            --accent: #6366f1;
            --success: #10b981;
            --danger: #ef4444;
            --bg-light: #f1f5f9;
            --card-bg: #ffffff;
            --border: #cbd5e1;
            --text-main: #1c293b;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-light);
            margin: 0;
            padding: 20px;
            color: var(--text-main);
        }

        /* --- تصميم شاشة تسجيل الدخول --- */
        #loginSection {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }
        .login-card {
            width: 100%;
            max-width: 450px;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border);
        }
        .login-card h2 {
            text-align: center;
            margin-bottom: 30px;
            color: var(--primary);
            font-weight: 900;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-main);
        }
        .login-card input[type="text"], .login-card input[type="password"] {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 16px;
            font-family: 'Cairo', sans-serif;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        .login-card input:focus {
            border-color: var(--accent);
        }
        .login-card button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.3s;
        }
        .login-card button:hover {
            background-color: var(--secondary);
        }
        .error-msg {
            color: var(--danger);
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            display: none;
        }

        /* --- تصميم لوحة التحكم الرئيسية (مخفية افتراضياً حتى يتم الدخول) --- */
        #dashboardSection {
            display: none;
            max-width: 1300px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.08);
        }

        /* شريط التنقل الموحد */
        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            background: #e2e8f0;
            padding: 12px;
            border-radius: 12px;
            flex-wrap: wrap;
        }
        .nav-link {
            text-decoration: none;
            padding: 10px 18px;
            background: #fff;
            border-radius: 8px;
            font-weight: 700;
            color: #1e293b;
            font-size: 14px;
            transition: all 0.2s;
        }
        .nav-link:hover, .nav-link.active {
            background: var(--accent);
            color: white;
        }

        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--bg-light);
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        .header-flex h2 {
            color: var(--primary);
            font-weight: 900;
            margin: 0;
            font-size: 26px;
        }

        .btn-logout {
            background-color: #fee2e2;
            color: var(--danger);
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            transition: all 0.2s;
        }
        .btn-logout:hover {
            background-color: var(--danger);
            color: white;
        }

        .control-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8fafc;
            border: 1.5px solid var(--border);
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            gap: 15px;
        }

        .search-box { flex: 1; }
        .search-box input {
            width: 100%;
            padding: 11px 15px;
            border-radius: 8px;
            border: 1.5px solid var(--border);
            background: white;
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            outline: none;
        }
        .search-box input:focus { border-color: var(--accent); }

        .btn-delete-all {
            background-color: #fee2e2;
            color: var(--danger);
            border: none;
            padding: 11px 18px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            transition: background 0.2s;
        }
        .btn-delete-all:hover { background-color: var(--danger); color: white; }

        .employees-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .employee-card {
            background: #ffffff;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02);
            transition: transform 0.2s;
        }
        .employee-card:hover { border-color: var(--accent); }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1.5px solid var(--bg-light);
            padding-bottom: 10px;
            margin-bottom: 12px;
        }

        .card-title { font-size: 18px; font-weight: 800; color: var(--primary); }
        .card-badge { background: #e0e7ff; color: var(--secondary); padding: 5px 14px; border-radius: 25px; font-size: 13px; font-weight: 700; }
        .card-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; font-size: 13px; }
        .info-item span { color: #64748b; font-size: 11px; display: block; margin-bottom: 2px; font-weight: 600; }
        .info-item strong { color: var(--text-main); font-size: 13px; }
        .card-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 12px; border-top: 1.5px solid var(--bg-light); padding-top: 10px; }

        .btn-delete {
            background-color: #fee2e2; color: var(--danger); border: none; padding: 6px 14px;
            border-radius: 6px; font-weight: 700; cursor: pointer; font-family: 'Cairo', sans-serif;
        }
        .btn-delete:hover { background-color: var(--danger); color: white; }
    </style>
</head>
<body>

    <!-- 1. شاشة تسجيل دخول المدير -->
    <div id="loginSection">
        <div class="login-card">
            <h2>تسجيل دخول المدير</h2>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>اسم المستخدم</label>
                    <input type="text" id="username" required placeholder="أدخل اسم المستخدم">
                </div>
                
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="password" required placeholder="أدخل كلمة المرور">
                </div>
                
                <button type="submit">دخول</button>
                <div id="errorMsg" class="error-msg">خطأ في اسم المستخدم أو كلمة المرور</div>
            </form>
        </div>
    </div>

    <!-- 2. لوحة التحكم الرئيسية (تظهر بعد الدخول الناجح) -->
    <div id="dashboardSection">
        <!-- شريط التنقل الموحد -->
        <div class="nav-tabs">
            <a href="index.html" class="nav-link active">🏠 الرئيسية</a>
            <a href="add-employee.html" class="nav-link">➕ إضافة موظف</a>
            <a href="update-employee.html" class="nav-link">🔄 تحديث بيانات</a>
            <a href="fingerprints.html" class="nav-link">📍 سجل البصمات</a>
            <a href="payroll.html" class="nav-link">🧮 حاسبة الرواتب</a>
            <a href="payroll-report.html" class="nav-link">📊 كشف الرواتب</a>
            <a href="settings.html" class="nav-link">⚙️ الإعدادات</a>
        </div>

        <div class="header-flex">
            <h2>إدارة الموظفين والبيانات الأساسية</h2>
            <button class="btn-logout" onclick="logout()">تسجيل الخروج 🚪</button>
        </div>

        <!-- شريط البحث والتحكم -->
        <div class="control-bar">
            <div class="search-box">
                <input type="text" id="searchInput" onkeyup="filterEmployees()" placeholder="🔍 ابحث عن موظف بالاسم، المسمى الوظيفي، أو رقم الهاتف...">
            </div>
            <button class="btn-delete-all" onclick="deleteAllEmployees()">🗑️ حذف كافة الموظفين</button>
        </div>

        <!-- حاوية عرض بطاقات الموظفين -->
        <div id="employeesContainer" class="employees-container"></div>
    </div>

<script>
    // التحقق عند فتح الصفحة إذا كان المدير مسجلاً دخوله مسبقاً
    window.onload = function() {
        if (localStorage.getItem('isLoggedIn') === 'true') {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('dashboardSection').style.display = 'block';
            fetchEmployees();
        }
    };

    function handleLogin(event) {
        event.preventDefault();
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        const errorDiv = document.getElementById('errorMsg');
        
        // بيانات الدخول الافتراضية
        if (user === "admin" && pass === "123456") {
            localStorage.setItem('isLoggedIn', 'true');
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('dashboardSection').style.display = 'block';
            fetchEmployees();
        } else {
            errorDiv.style.display = 'block';
        }
    }

    function logout() {
        localStorage.removeItem('isLoggedIn');
        document.getElementById('dashboardSection').style.display = 'none';
        document.getElementById('loginSection').style.display = 'flex';
        document.getElementById('username').value = '';
        document.getElementById('password').value = '';
    }

    const apiUrl = '/api/employees';
    let employeesData = [];

    async function fetchEmployees() {
        try {
            const res = await fetch(apiUrl);
            employeesData = await res.json();
            renderEmployees(employeesData);
        } catch (err) {
            console.error('Error loading employees:', err);
        }
    }

    function renderEmployees(data) {
        const container = document.getElementById('employeesContainer');
        container.innerHTML = '';

        if (!data || data.length === 0) {
            container.innerHTML = '<p style="text-align: center; color: #64748b; padding: 30px; font-weight: 600;">لا توجد سجلات موظفين مسجلة حالياً في النظام.</p>';
            return;
        }

        data.forEach(emp => {
            let dateStr = emp.start_date ? new Date(emp.start_date).toISOString().split('T')[0] : '-';
            
            container.innerHTML += `
                <div class="employee-card">
                    <div class="card-header">
                        <span class="card-title">#${emp.id} - ${emp.name || ''}</span>
                        <span class="card-badge">${emp.job_title || 'بدون مسمى'}</span>
                    </div>
                    <div class="card-grid">
                        <div class="info-item"><span>الراتب الشهري</span><strong>${emp.salary || 0} د.ع</strong></div>
                        <div class="info-item"><span>ساعات العمل</span><strong>${emp.shift_hours || '-'}</strong></div>
                        <div class="info-item"><span>رقم الهاتف</span><strong>${emp.phone || '-'}</strong></div>
                        <div class="info-item"><span>تاريخ البدء</span><strong>${dateStr}</strong></div>
                        <div class="info-item" style="grid-column: span 2;"><span>العنوان السكني</span><strong>${emp.province || ''}، ${emp.city || ''}، ح:${emp.district || ''}، م:${emp.mahalla || ''}، ز:${emp.alley || ''}، د:${emp.house_no || ''}</strong></div>
                        <div class="info-item"><span>الوثيقة الرسمية</span><strong>${emp.id_type || '-'}: (${emp.id_number || '-'})</strong></div>
                        <div class="info-item"><span>رقم بطاقة السكن</span><strong>${emp.housing_card || '-'}</strong></div>
                    </div>
                    <div class="card-actions">
                        <button class="btn-delete" onclick="deleteEmployee(${emp.id})">🗑️ حذف الموظف</button>
                    </div>
                </div>
            `;
        });
    }

    function filterEmployees() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = employeesData.filter(emp => 
            (emp.name && emp.name.toLowerCase().includes(query)) ||
            (emp.job_title && emp.job_title.toLowerCase().includes(query)) ||
            (emp.phone && emp.phone.includes(query))
        );
        renderEmployees(filtered);
    }

    async function deleteEmployee(id) {
        if (!confirm('هل أنت متأكد من رغبتك في حذف هذا الموظف؟')) return;
        try {
            const res = await fetch(`${apiUrl}/${id}`, { method: 'DELETE' });
            if (res.ok) {
                alert('✅ تم حذف الموظف بنجاح');
                fetchEmployees();
            } else {
                alert('❌ حدث خطأ أثناء الحذف');
            }
        } catch (err) {
            console.error('Error deleting employee:', err);
        }
    }

    async function deleteAllEmployees() {
        if (!confirm('⚠️ تحذير: هل أنت متأكد تماماً من حذف كافة الموظفين من النظام؟')) return;
        try {
            const res = await fetch(`${apiUrl}/all`, { method: 'DELETE' });
            if (res.ok) {
                alert('✅ تم حذف كافة الموظفين بنجاح');
                fetchEmployees();
            } else {
                alert('❌ حدث خطأ أثناء حذف السجلات');
            }
        } catch (err) {
            console.error('Error deleting all employees:', err);
        }
    }
</script>

</body>
</html>

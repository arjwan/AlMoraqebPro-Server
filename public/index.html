<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>المراقب برو - دخول آمن</title>
    <!-- استدعاء مكتبة الذكاء الاصطناعي للوجه -->
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js/dist/face-api.min.js"></script>
    <style>
        /* (احتفظ بنفس التنسيقات السابقة هنا) */
        #video { width: 100%; border-radius: 8px; display: none; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>تسجيل الدخول</h2>
        <form id="loginForm">
            <input type="text" id="username" placeholder="اسم المستخدم" required>
            <input type="password" id="password" placeholder="كلمة المرور" required>
            <button type="submit" class="btn-submit">دخول بكلمة المرور</button>
            
            <!-- زر الكاميرا الحقيقي -->
            <button type="button" id="faceBtn" class="btn-face">📸 تسجيل الدخول ببصمة الوجه</button>
        </form>

        <!-- نافذة الكاميرا -->
        <video id="video" autoplay muted playsinline></video>
        
        <div class="developer-info">
            <p>شركة الأرجوان للبرمجيات</p>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');

        // تحميل نماذج الذكاء الاصطناعي
        Promise.all([
            faceapi.nets.tinyFaceDetector.loadFromUri('/models'),
            faceapi.nets.faceLandmark68Net.loadFromUri('/models')
        ]);

        document.getElementById('faceBtn').addEventListener('click', async () => {
            const stream = await navigator.mediaDevices.getUserMedia({ video: {} });
            video.srcObject = stream;
            video.style.display = 'block';
            
            // هنا يتم الربط بالذكاء الاصطناعي للمطابقة
            console.log("جاري تحليل الوجه...");
            // ملاحظة: يجب توفير مسار للموديلات (models) في مجلد المشروع
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المراقب برو - تسجيل الدخول</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #2e1a47 0%, #1f1135 50%, #100820 100%); color: #ffffff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .login-card { width: 100%; max-width: 520px; background: #ffffff; color: #1e293b; padding: 50px 40px; border-radius: 28px; box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5); text-align: center; }
        .login-icon { font-size: 45px; margin-bottom: 15px; }
        h2 { font-size: 30px; font-weight: 800; color: #0284c7; margin-bottom: 10px; }
        .subtitle { font-size: 15px; color: #64748b; margin-bottom: 25px; }
        .info-box { background: #f0f9ff; border: 1px solid #bae6fd; color: #0369a1; padding: 14px; border-radius: 14px; font-size: 14px; margin-bottom: 30px; font-weight: 600; line-height: 1.6; text-align: right; }
        .form-group { text-align: right; margin-bottom: 22px; }
        label { display: block; font-size: 16px; font-weight: 700; color: #334155; margin-bottom: 8px; }
        input { width: 100%; padding: 16px 18px; font-size: 16px; border: 1px solid #cbd5e1; border-radius: 14px; outline: none; transition: 0.3s; background: #f8fafc; }
        input:focus { border-color: #0284c7; background: #fff; box-shadow: 0 0 10px rgba(2, 132, 199, 0.2); }
        .btn-submit { width: 100%; background: #0284c7; color: #ffffff; font-size: 18px; font-weight: 800; padding: 16px; border: none; border-radius: 14px; cursor: pointer; transition: 0.3s; margin-top: 10px; box-shadow: 0 6px 20px rgba(2, 132, 199, 0.3); }
        .btn-submit:hover { background: #0369a1; transform: translateY(-2px); }
        .back-link { display: inline-block; margin-top: 25px; color: #0284c7; text-decoration: none; font-size: 16px; font-weight: 700; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-icon">🔑</div>
        <h2>تسجيل الدخول</h2>
        <p class="subtitle">أدخل بيانات شركتك ومعرّفها للوصول إلى قاعدة البيانات ولوحة التحكم</p>

        <div class="info-box">
            💡 <b>تعليمات الدخول:</b><br>
            - الحساب التجريبي العام: المستخدم: <b>admin</b> | كلمة المرور: <b>admin123</b><br>
            - أو استخدم اسم المستخدم وكلمة المرور الخاصة بشركتك المفعلة.
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>اسم المستخدم أو معرف الشركة:</label>
                <input type="text" id="username" required placeholder="أدخل اسم المستخدم أو admin...">
            </div>

            <div class="form-group">
                <label>كلمة المرور:</label>
                <input type="password" id="password" required placeholder="أدخل كلمة المرور...">
            </div>

            <button type="submit" class="btn-submit">🚀 دخول لوحة التحكم</button>
        </form>

        <a href="admin-register.html" class="back-link">← ليس لديك حساب؟ إنشاء حساب جديد للشركة</a>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            const user = document.getElementById('username').value.trim().toLowerCase();
            const pass = document.getElementById('password').value.trim();

            // 1. التحقق الفوري للحساب التجريبي العام
            if (user === 'admin' && pass === 'admin123') {
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('activeCompanyId', 'default_company');
                window.location.href = 'admin.html';
                return;
            }

            // 2. التحقق المرن من الشركات المسجلة والمفعلة مسبقاً
            const companiesList = JSON.parse(localStorage.getItem('registeredCompanies')) || [];
            
            const matchedCompany = companiesList.find(c => {
                const cUser = (c.username || '').trim().toLowerCase();
                const cId = (c.id || '').trim().toLowerCase();
                const cPass = (c.pass || '').trim();
                
                return (cUser === user || cId === user) && cPass === pass;
            });

            if (matchedCompany) {
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('activeCompanyId', matchedCompany.id);
                window.location.href = 'admin.html';
            } else {
                alert('⚠️ بيانات الدخول غير صحيحة، تأكد من اسم المستخدم وكلمة المرور، أو تأكد من تفعيل الحساب من لوحة المطور.');
            }
        }
    </script>
</body>
</html>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#075985">
<title>المراقب برو | اختيار البوابة</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;font-family:"Segoe UI",Tahoma,sans-serif;color:#0f172a;background:linear-gradient(145deg,#e0f2fe,#f8fafc 48%,#dbeafe)}.shell{width:100%;max-width:900px;background:#fff;border:1px solid #cbd5e1;border-radius:28px;padding:28px;box-shadow:0 22px 55px #0f172a20}.hero{text-align:center;margin-bottom:25px}.logo{width:82px;height:82px;margin:auto;display:flex;align-items:center;justify-content:center;border-radius:24px;background:linear-gradient(135deg,#075985,#0ea5e9);font-size:40px;box-shadow:0 12px 25px #0284c74a}.hero h1{margin:13px 0 5px;font-size:30px;color:#0c4a6e}.hero p{margin:0;color:#64748b;font-weight:700}.status{display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:6px 11px;border-radius:20px;background:#dcfce7;color:#166534;font-size:11px;font-weight:900}.dot{width:8px;height:8px;border-radius:50%;background:#22c55e}.choices{display:grid;grid-template-columns:1fr 1fr;gap:18px}.choice{display:block;text-decoration:none;color:#0f172a;border:1px solid #cbd5e1;border-radius:22px;padding:25px;text-align:center;background:#fff;transition:.2s;box-shadow:0 5px 16px #0f172a0d}.choice:hover{transform:translateY(-4px);box-shadow:0 14px 30px #0284c729;border-color:#38bdf8}.choice .icon{font-size:48px;display:block;margin-bottom:10px}.choice h2{margin:0 0 7px;font-size:21px}.choice p{margin:0;color:#64748b;font-size:13px;line-height:1.7}.choice.admin{background:linear-gradient(150deg,#f0f9ff,#fff)}.choice.employee{background:linear-gradient(150deg,#f0fdf4,#fff)}.enter{display:inline-block;margin-top:17px;border-radius:12px;padding:9px 18px;color:#fff;background:#0284c7;font-weight:900;font-size:13px}.employee .enter{background:#16a34a}.footer{text-align:center;margin-top:22px;color:#64748b;font-size:11px}@media(max-width:650px){body{padding:8px;background:#f1f5f9}.shell{padding:18px 12px;border-radius:16px;box-shadow:0 5px 18px #0f172a1f}.hero h1{font-size:24px}.choices{grid-template-columns:1fr;gap:12px}.choice{padding:19px;border-radius:16px}.choice .icon{font-size:40px}.choice h2{font-size:18px}}
</style>
</head>
<body>
<main class="shell">
<header class="hero"><div class="logo">☀️</div><h1>نظام المراقب برو</h1><p>اختر البوابة التي تريد الدخول إليها</p><div class="status"><span class="dot"></span><span id="serverState">متصل بالسيرفر</span></div></header>
<section class="choices">
<a class="choice admin" href="/admin_login.html"><span class="icon">🛡️</span><h2>بوابة المدير</h2><p>إدارة الموظفين والحضور والرواتب والأرشيف والإشعارات والتقارير.</p><span class="enter">دخول المدير</span></a>
<a class="choice employee" href="/employee_portal.html"><span class="icon">👤</span><h2>بوابة الموظف</h2><p>تسجيل الدخول والبصمة والطلبات والخدمات وإشعارات الإدارة.</p><span class="enter">دخول الموظف</span></a>
</section>
<footer class="footer">المراقب برو — نظام إدارة ومتابعة متكامل</footer>
</main>
<script>
fetch('/api/ping',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error()}).catch(()=>{document.querySelector('.status').style.background='#fef3c7';document.querySelector('.status').style.color='#92400e';document.querySelector('.dot').style.background='#f59e0b';document.getElementById('serverState').textContent='السيرفر قيد الاستجابة'});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}))}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الذكية - نظام المراقب برو</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0f172a;
            --secondary: #312e81;
            --accent: #6366f1;
            --success: #10b981;
            --danger: #ef4444;
            --bg-light: #f1f5f9;
            --card-bg: #ffffff;
            --border: #cbd5e1;
            --text-main: #1c293b;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-light);
            margin: 0;
            padding: 20px;
            color: var(--text-main);
        }
        /* تصميم شاشة تسجيل الدخول */
        #loginSection {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }
        .login-card {
            width: 100%;
            max-width: 450px;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border);
        }
        h2 {
            text-align: center;
            margin-bottom: 30px;
            color: var(--primary);
            font-weight: 900;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-main);
        }
        input {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 16px;
            font-family: 'Cairo', sans-serif;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: var(--accent);
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: var(--secondary);
        }
        .error-msg {
            color: var(--danger);
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            display: none;
        }

        /* تصميم لوحة التحكم (مخفية حتى يتم الدخول) */
        #dashboardSection {
            display: none;
            max-width: 1250px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border);
        }
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--bg-light);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>

    <!-- قسم تسجيل الدخول -->
    <div id="loginSection">
        <div class="login-card">
            <h2>تسجيل دخول المدير</h2>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>اسم المستخدم</label>
                    <input type="text" id="username" required placeholder="أدخل اسم المستخدم">
                </div>
                
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="password" required placeholder="أدخل كلمة المرور">
                </div>
                
                <button type="submit">دخول</button>
                <div id="errorMsg" class="error-msg">خطأ في اسم المستخدم أو كلمة المرور</div>
            </form>
        </div>
    </div>

    <!-- قسم لوحة التحكم الرئيسية -->
    <div id="dashboardSection">
        <div class="dashboard-header">
            <h1>لوحة التحكم الذكية - نظام المراقب برو</h1>
            <button onclick="handleLogout()" style="width: auto; padding: 10px 20px; background-color: var(--danger);">تسجيل الخروج</button>
        </div>
        <div>
            <h3>مرحباً بك يا مدير النظام 🚀</h3>
            <p>هنا ستظهر بيانات وإدارة الموظفين والتحكم الكامل بالتطبيق.</p>
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMsg');
            
            // التحقق من بيانات الدخول
            if (user === "admin" && pass === "123456") {
                // إخفاء شاشة تسجيل الدخول
                document.getElementById('loginSection').style.display = 'none';
                // إظهار لوحة التحكم
                document.getElementById('dashboardSection').style.display = 'block';
            } else {
                errorDiv.style.display = 'block';
            }
        }

        function handleLogout() {
            // العودة لشاشة تسجيل الدخول
            document.getElementById('dashboardSection').style.display = 'none';
            document.getElementById('loginSection').style.display = 'flex';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }
    </script>
</body>
</html>

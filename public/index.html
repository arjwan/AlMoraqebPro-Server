<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>المراقب برو | بوابة الموظف</title>
<style>
/* === التصميم الأصلي مع إضافات النافذة === */
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,'Segoe UI',sans-serif;background:linear-gradient(160deg,#eff6ff,#f8fafc 55%,#e0f2fe);color:#0f172a;min-height:100vh;padding:18px;position:relative}.app{width:100%;max-width:480px;margin:auto}.hero{background:linear-gradient(135deg,#0369a1,#0284c7 55%,#38bdf8);color:#fff;border-radius:28px;padding:24px 20px;box-shadow:0 18px 45px rgba(2,132,199,.25);position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center}.hero:after{content:'';position:absolute;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.09);left:-45px;top:-55px}.brand{font-size:25px;font-weight:900;display:flex;align-items:center;gap:10px}.info-btn{background:rgba(255,255,255,0.2);border:0;color:#fff;font-size:20px;width:40px;height:40px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:0.3s}.info-btn:hover{background:rgba(255,255,255,0.4);transform:rotate(10deg)}.hero p{margin:7px 0 0;color:#e0f2fe;font-size:12px}.server{margin-top:18px;display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.14);padding:7px 11px;border-radius:999px;font-size:11px}.dot{width:8px;height:8px;border-radius:50%;background:#fbbf24}.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.nav button{border:0;border-radius:17px;padding:14px;background:#fff;color:#475569;font-weight:900;box-shadow:0 7px 22px rgba(15,23,42,.07);cursor:pointer;transition:0.2s}.nav button.active{background:#0f172a;color:#fff}.panel{display:none;background:#fff;border:1px solid #e2e8f0;border-radius:24px;padding:20px;box-shadow:0 12px 30px rgba(15,23,42,.08)}.panel.active{display:block}.section-title{font-size:18px;font-weight:900;margin-bottom:5px}.section-sub{font-size:11px;color:#64748b;margin-bottom:18px}.form{display:grid;gap:12px}.field label{display:block;font-size:11px;font-weight:900;color:#475569;margin:0 0 6px}.field input,.field select{width:100%;height:46px;border:1px solid #cbd5e1;border-radius:13px;padding:0 13px;font-size:13px;background:#f8fafc;outline:none}.field input:focus,.field select:focus{border-color:#0284c7;background:#fff;box-shadow:0 0 0 3px #e0f2fe}.primary{width:100%;height:48px;border:0;border-radius:14px;background:linear-gradient(135deg,#0284c7,#0369a1);color:#fff;font-weight:900;cursor:pointer;transition:0.2s}.primary:hover{transform:scale(1.01);opacity:0.95}.secondary{width:100%;height:44px;border:1px solid #cbd5e1;border-radius:13px;background:#f8fafc;color:#334155;font-weight:800;cursor:pointer;transition:0.2s}.secondary:hover{background:#e2e8f0}.success,.error,.info{display:none;margin-top:12px;padding:11px;border-radius:12px;font-size:12px;font-weight:800}.success{background:#dcfce7;color:#166534}.error{background:#fee2e2;color:#991b1b}.info{background:#e0f2fe;color:#075985}.request-menu{position:relative}.company-list{position:absolute;z-index:20;top:53px;right:0;left:0;background:#fff;border:1px solid #cbd5e1;border-radius:14px;box-shadow:0 16px 35px rgba(15,23,42,.16);max-height:220px;overflow:auto;display:none}.company-item{padding:12px;border-bottom:1px solid #f1f5f9;cursor:pointer;font-size:12px;font-weight:800}.company-item:hover{background:#f0f9ff}.choice-card{background:#f8fafc;border:1px solid #e2e8f0;border-radius:16px;padding:13px;margin-bottom:12px}.choice-card strong{display:block;font-size:13px}.choice-card span{font-size:11px;color:#64748b}.footer{text-align:center;color:#64748b;font-size:10px;margin:18px 0}.back{margin-top:10px}.loading{opacity:.65;pointer-events:none}

/* === النافذة المنبثقة (Full Screen) === */
.modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(15, 23, 42, 0.7);
    backdrop-filter: blur(8px);
    z-index: 1000;
    display: none;
    justify-content: center;
    align-items: flex-start;
    padding-top: 40px;
    animation: fadeIn 0.3s ease;
}
.modal-overlay.open { display: flex; }

.modal-sheet {
    background: #fff;
    width: 100%;
    max-width: 480px;
    max-height: 90vh;
    border-radius: 32px 32px 0 0;
    padding: 25px 20px 30px;
    box-shadow: 0 -20px 60px rgba(0,0,0,0.3);
    overflow-y: auto;
    animation: slideUp 0.4s ease;
    position: relative;
}

/* منطقة السحب للتحديث */
.pull-area {
    background: #f1f5f9;
    border-radius: 16px;
    padding: 18px 15px;
    margin-bottom: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    transition: 0.3s;
    border: 1px solid #e2e8f0;
}
.pull-area:active { transform: scale(0.98); }
.pull-area .pull-icon { font-size: 22px; }
.pull-area .pull-text { font-weight: 800; font-size: 13px; color: #1e293b; }

/* حالة السيرفر */
.server-status {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid #e2e8f0;
    margin-bottom: 15px;
}
.status-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    flex-shrink: 0;
    transition: 0.3s;
}
.status-dot.green { background: #22c55e; box-shadow: 0 0 12px #22c55e66; }
.status-dot.yellow { background: #fbbf24; box-shadow: 0 0 12px #fbbf2466; }
.status-dot.red { background: #ef4444; box-shadow: 0 0 12px #ef444466; }
.status-text { font-size: 14px; font-weight: 700; color: #0f172a; }

/* معلومات المطور */
.dev-info {
    background: #f8fafc;
    border-radius: 16px;
    padding: 18px;
    margin: 15px 0 20px;
    border: 1px solid #e2e8f0;
}
.dev-info h3 {
    margin: 0 0 10px 0;
    font-size: 16px;
    color: #0284c7;
}
.dev-info p {
    margin: 5px 0;
    font-size: 13px;
    color: #334155;
}
.dev-info .label { font-weight: 700; color: #0f172a; }

/* زر الإغلاق */
.close-btn {
    width: 100%;
    padding: 14px;
    border: 0;
    border-radius: 14px;
    background: #f1f5f9;
    color: #475569;
    font-weight: 900;
    font-size: 16px;
    cursor: pointer;
    transition: 0.2s;
    margin-top: 10px;
}
.close-btn:hover { background: #e2e8f0; }

/* الحركات */
@keyframes slideUp {
    from { transform: translateY(40px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}
@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

/* السحب للتحديث (Pull-to-Refresh) */
.pull-to-refresh {
    touch-action: none;
}
</style>
</head>
<body>
<div class="app">

<!-- الهيدر مع زر المعلومات -->
<section class="hero">
    <div class="brand">
        ☀️ المراقب برو
        <button class="info-btn" onclick="openModal()" title="معلومات المطور وحالة السيرفر">ℹ️</button>
    </div>
    <div><p>بوابة الموظف الذكية</p></div>
</section>

<!-- حالة السيرفر المصغرة في الهيدر -->
<div class="server">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">جاري فحص الاتصال...</span>
</div>

<!-- أزرار التبديل بين تسجيل الدخول وطلب التسجيل -->
<div class="nav">
    <button id="loginTab" class="active" onclick="showPanel('login')">🔐 تسجيل الدخول</button>
    <button id="requestTab" onclick="goRequest()">📝 طلب انضمام</button>
</div>

<!-- لوحة تسجيل الدخول -->
<section id="loginPanel" class="panel active">
    <div class="section-title">تسجيل دخول الموظف</div>
    <div class="section-sub">أدخل بيانات الحساب المعتمدة من إدارة الشركة.</div>
    <form class="form" onsubmit="login(event)">
        <div class="field"><label>رمز الشركة</label><input id="companyId" required placeholder="مثال: B-2080"></div>
        <div class="field"><label>اسم المستخدم</label><input id="username" required placeholder="اسم المستخدم"></div>
        <div class="field"><label>كلمة المرور</label><input id="password" type="password" required placeholder="كلمة المرور"></div>
        <button class="primary" id="loginBtn">🚀 دخول إلى حسابي</button>
    </form>
    <div id="loginMsg" class="error"></div>
</section>


<div class="footer">المراقب برو © 2026 — شركة الارجوان للبرمجيات</div>
</div>

<script>
// ============================================================
// الكود الأصلي مع إضافات النافذة المنبثقة
// ============================================================

const SERVER_URL = location.origin;

// ===== الكود الأصلي =====
function deviceId() {
    let id = localStorage.getItem('almoraqeb_device_id');
    if (!id) {
        id = crypto.randomUUID ? crypto.randomUUID() : 'device-' + Date.now() + '-' + Math.random().toString(36).slice(2);
        localStorage.setItem('almoraqeb_device_id', id);
    }
    return id;
}

function showPanel(name) {
    document.getElementById('loginPanel').classList.toggle('active', name === 'login');
    document.getElementById('loginTab').classList.toggle('active', name === 'login');
}
function goRequest() { location.href = 'register.html'; }

async function ping() {
    try {
        const r = await fetch(SERVER_URL + '/api/ping');
        document.getElementById('statusDot').style.background = r.ok ? '#22c55e' : '#fbbf24';
        document.getElementById('statusText').textContent = r.ok ? 'متصل بالسيرفر المركزي' : 'السيرفر غير متاح';
    } catch(e) {
        document.getElementById('statusDot').style.background = '#ef4444';
        document.getElementById('statusText').textContent = 'غير متصل حالياً';
    }
}

function esc(v) {
    return String(v ?? '').replace(/[&<>'"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[c]));
}

// ===== التهيئة =====
ping();
setInterval(ping, 30000);
</script>
</body>
</html>

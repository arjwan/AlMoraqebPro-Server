<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المراقب برو - تسجيل الدخول الآمن</title>
    <!-- استدعاء المكتبة للذكاء الاصطناعي وبصمة الوجه -->
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js/dist/face-api.min.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #2c3e50, #4ca1af); 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            color: #333; 
        }
        .login-card { 
            background: #ffffff; 
            padding: 40px; 
            border-radius: 20px; 
            box-shadow: 0 12px 35px rgba(0,0,0,0.3); 
            text-align: center; 
            max-width: 520px; 
            width: 95%; 
        }
        h2 { 
            color: #2c3e50; 
            margin-bottom: 20px; 
            font-size: 26px;
        }
        input { 
            width: 100%; 
            padding: 14px 16px; 
            margin: 10px 0; 
            border: 1px solid #ccc; 
            border-radius: 10px; 
            box-sizing: border-box; 
            font-size: 16px;
            outline: none;
        }
        input:focus {
            border-color: #3498db;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
        }
        .btn { 
            width: 100%; 
            padding: 14px; 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            font-weight: bold; 
            margin-top: 12px; 
            font-size: 16px;
            transition: 0.3s; 
        }
        .btn-submit { background: #3498db; color: white; }
        .btn-submit:hover { background: #2980b9; }
        .btn-face { background: #27ae60; color: white; }
        .btn-face:hover { background: #219653; }
        .btn-capture { background: #e67e22; color: white; display: none; margin-top: 12px; }
        .btn-capture:hover { background: #d35400; }
        
        #video-container {
            position: relative;
            margin-top: 15px;
            display: none;
        }
        #video { 
            width: 100%; 
            max-height: 340px;
            border-radius: 10px; 
            background: #000; 
            display: block;
            object-fit: cover;
        }
        
        .developer-info { 
            margin-top: 22px; 
            font-size: 13px; 
            border-top: 1px solid #eee; 
            padding-top: 14px; 
            color: #555;
            line-height: 1.6;
        }
        .developer-info .company {
            font-weight: bold;
            color: #2c3e50;
            font-size: 15px;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h2>🔑 تسجيل الدخول</h2>
    <form id="loginForm">
        <input type="text" id="username" placeholder="اسم المستخدم" required>
        <input type="password" id="password" placeholder="كلمة المرور" required>
        <button type="submit" class="btn btn-submit">دخول بكلمة المرور</button>
        <button type="button" id="faceBtn" class="btn btn-face">📸 فتح كاميرا بصمة الوجه</button>
    </form>
    
    <div id="video-container">
        <video id="video" autoplay muted playsinline></video>
        <button type="button" id="captureBtn" class="btn btn-capture">🔘 التقاط الصورة والتحقق</button>
    </div>

    <!-- معلومات الشركة، المطور، ووسائل التواصل -->
    <div class="developer-info">
        <div class="company">شركة الأرجوان للبرمجيات</div>
        <div>المطور: محمد العبيدي</div>
        <div>واتساب: <span dir="ltr">07807807491</span></div>
        <div>الإيميل: <span dir="ltr">mohmed1628@gmail.com</span></div>
    </div>
</div>

<script>
    const video = document.getElementById('video');
    const videoContainer = document.getElementById('video-container');
    const faceBtn = document.getElementById('faceBtn');
    const captureBtn = document.getElementById('captureBtn');

    async function loadModels() {
        await faceapi.nets.tinyFaceDetector.loadFromUri('/models');
        await faceapi.nets.faceLandmark68Net.loadFromUri('/models');
    }

    faceBtn.addEventListener('click', async () => {
        try {
            await loadModels();
            const stream = await navigator.mediaDevices.getUserMedia({ video: {} });
            video.srcObject = stream;
            videoContainer.style.display = 'block';
            captureBtn.style.display = 'block';
            faceBtn.style.display = 'none';
        } catch (err) {
            alert('تعذر فتح الكاميرا، تأكد من أذونات المتصفح.');
        }
    });

    captureBtn.addEventListener('click', async () => {
        const detections = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions());
        
        if (detections) {
            alert('تم التقاط الوجه بنجاح! جاري مطابقة البيانات...');
        } else {
            alert('لم يتم رصد وجه بوضوح أمام الكاميرا، حاول مرة أخرى.');
        }
    });

    // ربط نموذج تسجيل الدخول بالسيرفر وقاعدة البيانات
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();

        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await response.json();
            
            if (data.success) {
                alert('✅ تم تسجيل الدخول بنجاح!');
                // يمكنك توجيهه للوحة التحكم هنا لاحقاً، مثل: window.location.href = 'dashboard.html';
            } else {
                alert('❌ ' + (data.message || 'فشل تسجيل الدخول، تأكد من اسم المستخدم أو كلمة المرور'));
            }
        } catch (err) {
            console.error(err);
            alert('⚠️ حدث خطأ في الاتصال بالخادم على Render');
        }
    });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المراقب برو - التسجيل الآمن والذكي</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); color: #f8fafc; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .card { background: #1e293b; padding: 30px; border-radius: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); width: 100%; max-width: 520px; border: 1px solid #334155; }
        h2 { color: #38bdf8; font-size: 22px; margin-bottom: 20px; text-align: center; font-weight: 800; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 5px; color: #cbd5e1; }
        input { width: 100%; padding: 12px; border: 2px solid #334155; background: #0f172a; color: #fff; border-radius: 10px; font-size: 14px; outline: none; }
        input:focus { border-color: #38bdf8; }
        
        .capture-section {
            background: #0f172a;
            border: 2px dashed #475569;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 15px;
        }
        video, canvas {
            width: 100%;
            max-height: 180px;
            border-radius: 8px;
            background: #000;
            object-fit: cover;
            display: none;
            margin-top: 10px;
        }
        .snapshot-preview {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #38bdf8;
            display: none;
            margin: 10px auto 0;
        }
        .btn-cam {
            background: #0284c7;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            margin-top: 5px;
        }
        .gps-status { font-size: 12px; color: #34d399; margin-top: 5px; font-weight: bold; }
        .btn { width: 100%; padding: 14px; background: #10b981; color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; transition: 0.2s; }
        .btn:hover { background: #059669; }
        #successMsg { display: none; margin-top: 15px; padding: 12px; background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #10b981; border-radius: 10px; text-align: center; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🛡️ تسجيل موظف (نظام منع التكرار الذكي)</h2>
        
        <!-- حقل رمز الشركة (أصبح قابل للتعديل والكتابة بحرية) -->
        <div class="form-group">
            <label>رمز الشركة المرتبط (معرّف الشركة):</label>
            <input type="text" id="companyIdInput" placeholder="أدخل رمز الشركة هنا" style="color: #38bdf8; font-weight: bold;">
        </div>

        <div class="form-group">
            <label>الاسم الكامل (الثلاثي):</label>
            <input type="text" id="empName" placeholder="أدخل الاسم الكامل">
        </div>
        
        <div class="form-group">
            <label>البريد الإلكتروني:</label>
            <input type="email" id="empEmail" placeholder="name@company.com">
        </div>

        <div class="form-group">
            <label>العنوان الوظيفي ومكان العمل:</label>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="empSpecialty" placeholder="الاختصاص" style="flex:1;">
                <input type="text" id="empWorkplace" placeholder="مكان العمل" style="flex:1;">
            </div>
        </div>

        <div class="form-group">
            <label>اسم المستخدم وكلمة المرور:</label>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="empUsername" placeholder="اسم المستخدم" style="flex:1;">
                <input type="password" id="empPassword" placeholder="كلمة المرور" style="flex:1;">
            </div>
        </div>

        <div class="capture-section">
            <label style="margin-bottom: 8px;">بصمة الوجه والموقع الجغرافي (GPS):</label>
            <button type="button" class="btn-cam" onclick="startCamera()">📷 فتح الكاميرا للصورة</button>
            <video id="videoElement" autoplay playsinline></video>
            <button type="button" id="snapBtn" class="btn-cam" style="background: #10b981; display: none;" onclick="takeSnapshot()">📸 التقاط</button>
            <canvas id="canvasElement"></canvas>
            <img id="snapshotPreview" class="snapshot-preview" alt="صورة">
            <div id="gpsStatus" class="gps-status">📍 جاري رصد الـ GPS والمعرف الفريد للجهاز...</div>
        </div>

        <button class="btn" onclick="registerWithStrictValidation()">💾 حفظ نهائي ومزامنة مع النظام</button>
        <div id="successMsg">✅ تم التحقق والتسجيل بنجاح! جاري تحويلك...</div>
    </div>

    <script>
        let compressedPhotoData = "";
        let currentGPSLocation = "غير متوفر";
        let deviceUniqueId = "";

        function getOrCreateDeviceID() {
            let id = localStorage.getItem('system_device_fingerprint');
            if (!id) {
                id = 'DEV-' + Math.random().toString(36).substr(2, 9).toUpperCase() + '-' + Date.now();
                localStorage.setItem('system_device_fingerprint', id);
            }
            return id;
        }

        function startCamera() {
            const video = document.getElementById('videoElement');
            const snapBtn = document.getElementById('snapBtn');
            navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240, facingMode: 'user' }, audio: false })
                .then(stream => {
                    video.style.display = 'block';
                    video.srcObject = stream;
                    snapBtn.style.display = 'inline-block';
                })
                .catch(err => alert("⚠️ تعذر تشغيل الكاميرا."));
        }

        function takeSnapshot() {
            const video = document.getElementById('videoElement');
            const canvas = document.getElementById('canvasElement');
            const preview = document.getElementById('snapshotPreview');
            canvas.width = 150;
            canvas.height = 150;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, 150, 150);
            compressedPhotoData = canvas.toDataURL('image/jpeg', 0.7);
            preview.src = compressedPhotoData;
            preview.style.display = 'block';
            let stream = video.srcObject;
            if (stream) stream.getTracks().forEach(track => track.stop());
            video.style.display = 'none';
            document.getElementById('snapBtn').style.display = 'none';
        }

        window.onload = function() {
            deviceUniqueId = getOrCreateDeviceID();
            
            // جلب رمز الشركة ووضعه كقيمة افتراضية يمكن للمستخدم تعديلها متى شاء
            const urlParams = new URLSearchParams(window.location.search);
            let companyId = urlParams.get('company') || localStorage.getItem('activeCompanyId') || 'B-2060';
            document.getElementById('companyIdInput').value = companyId;

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => { currentGPSLocation = `${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}`; document.getElementById('gpsStatus').innerText = `📍 الجهاز محمي والموقع جاهز.`; },
                    (err) => { currentGPSLocation = "33.3152, 44.3661 (بغداد افتراضي)"; document.getElementById('gpsStatus').innerText = `📍 المعرف الفريد جاهز وموقع افتراضي نشط.`; },
                    { timeout: 5000 }
                );
            }
        };

        function registerWithStrictValidation() {
            const companyId = document.getElementById('companyIdInput').value.trim();
            const name = document.getElementById('empName').value.trim();
            const email = document.getElementById('empEmail').value.trim();
            const specialty = document.getElementById('empSpecialty').value.trim();
            const workplace = document.getElementById('empWorkplace').value.trim();
            const username = document.getElementById('empUsername').value.trim();
            const password = document.getElementById('empPassword').value.trim();

            if (!companyId) {
                alert("⚠️ يرجى كتابة رمز الشركة بدقة.");
                return;
            }

            if (!name || !email || !specialty || !workplace || !username || !password) {
                alert("⚠️ يرجى تعبئة كافة الحقول المطلوبة بدقة.");
                return;
            }

            if (!compressedPhotoData) {
                alert("⚠️ يرجى التقاط صورة الوجه أولاً.");
                return;
            }

            // تحديث التخزين المؤقت بالرمز الجديد الذي أدخله المستخدم
            localStorage.setItem('activeCompanyId', companyId);
            const storageKey = `company_employees_${companyId}`;
            let employees = JSON.parse(localStorage.getItem(storageKey)) || [];

            // 1. فحص تكرار المعرف الفريد للجهاز
            const deviceExists = employees.some(emp => emp.deviceId === deviceUniqueId);
            if (deviceExists) {
                alert("❌ عذراً، هذا الهاتف مسجل مسبقاً في النظام لهذه الشركة ولا يمكن تسجيل موظف آخر بنفس الجهاز.");
                return;
            }

            // 2. فحص تكرار البريد أو اسم المستخدم
            const conflictExists = employees.some(emp => emp.email === email || emp.username === username || emp.name === name);
            if (conflictExists) {
                alert("❌ خطأ: اسم المستخدم، البريد الإلكتروني، أو الاسم الكامل موجود مسبقاً في قاعدة بيانات هذه الشركة!");
                return;
            }

            const newEmp = {
                deviceId: deviceUniqueId,
                name: name,
                email: email,
                specialty: specialty,
                workplace: workplace,
                username: username,
                password: password,
                location: currentGPSLocation,
                startDate: new Date().toLocaleString('ar-EG'),
                photo: compressedPhotoData,
                companyId: companyId
            };

            employees.unshift(newEmp);
            localStorage.setItem(storageKey, JSON.stringify(employees));
            localStorage.setItem('company_employees', JSON.stringify(employees));
            localStorage.setItem(`active_session_${username}`, JSON.stringify(newEmp));

            document.getElementById('successMsg').style.display = 'block';

            setTimeout(() => {
                window.location.href = `login.html?company=${companyId}`;
            }, 1200);
        }
    </script>
</body>
</html>

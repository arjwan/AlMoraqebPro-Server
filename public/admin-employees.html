<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المراقب برو - إدارة ومتابعة موظفي الشركة</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        /* خلفية مشرق ومريحة للعين بدلاً من الأسود الداكن */
        body { background: #e2e8f0; color: #0f172a; min-height: 100vh; padding: 20px; font-size: 15px; }
        
        .main-container {
            width: 100%; max-width: 1650px; margin: 0 auto; background: #ffffff;
            border-radius: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); padding: 25px;
            border: 1px solid #cbd5e1;
        }

        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 15px; margin-bottom: 20px; padding-bottom: 15px;
            border-bottom: 2px solid #e2e8f0;
        }
        .title-area { display: flex; align-items: center; gap: 12px; }
        .title-area h2 { font-size: 24px; font-weight: 900; color: #0f172a; }
        
        .server-status-indicator {
            display: inline-flex; align-items: center; gap: 8px; background: #f1f5f9;
            padding: 8px 16px; border-radius: 20px; border: 1px solid #94a3b8; font-size: 13px; font-weight: bold;
        }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: #10b981; }

        .top-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        
        .btn {
            padding: 10px 18px; border-radius: 10px; font-weight: bold; cursor: pointer;
            border: none; font-size: 14px; display: inline-flex; align-items: center; gap: 6px;
            transition: all 0.2s;
        }
        .btn-primary { background: #0284c7; color: white; }
        .btn-success { background: #10b981; color: white; }
        .btn-dark { background: #334155; color: white; }
        .btn-danger { background: #ef4444; color: white; }
        .btn:active { transform: scale(0.97); }

        /* شريط البحث الكبير والواضح في أقصى اليمين */
        .filter-section {
            display: grid; grid-template-columns: 2.8fr 1.2fr 1.1fr 1.1fr auto; gap: 12px;
            margin-bottom: 20px; background: #f8fafc; padding: 15px; border-radius: 14px;
            border: 1px solid #cbd5e1; align-items: center;
        }
        
        .company-badge-box {
            background: #1e293b; color: #38bdf8; padding: 12px 16px; border-radius: 10px;
            font-size: 15px; font-weight: bold; display: flex; align-items: center; justify-content: space-between;
            border: 1px solid #475569;
        }

        input, select {
            width: 100%; padding: 12px 16px; border: 2px solid #94a3b8; border-radius: 10px;
            font-size: 15px; outline: none; background: #fff; color: #0f172a; font-weight: 600;
        }
        input:focus, select:focus { border-color: #0284c7; }

        /* الجدول بنصوص مكبرة ومريحة */
        .table-responsive { width: 100%; overflow-x: auto; border-radius: 12px; border: 1px solid #cbd5e1; }
        table { width: 100%; border-collapse: collapse; text-align: right; background: #ffffff; white-space: nowrap; }
        th { background: #1e293b; color: #ffffff; padding: 14px 12px; font-size: 14px; font-weight: 800; }
        td { padding: 12px; border-bottom: 1px solid #e2e8f0; font-size: 15px; color: #1e293b; font-weight: 600; }
        tr:hover { background: #f1f5f9; }

        .emp-img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; border: 2px solid #0284c7; }
        .badge { padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: bold; display: inline-block; }
        .bg-green { background: #dcfce7; color: #166534; }

        @media print {
            body { background: white; padding: 0; }
            .main-container { box-shadow: none; border: none; padding: 0; max-width: 100%; }
            .top-actions, .filter-section, .no-print { display: none !important; }
            @page { size: landscape; margin: 5mm; }
            table { font-size: 12px; }
            th { background: #000 !important; color: #fff !important; }
        }
    </style>
</head>
<body>

<div class="main-container">
    
    <div class="top-bar">
        <div class="title-area">
            <span style="font-size: 26px;">👥</span>
            <h2>إدارة ومتابعة موظفي الشركة</h2>
        </div>
        
        <div class="server-status-indicator">
            <span class="dot"></span>
            <span>متصل بقاعدة البيانات المحلية (نشط) 🟢</span>
        </div>

        <div class="top-actions">
            <button class="btn btn-dark" onclick="goBackDashboard()">⬅ العودة</button>
            <button class="btn btn-success" onclick="syncData()">🔄 مزامنة</button>
            <select id="printScope" style="width: auto; padding: 9px; font-weight: bold;" class="btn-primary">
                <option value="all">🖨️ طباعة للكل (أفقي)</option>
                <option value="branch">🖨️ طباعة للفرع</option>
                <option value="individual">🖨️ طباعة لفرد</option>
            </select>
            <button class="btn btn-primary" onclick="window.print()">🖨️ طباعة</button>
        </div>
    </div>

    <!-- مربع البحث الواسع في اليمين، يليه معلومات الشركة والفروع -->
    <div class="filter-section">
        <input type="text" id="searchInput" placeholder="🔍 بحث شامل (ابحث بالاسم، الاختصاص، اسم المستخدم، أو موقع العمل)..." onkeyup="filterTable()" style="font-size: 15px; font-weight: bold; border-color: #0284c7;">
        
        <div class="company-badge-box">
            <span>🏢 الشركة: <strong style="color: #fff;">المراقب برو</strong></span>
            <span style="background: #0284c7; padding: 3px 8px; border-radius: 6px; font-size: 13px;">B-2070</span>
        </div>

        <select id="filterBranch" onchange="filterTable()">
            <option value="">🏢 كل الفروع</option>
            <option value="الفرع الرئيسي">الفرع الرئيسي</option>
            <option value="الفرع الشمالي">الفرع الشمالي</option>
        </select>

        <select id="filterShift" onchange="filterTable()">
            <option value="">⏰ كل الشفتات</option>
            <option value="صباحي">صباحي</option>
            <option value="مسائي">مسائي</option>
        </select>

        <button class="btn btn-primary" onclick="addNewEmployeeModal()">➕ إضافة موظف</button>
    </div>

    <div class="table-responsive">
        <table id="employeesTable">
            <thead>
                <tr>
                    <th style="width: 55px; text-align: center;">تسلسل</th>
                    <th>صورة</th>
                    <th style="min-width: 170px;">اسم الموظف</th>
                    <th>الاختصاص</th>
                    <th>موقع العمل</th>
                    <th>اسم المستخدم</th>
                    <th>الموقع (GPS)</th>
                    <th>الراتب</th>
                    <th>الشفت</th>
                    <th>ساعات</th>
                    <th>التقييم</th>
                    <th>الإجازات (المدة والتاريخ)</th>
                    <th>الغيابات (المدة والتاريخ)</th>
                    <th>بداية التسجيل</th>
                    <th class="no-print">الإجراءات</th>
                </tr>
            </thead>
            <tbody id="employeeTableBody">
                <!-- تعبئة ديناميكية -->
            </tbody>
        </table>
    </div>

</div>

<script>
    window.onload = function() {
        renderTableData();
    };

    function syncData() {
        renderTableData();
        alert("🔄 تمت مزامنة وجلب أحدث بيانات الموظفين بنجاح!");
    }

    function renderTableData() {
        let tbody = document.getElementById('employeeTableBody');
        tbody.innerHTML = "";

        let employees = JSON.parse(localStorage.getItem('company_employees_registry') || '[]');

        if (employees.length === 0) {
            employees = [{
                img: "https://via.placeholder.com/44",
                fullName: "محمد العبيدي",
                specialty: "مطور أنظمة",
                location: "الفرع الرئيسي",
                username: "mohmmedali",
                gps: "33.3661, 44.3152",
                salary: "1,200,000 د.ع",
                shift: "صباحي",
                hours: "8 س",
                evaluation: "ممتاز ⭐",
                leave: "3 أيام (10/08 - 13/08)",
                absence: "يوم واحد (01/08)",
                startDate: "2026-06-01"
            }];
            localStorage.setItem('company_employees_registry', JSON.stringify(employees));
        }

        employees.forEach((emp, index) => {
            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="text-align: center; font-weight: bold; color: #0284c7; font-size: 16px;">#${index + 1}</td>
                <td><img src="${emp.img}" class="emp-img" alt="صورة"></td>
                <td style="font-size: 16px; font-weight: 900; color: #0f172a;">${emp.fullName}</td>
                <td style="font-size: 15px;">${emp.specialty}</td>
                <td style="font-size: 15px;">${emp.location}</td>
                <td><span style="color:#0284c7; font-size: 15px;">${emp.username}</span></td>
                <td><a href="https://maps.google.com/?q=${emp.gps}" target="_blank" style="color:#0284c7; font-size: 15px;">📍 إحداثي</a></td>
                <td><b style="color:#166534; font-size: 15px;">${emp.salary}</b></td>
                <td><span class="badge bg-green">${emp.shift}</span></td>
                <td style="font-size: 15px;">${emp.hours}</td>
                <td><span class="badge bg-green">${emp.evaluation}</span></td>
                <td style="font-size: 14px;"><b>${emp.leave}</b></td>
                <td style="font-size: 14px;"><b>${emp.absence}</b></td>
                <td style="font-size: 14px;">${emp.startDate}</td>
                <td class="no-print">
                    <button class="btn btn-primary" style="padding: 6px 12px; font-size: 13px;" onclick="editEmp(${index})">تعديل</button>
                    <button class="btn btn-danger" style="padding: 6px 12px; font-size: 13px;" onclick="deleteEmp(${index})">حذف</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function addNewEmployeeModal() {
        let name = prompt("أدخل الاسم الكامل للموظف الجديد:");
        if(!name) return;
        let specialty = prompt("أدخل الاختصاص:", "ممرض / إداري");
        
        let employees = JSON.parse(localStorage.getItem('company_employees_registry') || '[]');
        employees.push({
            img: "https://via.placeholder.com/44",
            fullName: name,
            specialty: specialty || "موظف",
            location: "الفرع الرئيسي",
            username: name.toLowerCase().replace(/\s+/g, '_'),
            gps: "33.3661, 44.3152",
            salary: "1,000,000 د.ع",
            shift: "صباحي",
            hours: "8 س",
            evaluation: "ممتاز ⭐",
            leave: "لا توجد",
            absence: "لا توجد",
            startDate: new Date().toISOString().split('T')[0]
        });

        localStorage.setItem('company_employees_registry', JSON.stringify(employees));
        renderTableData();
        alert("✅ تمت إضافة الموظف بنجاح!");
    }

    function deleteEmp(index) {
        if(confirm("هل أنت متأكد من حذف هذا السجل نهائياً؟")) {
            let employees = JSON.parse(localStorage.getItem('company_employees_registry') || '[]');
            employees.splice(index, 1);
            localStorage.setItem('company_employees_registry', JSON.stringify(employees));
            renderTableData();
        }
    }

    function editEmp(index) {
        alert("📝 جاري فتح نافذة تعديل بيانات الموظف...");
    }

    function filterTable() {
        let input = document.getElementById("searchInput").value.toLowerCase();
        let branchFilter = document.getElementById("filterBranch").value;
        let shiftFilter = document.getElementById("filterShift").value;
        
        let tr = document.getElementById("employeesTable").getElementsByTagName("tr");

        for (let i = 1; i < tr.length; i++) {
            let tdText = tr[i].textContent || tr[i].innerText;
            let matchSearch = tdText.toLowerCase().indexOf(input) > -1;
            let matchBranch = branchFilter === "" || tdText.includes(branchFilter);
            let matchShift = shiftFilter === "" || tdText.includes(shiftFilter);

            if (matchSearch && matchBranch && matchShift) {
                tr[i].style.display = "";
            } else {
                tr[i].style.display = "none";
            }
        }
    }

    function goBackDashboard() {
        window.location.href = "services.html";
    }
</script>

</body>
</html>

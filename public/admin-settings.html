<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المراقب برو - إعدادات النظام وتجربة المستخدم</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #1e1b4b 0%, #31103f 50%, #0f0c1b 100%);
            --container-bg: #fff;
            --text-color: #1e293b;
            --card-bg: #f8fafc;
            --border-color: #e2e8f0;
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --header-border: #f1f5f9;
        }

        /* الوضع الليلي */
        body.dark-mode {
            --bg-gradient: linear-gradient(135deg, #09090b 0%, #18181b 50%, #030712 100%);
            --container-bg: #121214;
            --text-color: #f4f4f5;
            --card-bg: #1a1a1e;
            --border-color: #27272a;
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --header-border: #27272a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: var(--base-font-size, 16px); }
        body { background: var(--bg-gradient); color: var(--text-color); min-height: 100vh; padding: 25px; transition: 0.3s ease; }
        .container { max-width: 1200px; margin: 0 auto; background: var(--container-bg); padding: 35px; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); transition: 0.3s ease; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--header-border); padding-bottom: 15px; margin-bottom: 30px; }
        h2 { color: var(--primary-color); font-size: 1.5rem; font-weight: 800; }
        .back-btn { background: var(--card-bg); color: var(--primary-color); padding: 10px 20px; border-radius: 10px; text-decoration: none; font-weight: bold; border: 1px solid var(--border-color); transition: 0.2s; }
        .back-btn:hover { background: var(--primary-color); color: #fff; }
        
        .settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 25px; }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 15px; padding: 25px; transition: 0.3s; }
        .card:hover { box-shadow: 0 10px 25px rgba(79, 70, 229, 0.1); border-color: var(--primary-color); }
        .card h3 { color: var(--text-color); font-size: 1.15rem; margin-bottom: 15px; border-bottom: 2px solid var(--border-color); padding-bottom: 8px; display: flex; align-items: center; gap: 10px; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.9rem; font-weight: bold; color: var(--text-color); margin-bottom: 6px; }
        .form-control { width: 100%; padding: 10px 15px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 0.95rem; background: var(--container-bg); color: var(--text-color); transition: 0.2s; }
        .form-control:focus { border-color: var(--primary-color); outline: none; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
        
        .checkbox-group { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
        .checkbox-group input { width: 18px; height: 18px; accent-color: var(--primary-color); cursor: pointer; }
        .checkbox-group label { margin-bottom: 0; cursor: pointer; color: var(--text-color); font-weight: 600; font-size: 0.9rem; }

        .btn-save { background: var(--primary-color); color: #fff; border: none; padding: 12px 25px; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; width: 100%; margin-top: 25px; transition: 0.2s; }
        .btn-save:hover { background: var(--primary-hover); box-shadow: 0 5px 15px rgba(79, 70, 229, 0.3); }
        .alert-msg { margin-top: 15px; padding: 12px; border-radius: 8px; font-size: 0.9rem; font-weight: bold; text-align: center; display: none; }
        
        .help-box { background: rgba(79, 70, 229, 0.05); border: 1px dashed var(--primary-color); padding: 15px; border-radius: 10px; margin-top: 10px; text-align: center; }
        .help-box p { font-size: 0.9rem; margin-bottom: 10px; }
        .help-btn { background: #10b981; color: #fff; border: none; padding: 8px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; }
        .help-btn:hover { background: #059669; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>⚙️ لوحة إعدادات النظام وتجربة المستخدم</h2>
            <a href="admin.html" class="back-btn">← العودة للوحة التحكم</a>
        </div>

        <form id="settingsForm" onsubmit="saveSettings(event)">
            <div class="settings-grid">
                
                <!-- إعدادات تجربة المستخدم والمظهر -->
                <div class="card">
                    <h3>🎨 إعدادات المظهر وإمكانية الوصول</h3>
                    <div class="form-group">
                        <label>لغة النظام (System Language)</label>
                        <select id="sysLanguage" class="form-control">
                            <option value="ar" selected>العربية (Arabic)</option>
                            <option value="en">الإنجليزية (English)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>مظهر الواجهة (Theme Mode)</label>
                        <select id="themeMode" class="form-control" onchange="previewTheme(this.value)">
                            <option value="light">وضع نهاري (Light Mode)</option>
                            <option value="dark">وضع ليلي (Dark Mode)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>حجم الخط (Font Scaling)</label>
                        <select id="fontSize" class="form-control" onchange="previewFontSize(this.value)">
                            <option value="14px">صغير (Compact)</option>
                            <option value="16px" selected>عادي (Standard)</option>
                            <option value="18px">كبير (Large)</option>
                            <option value="20px">كبير جداً (Extra Large)</option>
                        </select>
                    </div>
                </div>

                <!-- إعدادات الأمان والجلسات -->
                <div class="card">
                    <h3>🔒 أمان النظام والجلسات</h3>
                    <div class="form-group">
                        <label>مدة صلاحية الجلسة (بالدقائق)</label>
                        <input type="number" id="sessionTimeout" class="form-control" value="30" min="5" max="1440">
                    </div>
                    <div class="form-group">
                        <label>الحد الأقصى لمحاولات تسجيل الدخول الفاشلة</label>
                        <input type="number" id="maxLoginAttempts" class="form-control" value="3" min="1" max="10">
                    </div>
                    <div class="checkbox-group">
                        <input type="checkbox" id="forceHttps" checked>
                        <label for="forceHttps">إجبار الاتصال الآمن (HTTPS / SSL)</label>
                    </div>
                </div>

                <!-- إعدادات التنبيهات والدعم الفني -->
                <div class="card">
                    <h3>🚨 الرقابة والدعم الفني</h3>
                    <div class="checkbox-group">
                        <input type="checkbox" id="alertOnDelete" checked>
                        <label for="alertOnDelete">إرسال تنبيه عاجل عند حذف أي سجل حساس</label>
                    </div>
                    
                    <div class="form-group" style="margin-top: 15px;">
                        <label>بريد الدعم الفني أو مدير النظام</label>
                        <input type="email" id="adminEmail" class="form-control" value="admin@albaghdadi.com">
                    </div>

                    <div class="help-box">
                        <p>هل تواجه مشكلة تقنية أو تحتاج مساعدة استشارية؟</p>
                        <a href="mailto:support@albaghdadi.com" class="help-btn">💬 طلب المساعدة الفورية</a>
                    </div>
                </div>

            </div>

            <button type="submit" class="btn-save">💾 حفظ وتطبيق الإعدادات المتقدمة</button>
            <div id="alertBox" class="alert-msg"></div>
        </form>
    </div>

    <script>
        // المعاينة الحية للوضع الليلي والنهاري
        function previewTheme(mode) {
            if (mode === 'dark') {
                document.body.classList.add('dark-mode');
            } else {
                document.body.classList.remove('dark-mode');
            }
            localStorage.setItem('almoraqeb_theme', mode);
        }

        // المعاينة الحية لحجم الخط
        function previewFontSize(size) {
            document.documentElement.style.setProperty('--base-font-size', size);
            localStorage.setItem('almoraqeb_fontsize', size);
        }

        // تطبيق الإعدادات المخزنة محلياً عند فتح الصفحة
        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('almoraqeb_theme') || 'light';
            const savedFont = localStorage.getItem('almoraqeb_fontsize') || '16px';
            
            document.getElementById('themeMode').value = savedTheme;
            document.getElementById('fontSize').value = savedFont;
            
            previewTheme(savedTheme);
            previewFontSize(savedFont);
        });

        async function saveSettings(e) {
            e.preventDefault();
            const settingsData = {
                sysLanguage: document.getElementById('sysLanguage').value,
                themeMode: document.getElementById('themeMode').value,
                fontSize: document.getElementById('fontSize').value,
                sessionTimeout: document.getElementById('sessionTimeout').value,
                maxLoginAttempts: document.getElementById('maxLoginAttempts').value,
                forceHttps: document.getElementById('forceHttps').checked,
                alertOnDelete: document.getElementById('alertOnDelete').checked,
                adminEmail: document.getElementById('adminEmail').value
            };

            try {
                const response = await fetch('/api/system/settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(settingsData)
                });
                const result = await response.json();
                
                const alertBox = document.getElementById('alertBox');
                alertBox.style.display = 'block';
                if(result.success) {
                    alertBox.style.background = '#dcfce7';
                    alertBox.style.color = '#166534';
                    alertBox.innerText = '✅ تم حفظ وتطبيق الإعدادات بنجاح على السيرفر وفي المتصفح!';
                } else {
                    throw new Error(result.error || 'حدث خطأ غير معروف');
                }
            } catch (err) {
                const alertBox = document.getElementById('alertBox');
                alertBox.style.display = 'block';
                alertBox.style.background = '#fee2e2';
                alertBox.style.color = '#991b1b';
                alertBox.innerText = '❌ فشل حفظ الإعدادات: ' + err.message;
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المراقب برو - إدارة وعرض موظفي الشركة</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #2e1a47 0%, #1f1135 50%, #100820 100%);
            color: #1e293b;
            min-height: 100vh;
            padding: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main-card {
            width: 100%;
            max-width: 1600px;
            background: #ffffff;
            padding: 45px;
            border-radius: 28px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 20px;
        }

        h2 {
            font-size: 28px;
            font-weight: 800;
            color: #0284c7;
        }

        .company-badge {
            background: #e0f2fe;
            color: #0369a1;
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            margin-top: 5px;
            display: inline-block;
        }

        .back-btn {
            background: #f1f5f9;
            color: #0284c7;
            padding: 12px 24px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            border: 1px solid #cbd5e1;
            transition: 0.2s;
        }

        .back-btn:hover {
            background: #0284c7;
            color: #fff;
        }

        .actions-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            gap: 15px;
            flex-wrap: wrap;
        }

        .search-box-wrapper {
            display: flex;
            gap: 10px;
            flex: 1;
            max-width: 500px;
        }

        .search-box {
            flex: 1;
            padding: 14px 18px;
            font-size: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 14px;
            background: #f8fafc;
            outline: none;
        }

        .search-box:focus {
            border-color: #0284c7;
            background: #fff;
            box-shadow: 0 0 10px rgba(2, 132, 199, 0.2);
        }

        .btn-search {
            background: #0284c7;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-search:hover {
            background: #0369a1;
        }

        .action-btns {
            display: flex;
            gap: 12px;
        }

        .btn-print {
            background: #0284c7;
            color: white;
            border: none;
            padding: 14px 22px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-print:hover {
            background: #0369a1;
        }

        .btn-delete-all {
            background: #ef4444;
            color: white;
            border: none;
            padding: 14px 22px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-delete-all:hover {
            background: #dc2626;
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #f8fafc;
            white-space: nowrap;
        }

        th, td {
            padding: 16px;
            text-align: center;
            font-size: 15px;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background: #e0f2fe;
            color: #0369a1;
            font-weight: 800;
        }

        td img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #0284c7;
        }

        .btn-delete {
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .btn-delete:hover {
            background: #dc2626;
        }

        @media print {
            body {
                background: white;
                padding: 0;
            }
            .main-card {
                box-shadow: none;
                padding: 0;
                max-width: 100%;
            }
            .top-nav, .actions-bar, .btn-delete {
                display: none !important;
            }
            table {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="top-nav">
            <div>
                <h2>👥 قائمة وإدارة موظفي الشركة</h2>
                <div id="companyIndicator" class="company-badge">جاري تحميل بيانات الشركة النشطة...</div>
            </div>
            <a href="admin.html" class="back-btn">← العودة لوحة التحكم</a>
        </div>

        <div class="actions-bar">
            <div class="search-box-wrapper">
                <input type="text" id="searchInput" class="search-box" placeholder="🔍 بحث عن اسم الموظف، الاختصاص، أو مكان العمل..." onkeyup="filterEmployees()">
                <button class="btn-search" onclick="filterEmployees()">بحث</button>
            </div>
            
            <div class="action-btns">
                <button class="btn-print" onclick="window.print()">🖨️ طباعة التقرير</button>
                <button class="btn-delete-all" onclick="deleteAllEmployees()">🗑️ تصفية جدول الشركة</button>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>الصورة</th>
                        <th>الاسم الكامل</th>
                        <th>العنوان الوظيفي</th>
                        <th>مكان العمل</th>
                        <th>الراتب الاسمي</th>
                        <th>العنوان (محافظة / مدينة / حي / محلة / زقاق / دار)</th>
                        <th>الإجراءات</th>
                    </tr>
                </thead>
                <tbody id="employeesTableBody">
                    <!-- يتم تعبئتها ديناميكياً من قاعدة بيانات الشركة المستقلة -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // دالة تحديد مفتاح قاعدة البيانات للشركة النشطة حالياً
        function getActiveCompanyDbKey() {
            const activeId = localStorage.getItem('activeCompanyId');
            if (activeId) {
                return `company_employees_${activeId}`;
            }
            // مفتاح احتياطي افتراضي في حال لم يتم تحديد شركة نشطة بعد
            return 'employeesList';
        }

        function loadEmployees(data = null) {
            const tableBody = document.getElementById('employeesTableBody');
            const indicator = document.getElementById('companyIndicator');
            
            const activeId = localStorage.getItem('activeCompanyId') || 'افتراضية عامة';
            indicator.textContent = `قاعدة البيانات النشطة للشركة المعرّفة: [ ${activeId} ]`;

            const dbKey = getActiveCompanyDbKey();
            const employees = data || JSON.parse(localStorage.getItem(dbKey)) || [];
            
            tableBody.innerHTML = '';
            
            if (employees.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="7" style="color: #64748b; padding: 30px; font-size: 17px;">لا يوجد موظفون مسجلون حالياً في قاعدة بيانات هذه الشركة</td></tr>`;
                return;
            }

            employees.forEach((emp, index) => {
                const fullAddress = `${emp.province || '-'} / ${emp.city || '-'} / ${emp.district || '-'} / محلة ${emp.mahalla || '-'} / زقاق ${emp.alley || '-'} / دار ${emp.houseNo || '-'}`;
                
                tableBody.innerHTML += `
                    <tr>
                        <td><img src="${emp.photo || 'https://via.placeholder.com/50'}" alt="صورة"></td>
                        <td><b>${emp.name || '-'}</b></td>
                        <td>${emp.specialty || '-'}</td>
                        <td>${emp.workplace || '-'}</td>
                        <td style="color: #0d9488; font-weight: 800;">${emp.salary || '0'} د.ع</td>
                        <td>${fullAddress}</td>
                        <td><button class="btn-delete" onclick="deleteEmployee(${index})">حذف</button></td>
                    </tr>
                `;
            });
        }

        function filterEmployees() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const dbKey = getActiveCompanyDbKey();
            const employees = JSON.parse(localStorage.getItem(dbKey)) || [];
            
            if (!query) {
                loadEmployees(employees);
                return;
            }

            const filtered = employees.filter(emp => 
                (emp.name && emp.name.toLowerCase().includes(query)) || 
                (emp.specialty && emp.specialty.toLowerCase().includes(query)) ||
                (emp.workplace && emp.workplace.toLowerCase().includes(query)) ||
                (emp.province && emp.province.toLowerCase().includes(query))
            );
            loadEmployees(filtered);
        }

        function deleteEmployee(index) {
            if (confirm('هل أنت متأكد من حذف هذا الموظف من قاعدة بيانات الشركة؟')) {
                const dbKey = getActiveCompanyDbKey();
                let employees = JSON.parse(localStorage.getItem(dbKey)) || [];
                employees.splice(index, 1);
                localStorage.setItem(dbKey, JSON.stringify(employees));
                filterEmployees();
            }
        }

        function deleteAllEmployees() {
            if (confirm('⚠️ تحذير: هل أنت متأكد من تفريغ وحذف كافة موظفي هذه الشركة نهائياً من قاعدة بياناتها؟')) {
                const dbKey = getActiveCompanyDbKey();
                localStorage.removeItem(dbKey);
                loadEmployees();
            }
        }

        window.onload = () => loadEmployees();
    </script>
</body>
</html>

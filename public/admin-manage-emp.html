<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المراقب برو - إدارة وعرض موظفي الشركة</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #2e1a47 0%, #1f1135 50%, #100820 100%);
            color: #1e293b;
            min-height: 100vh;
            padding: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main-card {
            width: 100%;
            max-width: 1300px;
            background: #ffffff;
            padding: 35px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 15px;
            flex-wrap: wrap;
            gap: 15px;
        }

        h2 {
            font-size: 26px;
            font-weight: 800;
            color: #0284c7;
        }

        .badge-company {
            background: #e0f2fe;
            color: #0369a1;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
        }

        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .actions-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .search-box {
            display: flex;
            gap: 8px;
            flex: 1;
            max-width: 400px;
        }

        .search-box input {
            flex: 1;
            padding: 10px 14px;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
        }

        .search-box input:focus {
            border-color: #0284c7;
        }

        .btn {
            background: #0284c7;
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-secondary {
            background: #475569;
        }

        .btn-print {
            background: #0d9488;
        }

        .btn-danger {
            background: #ef4444;
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 8px;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #f8fafc;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }

        th, td {
            padding: 14px;
            text-align: center;
            font-size: 14px;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background: #f1f5f9;
            color: #334155;
            font-weight: 700;
        }

        td img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #0284c7;
        }

        @media print {
            body { background: #fff; padding: 0; }
            .main-card { box-shadow: none; padding: 0; max-width: 100%; }
            .top-nav, .controls-bar, th:last-child, td:last-child { display: none; }
        }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="top-nav">
            <h2>👥 قائمة وإدارة موظفي الشركة</h2>
            <div id="companyBadge" class="badge-company">قاعدة البيانات للشركة المعزولة: جاري التحميل...</div>
        </div>

        <div class="controls-bar">
            <div class="actions-group">
                <!-- زر العودة الموجه للصفحة الرئيسية أو لوحة التحكم المتاحة لديك -->
                <button class="btn btn-secondary" onclick="goBackDashboard()">← العودة لوحة التحكم</button>
                <!-- زر الطباعة -->
                <button class="btn btn-print" onclick="window.print()">🖨️ طباعة التقرير</button>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="بحث عن اسم الموظف، الاختصاص، أو مكان العمل..." onkeyup="filterEmployees()">
                <button class="btn" onclick="filterEmployees()">بحث</button>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>الصورة</th>
                    <th>الاسم الكامل</th>
                    <th>العنوان الوظيفي</th>
                    <th>مكان العمل</th>
                    <th>اسم المستخدم</th>
                    <th>الموقع (الإحداثيات)</th>
                    <th>تاريخ التسجيل</th>
                    <th>الإجراءات</th>
                </tr>
            </thead>
            <tbody id="employeesTableBody">
                <!-- تعبئة تلقائية -->
            </tbody>
        </table>
    </div>

    <script>
        let allCompanyEmployees = [];
        let currentCompanyId = '';

        function loadEmployees() {
            const urlParams = new URLSearchParams(window.location.search);
            currentCompanyId = urlParams.get('company');

            if (!currentCompanyId) {
                currentCompanyId = localStorage.getItem('activeCompanyId') || 'B-2060';
            }

            document.getElementById('companyBadge').innerText = `قاعدة البيانات للشركة المعزولة: [ ${currentCompanyId} ]`;

            const possibleKeys = [
                `company_employees_${currentCompanyId}`,
                `employees_${currentCompanyId}`,
                'company_employees',
                'employees'
            ];

            allCompanyEmployees = [];
            for (let key of possibleKeys) {
                const data = localStorage.getItem(key);
                if (data) {
                    try {
                        const parsed = JSON.parse(data);
                        if (Array.isArray(parsed) && parsed.length > 0) {
                            const filtered = parsed.filter(emp => !emp.companyId || emp.companyId === currentCompanyId);
                            if (filtered.length > 0) {
                                allCompanyEmployees = filtered;
                                break;
                            }
                        }
                    } catch(e) {}
                }
            }

            renderTable(allCompanyEmployees);
        }

        function renderTable(employees) {
            const tbody = document.getElementById('employeesTableBody');
            tbody.innerHTML = '';

            if (employees.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" style="color: #64748b; padding: 30px;">لا يوجد موظفون مسجلون حالياً في قاعدة بيانات هذه الشركة.</td></tr>`;
                return;
            }

            employees.forEach((emp) => {
                tbody.innerHTML += `
                    <tr>
                        <td><img src="${emp.photo || 'https://via.placeholder.com/40'}" alt="صورة"></td>
                        <td><b>${emp.name || emp.fullName || 'بدون اسم'}</b></td>
                        <td>${emp.specialty || '-'}</td>
                        <td>${emp.workplace || '-'}</td>
                        <td style="color: #0284c7; font-weight: bold;">${emp.username || '-'}</td>
                        <td style="font-size: 12px; color: #475569;">📍 ${emp.location || 'غير متوفر'}</td>
                        <td>${emp.startDate || new Date().toLocaleDateString()}</td>
                        <td><button class="btn btn-danger" onclick="deleteEmp('${emp.username}')">حذف</button></td>
                    </tr>
                `;
            });
        }

        function filterEmployees() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allCompanyEmployees.filter(emp => {
                const name = (emp.name || emp.fullName || '').toLowerCase();
                const specialty = (emp.specialty || '').toLowerCase();
                const workplace = (emp.workplace || '').toLowerCase();
                return name.includes(query) || specialty.includes(query) || workplace.includes(query);
            });
            renderTable(filtered);
        }

        function deleteEmp(username) {
            if (confirm('هل أنت متأكد من حذف هذا الموظف؟')) {
                allCompanyEmployees = allCompanyEmployees.filter(emp => emp.username !== username);
                const storageKey = `company_employees_${currentCompanyId}`;
                localStorage.setItem(storageKey, JSON.stringify(allCompanyEmployees));
                renderTable(allCompanyEmployees);
            }
        }

        // دالة ذكية للعودة إلى لوحة التحكم الرئيسية المتوفرة لديك لتجنب الصفحات الفارغة
        function goBackDashboard() {
            const possibleDashboards = ['admin-dashboard.html', 'dashboard.html', 'index.html', 'admin.html'];
            // يمكنك توجيهه مباشرة إلى الملف الرئيسي للوحة التحكم لديك
            window.location.href = 'admin-dashboard.html';
        }

        window.onload = loadEmployees;
    </script>
</body>
</html>

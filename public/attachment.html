<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المراقب برو - الحضور والانصراف</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .attendance-card { background: rgba(30, 41, 59, .95); border: 1px solid rgba(255,255,255,.15); padding: 30px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,.6); width: 100%; max-width: 480px; text-align: center; }
        .server-status { display: inline-flex; align-items: center; gap: 6px; background: rgba(16,185,129,.15); padding: 4px 12px; border-radius: 20px; font-size: 11px; color: #34d399; margin-bottom: 20px; border: 1px solid rgba(16,185,129,.3); }
        .status-dot { width: 7px; height: 7px; background: #34d399; border-radius: 50%; box-shadow: 0 0 6px #34d399; }
        h2 { font-size: 22px; margin-bottom: 6px; } .sub-info { font-size: 12px; color: #94a3b8; margin-bottom: 15px; }
        .clock-display { font-size: 32px; font-weight: 900; color: #38bdf8; background: rgba(15,23,42,.6); padding: 15px; border-radius: 16px; border: 2px solid rgba(56,189,248,.2); margin-bottom: 25px; }
        .action-btn { width: 100%; padding: 14px; border: none; border-radius: 14px; font-size: 14px; font-weight: bold; cursor: pointer; margin-bottom: 12px; color: white; }
        .btn-attendance { background: linear-gradient(135deg,#059669,#047857); } .btn-leave { background: linear-gradient(135deg,#dc2626,#b91c1c); } .btn-services { background: linear-gradient(135deg,#0284c7,#0369a1); }
        .location-status { font-size: 11px; color: #cbd5e1; margin-top: 15px; background: rgba(0,0,0,.3); padding: 10px; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="attendance-card">
        <div class="server-status"><div class="status-dot"></div><span id="serverStatusText">متصل بالسيرفر المركزي</span></div>
        <h2>⏱️ الحضور والانصراف</h2>
        <div class="sub-info" id="empDetails">جاري التحقق من الحساب...</div>
        <div class="clock-display" id="liveClock">00:00:00</div>
        <button type="button" class="action-btn btn-attendance" onclick="recordAttendance('attendance')">🟢 تسجيل الحضور عبر GPS</button>
        <button type="button" class="action-btn btn-leave" onclick="recordAttendance('departure')">🔴 تسجيل الانصراف عبر GPS</button>
        <button type="button" class="action-btn btn-services" onclick="window.location.href='services.html'">📁 الانتقال إلى صفحة الخدمات والطلبات</button>
        <div class="location-status" id="locStatusText">📍 جاري جلب الإحداثيات...</div>
    </div>
    <script>
        const SERVER_URL = window.location.origin;
        let cachedPosition = null;

        function updateClock() { document.getElementById('liveClock').innerText = new Date().toLocaleTimeString('en-US', { hour12: true }); }
        setInterval(updateClock, 1000); updateClock();

        window.addEventListener('DOMContentLoaded', () => {
            const employeeId = new URLSearchParams(window.location.search).get('employeeId') || localStorage.getItem('activeEmployeeId');
            if (!employeeId) { window.location.replace('index.html'); return; }
            document.getElementById('empDetails').innerText = `الموظف: ${localStorage.getItem('activeUser') || '--'} | الشركة: ${localStorage.getItem('activeCompanyId') || '--'}`;
            fetchRealGPS();
        });

        async function fetchRealGPS() {
            const locEl = document.getElementById('locStatusText');
            if (!navigator.geolocation) throw new Error('المتصفح لا يدعم تحديد الموقع الجغرافي');
            return new Promise((resolve, reject) => navigator.geolocation.getCurrentPosition(
                pos => {
                    cachedPosition = { lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy };
                    locEl.innerHTML = `📍 GPS متصل: ${cachedPosition.lat.toFixed(4)}، ${cachedPosition.lng.toFixed(4)} <br><span style="color:#34d399;">دقة الموقع: ${Math.round(cachedPosition.accuracy)} متر</span>`;
                    resolve(cachedPosition);
                },
                () => { locEl.innerText = '⚠️ فعّل خدمة GPS ثم حاول مرة أخرى.'; reject(new Error('تعذر جلب الموقع')); },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            ));
        }

        async function recordAttendance(type) {
            const employeeId = localStorage.getItem('activeEmployeeId');
            if (!employeeId) { window.location.replace('index.html'); return; }
            try {
                const position = await fetchRealGPS();
                const response = await fetch(`${SERVER_URL}/api/attendance`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ employeeId, latitude: position.lat, longitude: position.lng, timestamp: new Date().toISOString(), type })
                });
                const result = await response.json();
                if (!response.ok || !result.success) throw new Error(result.message || 'تعذر حفظ الحركة في السيرفر');
                alert(type === 'attendance' ? '✅ تم تسجيل الحضور في السيرفر.' : '✅ تم تسجيل الانصراف في السيرفر.');
            } catch (error) {
                alert(`⚠️ ${error.message}`);
            }
        }
    </script>
</body>
</html>

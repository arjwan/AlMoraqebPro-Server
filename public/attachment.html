<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المراقب برو - بوابة الحضور والانصراف</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .attendance-card { background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); padding: 30px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); width: 100%; max-width: 480px; text-align: center; position: relative; }
        .server-status { display: inline-flex; align-items: center; gap: 6px; background: rgba(16, 185, 129, 0.15); padding: 4px 12px; border-radius: 20px; font-size: 11px; color: #34d399; margin-bottom: 20px; border: 1px solid rgba(16, 185, 129, 0.3); }
        .status-dot { width: 7px; height: 7px; background: #34d399; border-radius: 50%; box-shadow: 0 0 6px #34d399; }
        h2 { font-size: 22px; margin-bottom: 6px; color: #f1f5f9; }
        .sub-info { font-size: 12px; color: #94a3b8; margin-bottom: 20px; }
        .clock-display { font-size: 32px; font-weight: 900; color: #38bdf8; background: rgba(15, 23, 42, 0.6); padding: 15px; border-radius: 16px; border: 2px solid rgba(56, 189, 248, 0.2); margin-bottom: 25px; letter-spacing: 2px; }
        
        .action-btn { width: 100%; padding: 14px; border: none; border-radius: 14px; font-size: 14px; font-weight: bold; cursor: pointer; margin-bottom: 12px; transition: all 0.3s; display: flex; justify-content: center; align-items: center; gap: 8px; color: white; }
        .btn-attendance { background: linear-gradient(135deg, #059669 0%, #047857 100%); }
        .btn-leave { background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%); }
        .btn-services { background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); }
        
        /* خيارات اختيار نوع البصمة */
        .biometric-selector { display: flex; gap: 10px; margin-bottom: 15px; }
        .bio-option { flex: 1; padding: 10px; background: #334155; border: 2px solid #475569; border-radius: 10px; color: white; font-size: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .bio-option.active { background: #0284c7; border-color: #38bdf8; }

        .location-status { font-size: 11px; color: #cbd5e1; margin-top: 15px; background: rgba(0,0,0,0.2); padding: 8px; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="attendance-card">
        <div class="server-status">
            <div class="status-dot"></div>
            <span id="serverStatusText">متصل بالسيرفر المركزي</span>
        </div>

        <h2>⏱️ بصمة الحضور والانصراف</h2>
        <div class="sub-info" id="empDetails">الموظف: جاري التحميل... | الشركة: --</div>

        <div class="clock-display" id="liveClock">00:00:00</div>

        <!-- اختيار طريقة البصمة المفضلة للموظف (وجه أو إصبع) -->
        <div style="text-align: right; font-size: 11px; margin-bottom: 5px; color: #94a3b8;">اختر طريقة التحقق الحيوي:</div>
        <div class="biometric-selector">
            <button type="button" id="btnFaceMode" class="bio-option active" onclick="setBioMode('face')">📷 بصمة الوجه</button>
            <button type="button" id="btnFingerMode" class="bio-option" onclick="setBioMode('fingerprint')">👆 بصمة الإصبع</button>
        </div>

        <button type="button" class="action-btn btn-attendance" onclick="processAttendanceAction('حضور')">
            🟢 تسجيل حضور (بالتحقق والموقع)
        </button>

        <button type="button" class="action-btn btn-leave" onclick="processAttendanceAction('انصراف')">
            🔴 تسجيل انصراف (بالتحقق والموقع)
        </button>

        <button type="button" class="action-btn btn-services" onclick="window.location.href='services.html'">
            📁 الانتقال إلى صفحة الخدمات والطلبات
        </button>

        <div class="location-status" id="locStatusText">📍 جاري تحديد الموقع الجغرافي (GPS)...</div>
    </div>

    <script>
        const SERVER_URL = "https://almoraqebpro-server.onrender.com";
        let currentBioMethod = "face"; // الافتراضي بصمة الوجه، ويمكن تحويله لإصبع

        // تحديث الساعة الحية
        function updateClock() {
            const now = new Date();
            document.getElementById('liveClock').innerText = now.toLocaleTimeString('en-US', { hour12: true });
        }
        setInterval(updateClock, 1000);
        updateClock();

        function setBioMode(mode) {
            currentBioMethod = mode;
            document.getElementById('btnFaceMode').classList.toggle('active', mode === 'face');
            document.getElementById('btnFingerMode').classList.toggle('active', mode === 'fingerprint');
        }

        // جلب الموقع الجغرافي الحالي للموظف
        async function getGPSLocation() {
            return new Promise((resolve, reject) => {
                if (!navigator.geolocation) {
                    reject("المتصفح لا يدعم تحديد الموقع الجغرافي");
                }
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        document.getElementById('locStatusText').innerText = `📍 الموقع دقيق: ${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}`;
                        resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude });
                    },
                    (err) => {
                        document.getElementById('locStatusText').innerText = "⚠️ تعذر جلب الموقع، يرجى تفعيل الـ GPS";
                        reject(err);
                    },
                    { enableHighAccuracy: true }
                );
            });
        }

        // تنفيذ التحقق الحيوي حسب اختيار المستخدم (وجه أو بصمة إصبع WebAuthn)
        async function verifyBiometric() {
            if (currentBioMethod === 'fingerprint') {
                try {
                    const challenge = new Uint8Array([21, 31, 105, 47, 11, 99]);
                    const publicKey = { challenge, timeout: 60000, userVerification: "required" };
                    const assertion = await navigator.credentials.get({ publicKey });
                    return assertion ? true : false;
                } catch (e) {
                    console.error("خطأ بصمة الإصبع:", e);
                    alert("⚠️ فشل التعرف على بصمة الإصبع أو تم إلغاؤها.");
                    return false;
                }
            } else {
                // محاكاة أو فتح نافذة التقاط بصمة الوجه المعمول بها
                return confirm("📷 يرجى توجيه الكاميرا لالتقاط بصمة الوجه وتحقيق المطابقة بنجاح؟");
            }
        }

        // العملية الرئيسية لتسجيل الحضور أو الانصراف وربطها بالسيرفر والسجلات
        async function processAttendanceAction(actionType) {
            try {
                alert(`⏳ جاري التحقق عبر (${currentBioMethod === 'face' ? 'بصمة الوجه' : 'بصمة الإصبع'})...`);
                
                // 1. التحقق الحيوي
                const isVerified = await verifyBiometric();
                if (!isVerified) {
                    alert("❌ فشل التحقق الحيوي، لم يتم تسجيل العملية.");
                    return;
                }

                // 2. جلب الموقع
                let location = { lat: 33.3152, lng: 44.3661 }; // قيمة افتراضية بغداد
                try {
                    location = await getGPSLocation();
                } catch (err) {
                    console.warn("الموقع غير متوفر تماماً، سيتم المتابعة بالإحداثيات المتاحة");
                }

                const recordData = {
                    companyId: localStorage.getItem('activeCompanyId') || "B-2070",
                    employeeUsername: localStorage.getItem('activeUser') || "mohmmedali",
                    type: actionType, // "حضور" أو "انصراف"
                    method: currentBioMethod, // "face" أو "fingerprint"
                    location: location,
                    timestamp: new Date().toISOString()
                };

                // 3. الإرسال للسيرفر أو الحفظ المحلي في السجلات المتعددة
                let response;
                try {
                    let res = await fetch(`${SERVER_URL}/api/attendance/log`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(recordData)
                    });
                    response = await res.json();
                } catch (netErr) {
                    response = { success: false, offline: true };
                }

                // حفظ في التخزين المحلي للسجلات (LocalStorage) لضمان عدم ضياعها
                let localRecords = JSON.parse(localStorage.getItem('system_attendance_logs') || '[]');
                localRecords.push(recordData);
                localStorage.setItem('system_attendance_logs', JSON.stringify(localRecords));

                alert(`✅ تم بنجاح تثبيت سجل (${actionType}) عبر (${currentBioMethod === 'face' ? 'الوجه' : 'الإصبع'}) والموقع الجغرافي وحفظه في السجلات!`);

            } catch (error) {
                console.error(error);
                alert("⚠️ حدث خطأ أثناء تنفيذ عملية التسجيل.");
            }
        }
    </script>
</body>
</html>

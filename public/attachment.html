<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>المراقب برو - تسجيل الحضور بالبصمة</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(160deg, #0f172a, #172554 55%, #0c4a6e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #f8fafc;
        }
        .card {
            width: 100%;
            max-width: 480px;
            background: rgba(30, 41, 59, 0.92);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            padding: 28px 22px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            top: -80px;
            left: -80px;
            width: 220px;
            height: 220px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.15), transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
            position: relative;
        }
        .brand {
            font-size: 20px;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .connection-badge {
            font-size: 11px;
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #34d399;
            padding: 5px 12px;
            border-radius: 999px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .connection-badge.offline {
            background: rgba(239, 68, 68, 0.12);
            border-color: rgba(239, 68, 68, 0.3);
            color: #f87171;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #34d399;
            box-shadow: 0 0 8px #34d399;
        }
        .connection-badge.offline .status-dot {
            background: #f87171;
            box-shadow: 0 0 8px #f87171;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 6px;
            color: #f1f5f9;
            text-align: center;
        }
        .sub-info {
            font-size: 12px;
            color: #94a3b8;
            text-align: center;
            margin-bottom: 22px;
            line-height: 1.6;
        }
        .clock {
            font-size: 36px;
            font-weight: 900;
            color: #38bdf8;
            background: rgba(15, 23, 42, 0.7);
            border: 2px solid rgba(56, 189, 248, 0.2);
            padding: 16px;
            border-radius: 18px;
            text-align: center;
            letter-spacing: 3px;
            margin-bottom: 24px;
        }
        .actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 18px;
        }
        .action-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.25s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            color: white;
            position: relative;
            overflow: hidden;
        }
        .action-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn-attendance {
            background: linear-gradient(135deg, #059669, #047857);
            box-shadow: 0 8px 20px rgba(5, 150, 105, 0.3);
        }
        .btn-leave {
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            box-shadow: 0 8px 20px rgba(220, 38, 38, 0.3);
        }
        .btn-services {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            box-shadow: 0 8px 20px rgba(2, 132, 199, 0.3);
        }
        .action-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            filter: brightness(1.05);
        }
        .action-btn:active:not(:disabled) {
            transform: translateY(0);
        }
        .location-status {
            font-size: 11px;
            color: #cbd5e1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            margin-top: 10px;
            line-height: 1.6;
        }
        .message {
            display: none;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            margin-top: 16px;
            animation: fadeIn 0.3s;
        }
        .message.success {
            background: #064e3b;
            color: #a7f3d0;
            border: 1px solid #10b981;
            display: block;
        }
        .message.error {
            background: #7f1d1d;
            color: #fecaca;
            border: 1px solid #ef4444;
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .loading-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <div class="brand">☀️ المراقب برو</div>
        <div class="connection-badge" id="connectionBadge">
            <span class="status-dot"></span>
            <span id="connectionText">متصل</span>
        </div>
    </div>

    <h1>⏱️ تسجيل الحضور بالبصمة</h1>
    <div class="sub-info" id="empDetails">جاري تحميل بيانات الموظف...</div>

    <div class="clock" id="liveClock">00:00:00</div>

    <div class="actions">
        <button class="action-btn btn-attendance" id="btnAttendance" onclick="handleAttendance('attendance')">
            🟢 تسجيل حضور
        </button>
        <button class="action-btn btn-leave" id="btnLeave" onclick="handleAttendance('departure')">
            🔴 تسجيل انصراف
        </button>
        <button class="action-btn btn-services" onclick="goToServices()">
            📁 الخدمات والطلبات
        </button>
    </div>

    <div class="location-status" id="locationStatus">📍 جاري تحديد الموقع الجغرافي...</div>
    <div class="message" id="messageBox"></div>
</div>

<script>
    const SERVER_URL = location.origin;  // يعمل على نفس السيرفر المنشور
    let employeeId = localStorage.getItem('employeeId') || '';
    let deviceId = localStorage.getItem('almoraqeb_device_id') || '';
    let companyId = localStorage.getItem('activeCompanyId') || '';
    let employeeName = localStorage.getItem('activeUser') || '';

    // إذا لم تتوفر البيانات، نحاول استخراجها من كائن الموظف المخزن
    if (!employeeId) {
        const empData = localStorage.getItem('almoraqeb_employee');
        if (empData) {
            try {
                const emp = JSON.parse(empData);
                employeeId = emp._id || emp.id || '';
                companyId = emp.companyId || companyId;
                employeeName = emp.name || emp.username || employeeName;
                localStorage.setItem('employeeId', employeeId);
                localStorage.setItem('activeCompanyId', companyId);
                localStorage.setItem('activeUser', employeeName);
            } catch (e) {}
        }
    }

    // التحقق من وجود البيانات
    if (!employeeId || !deviceId) {
        alert('بيانات الموظف غير مكتملة. يرجى تسجيل الدخول من جديد.');
        window.location.href = '/index.html';
    }

    function updateEmpDetails() {
        document.getElementById('empDetails').innerText = 
            `الموظف: ${employeeName || 'غير معروف'} | الشركة: ${companyId || '---'}`;
    }
    updateEmpDetails();

    // الساعة الحية
    function updateClock() {
        const now = new Date();
        document.getElementById('liveClock').textContent = now.toLocaleTimeString('ar-SA', { hour12: true });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // حالة الاتصال
    function updateConnection(status) {
        const badge = document.getElementById('connectionBadge');
        const text = document.getElementById('connectionText');
        if (status) {
            badge.classList.remove('offline');
            text.textContent = 'متصل';
        } else {
            badge.classList.add('offline');
            text.textContent = 'غير متصل';
        }
    }

    // فحص الاتصال بالسيرفر
    async function checkServer() {
        try {
            const res = await fetch(SERVER_URL + '/api/ping', { cache: 'no-store' });
            updateConnection(res.ok);
            return res.ok;
        } catch (e) {
            updateConnection(false);
            return false;
        }
    }

    // جلب الموقع الجغرافي بدقة مع مهلة قسرية
    function getLocation() {
        return new Promise((resolve, reject) => {
            if (!navigator.geolocation) {
                reject('المتصفح لا يدعم تحديد الموقع');
                return;
            }

            const timeoutId = setTimeout(() => {
                reject('انتهت مهلة تحديد الموقع (20 ثانية). تأكد من تفعيل GPS وأنك في مكان مفتوح.');
            }, 20000);

            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    clearTimeout(timeoutId);
                    resolve({
                        latitude: pos.coords.latitude,
                        longitude: pos.coords.longitude,
                        accuracy: pos.coords.accuracy
                    });
                },
                (err) => {
                    clearTimeout(timeoutId);
                    let msg = 'فشل الحصول على الموقع';
                    if (err.code === err.PERMISSION_DENIED) {
                        msg = 'تم رفض إذن الموقع. يرجى السماح بالوصول للموقع من إعدادات المتصفح.';
                    } else if (err.code === err.TIMEOUT) {
                        msg = 'انتهت مهلة تحديد الموقع. تأكد من تفعيل GPS وأنك في مكان مفتوح.';
                    } else if (err.code === err.POSITION_UNAVAILABLE) {
                        msg = 'معلومات الموقع غير متاحة حالياً. حاول مرة أخرى.';
                    }
                    reject(msg);
                },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        });
    }

    // تحويل base64url إلى ArrayBuffer
    function base64UrlToArrayBuffer(base64url) {
        const padding = '='.repeat((4 - (base64url.length % 4)) % 4);
        const base64 = (base64url + padding).replace(/-/g, '+').replace(/_/g, '/');
        const raw = atob(base64);
        const buffer = new Uint8Array(raw.length);
        for (let i = 0; i < raw.length; i++) {
            buffer[i] = raw.charCodeAt(i);
        }
        return buffer.buffer;
    }

    // الحصول على تحدي البصمة من السيرفر
    async function getChallenge() {
        const url = `${SERVER_URL}/api/attendance/challenge?employeeId=${encodeURIComponent(employeeId)}&deviceId=${encodeURIComponent(deviceId)}`;
        const res = await fetch(url);
        if (!res.ok) {
            const data = await res.json().catch(() => ({}));
            throw new Error(data.message || 'فشل الحصول على تحدي البصمة');
        }
        const data = await res.json();
        return data;
    }

    // التحقق من بصمة الإصبع عبر WebAuthn (تجاهل المفاتيح المخزنة)
    async function verifyFingerprint(challengeB64Url) {
        if (!window.PublicKeyCredential) {
            throw new Error('متصفحك لا يدعم بصمة الإصبع عبر WebAuthn');
        }

        const challengeBuffer = base64UrlToArrayBuffer(challengeB64Url);

        // المحاولة الأولى: طلب بصمة مباشرة مع تجاهل المفاتيح المخزنة
        try {
            const publicKeyOptions = {
                challenge: challengeBuffer,
                timeout: 60000,
                userVerification: 'required',
                allowCredentials: []   // ✅ تجاهل المفاتيح المخزنة
            };

            const credential = await navigator.credentials.get({ publicKey: publicKeyOptions });
            if (!credential) {
                throw new Error('لم يتم تأكيد البصمة');
            }
            const credId = btoa(String.fromCharCode(...new Uint8Array(credential.rawId)));
            return credId;
        } catch (firstErr) {
            // إذا ألغى المستخدم، نعرض رسالة مناسبة ولا نجرب إنشاء مفتاح جديد
            if (firstErr.name === 'NotAllowedError') {
                throw new Error('تم إلغاء عملية البصمة من قبل المستخدم');
            }

            // محاولة ثانية: إنشاء مفتاح جديد (يطلب بصمة أيضاً)
            try {
                const publicKeyCreateOptions = {
                    challenge: challengeBuffer,
                    rp: { name: 'المراقب برو', id: location.hostname },
                    user: {
                        id: new TextEncoder().encode(employeeId || 'employee'),
                        name: employeeName || 'employee',
                        displayName: employeeName || 'employee'
                    },
                    pubKeyCredParams: [{ type: 'public-key', alg: -7 }],
                    timeout: 60000,
                    authenticatorSelection: {
                        authenticatorAttachment: 'platform',
                        userVerification: 'required'
                    },
                    attestation: 'none'
                };

                const newCredential = await navigator.credentials.create({ publicKey: publicKeyCreateOptions });
                if (!newCredential) {
                    throw new Error('لم يتم تأكيد البصمة');
                }
                return btoa(String.fromCharCode(...new Uint8Array(newCredential.rawId)));
            } catch (secondErr) {
                if (secondErr.name === 'NotAllowedError') {
                    throw new Error('تم إلغاء عملية البصمة من قبل المستخدم');
                }
                throw new Error('فشل التحقق من بصمة الإصبع: ' + (secondErr.message || 'خطأ غير معروف'));
            }
        }
    }

    // حفظ السجل محليًا في حالة عدم الاتصال
    function saveOfflineRecord(record) {
        let pending = JSON.parse(localStorage.getItem('pendingAttendanceRecords') || '[]');
        pending.push(record);
        localStorage.setItem('pendingAttendanceRecords', JSON.stringify(pending));
    }

    // مزامنة السجلات المعلقة
    async function syncPendingAttendance() {
        const pending = JSON.parse(localStorage.getItem('pendingAttendanceRecords') || '[]');
        if (pending.length === 0) return;

        for (let i = pending.length - 1; i >= 0; i--) {
            const record = pending[i];
            try {
                const res = await fetch(SERVER_URL + '/api/attendance', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(record)
                });
                if (res.ok) {
                    pending.splice(i, 1);
                    localStorage.setItem('pendingAttendanceRecords', JSON.stringify(pending));
                }
            } catch (e) {
                break;  // توقف عند انقطاع الشبكة
            }
        }
    }

    // عرض رسالة
    function showMessage(type, text) {
        const box = document.getElementById('messageBox');
        box.className = 'message ' + type;
        box.textContent = text;
        box.style.display = 'block';
        clearTimeout(box._timeout);
        box._timeout = setTimeout(() => {
            box.style.display = 'none';
        }, 5000);
    }

    // تعطيل الأزرار أثناء المعالجة
    function setButtonsDisabled(disabled, loadingText) {
        const btnAttendance = document.getElementById('btnAttendance');
        const btnLeave = document.getElementById('btnLeave');
        btnAttendance.disabled = disabled;
        btnLeave.disabled = disabled;
        if (disabled) {
            btnAttendance.innerHTML = '<span class="loading-spinner"></span> ' + loadingText;
            btnLeave.innerHTML = '<span class="loading-spinner"></span> ' + loadingText;
        } else {
            btnAttendance.innerHTML = '🟢 تسجيل حضور';
            btnLeave.innerHTML = '🔴 تسجيل انصراف';
        }
    }

    // معالجة تسجيل الحضور/الانصراف
    async function handleAttendance(type) {
        setButtonsDisabled(true, 'جاري المعالجة...');

        try {
            // 1. الحصول على الموقع أولاً (يجب أن يكون داخل حدث المستخدم مباشرة)
            let location;
            try {
                location = await getLocation();
                document.getElementById('locationStatus').innerHTML = 
                    `📍 <b>GPS حقيقي:</b> خط عرض ${location.latitude.toFixed(4)}، خط طول ${location.longitude.toFixed(4)} <br> <span style="color:#34d399;">(دقة ضمن ${Math.round(location.accuracy)} متر)</span>`;
            } catch (locErr) {
                showMessage('error', '❌ ' + locErr);
                return;
            }

            // 2. فحص الاتصال
            const online = await checkServer();

            // 3. الحصول على تحدي البصمة من السيرفر (إذا متصل)
            let challengeId = null;
            let challengeB64Url = null;
            if (online) {
                try {
                    const challengeData = await getChallenge();
                    challengeId = challengeData.challengeId;
                    challengeB64Url = challengeData.challenge;
                } catch (chErr) {
                    showMessage('error', '❌ ' + chErr.message);
                    return;
                }
            } else {
                challengeId = 'offline-' + Date.now();
                challengeB64Url = btoa(String.fromCharCode(...new Uint8Array(32)));
            }

            // 4. التحقق من بصمة الإصبع
            let fingerprintToken;
            try {
                fingerprintToken = await verifyFingerprint(challengeB64Url);
            } catch (fingerErr) {
                showMessage('error', '❌ ' + fingerErr.message);
                return;
            }

            // 5. بناء السجل
            const record = {
                employeeId,
                deviceId,
                fingerprintToken,
                type: type,
                latitude: location.latitude,
                longitude: location.longitude,
                challengeId,
                timestamp: new Date().toISOString()
            };

            // 6. إرسال السجل
            if (online) {
                try {
                    const res = await fetch(SERVER_URL + '/api/attendance', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(record)
                    });
                    const data = await res.json().catch(() => ({}));
                    if (!res.ok) {
                        throw new Error(data.message || 'فشل تسجيل الحضور');
                    }
                    showMessage('success', '✅ تم تسجيل ' + (type === 'attendance' ? 'الحضور' : 'الانصراف') + ' بنجاح وتم إرساله للوحة المدير.');
                } catch (netErr) {
                    saveOfflineRecord(record);
                    showMessage('error', '⚠️ تعذر الاتصال بالسيرفر. تم حفظ السجل محليًا وسيتم مزامنته عند عودة الاتصال.');
                }
            } else {
                saveOfflineRecord(record);
                showMessage('error', '📴 أنت غير متصل. تم حفظ سجل ' + (type === 'attendance' ? 'الحضور' : 'الانصراف') + ' محليًا وسيتم مزامنته عند الاتصال.');
            }

        } catch (err) {
            showMessage('error', '❌ ' + (err.message || 'حدث خطأ غير متوقع'));
        } finally {
            setButtonsDisabled(false);
        }
    }

    // الانتقال إلى صفحة الخدمات
    function goToServices() {
        window.location.href = '/services.html';
    }

    // عند تحميل الصفحة
    window.addEventListener('load', async () => {
        updateEmpDetails();
        const online = await checkServer();
        if (online) {
            await syncPendingAttendance();
        }
    });

    // الاستماع لحدث عودة الاتصال
    window.addEventListener('online', async () => {
        updateConnection(true);
        await syncPendingAttendance();
        showMessage('success', '✅ تمت استعادة الاتصال. تمت مزامنة السجلات المعلقة.');
    });

    window.addEventListener('offline', () => {
        updateConnection(false);
        showMessage('error', '📴 انقطع الاتصال. سيتم الحفظ محليًا.');
    });

    // فحص دوري للاتصال
    setInterval(async () => {
        const online = await checkServer();
        if (online) {
            await syncPendingAttendance();
        }
    }, 60000);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المراقب برو - إدارة المستخدمين والصلاحيات</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #2e1a47 0%, #1f1135 50%, #100820 100%);
            color: #1e293b;
            min-height: 100vh;
            padding: 30px;
        }

        .main-card {
            max-width: 1800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 28px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 20px;
        }

        h2 {
            font-size: 26px;
            font-weight: 800;
            color: #0284c7;
        }

        .back-btn {
            background: #f1f5f9;
            color: #0284c7;
            padding: 12px 24px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            border: 1px solid #cbd5e1;
            transition: 0.2s;
        }

        .back-btn:hover {
            background: #0284c7;
            color: #fff;
        }

        /* نموذج إضافة مستخدم وصلاحيات جديدة */
        .user-form-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            background: #f8fafc;
            padding: 25px;
            border-radius: 20px;
            border: 1px solid #cbd5e1;
            margin-bottom: 35px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 14px;
            font-weight: 700;
            color: #334155;
        }

        input, select {
            background: #fff;
            border: 2px solid #cbd5e1;
            padding: 12px 15px;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        input:focus, select:focus {
            border-color: #0284c7;
            box-shadow: 0 0 8px rgba(2, 132, 199, 0.3);
        }

        .permissions-box {
            grid-column: span 3;
            background: #e0f2fe;
            padding: 15px 20px;
            border-radius: 14px;
            border: 1px solid #bae6fd;
        }

        .permissions-box h4 {
            font-size: 15px;
            color: #0369a1;
            margin-bottom: 12px;
        }

        .checkbox-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #0f172a;
            cursor: pointer;
        }

        .checkbox-item input {
            width: 18px;
            height: 18px;
            accent-color: #0284c7;
        }

        .btn-submit {
            grid-column: span 3;
            background: #0d9488;
            color: #fff;
            padding: 15px;
            font-size: 16px;
            font-weight: 800;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-submit:hover {
            background: #0f766e;
        }

        .section-title {
            font-size: 18px;
            font-weight: 800;
            color: #0369a1;
            margin-bottom: 15px;
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #f8fafc;
            white-space: nowrap;
        }

        th, td {
            padding: 14px 12px;
            text-align: center;
            font-size: 14px;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background: #e0f2fe;
            color: #0369a1;
            font-weight: 800;
        }

        .badge-role-admin {
            background: #fee2e2;
            color: #991b1b;
            padding: 5px 10px;
            border-radius: 8px;
            font-weight: bold;
        }

        .badge-role-staff {
            background: #dcfce7;
            color: #166534;
            padding: 5px 10px;
            border-radius: 8px;
            font-weight: bold;
        }

        .btn-delete {
            background: #dc2626;
            color: #fff;
            padding: 6px 12px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-delete:hover { background: #b91c1c; }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="top-nav">
            <h2>🛡️ إدارة المستخدمين وصلاحيات لوحة التحكم</h2>
            <a href="admin.html" class="back-btn">← العودة إلى لوحة التحكم</a>
        </div>

        <!-- نموذج إضافة حساب جديد وصلاحياته -->
        <form id="userForm" class="user-form-grid">
            <div class="form-group">
                <label>اسم المستخدم (لليوزرنيم):</label>
                <input type="text" id="username" required placeholder="مثال: mohmmedali">
            </div>
            <div class="form-group">
                <label>كلمة المرور:</label>
                <input type="password" id="password" required placeholder="أدخل كلمة المرور...">
            </div>
            <div class="form-group">
                <label>نوع الحساب (الدور الأساسي):</label>
                <select id="roleType" onchange="togglePermissions()">
                    <option value="admin">مدير عام (صلاحيات شاملة مطلقة)</option>
                    <option value="staff">موظف / مشرف (صلاحيات مخصصة)</option>
                </select>
            </div>

            <!-- لوحة تخصيص الصلاحيات الدقيقة -->
            <div class="permissions-box" id="permissionsContainer">
                <h4>🔐 تحديد الصلاحيات المخصصة لهذا المستخدم:</h4>
                <div class="checkbox-grid">
                    <label class="checkbox-item"><input type="checkbox" name="perm" value="attendance"> إدارة الحضور والغياب والبصمة</label>
                    <label class="checkbox-item"><input type="checkbox" name="perm" value="loans"> إدارة السلف والقروض والطلبات</label>
                    <label class="checkbox-item"><input type="checkbox" name="perm" value="reports"> طباعة وعرض التقارير الشاملة</label>
                    <label class="checkbox-item"><input type="checkbox" name="perm" value="notifications"> إرسال الإشعارات والإنذارات</label>
                    <label class="checkbox-item"><input type="checkbox" name="perm" value="shifts"> إدارة الشفتات ومواقع العمل</label>
                    <label class="checkbox-item"><input type="checkbox" name="perm" value="employees"> إدارة سجلات الموظفين</label>
                </div>
            </div>

            <button type="submit" class="btn-submit">➕ حفظ وإنشاء حساب المشرف / الموظف الجديد</button>
        </form>

        <!-- جدول الحسابات الحالية -->
        <div class="section-title">👥 سجل الحسابات والمشرفين المسجلين في النظام:</div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ت</th>
                        <th>اسم المستخدم</th>
                        <th>نوع الحساب</th>
                        <th>الصلاحيات المتاحة</th>
                        <th>تاريخ الإنشاء</th>
                        <th>إجراءات</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                    <!-- الحقن الديناميكي -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const initialUsers = [
            { username: "admin", role: "admin", perms: ["صلاحيات كاملة وشاملة لكافة أقسام النظام"], date: "2026-01-01" },
            { username: "ali_supervisor", role: "staff", perms: ["إدارة الحضور والغياب البصمة", "إدارة السلف والقروض"], date: "2026-06-15" }
        ];

        function loadUsers() {
            let users = JSON.parse(localStorage.getItem('companyUsers')) || initialUsers;
            const tableBody = document.getElementById('usersTableBody');
            tableBody.innerHTML = '';

            users.forEach((u, index) => {
                let roleBadge = u.role === 'admin' ? '<span class="badge-role-admin">مدير عام (شامل)</span>' : '<span class="badge-role-staff">موظف بصلاحيات مخصصة</span>';
                let permsText = Array.isArray(u.perms) ? u.perms.join('، ') : u.perms;

                tableBody.innerHTML += `
                    <tr>
                        <td><b>${index + 1}</b></td>
                        <td style="font-weight: 700; color: #0f172a;">${u.username}</td>
                        <td>${roleBadge}</td>
                        <td style="color: #0369a1; font-weight: 600;">${permsText}</td>
                        <td>${u.date}</td>
                        <td>${u.username !== 'admin' ? `<button class="btn-delete" onclick="deleteUser(${index})">حذف الحساب</button>` : '<span style="color:#94a3b8">محمي</span>'}</td>
                    </tr>
                `;
            });
        }

        function togglePermissions() {
            let role = document.getElementById('roleType').value;
            let container = document.getElementById('permissionsContainer');
            if (role === 'admin') {
                container.style.opacity = '0.5';
                container.style.pointerEvents = 'none';
            } else {
                container.style.opacity = '1';
                container.style.pointerEvents = 'auto';
            }
        }

        document.getElementById('userForm').addEventListener('submit', (e) => {
            e.preventDefault();
            let username = document.getElementById('username').value;
            let role = document.getElementById('roleType').value;
            let date = new Date().toISOString().split('T')[0];
            let perms = [];

            if (role === 'admin') {
                perms = ["صلاحيات كاملة وشاملة لكافة أقسام النظام"];
            } else {
                document.querySelectorAll('input[name="perm"]:checked').forEach((checkbox) => {
                    perms.push(checkbox.parentElement.innerText.trim());
                });
                if (perms.length === 0) {
                    alert('يرجى اختيار صلاحية واحدة على الأقل للموظف!');
                    return;
                }
            }

            let users = JSON.parse(localStorage.getItem('companyUsers')) || initialUsers;
            users.push({ username, role, perms, date });
            localStorage.setItem('companyUsers', JSON.stringify(users));

            alert('تم إنشاء الحساب وتحديد الصلاحيات بنجاح!');
            document.getElementById('userForm').reset();
            togglePermissions();
            loadUsers();
        });

        function deleteUser(index) {
            if (confirm('هل أنت متأكد من حذف هذا المستخدم؟')) {
                let users = JSON.parse(localStorage.getItem('companyUsers')) || initialUsers;
                users.splice(index, 1);
                localStorage.setItem('companyUsers', JSON.stringify(users));
                loadUsers();
            }
        }

        window.onload = () => {
            if (!localStorage.getItem('companyUsers')) {
                localStorage.setItem('companyUsers', JSON.stringify(initialUsers));
            }
            loadUsers();
        };
    </script>
</body>
</html>

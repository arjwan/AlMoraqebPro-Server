<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول المدير - المراقب برو</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{background:#1e1b4b;font-family:'Segoe UI',Tahoma,sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
        .login-box{background:#fff;border-radius:20px;padding:40px 35px;max-width:420px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,0.4);text-align:center}
        .login-box .logo{font-size:28px;font-weight:900;color:#1e293b}
        .login-box .sub{color:#64748b;font-size:14px;margin:5px 0 25px}
        .login-box .form-group{margin-bottom:18px;text-align:right}
        .login-box label{display:block;font-weight:700;color:#1e293b;margin-bottom:5px;font-size:14px}
        .login-box input{width:100%;padding:12px 14px;border:2px solid #cbd5e1;border-radius:10px;font-size:15px;outline:none;background:#f8fafc}
        .login-box input:focus{border-color:#0284c7;background:#fff}
        .login-box .btn{width:100%;padding:14px;border:0;border-radius:10px;font-size:17px;font-weight:800;cursor:pointer;background:#0284c7;color:#fff;transition:background .2s,transform .15s}
        .login-box .btn:hover{background:#0369a1;transform:translateY(-2px)}
        .login-box .btn:active{transform:scale(0.97)}
        .login-box .error{color:#ef4444;font-size:13px;margin-top:12px;display:none;font-weight:600}
        .login-box .error.show{display:block}
        .login-box .footer{margin-top:20px;font-size:12px;color:#94a3b8}
        .developer-link{display:inline-flex;align-items:center;gap:7px;margin-top:15px;padding:9px 13px;border:1px solid #cbd5e1;border-radius:10px;color:#64748b;text-decoration:none;font-size:12px;font-weight:700;transition:.2s}
        .developer-link:hover{color:#4338ca;border-color:#818cf8;background:#eef2ff}
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo">👨‍💼 المراقب برو</div>
        <div class="sub">تسجيل دخول المدير</div>
        <form id="loginForm" onsubmit="login(event)">
            <div class="form-group">
                <label>رمز الشركة</label>
                <input type="text" id="companyId" placeholder="مثال: B-2070" required>
            </div>
            <div class="form-group">
                <label>اسم المستخدم</label>
                <input type="text" id="username" placeholder="أدخل اسم المستخدم" required>
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn">🚪 دخول</button>
            <div class="error" id="loginError">❌ بيانات الدخول غير صحيحة</div>
        </form>
        <a class="developer-link" href="/developer/login" title="فتح بوابة المطور">🛠️ خيارات المطور</a>
        <div class="footer">© 2026 نظام المراقب برو - جميع الحقوق محفوظة</div>
    </div>

    <script>
        const API = location.origin;

        async function login(e) {

            e.preventDefault();

            const companyId =
                document
                    .getElementById('companyId')
                    .value
                    .trim();

            const username =
                document
                    .getElementById('username')
                    .value
                    .trim();

            const password =
                document
                    .getElementById('password')
                    .value;

            const errorEl =
                document.getElementById(
                    'loginError'
                );

            errorEl.classList.remove('show');

            if (
                !companyId ||
                !username ||
                !password
            ) {
                errorEl.textContent =
                    '⚠ يرجى ملء جميع الحقول';

                errorEl.classList.add('show');
                return;
            }

            /*
             * نحاول السيرفر أولاً.
             */
            if (navigator.onLine) {

                try {

                    const res =
                        await fetch(
                            API + '/api/admin/login',
                            {
                                method:'POST',
                                headers:{
                                    'Content-Type':
                                        'application/json'
                                },
                                body:
                                    JSON.stringify({
                                        companyId,
                                        username,
                                        password
                                    })
                            }
                        );

                    const data =
                        await res
                            .json()
                            .catch(()=>({}));

                    /*
                     * السيرفر رد فعلياً:
                     * إذا كانت البيانات خطأ لا نسمح
                     * بالدخول Offline كالتفاف.
                     */
                    if (!res.ok || !data.success) {

                        errorEl.textContent =
                            '❌ ' +
                            (
                                data.message ||
                                'بيانات الدخول غير صحيحة'
                            );

                        errorEl.classList.add('show');
                        return;
                    }

                    sessionStorage.setItem(
                        'almoraqeb_admin_token',
                        data.token
                    );

                    sessionStorage.removeItem(
                        'almoraqeb_admin_offline'
                    );

                    localStorage.setItem(
                        'almoraqeb_admin_session',
                        JSON.stringify({
                            companyId,
                            username,
                            role:
                                data.role ||
                                'admin',
                            offlineMode:false
                        })
                    );

                    localStorage.setItem(
                        'companyId',
                        companyId
                    );

                    /*
                     * لا نحفظ كلمة المرور.
                     * نحفظ verifier محلي فقط
                     * بعد نجاح تسجيل الدخول Online.
                     */
                    await AlMoraqebOfflineAuth
                        .saveCredential({
                            companyId,
                            username,
                            password,
                            role:
                                data.role ||
                                'admin'
                        });

                    location.href =
                        'admin.html?company=' +
                        encodeURIComponent(
                            companyId
                        );

                    return;

                } catch (networkError) {

                    /*
                     * فشل الوصول إلى Render نفسه.
                     * ننتقل للمصادقة المحلية.
                     */
                }
            }

            /*
             * OFFLINE LOGIN
             */
            try {

                const valid =
                    await AlMoraqebOfflineAuth
                        .verifyCredential(
                            companyId,
                            username,
                            password
                        );

                if (!valid) {

                    errorEl.textContent =
                        '❌ لا توجد بيانات دخول Offline صالحة لهذا الحساب';

                    errorEl.classList.add('show');
                    return;
                }

                const record =
                    await AlMoraqebOfflineAuth
                        .getCredential(
                            companyId
                        );

                AlMoraqebOfflineAuth
                    .startOfflineSession(
                        companyId,
                        username,
                        record?.role ||
                        'admin'
                    );

                location.href =
                    'admin.html?company=' +
                    encodeURIComponent(
                        companyId
                    );

            } catch (err) {

                errorEl.textContent =
                    '❌ تعذر التحقق من بيانات الدخول المحلية';

                errorEl.classList.add('show');
            }
        }
    </script>

<script src="/offline_db.js"></script>
<script src="/offline_sync.js"></script>
<script src="/offline_auth.js"></script>
<script src="/offline_boot.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المراقب برو - إضافة موظف جديد</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #2e1a47 0%, #1f1135 50%, #100820 100%);
            color: #1e293b;
            min-height: 100vh;
            padding: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main-card {
            width: 100%;
            max-width: 900px;
            background: #ffffff;
            padding: 40px;
            border-radius: 28px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
        }

        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        h2 {
            font-size: 28px;
            font-weight: 800;
            color: #0284c7;
        }

        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn-dashboard {
            background: #475569;
            color: #fff;
            padding: 8px 16px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            border: none;
        }

        .btn-dashboard:hover {
            background: #334155;
        }

        .date-box {
            background: #e0f2fe;
            color: #0369a1;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label {
            font-weight: 700;
            font-size: 14px;
            color: #334155;
        }

        input, select {
            padding: 12px 16px;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
            background: #f8fafc;
        }

        input:focus, select:focus {
            border-color: #0284c7;
            background: #fff;
        }

        .media-section {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            background: #f1f5f9;
            padding: 15px;
            border-radius: 12px;
            border: 1px dashed #cbd5e1;
        }

        .media-section input[type="file"] {
            border: none;
            background: transparent;
            padding: 0;
        }

        .btn {
            background: #0284c7;
            color: #fff;
            border: none;
            padding: 14px 24px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: 0.2s;
            text-align: center;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-success {
            background: #10b981;
            grid-column: span 2;
            margin-top: 10px;
        }

        .btn-success:hover {
            background: #059669;
        }

        .location-status {
            font-size: 13px;
            color: #0d9488;
            font-weight: bold;
        }

        video, canvas {
            width: 100%;
            max-width: 200px;
            border-radius: 8px;
            display: none;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="top-header">
            <h2>➕ إضافة موظف جديد</h2>
            <div class="header-actions">
                <button type="button" class="btn-dashboard" onclick="goToDashboard()">🏠 العودة لوحة التحكم</button>
                <div class="date-box" id="currentDateDisplay">التاريخ: جاري التحميل...</div>
            </div>
        </div>

        <form id="addEmployeeForm" class="form-grid" onsubmit="saveEmployee(event)">
            
            <!-- 1. رمز الشركة -->
            <div class="form-group">
                <label>رمز الشركة:</label>
                <input type="text" id="companyId" placeholder="مثال: B-2060" required oninput="saveActiveCompany()">
            </div>

            <!-- 2. اسم الشركة -->
            <div class="form-group">
                <label>اسم الشركة:</label>
                <input type="text" id="companyName" placeholder="أدخل اسم الشركة" required>
            </div>

            <!-- 3. اسم الموظف -->
            <div class="form-group full-width">
                <label>اسم الموظف الكامل:</label>
                <input type="text" id="employeeName" placeholder="الاسم ثلاثي" required>
            </div>

            <!-- 4. العنوان الوظيفي -->
            <div class="form-group">
                <label>العنوان الوظيفي:</label>
                <input type="text" id="employeeSpecialty" placeholder="مثال: مهندس برمجيات، محاسب..." required>
            </div>

            <!-- 5. مكان العمل -->
            <div class="form-group">
                <label>مكان العمل:</label>
                <input type="text" id="employeeWorkplace" placeholder="الفرع أو القسم الرئيسي" required>
            </div>

            <!-- 6. مقدار الراتب -->
            <div class="form-group">
                <label>مقدار الراتب:</label>
                <input type="number" id="employeeSalary" placeholder="قيمة الراتب الأساسي" required>
            </div>

            <!-- 7. المخصصات -->
            <div class="form-group">
                <label>المخصصات:</label>
                <input type="number" id="employeeAllowances" placeholder="مخصصات النقل أو السكن (اختياري)">
            </div>

            <!-- 8. اسم المستخدم -->
            <div class="form-group">
                <label>اسم المستخدم (للدخول):</label>
                <input type="text" id="employeeUsername" placeholder="اسم المستخدم الفريد" required>
            </div>

            <!-- 9. كلمة المرور -->
            <div class="form-group">
                <label>كلمة المرور:</label>
                <input type="password" id="employeePassword" placeholder="كلمة المرور الخاصة بالموظف" required>
            </div>

            <!-- 10. التقاط صورة أو تحميل صورة -->
            <div class="form-group full-width">
                <label>صورة الموظف (التقاط بالكاميرا أو تحميل ملف):</label>
                <div class="media-section">
                    <input type="file" id="uploadImageInput" accept="image/*" onchange="handleImageUpload(event)">
                    <button type="button" class="btn" style="padding: 8px 14px; font-size: 14px;" onclick="startCamera()">📷 فتح الكاميرا للتقاط</button>
                    <button type="button" class="btn" style="padding: 8px 14px; font-size: 14px; background: #ef4444; display:none;" id="captureBtn" onclick="capturePhoto()">التقاط الصورة</button>
                </div>
                <video id="cameraStream" autoplay playsinline></video>
                <canvas id="cameraCanvas"></canvas>
                <input type="hidden" id="employeePhoto" value="">
            </div>

            <!-- 11. جلب الموقع والإحداثيات -->
            <div class="form-group full-width">
                <label>الموقع الجغرافي (الإحداثيات):</label>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <button type="button" class="btn" style="padding: 10px 16px; font-size: 14px; background: #0d9488;" onclick="getLocation()">📍 جلب الموقع الحالي</button>
                    <span id="locationStatus" class="location-status">لم يتم تحديد الموقع بعد</span>
                </div>
                <input type="hidden" id="employeeLocation" value="غير متوفر">
            </div>

            <!-- 12. الحفظ والتسجيل -->
            <button type="submit" class="btn btn-success">💾 الحفظ والتسجيل وترحيل البيانات</button>

        </form>
    </div>

    <script>
        let capturedPhotoData = '';

        window.onload = () => {
            const today = new Date().toLocaleDateString('ar-EG');
            document.getElementById('currentDateDisplay').innerText = `التاريخ: ${today}`;

            const urlParams = new URLSearchParams(window.location.search);
            const compParam = urlParams.get('company');
            if (compParam) {
                document.getElementById('companyId').value = compParam;
                localStorage.setItem('activeCompanyId', compParam);
            } else {
                const savedComp = localStorage.getItem('activeCompanyId');
                if (savedComp) document.getElementById('companyId').value = savedComp;
            }
        };

        function saveActiveCompany() {
            const compId = document.getElementById('companyId').value.trim();
            if (compId) {
                localStorage.setItem('activeCompanyId', compId);
            }
        }

        function goToDashboard() {
            const compId = document.getElementById('companyId').value.trim();
            if (compId) {
                window.location.href = `admin-employee.html?company=${encodeURIComponent(compId)}`;
            } else {
                window.location.href = 'admin-employee.html';
            }
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    capturedPhotoData = e.target.result;
                    document.getElementById('employeePhoto').value = capturedPhotoData;
                    alert('تم تحميل الصورة بنجاح!');
                };
                reader.readAsDataURL(file);
            }
        }

        let videoStream = null;
        function startCamera() {
            const video = document.getElementById('cameraStream');
            document.getElementById('captureBtn').style.display = 'inline-block';
            video.style.display = 'block';

            navigator.mediaDevices.getUserMedia({ video: true })
                .then(stream => {
                    videoStream = stream;
                    video.srcObject = stream;
                })
                .catch(err => {
                    alert('تعذر الوصول إلى الكاميرا: ' + err.message);
                });
        }

        function capturePhoto() {
            const video = document.getElementById('cameraStream');
            const canvas = document.getElementById('cameraCanvas');
            canvas.width = video.videoWidth || 320;
            canvas.height = video.videoHeight || 240;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            capturedPhotoData = canvas.toDataURL('image/png');
            document.getElementById('employeePhoto').value = capturedPhotoData;

            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
            }
            video.style.display = 'none';
            document.getElementById('captureBtn').style.display = 'none';
            alert('تم التقاط صورة الوجه بنجاح!');
        }

        function getLocation() {
            const statusEl = document.getElementById('locationStatus'); مفصل
            const locationInput = document.getElementById('employeeLocation');

            if (navigator.geolocation) {
                statusEl.innerText = 'جاري تحديد الإحداثيات...';
                navigator.geolocation.getCurrentPosition(
                    position => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        const coordsStr = `${lat.toFixed(4)}, ${lon.toFixed(4)}`;
                        locationInput.value = coordsStr;
                        statusEl.innerText = `✅ تم جلب الموقع بنجاح: (${coordsStr})`;
                    },
                    error => {
                        statusEl.innerText = '❌ فشل جلب الموقع، يرجى السماح بالصلاحيات.';
                        locationInput.value = 'غير متوفر';
                    }
                );
            } else {
                alert('متصفحك لا يدعم خاصية تحديد الموقع الجغرافي.');
            }
        }

        function saveEmployee(event) {
            event.preventDefault();

            const compId = document.getElementById('companyId').value.trim();
            if (!compId) {
                alert('يرجى إدخال رمز الشركة أولاً!');
                return;
            }

            const newEmployee = {
                companyId: compId,
                companyName: document.getElementById('companyName').value.trim(),
                name: document.getElementById('employeeName').value.trim(),
                specialty: document.getElementById('employeeSpecialty').value.trim(),
                workplace: document.getElementById('employeeWorkplace').value.trim(),
                salary: document.getElementById('employeeSalary').value.trim(),
                allowances: document.getElementById('employeeAllowances').value.trim() || '0',
                username: document.getElementById('employeeUsername').value.trim(),
                password: document.getElementById('employeePassword').value.trim(),
                photo: document.getElementById('employeePhoto').value || 'https://via.placeholder.com/45',
                location: document.getElementById('employeeLocation').value,
                startDate: new Date().toLocaleDateString('ar-EG')
            };

            try {
                // 1. الحفظ في تخزين الشركة المخصص (جداول الموظفين الخاصة بالشركة)
                const storageKey = `company_employees_${compId}`;
                let existingEmployees = JSON.parse(localStorage.getItem(storageKey) || '[]');
                existingEmployees.push(newEmployee);
                localStorage.setItem(storageKey, JSON.stringify(existingEmployees));

                // 2. الترحيل العام للقائمة العامة للموظفين
                let generalEmployees = JSON.parse(localStorage.getItem('company_employees') || '[]');
                generalEmployees.push(newEmployee);
                localStorage.setItem('company_employees', JSON.stringify(generalEmployees));

                // 3. ترحيل بيانات الرواتب لجدول الرواتب
                let salariesList = JSON.parse(localStorage.getItem(`salaries_${compId}`) || '[]');
                salariesList.push({ username: newEmployee.username, name: newEmployee.name, salary: newEmployee.salary, allowances: newEmployee.allowances });
                localStorage.setItem(`salaries_${compId}`, JSON.stringify(salariesList));

                // 4. ترحيل بيانات الشفتات لجدول الشفتات
                let shiftsList = JSON.parse(localStorage.getItem(`shifts_${compId}`) || '[]');
                shiftsList.push({ username: newEmployee.username, name: newEmployee.name, workplace: newEmployee.workplace, status: 'نشط' });
                localStorage.setItem(`shifts_${compId}`, JSON.stringify(shiftsList));

                // 5. ترحيل بيانات التوثيق الأمني لجدول الأمان
                let securityList = JSON.parse(localStorage.getItem(`security_${compId}`) || '[]');
                securityList.push({ username: newEmployee.username, name: newEmployee.name, verified: true, date: newEmployee.startDate });
                localStorage.setItem(`security_${compId}`, JSON.stringify(securityList));

                alert('🎉 تم حفظ وتخزين وترحيل بيانات الموظف بنجاح إلى كافة الجداول واللوحات المرتبطة!');

                // تفريغ حقول إدخال بيانات الموظف الجديدة وتجهيز النموذج لعملية إدخال تالية
                document.getElementById('employeeName').value = '';
                document.getElementById('employeeSpecialty').value = '';
                document.getElementById('employeeWorkplace').value = '';
                document.getElementById('employeeSalary').value = '';
                document.getElementById('employeeAllowances').value = '';
                document.getElementById('employeeUsername').value = '';
                document.getElementById('employeePassword').value = '';
                document.getElementById('employeePhoto').value = '';
                document.getElementById('uploadImageInput').value = '';
                document.getElementById('employeeLocation').value = 'غير متوفر';
                document.getElementById('locationStatus').innerText = 'لم يتم تحديد الموقع بعد';
                capturedPhotoData = '';

            } catch (error) {
                alert('حدث خطأ أثناء حفظ البيانات في التخزين المحلي (LocalStorage): ' + error.message);
            }
        }
    </script>
</body>
</html>

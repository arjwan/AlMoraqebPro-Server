<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المراقب برو - إدارة وإضافة الموظفين</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #2e1a47 0%, #1f1135 50%, #100820 100%);
            color: #1e293b;
            min-height: 100vh;
            padding: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main-card {
            width: 100%;
            max-width: 1250px;
            background: #ffffff;
            padding: 45px;
            border-radius: 28px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 20px;
        }

        h2 {
            font-size: 32px;
            font-weight: 800;
            color: #0284c7;
        }

        .back-btn {
            background: #f1f5f9;
            color: #0284c7;
            padding: 12px 24px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 700;
            font-size: 16px;
            border: 1px solid #cbd5e1;
            transition: 0.2s;
        }

        .back-btn:hover {
            background: #0284c7;
            color: #fff;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .small-inputs-row {
            grid-column: span 3;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            background: #f1f5f9;
            padding: 20px;
            border-radius: 18px;
            border: 1px solid #cbd5e1;
        }

        label {
            font-size: 16px;
            font-weight: 700;
            color: #334155;
        }

        input, select {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            padding: 15px 18px;
            border-radius: 14px;
            color: #1e293b;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #0284c7;
            background: #fff;
            box-shadow: 0 0 10px rgba(2, 132, 199, 0.2);
        }

        .camera-section {
            background: #f8fafc;
            border: 2px dashed #cbd5e1;
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            grid-column: span 3;
        }

        video {
            width: 100%;
            max-width: 300px;
            height: 190px;
            border-radius: 12px;
            background: #000;
            margin-top: 10px;
            object-fit: cover;
            border: 2px solid #cbd5e1;
        }

        .btn-capture {
            background: #0284c7;
            color: #fff;
            font-weight: 800;
            font-size: 15px;
            padding: 10px 20px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            margin-top: 12px;
        }

        .btn-submit {
            grid-column: span 3;
            background: #0d9488;
            color: #fff;
            padding: 18px;
            font-size: 18px;
            font-weight: 800;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 6px 20px rgba(13, 148, 136, 0.3);
        }

        .btn-submit:hover {
            background: #0f766e;
            transform: translateY(-2px);
        }

        .section-title {
            font-size: 24px;
            font-weight: 800;
            color: #1e293b;
            margin-bottom: 20px;
            border-right: 5px solid #0284c7;
            padding-right: 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #f8fafc;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }

        th, td {
            padding: 16px;
            text-align: center;
            font-size: 16px;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background: #e0f2fe;
            color: #0369a1;
            font-weight: 800;
        }

        td img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #0284c7;
        }

        .btn-delete {
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .btn-delete:hover {
            background: #dc2626;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="top-nav">
            <h2>👥 إدارة وإضافة الموظفين</h2>
            <a href="admin.html" class="back-btn">← العودة لوحة التحكم</a>
        </div>
        
        <form id="addEmployeeForm" class="form-grid">
            <div class="form-group">
                <label>اسم الموظف الكامل:</label>
                <input type="text" id="empName" required placeholder="أدخل اسم الموظف...">
            </div>

            <div class="form-group">
                <label>العنوان الوظيفي:</label>
                <input type="text" id="empSpecialty" required placeholder="مثال: مبرمج، محاسب...">
            </div>

            <div class="form-group">
                <label>مكان العمل:</label>
                <input type="text" id="empWorkplace" required placeholder="مثال: الفرع الرئيسي...">
            </div>

            <div class="form-group">
                <label>الراتب الاسمي (د.ع):</label>
                <input type="number" id="empSalary" required placeholder="مقدار الراتب الاسمي...">
            </div>

            <div class="form-group">
                <label>تاريخ بدء العمل:</label>
                <input type="date" id="empStartDate" required>
            </div>

            <div class="form-group">
                <label>المحافظة:</label>
                <input type="text" id="empProvince" required placeholder="المحافظة...">
            </div>

            <div class="form-group">
                <label>المدينة:</label>
                <input type="text" id="empCity" required placeholder="المدينة...">
            </div>

            <div class="form-group">
                <label>الحي:</label>
                <input type="text" id="empDistrict" placeholder="الحي...">
            </div>

            <div class="small-inputs-row">
                <div class="form-group">
                    <label>المحلة:</label>
                    <input type="text" id="empMahalla" maxlength="5" placeholder="مثال: 322">
                </div>
                <div class="form-group">
                    <label>الزقاق:</label>
                    <input type="text" id="empAlley" maxlength="5" placeholder="مثال: 14">
                </div>
                <div class="form-group">
                    <label>رقم الدار:</label>
                    <input type="text" id="empHouseNo" maxlength="5" placeholder="مثال: 8">
                </div>
            </div>

            <div class="camera-section">
                <label>📸 التقاط صورة الوجه (للبصمة):</label>
                <div>
                    <video id="video" autoplay playsinline></video>
                    <canvas id="canvas" style="display:none;"></canvas>
                </div>
                <button type="button" class="btn-capture" id="captureBtn">التقاط الصورة</button>
                <p id="captureStatus" style="color: #0d9488; margin-top: 8px; font-weight: bold; display:none;">✓ تم التقاط الصورة بنجاح</p>
            </div>

            <button type="submit" class="btn-submit">💾 حفظ الموظف وإضافته للنظام</button>
        </form>

        <h3 class="section-title">قائمة الموظفين المسجلين</h3>
        <table>
            <thead>
                <tr>
                    <th>الصورة</th>
                    <th>الاسم الكامل</th>
                    <th>العنوان الوظيفي</th>
                    <th>مكان العمل</th>
                    <th>الراتب الاسمي</th>
                    <th>العنوان (محافظة / مدينة / حي / محلة / زقاق / دار)</th>
                    <th>تاريخ البدء</th>
                    <th>الإجراءات</th>
                </tr>
            </thead>
            <tbody id="employeesTableBody">
                <!-- يتم تعبئتها تلقائياً -->
            </tbody>
        </table>
    </div>

    <!-- ملف المزامنة والربط الشامل -->
    <script src="employees-sync.js"></script>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const captureBtn = document.getElementById('captureBtn');
        const captureStatus = document.getElementById('captureStatus');
        let capturedImageData = "";

        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => { video.srcObject = stream; })
            .catch(err => { console.log("الكاميرا غير متاحة: ", err); });

        captureBtn.addEventListener('click', () => {
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth || 320;
            canvas.height = video.videoHeight || 240;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            capturedImageData = canvas.toDataURL('image/png');
            captureStatus.style.display = 'block';
        });

        function loadEmployees() {
            const tableBody = document.getElementById('employeesTableBody');
            const employees = getAllEmployees(); // دالة الجلب الموحدة من employees-sync.js
            
            tableBody.innerHTML = '';
            if (employees.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="8" style="color: #64748b; padding: 25px;">لا يوجد موظفون مسجلون حالياً</td></tr>`;
                return;
            }
            
            employees.forEach((emp, index) => {
                const fullAddress = `${emp.province || '-'} / ${emp.city || '-'} / ${emp.district || '-'} / محلة ${emp.mahalla || '-'} / زقاق ${emp.alley || '-'} / دار ${emp.houseNo || '-'}`;
                tableBody.innerHTML += `
                    <tr>
                        <td><img src="${emp.photo || emp.faceImage || 'https://via.placeholder.com/45'}" alt="صورة"></td>
                        <td><b>${emp.name}</b></td>
                        <td>${emp.specialty || '-'}</td>
                        <td>${emp.workplace || '-'}</td>
                        <td style="color: #0d9488; font-weight: 800;">${emp.salary || '0'} د.ع</td>
                        <td>${emp.address || fullAddress}</td>
                        <td>${emp.startDate || '-'}</td>
                        <td><button class="btn-delete" onclick="deleteEmployee(${index})">حذف</button></td>
                    </tr>
                `;
            });
        }

        document.getElementById('addEmployeeForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const newEmployee = {
                id: 'emp_' + Date.now(),
                name: document.getElementById('empName').value,
                specialty: document.getElementById('empSpecialty').value,
                workplace: document.getElementById('empWorkplace').value,
                salary: document.getElementById('empSalary').value,
                startDate: document.getElementById('empStartDate').value,
                province: document.getElementById('empProvince').value,
                city: document.getElementById('empCity').value,
                district: document.getElementById('empDistrict').value,
                mahalla: document.getElementById('empMahalla').value,
                alley: document.getElementById('empAlley').value,
                houseNo: document.getElementById('empHouseNo').value,
                photo: capturedImageData,
                username: "admin_added_" + Date.now()
            };

            const result = saveEmployee(newEmployee); // دالة الحفظ الموحدة من employees-sync.js
            if (result.success) {
                alert('تمت إضافة الموظف بنجاح!');
                document.getElementById('addEmployeeForm').reset();
                capturedImageData = "";
                captureStatus.style.display = 'none';
                loadEmployees();
            } else {
                alert('⚠️ ' + result.message);
            }
        });

        function deleteEmployee(index) {
            if (confirm('هل أنت متأكد من حذف هذا الموظف؟')) {
                const compKey = getCompanyKey();
                let employees = getAllEmployees();
                employees.splice(index, 1);
                localStorage.setItem(compKey, JSON.stringify(employees));
                loadEmployees();
            }
        }

        window.onload = loadEmployees;
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المراقب برو - إدارة وإضافة الموظفين</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #2e1a47 0%, #1f1135 50%, #100820 100%);
            color: #1e293b;
            min-height: 100vh;
            padding: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main-card {
            width: 100%;
            max-width: 1250px;
            background: #ffffff;
            padding: 45px;
            border-radius: 28px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 20px;
        }

        h2 {
            font-size: 32px;
            font-weight: 800;
            color: #0284c7;
        }

        .company-filter-box {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .company-filter-box input {
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 14px;
        }

        .btn-filter {
            background: #0284c7;
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        .section-title {
            font-size: 24px;
            font-weight: 800;
            color: #1e293b;
            margin-bottom: 20px;
            border-right: 5px solid #0284c7;
            padding-right: 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #f8fafc;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }

        th, td {
            padding: 16px;
            text-align: center;
            font-size: 15px;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background: #e0f2fe;
            color: #0369a1;
            font-weight: 800;
        }

        td img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #0284c7;
        }

        .btn-delete {
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .btn-delete:hover {
            background: #dc2626;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="top-nav">
            <h2>👥 قائمة الموظفين المسجلين والمربوطين</h2>
            <div class="company-filter-box">
                <input type="text" id="filterCompanyId" placeholder="أدخل رمز الشركة لعرضهم...">
                <button class="btn-filter" onclick="loadEmployeesByCompany()">عرض الموظفين</button>
            </div>
        </div>

        <h3 class="section-title" id="tableTitle">الموظفون التابعون للشركة النشطة حالياً</h3>
        <table>
            <thead>
                <tr>
                    <th>الصورة</th>
                    <th>اسم الشركة</th>
                    <th>اسم الموظف الكامل</th>
                    <th>العنوان الوظيفي</th>
                    <th>مكان العمل</th>
                    <th>اسم المستخدم</th>
                    <th>الإحداثيات (الموقع)</th>
                    <th>تاريخ التسجيل</th>
                    <th>الإجراءات</th>
                </tr>
            </thead>
            <tbody id="employeesTableBody">
                <!-- يتم تعبئتها تلقائياً -->
            </tbody>
        </table>
    </div>

    <script>
        // دالة لجلب وعرض الموظفين بناءً على رمز الشركة
        function loadEmployeesByCompany() {
            // جلب رمز الشركة من حقل البحث أو من الذاكرة المحلية
            let compId = document.getElementById('filterCompanyId').value.trim();
            if (!compId) {
                compId = localStorage.getItem('activeCompanyId') || '';
                document.getElementById('filterCompanyId').value = compId;
            } else {
                localStorage.setItem('activeCompanyId', compId);
            }

            const tableBody = document.getElementById('employeesTableBody');
            const titleEl = document.getElementById('tableTitle');
            
            if (!compId) {
                tableBody.innerHTML = `<tr><td colspan="9" style="color: #ef4444; padding: 25px;">⚠️ يرجى إدخال رمز الشركة لعرض الموظفين المسجلين!</td></tr>`;
                return;
            }

            titleEl.innerText = `الموظفون التابعون للشركة برمز: [ ${compId} ]`;

            // جلب البيانات من مفتاح التخزين الموحد
            const storageKey = `company_employees_${compId}`;
            const employees = JSON.parse(localStorage.getItem(storageKey) || '[]');
            
            tableBody.innerHTML = '';
            if (employees.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="9" style="color: #64748b; padding: 25px;">لا يوجد موظفون مسجلون حتى الآن لهذه الشركة.</td></tr>`;
                return;
            }
            
            employees.forEach((emp, index) => {
                tableBody.innerHTML += `
                    <tr>
                        <td><img src="${emp.photo || 'https://via.placeholder.com/45'}" alt="صورة"></td>
                        <td><b>${emp.companyName || '-'}</b></td>
                        <td><b>${emp.name}</b></td>
                        <td>${emp.specialty || '-'}</td>
                        <td>${emp.workplace || '-'}</td>
                        <td style="color: #0284c7; font-weight: bold;">${emp.username}</td>
                        <td style="font-size: 12px; color: #475569;">📍 ${emp.location || 'غير متوفر'}</td>
                        <td>${emp.startDate || '-'}</td>
                        <td><button class="btn-delete" onclick="deleteEmployee(${index}, '${compId}')">حذف</button></td>
                    </tr>
                `;
            });
        }

        // دالة حذف موظف
        function deleteEmployee(index, compId) {
            if (confirm('هل أنت متأكد من حذف هذا الموظف من قاعدة البيانات؟')) {
                const storageKey = `company_employees_${compId}`;
                let employees = JSON.parse(localStorage.getItem(storageKey) || '[]');
                employees.splice(index, 1);
                localStorage.setItem(storageKey, JSON.stringify(employees));
                loadEmployeesByCompany();
            }
        }

        // تحميل القائمة تلقائياً عند فتح الصفحة بناءً على آخر شركة نشطة
        window.onload = () => {
            const savedComp = localStorage.getItem('activeCompanyId');
            if (savedComp) {
                document.getElementById('filterCompanyId').value = savedComp;
                loadEmployeesByCompany();
            }
        };
    </script>
</body>
</html>

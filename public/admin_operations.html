<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>العمليات - الشفتات، السلف، الرواتب - نظام المراقب برو</title>
    <style>
        *{box-sizing:border-box}body{margin:0;background:#1e1b4b;color:#0f172a;font-family:'Segoe UI',Tahoma,sans-serif;padding:18px}.wrap{max-width:1500px;margin:auto;background:#fff;border-radius:18px;padding:20px;box-shadow:0 12px 35px #0005}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border:1px solid #e2e8f0;border-radius:14px;padding:14px 18px;margin-bottom:16px}.brand{font-size:24px;font-weight:900}.badge{font-size:12px;background:#0284c7;color:#fff;padding:6px 10px;border-radius:8px;margin-right:8px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 15px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;gap:7px;align-items:center;transition:transform .18s ease,box-shadow .18s ease}.btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px #0f172a26}.btn:active{transform:translateY(0) scale(.98)}.btn-blue{background:#0284c7;color:#fff}.btn-green{background:#10b981;color:#fff}.btn-red{background:#ef4444;color:#fff}.btn-orange{background:#f59e0b;color:#fff}.btn-purple{background:#8b5cf6;color:#fff}.filter-bar{display:flex;gap:10px;margin-bottom:20px;background:#f8fafc;padding:12px;border-radius:10px;border:1px solid #cbd5e1;flex-wrap:wrap;align-items:center}.filter-bar input,.filter-bar select{padding:9px 12px;border:2px solid #94a3b8;border-radius:8px;font-size:14px;outline:none;background:#fff;font-weight:600;flex:1;min-width:180px}.filter-bar input:focus,.filter-bar select:focus{border-color:#0284c7}.tab-bar{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;border-bottom:2px solid #e2e8f0;padding-bottom:10px}.tab-btn{padding:10px 20px;border:0;border-radius:10px 10px 0 0;font-weight:800;cursor:pointer;background:#f1f5f9;color:#64748b;transition:all .2s ease}.tab-btn.active{background:#0284c7;color:#fff}.tab-btn:hover{background:#e2e8f0;transform:translateY(-2px)}.tab-content{display:none}.tab-content.active{display:block}.table-container{width:100%;overflow-x:auto;border-radius:8px;border:1px solid #cbd5e1;margin-bottom:20px}table{width:100%;border-collapse:collapse;text-align:center;background:#fff}th{background:#1e293b;color:#fff;padding:12px;font-size:14px;font-weight:800;text-align:center}td{padding:10px 12px;border-bottom:1px solid #e2e8f0;font-size:14px;color:#1e293b;font-weight:600;text-align:center}tr:hover{background:#f1f5f9}.status-badge{padding:4px 10px;border-radius:20px;font-size:12px;font-weight:bold;display:inline-block}.status-active{background:#d1fae5;color:#065f46}.status-inactive{background:#f1f5f9;color:#64748b}.status-pending{background:#fef3c7;color:#92400e}.status-approved{background:#d1fae5;color:#065f46}.status-rejected{background:#fee2e2;color:#991b1b}.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);justify-content:center;align-items:center;z-index:999}.modal.show{display:flex}.modal-box{background:#fff;border-radius:16px;padding:30px;max-width:550px;width:90%;max-height:90vh;overflow-y:auto}.modal-box h3{margin-bottom:15px}.modal-box .form-group{margin-bottom:12px}.modal-box .form-group label{display:block;font-weight:bold;margin-bottom:4px}.modal-box .form-group input,.modal-box .form-group select{width:100%;padding:9px 12px;border:2px solid #94a3b8;border-radius:8px;font-size:14px;outline:none}.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}.status{margin-top:16px;background:#10b981;color:#fff;padding:12px;border-radius:10px;text-align:center;font-weight:900}.status.error{background:#ef4444}.status.warning{background:#f59e0b}.loading-spinner{display:inline-block;width:24px;height:24px;border:3px solid #f3f3f3;border-top:3px solid #0284c7;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.salary-card{background:#f8fafc;border:1px solid #cbd5e1;border-radius:12px;padding:18px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.salary-card .name{font-weight:bold;font-size:16px}.salary-card .amount{font-size:18px;font-weight:900;color:#10b981}.salary-card .details{font-size:13px;color:#64748b}@media(max-width:700px){body{padding:8px}.wrap{padding:12px}.top{padding:12px}.brand{font-size:20px}}
    </style>
</head>
<body>
<div class="wrap">
    <!-- الشريط العلوي -->
    <div class="top">
        <div class="brand">⚙️ العمليات <span id="companyBadge" class="badge">...</span></div>
        <div class="actions">
            <button class="btn btn-purple" onclick="goHome()">🏠 العودة للرئيسية</button>
        </div>
    </div>

    <!-- أشرطة التبويب -->
    <div class="tab-bar">
        <button class="tab-btn active" data-tab="shifts" onclick="switchTab('shifts')">⏰ الشفتات</button>
        <button class="tab-btn" data-tab="loans" onclick="switchTab('loans')">💳 السلف</button>
        <button class="tab-btn" data-tab="salaries" onclick="switchTab('salaries')">💰 الرواتب</button>
    </div>

    <!-- ============================================================ -->
    <!-- تبويب الشفتات -->
    <div id="tab-shifts" class="tab-content active">
        <div class="filter-bar">
            <button class="btn btn-green" onclick="showShiftModal()">➕ إضافة شفت</button>
            <button class="btn btn-blue" onclick="loadShifts()">🔄 تحديث</button>
        </div>
        <div class="table-container">
            <table>
                <thead><tr><th>#</th><th>اسم الشفت</th><th>وقت الحضور</th><th>وقت الانصراف</th><th>فترة السماح</th><th>الإجراءات</th></tr></thead>
                <tbody id="shiftsTable"><tr><td colspan="6"><div class="loading-spinner"></div> جاري التحميل...</td></tr></tbody>
            </table>
        </div>
    </div>

    <!-- تبويب السلف -->
    <div id="tab-loans" class="tab-content">
        <div class="filter-bar">
            <button class="btn btn-green" onclick="showLoanModal()">➕ إضافة سلفة</button>
            <button class="btn btn-blue" onclick="loadLoans()">🔄 تحديث</button>
        </div>
        <div class="table-container">
            <table>
                <thead><tr><th>#</th><th>الموظف</th><th>المبلغ</th><th>المتبقي</th><th>عدد الأقساط</th><th>الحالة</th><th>الإجراءات</th></tr></thead>
                <tbody id="loansTable"><tr><td colspan="7"><div class="loading-spinner"></div> جاري التحميل...</td></tr></tbody>
            </table>
        </div>
    </div>

    <!-- تبويب الرواتب -->
    <div id="tab-salaries" class="tab-content">
        <div class="filter-bar">
            <button class="btn btn-green" onclick="calculateSalaries()">🧮 حساب الرواتب</button>
            <button class="btn btn-blue" onclick="loadSalaries()">🔄 تحديث</button>
        </div>
        <div id="salariesContainer"><div class="loading-spinner"></div> جاري التحميل...</div>
    </div>

    <div id="status" class="status">✓ جاري تحميل البيانات...</div>
</div>

<!-- مودال إضافة شفت -->
<div class="modal" id="shiftModal">
    <div class="modal-box">
        <h3>➕ إضافة شفت جديد</h3>
        <form onsubmit="saveShift(event)">
            <div class="form-group"><label>اسم الشفت</label><input type="text" id="shiftName" required></div>
            <div class="form-group"><label>وقت الحضور</label><input type="time" id="shiftCheckIn" required></div>
            <div class="form-group"><label>وقت الانصراف</label><input type="time" id="shiftCheckOut" required></div>
            <div class="form-group"><label>فترة السماح (دقائق)</label><input type="number" id="shiftGrace" value="15"></div>
            <div class="modal-actions">
                <button type="button" class="btn btn-red" onclick="closeModal('shiftModal')">إلغاء</button>
                <button type="submit" class="btn btn-green">💾 حفظ</button>
            </div>
        </form>
    </div>
</div>

<!-- مودال إضافة سلفة -->
<div class="modal" id="loanModal">
    <div class="modal-box">
        <h3>💳 إضافة سلفة</h3>
        <form onsubmit="saveLoan(event)">
            <div class="form-group"><label>الموظف</label>
                <select id="loanEmployee" required><option value="">اختر موظف...</option></select>
            </div>
            <div class="form-group"><label>المبلغ</label><input type="number" id="loanAmount" required></div>
            <div class="form-group"><label>عدد الأقساط</label><input type="number" id="loanInstallments" value="3" required></div>
            <div class="modal-actions">
                <button type="button" class="btn btn-red" onclick="closeModal('loanModal')">إلغاء</button>
                <button type="submit" class="btn btn-green">💾 حفظ</button>
            </div>
        </form>
    </div>
</div>

<script>
    // ================================================================
    // 🔗 رابط السيرفر
    // ================================================================
    const API = location.origin;
    let token = '', companyId = '';

    // ================================================================
    // 📦 إدارة الجلسة
    // ================================================================
    function getSession() {
        try { return JSON.parse(localStorage.getItem('almoraqeb_admin_session') || '{}'); } 
        catch { return {}; }
    }

    function getCompanyId() {
        const s = getSession();
        return String(s.companyId || new URLSearchParams(location.search).get('company') || localStorage.getItem('companyId') || '').trim();
    }

    async function auth() {
        token = sessionStorage.getItem('almoraqeb_admin_token') || '';
        companyId = getCompanyId();
        if (!token || !companyId) { location.href = 'admin_login.html'; return false; }
        try {
            const r = await fetch(API + '/api/admin/session', {
                headers: { 'Authorization': 'Bearer ' + token },
                cache: 'no-store'
            });
            const d = await r.json();
            if (!r.ok || !d.success) throw 0;
            document.getElementById('companyBadge').textContent = companyId;
            return true;
        } catch {
            location.href = 'admin_login.html';
            return false;
        }
    }

    function goHome() {
        location.href = 'index.html?company=' + encodeURIComponent(companyId);
    }

    function closeModal(id) {
        document.getElementById(id).classList.remove('show');
    }

    function showStatus(text, type = '') {
        const el = document.getElementById('status');
        el.textContent = text;
        el.className = 'status' + (type ? ' ' + type : '');
    }

    // ================================================================
    // 📑 التبويبات
    // ================================================================
    function switchTab(tab) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById('tab-' + tab).classList.add('active');
        document.querySelector('.tab-btn[data-tab="' + tab + '"]').classList.add('active');
        
        if (tab === 'shifts') loadShifts();
        else if (tab === 'loans') loadLoans();
        else if (tab === 'salaries') loadSalaries();
    }

    // ================================================================
    // ⏰ الشفتات
    // ================================================================
    async function loadShifts() {
        const tbody = document.getElementById('shiftsTable');
        tbody.innerHTML = `<tr><td colspan="6"><div class="loading-spinner"></div></td></tr>`;
        try {
            const r = await fetch(API + '/api/shifts?companyId=' + encodeURIComponent(companyId), {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            const d = await r.json();
            if (r.ok && d.success) {
                const shifts = d.shifts || [];
                tbody.innerHTML = shifts.length === 0 ? 
                    `<tr><td colspan="6" style="color:#64748b;">لا توجد شفتات</td></tr>` :
                    shifts.map((s, i) => `
                        <tr>
                            <td>${i+1}</td>
                            <td><b>${s.name}</b></td>
                            <td>${s.checkIn}</td>
                            <td>${s.checkOut}</td>
                            <td>${s.gracePeriod || 0} دقيقة</td>
                            <td>
                                <button class="btn btn-red" style="padding:4px 10px;font-size:11px;" onclick="deleteShift('${s._id}')">🗑️</button>
                            </td>
                        </tr>
                    `).join('');
                showStatus('✅ تم تحميل ' + shifts.length + ' شفت', '');
            } else {
                tbody.innerHTML = `<tr><td colspan="6" style="color:#ef4444;">❌ فشل التحميل</td></tr>`;
            }
        } catch {
            tbody.innerHTML = `<tr><td colspan="6" style="color:#ef4444;">❌ فشل الاتصال</td></tr>`;
        }
    }

    function showShiftModal() {
        document.getElementById('shiftModal').classList.add('show');
        document.getElementById('shiftName').value = '';
        document.getElementById('shiftCheckIn').value = '';
        document.getElementById('shiftCheckOut').value = '';
        document.getElementById('shiftGrace').value = '15';
    }

    async function saveShift(e) {
        e.preventDefault();
        const data = {
            companyId: companyId,
            name: document.getElementById('shiftName').value,
            checkIn: document.getElementById('shiftCheckIn').value,
            checkOut: document.getElementById('shiftCheckOut').value,
            gracePeriod: parseInt(document.getElementById('shiftGrace').value) || 0
        };
        try {
            const r = await fetch(API + '/api/shifts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify(data)
            });
            const result = await r.json();
            if (r.ok && result.success) {
                alert('✅ تم إضافة الشفت بنجاح');
                closeModal('shiftModal');
                loadShifts();
            } else {
                alert('❌ ' + (result.message || 'فشل الإضافة'));
            }
        } catch {
            alert('❌ فشل الاتصال بالسيرفر');
        }
    }

    async function deleteShift(id) {
        if (!confirm('هل أنت متأكد من حذف هذا الشفت؟')) return;
        try {
            const r = await fetch(API + '/api/shifts/' + id, {
                method: 'DELETE',
                headers: { 'Authorization': 'Bearer ' + token }
            });
            const result = await r.json();
            if (r.ok && result.success) {
                alert('✅ تم الحذف');
                loadShifts();
            } else {
                alert('❌ ' + (result.message || 'فشل الحذف'));
            }
        } catch {
            alert('❌ فشل الاتصال بالسيرفر');
        }
    }

    // ================================================================
    // 💳 السلف
    // ================================================================
    async function loadLoans() {
        const tbody = document.getElementById('loansTable');
        tbody.innerHTML = `<tr><td colspan="7"><div class="loading-spinner"></div></td></tr>`;
        try {
            const r = await fetch(API + '/api/loans?companyId=' + encodeURIComponent(companyId), {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            const d = await r.json();
            if (r.ok && d.success) {
                const loans = d.loans || [];
                tbody.innerHTML = loans.length === 0 ?
                    `<tr><td colspan="7" style="color:#64748b;">لا توجد سلف</td></tr>` :
                    loans.map((l, i) => `
                        <tr>
                            <td>${i+1}</td>
                            <td><b>${l.employeeName}</b></td>
                            <td>${Number(l.amount).toLocaleString()} د.ع</td>
                            <td>${Number(l.remaining).toLocaleString()} د.ع</td>
                            <td>${l.installments || 0}</td>
                            <td><span class="status-badge ${l.status === 'paid' ? 'status-approved' : 'status-pending'}">${l.status === 'paid' ? '✅ مسدد' : '⏳ قيد التقسيط'}</span></td>
                            <td>
                                ${l.status !== 'paid' ? `<button class="btn btn-green" style="padding:4px 10px;font-size:11px;" onclick="payLoan('${l._id}')">دفع قسط</button>` : ''}
                                <button class="btn btn-red" style="padding:4px 10px;font-size:11px;" onclick="deleteLoan('${l._id}')">🗑️</button>
                            </td>
                        </tr>
                    `).join('');
                showStatus('✅ تم تحميل ' + loans.length + ' سلفة', '');
            } else {
                tbody.innerHTML = `<tr><td colspan="7" style="color:#ef4444;">❌ فشل التحميل</td></tr>`;
            }
        } catch {
            tbody.innerHTML = `<tr><td colspan="7" style="color:#ef4444;">❌ فشل الاتصال</td></tr>`;
        }
    }

    async function showLoanModal() {
        // جلب الموظفين لملء القائمة المنسدلة
        try {
            const r = await fetch(API + '/api/employees?companyId=' + encodeURIComponent(companyId), {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            const d = await r.json();
            const select = document.getElementById('loanEmployee');
            select.innerHTML = '<option value="">اختر موظف...</option>';
            if (d.success && d.employees) {
                d.employees.forEach(e => {
                    select.innerHTML += `<option value="${e._id}">${e.name}</option>`;
                });
            }
            document.getElementById('loanModal').classList.add('show');
            document.getElementById('loanAmount').value = '';
            document.getElementById('loanInstallments').value = '3';
        } catch {
            alert('❌ فشل تحميل قائمة الموظفين');
        }
    }

    async function saveLoan(e) {
        e.preventDefault();
        const employeeId = document.getElementById('loanEmployee').value;
        const amount = parseInt(document.getElementById('loanAmount').value);
        const installments = parseInt(document.getElementById('loanInstallments').value);
        
        if (!employeeId) { alert('⚠️ يرجى اختيار موظف'); return; }

        // جلب اسم الموظف
        try {
            const r = await fetch(API + '/api/employees/' + employeeId, {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            const d = await r.json();
            const employeeName = d.success && d.employee ? d.employee.name : 'غير معروف';

            const data = {
                companyId: companyId,
                employeeId: employeeId,
                employeeName: employeeName,
                amount: amount,
                remaining: amount,
                installments: installments,
                status: 'active'
            };

            const res = await fetch(API + '/api/loans', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify(data)
            });
            const result = await res.json();
            if (res.ok && result.success) {
                alert('✅ تم إضافة السلفة بنجاح');
                closeModal('loanModal');
                loadLoans();
            } else {
                alert('❌ ' + (result.message || 'فشل الإضافة'));
            }
        } catch {
            alert('❌ فشل الاتصال بالسيرفر');
        }
    }

    async function payLoan(id) {
        if (!confirm('هل أنت متأكد من دفع قسط؟')) return;
        try {
            const r = await fetch(API + '/api/loans/' + id + '/pay', {
                method: 'PUT',
                headers: { 'Authorization': 'Bearer ' + token }
            });
            const result = await r.json();
            if (r.ok && result.success) {
                alert('✅ تم دفع القسط بنجاح');
                loadLoans();
            } else {
                alert('❌ ' + (result.message || 'فشل الدفع'));
            }
        } catch {
            alert('❌ فشل الاتصال بالسيرفر');
        }
    }

    async function deleteLoan(id) {
        if (!confirm('هل أنت متأكد من حذف هذه السلفة؟')) return;
        try {
            const r = await fetch(API + '/api/loans/' + id, {
                method: 'DELETE',
                headers: { 'Authorization': 'Bearer ' + token }
            });
            const result = await r.json();
            if (r.ok && result.success) {
                alert('✅ تم الحذف');
                loadLoans();
            } else {
                alert('❌ ' + (result.message || 'فشل الحذف'));
            }
        } catch {
            alert('❌ فشل الاتصال بالسيرفر');
        }
    }

    // ================================================================
    // 💰 الرواتب
    // ================================================================
    async function loadSalaries() {
        const container = document.getElementById('salariesContainer');
        container.innerHTML = `<div class="loading-spinner"></div> جاري التحميل...`;
        try {
            const r = await fetch(API + '/api/salaries?companyId=' + encodeURIComponent(companyId), {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            const d = await r.json();
            if (r.ok && d.success) {
                const salaries = d.salaries || [];
                if (salaries.length === 0) {
                    container.innerHTML = `<p style="text-align:center;color:#64748b;padding:20px;">لا توجد بيانات رواتب</p>`;
                } else {
                    let html = '';
                    let total = 0;
                    salaries.forEach(s => {
                        total += Number(s.salary || 0);
                        html += `
                            <div class="salary-card">
                                <div>
                                    <div class="name">${s.name}</div>
                                    <div class="details">${s.specialty || '—'} | ${s.location || '—'}</div>
                                </div>
                                <div class="amount">${Number(s.salary || 0).toLocaleString()} د.ع</div>
                            </div>
                        `;
                    });
                    html += `<div style="text-align:center;margin-top:15px;font-weight:900;color:#0284c7;font-size:18px;">إجمالي الرواتب: ${total.toLocaleString()} د.ع</div>`;
                    container.innerHTML = html;
                    showStatus('✅ تم تحميل ' + salaries.length + ' راتب', '');
                }
            } else {
                container.innerHTML = `<p style="text-align:center;color:#ef4444;">❌ فشل تحميل الرواتب</p>`;
            }
        } catch {
            container.innerHTML = `<p style="text-align:center;color:#ef4444;">❌ فشل الاتصال بالسيرفر</p>`;
        }
    }

    async function calculateSalaries() {
        showStatus('🧮 جاري حساب الرواتب...', 'warning');
        try {
            const r = await fetch(API + '/api/salaries/calculate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify({ companyId: companyId })
            });
            const result = await r.json();
            if (r.ok && result.success) {
                showStatus('✅ تم حساب الرواتب بنجاح', '');
                loadSalaries();
            } else {
                showStatus('❌ ' + (result.message || 'فشل الحساب'), 'error');
            }
        } catch {
            showStatus('❌ فشل الاتصال بالسيرفر', 'error');
        }
    }

    // ================================================================
    // 🚀 التهيئة عند التحميل
    // ================================================================
    (async () => {
        if (await auth()) {
            // تحديد التبويب من رابط الصفحة
            const tab = new URLSearchParams(location.search).get('tab') || 'shifts';
            switchTab(tab);
        }
    })();
</script>
</body>
</html>

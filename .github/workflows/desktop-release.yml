name: Build desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build: desktop:build:linux
            artifact: AppImage
            path: dist-desktop/*.AppImage
          - os: windows-latest
            build: desktop:build:win
            artifact: Windows
            path: dist-desktop/*.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build ${{ matrix.artifact }}
        run: npm run ${{ matrix.build }}

      - name: Store build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlMoraqebPro-${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: desktop
    runs-on: ubuntu-latest

    steps:
      - name: Download desktop files
        uses: actions/download-artifact@v4
        with:
          pattern: AlMoraqebPro-*
          path: release-assets
          merge-multiple: true

      - name: Create release with all desktop files
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
name: Deploy Alarjwan Static Site

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/deploy-alarjwan-site.yml'
  workflow_dispatch:

concurrency:
  group: alarjwan-static-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Alarjwan static site without touching app services
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          : "${ORACLE_HOST:?Missing ORACLE_HOST secret}"
          : "${ORACLE_USER:?Missing ORACLE_USER secret}"
          : "${ORACLE_SSH_KEY:?Missing ORACLE_SSH_KEY secret}"
          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          SRC="$HOME/Alarjwan-Website-source"
          WEBROOT="/usr/share/nginx/html/alarjwan"
          DOMAIN="alarjwan.duckdns.org"
          REPO="https://github.com/arjwan/AlMoraqebPro-Website.git"
          if [ ! -d "$SRC/.git" ]; then
            git clone --branch alarjwan-website --single-branch "$REPO" "$SRC"
          else
            git -C "$SRC" fetch origin alarjwan-website
            git -C "$SRC" reset --hard origin/alarjwan-website
          fi
          test -f "$SRC/alarjwan-site/index.html"
          test -f "$SRC/alarjwan-site/sitemap.xml"
          test -f "$SRC/alarjwan-site/robots.txt"
          test -f "$SRC/alarjwan-site/products/ittisal.html"
          sudo mkdir -p "$WEBROOT"
          sudo rsync -a --delete "$SRC/alarjwan-site/" "$WEBROOT/"
          sudo find "$WEBROOT" -type d -exec chmod 755 {} +
          sudo find "$WEBROOT" -type f -exec chmod 644 {} +
          sudo restorecon -RF "$WEBROOT" 2>/dev/null || true
          sudo nginx -t
          sudo systemctl reload nginx
          echo '=== LOCAL STATIC FILES ==='
          grep -q 'الأرجوان للبرمجيات' "$WEBROOT/index.html"
          grep -q 'شنو منو اتصال' "$WEBROOT/products/ittisal.html"
          echo 'static files verified'
          echo '=== APP SERVICES REMAIN RUNNING ==='
          sudo systemctl is-active --quiet shno-mano-tech.service
          echo 'shno-mano-tech.service active'
          sudo systemctl is-active --quiet almoraqebpro.service
          echo 'almoraqebpro.service active'
          echo '=== PUBLIC HTTPS ==='
          curl --fail --location --silent --show-error "https://${DOMAIN}/" | grep -q 'الأرجوان للبرمجيات'
          curl --fail --location --silent --show-error "https://${DOMAIN}/products/ittisal.html" | grep -q 'شنو منو اتصال'
          curl --fail --location --silent --show-error "https://${DOMAIN}/robots.txt" >/dev/null
          curl --fail --location --silent --show-error "https://${DOMAIN}/sitemap.xml" >/dev/null
          echo 'ALARJWAN_HTTPS_READY=1'
          REMOTE
          rm -f ~/.ssh/oracle_key

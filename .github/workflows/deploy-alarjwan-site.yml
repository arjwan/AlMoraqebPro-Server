name: Deploy Alarjwan Static Site

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/deploy-alarjwan-site.yml'
  workflow_dispatch:

concurrency:
  group: alarjwan-static-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Arjwan and public Shno SEO pages safely
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          : "${ORACLE_HOST:?Missing ORACLE_HOST secret}"
          : "${ORACLE_USER:?Missing ORACLE_USER secret}"
          : "${ORACLE_SSH_KEY:?Missing ORACLE_SSH_KEY secret}"

          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          ARJ_SRC="$HOME/Alarjwan-Website-source"
          ARJ_ROOT="/usr/share/nginx/html/alarjwan"
          ARJ_DOMAIN="alarjwan.duckdns.org"
          ARJ_REPO="https://github.com/arjwan/AlMoraqebPro-Website.git"
          SHNO_ROOT="/usr/share/nginx/html/shno-mano"
          SHNO_DOMAIN="shino-mino-tak-tak.duckdns.org"

          if [ ! -d "$ARJ_SRC/.git" ]; then
            git clone --branch alarjwan-website --single-branch "$ARJ_REPO" "$ARJ_SRC"
          else
            git -C "$ARJ_SRC" fetch origin alarjwan-website
            git -C "$ARJ_SRC" reset --hard origin/alarjwan-website
          fi

          test -f "$ARJ_SRC/alarjwan-site/index.html"
          test -f "$ARJ_SRC/alarjwan-site/robots.txt"
          test -f "$ARJ_SRC/alarjwan-site/sitemap.xml"
          test -f "$ARJ_SRC/alarjwan-site/products/almoraqebpro.html"
          test -f "$ARJ_SRC/alarjwan-site/products/shenoo-menoo.html"
          test -f "$ARJ_SRC/alarjwan-site/products/ittisal.html"

          sudo mkdir -p "$ARJ_ROOT/downloads"
          sudo rsync -a --delete --exclude 'downloads/' "$ARJ_SRC/alarjwan-site/" "$ARJ_ROOT/"
          sudo restorecon -RF "$ARJ_ROOT" 2>/dev/null || true

          # Downloads were published and verified in the previous release; preserve them on every site sync.
          for f in AlMoraqebPro-4.0.3.apk Shno-Mano-TakTak-2.0.0.apk Shno-Mano-Ittisal-1.3.0.apk; do
            sudo test -s "$ARJ_ROOT/downloads/$f"
          done

          # Publish only public crawl/download files for Shno Mano; do not touch app pages or Bing verification.
          curl --fail --silent --show-error https://raw.githubusercontent.com/arjwan/shenoo-menoo-tak-tak/main/download.html -o /tmp/shno-download.html
          curl --fail --silent --show-error https://raw.githubusercontent.com/arjwan/shenoo-menoo-tak-tak/main/sitemap.xml -o /tmp/shno-sitemap.xml
          curl --fail --silent --show-error https://raw.githubusercontent.com/arjwan/shenoo-menoo-tak-tak/main/robots.txt -o /tmp/shno-robots.txt
          sudo test -d "$SHNO_ROOT"
          sudo install -m 0644 /tmp/shno-download.html "$SHNO_ROOT/download.html"
          sudo install -m 0644 /tmp/shno-sitemap.xml "$SHNO_ROOT/sitemap.xml"
          sudo install -m 0644 /tmp/shno-robots.txt "$SHNO_ROOT/robots.txt"
          sudo restorecon -F "$SHNO_ROOT/download.html" "$SHNO_ROOT/sitemap.xml" "$SHNO_ROOT/robots.txt" 2>/dev/null || true

          sudo nginx -t
          sudo systemctl reload nginx
          sudo systemctl is-active --quiet shno-mano-tech.service
          sudo systemctl is-active --quiet almoraqebpro.service

          curl --fail --location --silent --show-error "https://${ARJ_DOMAIN}/" | grep -q 'الأرجوان للبرمجيات'
          curl --fail --location --silent --show-error "https://${ARJ_DOMAIN}/products/almoraqebpro.html" | grep -q 'تحميل APK مباشر'
          curl --fail --location --silent --show-error "https://${ARJ_DOMAIN}/products/shenoo-menoo.html" | grep -q 'Shno-Mano-TakTak-2.0.0.apk'
          curl --fail --location --silent --show-error "https://${ARJ_DOMAIN}/products/ittisal.html" | grep -q 'Shno-Mano-Ittisal-1.3.0.apk'
          curl --fail --location --silent --show-error "https://${ARJ_DOMAIN}/robots.txt" >/dev/null
          curl --fail --location --silent --show-error "https://${ARJ_DOMAIN}/sitemap.xml" >/dev/null
          for f in AlMoraqebPro-4.0.3.apk Shno-Mano-TakTak-2.0.0.apk Shno-Mano-Ittisal-1.3.0.apk; do
            curl --fail --location --silent --show-error --range 0-15 "https://${ARJ_DOMAIN}/downloads/$f" >/dev/null
          done

          curl --fail --location --silent --show-error "https://${SHNO_DOMAIN}/download.html" | grep -q 'تحميل APK مباشر'
          curl --fail --location --silent --show-error "https://${SHNO_DOMAIN}/robots.txt" >/dev/null
          curl --fail --location --silent --show-error "https://${SHNO_DOMAIN}/sitemap.xml" | grep -q 'download.html'

          echo 'ARJWAN_SITE_READY=1'
          echo 'ALL_DIRECT_APKS_READY=1'
          echo 'SHNO_SEO_DOWNLOAD_READY=1'
          REMOTE

          rm -f ~/.ssh/oracle_key

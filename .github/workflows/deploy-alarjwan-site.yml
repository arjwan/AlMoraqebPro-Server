name: Deploy Alarjwan Static Site

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/deploy-alarjwan-site.yml'
  workflow_dispatch:

concurrency:
  group: alarjwan-static-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Arjwan and harden public Shno pages safely
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          : "${ORACLE_HOST:?Missing ORACLE_HOST secret}"
          : "${ORACLE_USER:?Missing ORACLE_USER secret}"
          : "${ORACLE_SSH_KEY:?Missing ORACLE_SSH_KEY secret}"

          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          ARJ_SRC="$HOME/Alarjwan-Website-source"
          ARJ_ROOT="/usr/share/nginx/html/alarjwan"
          ARJ_DOMAIN="alarjwan.duckdns.org"
          ARJ_REPO="https://github.com/arjwan/AlMoraqebPro-Website.git"
          SHNO_ROOT="/usr/share/nginx/html/shno-mano"
          SHNO_DOMAIN="shino-mino-tak-tak.duckdns.org"
          SHNO_RAW="https://raw.githubusercontent.com/arjwan/shenoo-menoo-tak-tak/main"

          if [ ! -d "$ARJ_SRC/.git" ]; then
            git clone --branch alarjwan-website --single-branch "$ARJ_REPO" "$ARJ_SRC"
          else
            git -C "$ARJ_SRC" fetch origin alarjwan-website
            git -C "$ARJ_SRC" reset --hard origin/alarjwan-website
          fi

          test -f "$ARJ_SRC/alarjwan-site/index.html"
          test -f "$ARJ_SRC/alarjwan-site/robots.txt"
          test -f "$ARJ_SRC/alarjwan-site/sitemap.xml"
          test -f "$ARJ_SRC/alarjwan-site/products/almoraqebpro.html"
          test -f "$ARJ_SRC/alarjwan-site/products/shenoo-menoo.html"
          test -f "$ARJ_SRC/alarjwan-site/products/ittisal.html"

          sudo mkdir -p "$ARJ_ROOT/downloads"
          sudo rsync -a --delete --exclude 'downloads/' "$ARJ_SRC/alarjwan-site/" "$ARJ_ROOT/"
          sudo restorecon -RF "$ARJ_ROOT" 2>/dev/null || true

          for f in AlMoraqebPro-4.0.3.apk Shno-Mano-TakTak-2.0.0.apk Shno-Mano-Ittisal-1.3.0.apk; do
            sudo test -s "$ARJ_ROOT/downloads/$f"
          done

          # Refresh public discovery files plus the two first-party auth pages.
          for f in download.html sitemap.xml robots.txt signin.html signup.html; do
            curl --fail --silent --show-error "$SHNO_RAW/$f" -o "/tmp/shno-$f"
          done

          # Login and signup are required application pages, not search landing pages.
          # Add explicit noindex metadata and first-party ownership/canonical signals without changing auth logic.
          python3 - <<'PY'
          from pathlib import Path
          domain = 'https://shino-mino-tak-tak.duckdns.org'
          for name in ('signin.html', 'signup.html'):
              p = Path('/tmp/shno-' + name)
              s = p.read_text(encoding='utf-8')
              if 'name="robots" content="noindex,nofollow,noarchive"' not in s:
                  s = s.replace('<meta name="viewport"', '<meta name="robots" content="noindex,nofollow,noarchive">\n  <link rel="canonical" href="%s/%s">\n  <meta name="viewport"' % (domain, name), 1)
              marker = '<h2>تسجيل الدخول</h2>' if name == 'signin.html' else '<h2>إنشاء حساب</h2>'
              trust = marker + '\n      <p style="margin:6px 0 14px;color:#a9adc1;font-size:13px;line-height:1.7">هذه الصفحة الرسمية لحسابات شنو منو تك تك على النطاق shino-mino-tak-tak.duckdns.org، ولا نطلب بيانات دخول تخص أي خدمة أو موقع آخر.</p>'
              if 'هذه الصفحة الرسمية لحسابات شنو منو تك تك' not in s:
                  s = s.replace(marker, trust, 1)
              p.write_text(s, encoding='utf-8')
          PY

          sudo test -d "$SHNO_ROOT"
          sudo install -m 0644 /tmp/shno-download.html "$SHNO_ROOT/download.html"
          sudo install -m 0644 /tmp/shno-sitemap.xml "$SHNO_ROOT/sitemap.xml"
          sudo install -m 0644 /tmp/shno-robots.txt "$SHNO_ROOT/robots.txt"
          sudo install -m 0644 /tmp/shno-signin.html "$SHNO_ROOT/signin.html"
          sudo install -m 0644 /tmp/shno-signup.html "$SHNO_ROOT/signup.html"

          # Do not expose obsolete prototypes/backups from the public static root.
          sudo rm -rf "$SHNO_ROOT/backups" "$SHNO_ROOT/legacy-prototype"
          sudo restorecon -RF "$SHNO_ROOT" 2>/dev/null || true

          sudo nginx -t
          sudo systemctl reload nginx
          sudo systemctl is-active --quiet shno-mano-tech.service
          sudo systemctl is-active --quiet almoraqebpro.service

          curl --fail --location --silent --show-error "https://${ARJ_DOMAIN}/" | grep -q 'الأرجوان للبرمجيات'
          curl --fail --location --silent --show-error "https://${ARJ_DOMAIN}/products/almoraqebpro.html" | grep -q 'تحميل APK مباشر'
          curl --fail --location --silent --show-error "https://${ARJ_DOMAIN}/products/shenoo-menoo.html" | grep -q 'Shno-Mano-TakTak-2.0.0.apk'
          curl --fail --location --silent --show-error "https://${ARJ_DOMAIN}/products/ittisal.html" | grep -q 'Shno-Mano-Ittisal-1.3.0.apk'
          for f in AlMoraqebPro-4.0.3.apk Shno-Mano-TakTak-2.0.0.apk Shno-Mano-Ittisal-1.3.0.apk; do
            curl --fail --location --silent --show-error --range 0-15 "https://${ARJ_DOMAIN}/downloads/$f" >/dev/null
          done

          curl --fail --location --silent --show-error "https://${SHNO_DOMAIN}/download.html" | grep -q 'تحميل APK مباشر'
          curl --fail --location --silent --show-error "https://${SHNO_DOMAIN}/robots.txt" | grep -q 'Disallow: /signin.html'
          ! curl --fail --location --silent --show-error "https://${SHNO_DOMAIN}/sitemap.xml" | grep -q '/signin.html'
          ! curl --fail --location --silent --show-error "https://${SHNO_DOMAIN}/sitemap.xml" | grep -q '/signup.html'
          curl --fail --location --silent --show-error "https://${SHNO_DOMAIN}/signin.html" | grep -q 'noindex,nofollow,noarchive'
          curl --fail --location --silent --show-error "https://${SHNO_DOMAIN}/signup.html" | grep -q 'noindex,nofollow,noarchive'
          curl --fail --location --silent --show-error "https://${SHNO_DOMAIN}/signin.html" | grep -q 'هذه الصفحة الرسمية لحسابات شنو منو تك تك'
          test ! -e "$SHNO_ROOT/backups"
          test ! -e "$SHNO_ROOT/legacy-prototype"

          echo 'ARJWAN_SITE_READY=1'
          echo 'ALL_DIRECT_APKS_READY=1'
          echo 'SHNO_AUTH_SEARCH_HARDENED=1'
          echo 'SHNO_LEGACY_PUBLIC_CONTENT_REMOVED=1'
          REMOTE

          rm -f ~/.ssh/oracle_key

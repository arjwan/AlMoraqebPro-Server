name: Deploy Shno Mano staged registration

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/deploy-shno-staged-registration.yml'

permissions:
  contents: read

concurrency:
  group: shno-mano-oracle-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy staged registration through authorized Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          : "${ORACLE_HOST:?Missing ORACLE_HOST secret}"
          : "${ORACLE_USER:?Missing ORACLE_USER secret}"
          : "${ORACLE_SSH_KEY:?Missing ORACLE_SSH_KEY secret}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          project="$HOME/shenoo-menoo-tak-tak"
          test -d "$project/.git"
          cd "$project"
          git fetch origin main
          git pull --ff-only origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          npm ci
          npm test

          umask 077
          test -f .env
          cp .env ".env.backup-$(date -u +%Y%m%dT%H%M%SZ)"
          filtered="$(mktemp)"
          grep -Ev '^REGISTRATION_OTP_REQUIRED=' .env > "$filtered" || true
          printf 'REGISTRATION_OTP_REQUIRED=false\n' >> "$filtered"
          mv "$filtered" .env
          chmod 600 .env

          sudo install -m 0644 signup.html /usr/share/nginx/html/shno-mano/signup.html
          sudo install -m 0644 signin.html /usr/share/nginx/html/shno-mano/signin.html
          sudo install -m 0644 developer.html /usr/share/nginx/html/shno-mano/developer.html
          sudo install -m 0644 invite-friends.html /usr/share/nginx/html/shno-mano/invite-friends.html
          sudo install -m 0644 friend-qr.html /usr/share/nginx/html/shno-mano/friend-qr.html
          sudo install -m 0644 friends.html /usr/share/nginx/html/shno-mano/friends.html
          sudo install -m 0644 taktak.html /usr/share/nginx/html/shno-mano/taktak.html
          sudo install -m 0644 friends.js /usr/share/nginx/html/shno-mano/friends.js
          sudo install -m 0644 social-api.js /usr/share/nginx/html/shno-mano/social-api.js
          sudo restorecon -F /usr/share/nginx/html/shno-mano/signup.html /usr/share/nginx/html/shno-mano/signin.html /usr/share/nginx/html/shno-mano/developer.html || true

          sudo systemctl restart shno-mano-tech.service
          local_config=""
          for attempt in $(seq 1 30); do
            if local_config="$(curl --fail --silent --show-error http://127.0.0.1:3000/api/auth/registration-config 2>/dev/null)"; then
              break
            fi
            sleep 2
          done
          if [ -z "$local_config" ]; then
            sudo systemctl --no-pager --full status shno-mano-tech.service || true
            sudo journalctl --no-pager -u shno-mano-tech.service -n 100 || true
            exit 1
          fi
          sudo systemctl is-active --quiet shno-mano-tech.service
          printf '%s' "$local_config" | grep -q '"otpRequired":false'
          printf '%s' "$local_config" | grep -q '"phoneRequired":true'
          echo "deployed_head=$(git rev-parse --short HEAD)"
          echo "local_registration_config=$local_config"
          REMOTE

          public_config=""
          for attempt in $(seq 1 15); do
            if public_config="$(curl --fail --silent --show-error https://shino-mino-tak-tak.duckdns.org/api/auth/registration-config 2>/dev/null)"; then
              break
            fi
            sleep 2
          done
          test -n "$public_config"
          printf '%s' "$public_config" | grep -q '"otpRequired":false'
          printf '%s' "$public_config" | grep -q '"phoneRequired":true'
          signup_page="$(curl --fail --silent --show-error https://shino-mino-tak-tak.duckdns.org/signup.html)"
          developer_page="$(curl --fail --silent --show-error -H 'Cache-Control: no-cache' "https://shino-mino-tak-tak.duckdns.org/developer.html?deploy=$(date +%s)")"
          grep -q 'verificationRequired' <<<"$signup_page"
          grep -q 'createUserForm' <<<"$developer_page"
          grep -q 'href="#create-user"' <<<"$developer_page"
          grep -q 'إنشاء حساب مستخدم' <<<"$developer_page"
          invite_page="$(curl --fail --silent --show-error -H 'Cache-Control: no-cache' "https://shino-mino-tak-tak.duckdns.org/friend-qr.html?deploy=$(date +%s)")"
          friends_script="$(curl --fail --silent --show-error -H 'Cache-Control: no-cache' "https://shino-mino-tak-tak.duckdns.org/friends.js?deploy=$(date +%s)")"
          qr_page="$(curl --fail --silent --show-error -H 'Cache-Control: no-cache' "https://shino-mino-tak-tak.duckdns.org/friend-qr.html?deploy=$(date +%s)")"
          grep -q '/api/friends/qr/request' <<<"$invite_page"
          grep -q 'id="qrStatus"' <<<"$qr_page"
          grep -q 'مسح QR بالكاميرا' <<<"$qr_page"
          grep -q 'جارٍ التحقق من الرمز' <<<"$qr_page"
          grep -q 'ShnoManoNative.scanFriendQr' <<<"$invite_page"
          grep -q 'method: "PATCH"' <<<"$friends_script"
          home_page="$(curl --fail --silent --show-error -H 'Cache-Control: no-cache' "https://shino-mino-tak-tak.duckdns.org/taktak.html?deploy=$(date +%s)")"
          friends_page="$(curl --fail --silent --show-error -H 'Cache-Control: no-cache' "https://shino-mino-tak-tak.duckdns.org/friends.html?deploy=$(date +%s)")"
          grep -q 'friend-qr.html?v=20260913-1' <<<"$home_page"
          grep -q '>▦ QR</a>' <<<"$friends_page"
          echo "public_registration_config=$public_config"
          rm -f ~/.ssh/oracle_key

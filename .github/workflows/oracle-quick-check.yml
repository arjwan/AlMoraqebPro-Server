name: Oracle public DNS and HTTPS check

on:
  push:
    branches: [main]
    paths: ['.github/workflows/oracle-quick-check.yml']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check DNS and public routes
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          set -u
          domain=almoraqebpro.duckdns.org
          dns_ip=$(getent ahostsv4 "$domain" | awk 'NR==1 {print $1}')
          echo "DNS_RESOLVED=$([ -n "$dns_ip" ] && echo yes || echo no)"
          echo "DNS_MATCHES_DEPLOY_HOST=$([ "$dns_ip" = "$ORACLE_HOST" ] && echo yes || echo no)"
          python3 - <<'PY'
          import os, socket
          for label, address in [('dns', socket.gethostbyname('almoraqebpro.duckdns.org')), ('deploy', os.getenv('ORACLE_HOST', ''))]:
              if not address:
                  continue
              for port in (22, 80, 443):
                  try:
                      with socket.create_connection((address, port), timeout=4):
                          print(f'{label.upper()}_PORT_{port}=open')
                  except OSError as exc:
                      print(f'{label.upper()}_PORT_{port}={type(exc).__name__}')
          PY
          for route in dns deploy; do
            if [ "$route" = dns ]; then ip="$dns_ip"; else ip="$ORACLE_HOST"; fi
            [ -n "$ip" ] || continue
            for path in / /admin_login.html /health; do
              echo "ROUTE=$route PATH=$path"
              curl --noproxy '*' -k -sS --connect-timeout 4 --max-time 9 --resolve "$domain:443:$ip" -o /tmp/body -w 'HTTP=%{http_code} TIME=%{time_total}\n' "https://$domain$path" || true
              grep -oi '<title[^>]*>[^<]*' /tmp/body | head -1 || true
              rm -f /tmp/body
            done
          done

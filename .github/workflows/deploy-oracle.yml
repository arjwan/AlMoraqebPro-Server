name: Deploy AlMoraqebPro Server to Oracle

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: oracle-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy through SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          APP_DIR="$HOME/AlMoraqebPro-Server"
          REPO="https://github.com/arjwan307/AlMoraqebPro-Server.git"

          if [ ! -d "$APP_DIR/.git" ]; then
            git clone "$REPO" "$APP_DIR"
          else
            git -C "$APP_DIR" fetch origin main
            git -C "$APP_DIR" reset --hard origin/main
          fi

          cd "$APP_DIR"
          npm ci --omit=dev

          if command -v pm2 >/dev/null 2>&1; then
            pm2 describe almoraqibpro-server >/dev/null 2>&1 \
              && pm2 restart almoraqibpro-server --update-env \
              || pm2 start server.js --name almoraqibpro-server
            pm2 save
          else
            echo 'PM2 is not installed on Oracle. Install/configure PM2 once before production deployment.'
            exit 1
          fi
          REMOTE

          rm -f ~/.ssh/oracle_key

name: Deploy AlMoraqebPro to Oracle

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: oracle-production
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full Mongo-backed smoke suite
        env:
          REQUIRE_TEST_DB: '1'
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 34
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Compile employee app
        working-directory: almoraqbp0serves
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon

  deploy:
    needs: [test, android]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy through SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          DEVELOPER_PASSWORD: ${{ secrets.DEVELOPER_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
        run: |
          set -euo pipefail

          : "${ORACLE_HOST:?Missing ORACLE_HOST secret}"
          : "${ORACLE_USER:?Missing ORACLE_USER secret}"
          : "${ORACLE_SSH_KEY:?Missing ORACLE_SSH_KEY secret}"
          : "${MONGO_URI:?Missing MONGO_URI secret}"
          : "${DEVELOPER_PASSWORD:?Missing DEVELOPER_PASSWORD secret}"
          : "${SESSION_SECRET:?Missing SESSION_SECRET secret}"

          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          APP_DIR="$HOME/AlMoraqebPro-Server"
          REPO="https://github.com/arjwan/AlMoraqebPro-Server.git"

          if [ ! -d "$APP_DIR/.git" ]; then
            git clone "$REPO" "$APP_DIR"
          else
            git -C "$APP_DIR" fetch origin main
            status="$(git -C "$APP_DIR" status --porcelain)"
            unexpected="$(printf '%s\n' "$status" | grep -Ev '^( M package-lock\.json|\?\? \.interview-demo-b3214(-daytime-pairs)?\.seeded)$' || true)"
            if [ -n "$unexpected" ]; then
              echo 'Oracle checkout has unexpected local changes; stop deployment.' >&2
              printf '%s\n' "$unexpected" >&2
              exit 1
            fi
            if ! git -C "$APP_DIR" diff --quiet -- package-lock.json; then
              BACKUP_DIR="$HOME/almoraqebpro-deploy-backups/$(date -u +%Y%m%dT%H%M%SZ)"
              mkdir -p "$BACKUP_DIR"
              cp -p "$APP_DIR/package-lock.json" "$BACKUP_DIR/package-lock.json"
              echo "Saved Oracle package-lock.json to $BACKUP_DIR"
              git -C "$APP_DIR" show HEAD:package-lock.json > "$APP_DIR/package-lock.json"
            fi
            git -C "$APP_DIR" merge --ff-only origin/main
          fi
          REMOTE

          {
            printf 'MONGO_URI=%s\n' "$MONGO_URI"
            printf 'DEVELOPER_PASSWORD=%s\n' "$DEVELOPER_PASSWORD"
            printf 'SESSION_SECRET=%s\n' "$SESSION_SECRET"
            printf 'ALLOWED_ORIGINS=%s\n' "$ALLOWED_ORIGINS"
            printf 'HOST=127.0.0.1\nPORT=3100\n'
          } | ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" \
            'umask 077; cat > "$HOME/AlMoraqebPro-Server/.env"'

          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          APP_DIR="$HOME/AlMoraqebPro-Server"
          SERVICE_NAME="almoraqebpro"
          DOMAIN="almoraqebpro.duckdns.org"

          cd "$APP_DIR"
          test -s .env
          npm install --no-audit --no-fund
          node --check server.js

          # One-time interview demo seed for the existing B-3214 company.
          # The marker stays outside git tracking, so later deploys do not duplicate/reseed it.
          if [ ! -f .interview-demo-b3214.seeded ]; then
            DEMO_COMPANY_ID=B-3214 DEMO_EMPLOYEE_COUNT=30 node scripts/seed-interview-demo.js | tee /tmp/almoraqebpro-demo-seed.json
            grep -q '"ok": true' /tmp/almoraqebpro-demo-seed.json
            grep -q '"company": "B-3214"' /tmp/almoraqebpro-demo-seed.json
            touch .interview-demo-b3214.seeded
          fi

          # One-time refresh: add valid departure pairs for the daytime demo employees.
          if [ ! -f .interview-demo-b3214-daytime-pairs.seeded ]; then
            DEMO_COMPANY_ID=B-3214 DEMO_EMPLOYEE_COUNT=30 node scripts/seed-interview-demo.js | tee /tmp/almoraqebpro-demo-daytime.json
            grep -q '"ok": true' /tmp/almoraqebpro-demo-daytime.json
            grep -q '"company": "B-3214"' /tmp/almoraqebpro-demo-daytime.json
            touch .interview-demo-b3214-daytime-pairs.seeded
          fi

          sudo systemctl stop "$SERVICE_NAME" 2>/dev/null || true
          sudo install -o root -g root -m 600 .env "/etc/${SERVICE_NAME}.env"
          sudo restorecon -F "/etc/${SERVICE_NAME}.env" 2>/dev/null || true

          NODE_BIN="$(command -v node)"
          APP_USER="$(id -un)"
          APP_GROUP="$(id -gn)"

          sudo tee "/etc/systemd/system/${SERVICE_NAME}.service" >/dev/null <<UNIT
          [Unit]
          Description=AlMoraqebPro API
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=${APP_USER}
          Group=${APP_GROUP}
          WorkingDirectory=${APP_DIR}
          EnvironmentFile=/etc/${SERVICE_NAME}.env
          Environment=NODE_ENV=production
          Environment=HOST=127.0.0.1
          Environment=PORT=3100
          ExecStart=${NODE_BIN} -r ./server-preload.js -r ./admin-pages-preload.js server.js
          Restart=always
          RestartSec=5
          NoNewPrivileges=true
          PrivateTmp=true

          [Install]
          WantedBy=multi-user.target
          UNIT

          sudo systemctl daemon-reload
          sudo systemctl enable "$SERVICE_NAME"
          if ! sudo systemctl restart "$SERVICE_NAME"; then
            sudo systemctl --no-pager --full status "$SERVICE_NAME" || true
            sudo journalctl --no-pager -u "$SERVICE_NAME" -n 100 || true
            exit 1
          fi

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3100/health >/tmp/almoraqebpro-health.json; then
              break
            fi
            sleep 2
          done
          if ! grep -q '"database":"connected"' /tmp/almoraqebpro-health.json; then
            cat /tmp/almoraqebpro-health.json || true
            sudo systemctl --no-pager --full status "$SERVICE_NAME" || true
            sudo journalctl --no-pager -u "$SERVICE_NAME" -n 100 || true
            exit 1
          fi

          sudo tee "/etc/nginx/conf.d/${SERVICE_NAME}.conf" >/dev/null <<NGINX
          server {
              listen 80;
              server_name ${DOMAIN};

              client_max_body_size 25m;

              location / {
                  proxy_pass http://127.0.0.1:3100;
                  proxy_http_version 1.1;
                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
              }
          }
          NGINX

          sudo nginx -t
          sudo systemctl reload nginx

          if command -v certbot >/dev/null 2>&1; then
            sudo certbot --nginx -d "$DOMAIN" --non-interactive --agree-tos \
              --register-unsafely-without-email --redirect
          else
            echo 'certbot is not installed on Oracle'
            exit 1
          fi

          curl --fail --silent --show-error "https://${DOMAIN}/health" | grep -q '"database":"connected"'
          curl --fail --silent --show-error "https://${DOMAIN}/api/ping" >/dev/null
          sudo systemctl --no-pager --full status "$SERVICE_NAME"
          REMOTE

          rm -f ~/.ssh/oracle_key

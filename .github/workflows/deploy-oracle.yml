name: Deploy AlMoraqebPro to Oracle

on:
  workflow_dispatch:

concurrency:
  group: oracle-production
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full Mongo-backed smoke suite
        env:
          REQUIRE_TEST_DB: '1'
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile employee app
        working-directory: almoraqbp0serves
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon

  deploy:
    needs: [test, android]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy through SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          DEVELOPER_PASSWORD: ${{ secrets.DEVELOPER_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
        run: |
          set -euo pipefail

          : "${ORACLE_HOST:?Missing ORACLE_HOST secret}"
          : "${ORACLE_USER:?Missing ORACLE_USER secret}"
          : "${ORACLE_SSH_KEY:?Missing ORACLE_SSH_KEY secret}"
          : "${MONGO_URI:?Missing MONGO_URI secret}"
          : "${DEVELOPER_PASSWORD:?Missing DEVELOPER_PASSWORD secret}"
          : "${SESSION_SECRET:?Missing SESSION_SECRET secret}"

          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          APP_DIR="$HOME/AlMoraqebPro-Server"
          REPO="https://github.com/arjwan/AlMoraqebPro-Server.git"

          if [ ! -d "$APP_DIR/.git" ]; then
            git clone "$REPO" "$APP_DIR"
          else
            git -C "$APP_DIR" fetch origin main
            status="$(git -C "$APP_DIR" status --porcelain)"
            unexpected="$(printf '%s\n' "$status" | grep -Ev '^( M package-lock\.json|\?\? \.interview-demo-b3214(-daytime-pairs|-sites-v2)?\.seeded)$' || true)"
            if [ -n "$unexpected" ]; then
              echo 'Oracle checkout has unexpected local changes; stop deployment.' >&2
              printf '%s\n' "$unexpected" >&2
              exit 1
            fi
            if ! git -C "$APP_DIR" diff --quiet -- package-lock.json; then
              BACKUP_DIR="$HOME/almoraqebpro-deploy-backups/$(date -u +%Y%m%dT%H%M%SZ)"
              mkdir -p "$BACKUP_DIR"
              cp -p "$APP_DIR/package-lock.json" "$BACKUP_DIR/package-lock.json"
              echo "Saved Oracle package-lock.json to $BACKUP_DIR"
              git -C "$APP_DIR" show HEAD:package-lock.json > "$APP_DIR/package-lock.json"
            fi
            git -C "$APP_DIR" merge --ff-only origin/main
          fi
          REMOTE

          {
            printf 'MONGO_URI=%s\n' "$MONGO_URI"
            printf 'DEVELOPER_PASSWORD=%s\n' "$DEVELOPER_PASSWORD"
            printf 'SESSION_SECRET=%s\n' "$SESSION_SECRET"
            printf 'ALLOWED_ORIGINS=%s\n' "$ALLOWED_ORIGINS"
            printf 'HOST=127.0.0.1\nPORT=3100\n'
          } | ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" \
            'umask 077; cat > "$HOME/AlMoraqebPro-Server/.env"'

          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          APP_DIR="$HOME/AlMoraqebPro-Server"
          SERVICE_NAME="almoraqebpro"
          DOMAIN="almoraqebpro.duckdns.org"

          cd "$APP_DIR"
          test -s .env
          npm install --no-audit --no-fund
          node --check server.js

          # One-time interview demo seed for the existing B-3214 company.
          # The marker stays outside git tracking, so later deploys do not duplicate/reseed it.
          if [ ! -f .interview-demo-b3214.seeded ]; then
            DEMO_COMPANY_ID=B-3214 DEMO_EMPLOYEE_COUNT=30 node scripts/seed-interview-demo.js | tee /tmp/almoraqebpro-demo-seed.json
            grep -q '"ok": true' /tmp/almoraqebpro-demo-seed.json
            grep -q '"company": "B-3214"' /tmp/almoraqebpro-demo-seed.json
            touch .interview-demo-b3214.seeded
          fi

          # One-time refresh: add valid departure pairs for the daytime demo employees.
          if [ ! -f .interview-demo-b3214-daytime-pairs.seeded ]; then
            DEMO_COMPANY_ID=B-3214 DEMO_EMPLOYEE_COUNT=30 node scripts/seed-interview-demo.js | tee /tmp/almoraqebpro-demo-daytime.json
            grep -q '"ok": true' /tmp/almoraqebpro-demo-daytime.json
            grep -q '"company": "B-3214"' /tmp/almoraqebpro-demo-daytime.json
            touch .interview-demo-b3214-daytime-pairs.seeded
          fi

          # One-time migration: isolate simulated employees at explicitly tagged demo sites.
          # The company's real headquarters and its real location records are preserved.
          if [ ! -f .interview-demo-b3214-sites-v2.seeded ]; then
            DEMO_COMPANY_ID=B-3214 DEMO_EMPLOYEE_COUNT=30 node scripts/seed-interview-demo.js | tee /tmp/almoraqebpro-demo-sites.json
            grep -q '"ok": true' /tmp/almoraqebpro-demo-sites.json
            grep -q '"demoLocations": 4' /tmp/almoraqebpro-demo-sites.json
            touch .interview-demo-b3214-sites-v2.seeded
          fi

          sudo install -o root -g root -m 600 .env "/etc/${SERVICE_NAME}.env"
          sudo restorecon -F "/etc/${SERVICE_NAME}.env" 2>/dev/null || true

          NODE_BIN="$(command -v node)"
          APP_USER="$(id -un)"
          APP_GROUP="$(id -gn)"

          sudo tee "/etc/systemd/system/${SERVICE_NAME}.service" >/dev/null <<UNIT
          [Unit]
          Description=AlMoraqebPro API
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=${APP_USER}
          Group=${APP_GROUP}
          WorkingDirectory=${APP_DIR}
          EnvironmentFile=/etc/${SERVICE_NAME}.env
          Environment=NODE_ENV=production
          Environment=HOST=127.0.0.1
          Environment=PORT=3100
          ExecStart=${NODE_BIN} -r ./server-preload.js -r ./admin-pages-preload.js server.js
          Restart=always
          RestartSec=5
          NoNewPrivileges=true
          PrivateTmp=true

          [Install]
          WantedBy=multi-user.target
          UNIT

          sudo systemctl daemon-reload
          sudo systemctl enable "$SERVICE_NAME"
          if ! sudo systemctl restart "$SERVICE_NAME"; then
            sudo systemctl --no-pager --full status "$SERVICE_NAME" || true
            sudo journalctl --no-pager -u "$SERVICE_NAME" -n 100 || true
            exit 1
          fi

          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3100/health >/tmp/almoraqebpro-health.json; then
              break
            fi
            sleep 2
          done
          if ! grep -q '"database":"connected"' /tmp/almoraqebpro-health.json; then
            cat /tmp/almoraqebpro-health.json || true
            sudo systemctl --no-pager --full status "$SERVICE_NAME" || true
            sudo journalctl --no-pager -u "$SERVICE_NAME" -n 100 || true
            exit 1
          fi

          # Keep HTTPS bound to this domain after every deployment.
          sudo test -s "/etc/letsencrypt/live/${DOMAIN}/fullchain.pem"
          sudo test -s "/etc/letsencrypt/live/${DOMAIN}/privkey.pem"
          NGINX_CONFIG="/etc/nginx/conf.d/${SERVICE_NAME}.conf"
          NGINX_BACKUP="${NGINX_CONFIG}.backup-$(date -u +%Y%m%dT%H%M%SZ)"
          sudo cp -p "$NGINX_CONFIG" "$NGINX_BACKUP"
          sudo tee "$NGINX_CONFIG" >/dev/null <<'NGINX'
          server {
              listen 80;
              server_name almoraqebpro.duckdns.org;
              return 301 https://$host$request_uri;
          }
          server {
              listen 443 ssl;
              server_name almoraqebpro.duckdns.org;
              ssl_certificate /etc/letsencrypt/live/almoraqebpro.duckdns.org/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/almoraqebpro.duckdns.org/privkey.pem;
              client_max_body_size 25m;
              location / {
                  proxy_pass http://127.0.0.1:3100;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
          NGINX
          if ! sudo nginx -t; then
            sudo cp -p "$NGINX_BACKUP" "$NGINX_CONFIG"
            exit 1
          fi
          sudo systemctl reload nginx

          # Keep interview-only synthetic attendance and its accrued wages current.
          # The script filters demoData/demoBatch and never writes real employees.
          sudo tee /etc/systemd/system/almoraqebpro-demo-refresh.service >/dev/null <<UNIT
          [Unit]
          Description=Refresh AlMoraqebPro interview demo attendance and wages
          After=network-online.target
          [Service]
          Type=oneshot
          User=${APP_USER}
          Group=${APP_GROUP}
          WorkingDirectory=${APP_DIR}
          EnvironmentFile=/etc/${SERVICE_NAME}.env
          ExecStart=${NODE_BIN} scripts/refresh-interview-demo.js
          NoNewPrivileges=true
          [Install]
          WantedBy=multi-user.target
          UNIT

          sudo tee /etc/systemd/system/almoraqebpro-demo-refresh.timer >/dev/null <<TIMER
          [Unit]
          Description=Refresh interview demo every 30 minutes
          [Timer]
          OnCalendar=*:0/30
          Persistent=true
          Unit=almoraqebpro-demo-refresh.service
          [Install]
          WantedBy=timers.target
          TIMER
          sudo systemctl daemon-reload
          sudo systemctl enable --now almoraqebpro-demo-refresh.timer
          sudo systemctl start almoraqebpro-demo-refresh.service

          for path in /health /api/ping /admin.html /admin_map.html; do
            curl --noproxy '*' --fail --silent --show-error --max-time 15 "https://${DOMAIN}$path" >/dev/null
          done
          curl --noproxy '*' --fail --silent --show-error "https://${DOMAIN}/health" | grep -q '"database":"connected"'
          sudo systemctl --no-pager --full status "$SERVICE_NAME"
          REMOTE

          rm -f ~/.ssh/oracle_key

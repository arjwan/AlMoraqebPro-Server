<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المراقب برو - شاشة الترحيب</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .welcome-card {
            width: 100%;
            max-width: 380px;
            background: #1e293b;
            padding: 40px 30px;
            border-radius: 30px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
            border: 1px solid #334155;
            text-align: center;
        }

        .app-icon {
            font-size: 50px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 24px;
            color: #38bdf8;
            margin-bottom: 10px;
        }

        p {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 35px;
            line-height: 1.5;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border-radius: 14px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            border: none;
            transition: 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-login {
            background: #0284c7;
            color: #fff;
        }

        .btn-login:hover {
            background: #0369a1;
        }

        .btn-register {
            background: #334155;
            color: #f8fafc;
            border: 1px solid #475569;
        }

        .btn-register:hover {
            background: #475569;
        }
    </style>
</head>
<body>

    <div class="welcome-card">
        <div class="app-icon">🛡️</div>
        <h1>المراقب برو</h1>
        <p>النظام الذكي لإدارة الحضور، الشفتات، وبيانات الموظفين بكل كفاءة وأمان.</p>

        <div class="btn-group">
            <!-- زر تسجيل الدخول -->
            <button class="btn btn-login" onclick="goToLogin()">تسجيل الدخول</button>
            
            <!-- زر إنشاء حساب -->
            <button class="btn btn-register" onclick="goToRegister()">إنشاء حساب جديد</button>
        </div>
    </div>

    <script>
        function goToLogin() {
            // توجيه المستخدم إلى صفحة تسجيل الدخول (index.html أو login.html)
            window.location.href = 'index.html';
        }

        function goToRegister() {
            // توجيه المستخدم إلى صفحة إنشاء الحساب أو نموذج التسجيل
            alert('⚙️ سيتم توجيهك إلى نافذة إنشاء حساب موظف جديد.');
            // window.location.href = 'register.html';
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المراقب برو - تسجيل موظف جديد</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); color: #f8fafc; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        
        .card { background: #1e293b; padding: 30px; border-radius: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); width: 100%; max-width: 420px; border: 1px solid #334155; }
        h2 { color: #38bdf8; font-size: 22px; margin-bottom: 5px; text-align: center; }
        .subtitle { color: #94a3b8; font-size: 13px; margin-bottom: 20px; text-align: center; }

        .form-group { margin-bottom: 15px; text-align: right; }
        label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 6px; }
        input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: white; font-size: 14px; }
        input:focus { outline: none; border-color: #38bdf8; }

        .btn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        .btn-primary { background: #0284c7; color: white; }
        .btn-primary:hover { background: #0369a1; }

        .back-link { display: block; text-align: center; margin-top: 15px; color: #94a3b8; font-size: 13px; text-decoration: none; }
        .back-link:hover { color: #38bdf8; }

        #alertBox { margin-top: 15px; padding: 10px; border-radius: 8px; font-size: 13px; text-align: center; display: none; }
        .alert-success { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #10b981; }
        .alert-error { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }
    </style>
</head>
<body>

    <div class="card">
        <h2>📝 تسجيل موظف جديد</h2>
        <p class="subtitle">أدخل رمز الشركة (مثل B-2026) لربط حسابك آلياً</p>

        <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label>معرف الشركة الفريد (إجباري)</label>
                <input type="text" id="companyId" required placeholder="مثال: B-2026" style="text-transform: uppercase; font-weight: bold; letter-spacing: 1px;">
            </div>

            <div class="form-group">
                <label>اسم الموظف الثلاثي</label>
                <input type="text" id="employeeName" required placeholder="أدخل اسمك الكامل">
            </div>

            <div class="form-group">
                <label>رقم الهاتف / معرف الدخول</label>
                <input type="text" id="employeePhone" required placeholder="أدخل رقم الهاتف">
            </div>

            <button type="submit" class="btn btn-primary">إتمام التسجيل والربط الآلي</button>
        </form>

        <a href="login.html" class="back-link">العودة لتسجيل الدخول</a>

        <div id="alertBox"></div>
    </div>

    <script>
        function handleRegister(event) {
            event.preventDefault();

            const companyId = document.getElementById('companyId').value.trim().toUpperCase();
            const employeeName = document.getElementById('employeeName').value.trim();
            const employeePhone = document.getElementById('employeePhone').value.trim();
            const alertBox = document.getElementById('alertBox');

            // التحقق من صيغة المعرف (مثال بسيط للتأكد من إدخاله)
            if (!companyId) {
                alertBox.style.display = 'block';
                alertBox.className = 'alert-error';
                alertBox.textContent = '❌ يرجى إدخال معرف الشركة الإجباري!';
                return;
            }

            // 1. حفظ بيانات الربط في ذاكرة الهاتف المحلية (LocalStorage) لتلتصق الموظف بشركته فوراً
            localStorage.setItem('activeCompanyId', companyId);
            localStorage.setItem('activeEmployee', employeeName);
            localStorage.setItem('activeEmployeePhone', employeePhone);

            // 2. تسجيل الموظف آلياً في قائمة موظفي هذه الشركة المحددة بالرمز
            const companyEmployeesKey = `company_employees_${companyId}`;
            const employeesList = JSON.parse(localStorage.getItem(companyEmployeesKey)) || [];
            
            const newEmployeeData = {
                name: employeeName,
                phone: employeePhone,
                registeredAt: new Date().toLocaleString('ar-EG')
            };

            employeesList.push(newEmployeeData);
            localStorage.setItem(companyEmployeesKey, JSON.stringify(employeesList));

            // 3. إظهار رسالة النجاح والتحويل التلقائي لصفحة الحضور (البصمة)
            alertBox.style.display = 'block';
            alertBox.className = 'alert-success';
            alertBox.textContent = `✅ تم ربطك بنجاح بالشركة ذات المعرف (${companyId})، جاري تحويلك...`;

            setTimeout(() => {
                window.location.href = 'attendance.html'; // الانتقال لصفحة البصمة والخدمات فوراً
            }, 1500);
        }
    </script>
</body>
</html>

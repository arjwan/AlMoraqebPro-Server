<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المراقب برو - تسجيل موظف جديد</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #2e1a47 0%, #1f1135 50%, #100820 100%);
            color: #1e293b;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .register-card {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            padding: 30px 25px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            max-height: 95vh;
            overflow-y: auto;
        }

        .header-title {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 12px;
        }

        .header-title h2 {
            font-size: 22px;
            font-weight: 800;
            color: #0284c7;
            margin-bottom: 4px;
        }

        .header-title p {
            font-size: 13px;
            color: #64748b;
        }

        .form-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 700;
            color: #475569;
        }

        .form-group input {
            padding: 12px 14px;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            font-size: 14px;
            background: #fff;
            outline: none;
            transition: 0.2s;
            width: 100%;
        }

        .form-group input:focus {
            border-color: #0284c7;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }

        .camera-section {
            border: 2px dashed #cbd5e1;
            background: #f8fafc;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 20px;
        }

        .video-box {
            width: 100%;
            max-width: 220px;
            height: 150px;
            background: #000;
            margin: 0 auto 12px auto;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            position: relative;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .btn-action {
            background: #0284c7;
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            font-size: 13px;
            width: 100%;
            margin-top: 5px;
        }

        .btn-action:hover {
            background: #0369a1;
        }

        .btn-location {
            background: #475569;
        }

        .btn-location:hover {
            background: #334155;
        }

        .location-display {
            background: #f1f5f9;
            padding: 12px;
            border-radius: 10px;
            margin-top: 8px;
            border: 1px dashed #94a3b8;
            font-size: 13px;
            color: #334155;
            text-align: right;
        }

        .btn-submit {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);
            transition: 0.2s;
        }

        .btn-submit:hover {
            opacity: 0.95;
        }
    </style>
</head>
<body>

    <div class="register-card">
        <div class="header-title">
            <h2>📝 تسجيل موظف جديد</h2>
            <p>أدخل بيانات الحساب والربط التلقائي بالمؤسسة</p>
        </div>

        <form id="registerForm">
            <div class="form-grid">
                <div class="form-group">
                    <label>رمز الشركة (المعرف الفريد):</label>
                    <input type="text" id="companyId" required placeholder="مثال: B-2026">
                </div>

                <div class="form-group">
                    <label>اسم الشركة:</label>
                    <input type="text" id="companyName" required placeholder="أدخل اسم الشركة...">
                </div>

                <div class="form-group">
                    <label>اسم الموظف الكامل:</label>
                    <input type="text" id="fullName" required placeholder="أدخل اسمك الثلاثي...">
                </div>

                <div class="form-group">
                    <label>العنوان الوظيفي:</label>
                    <input type="text" id="specialty" required placeholder="مثال: مبرمج، محاسب، مشرف...">
                </div>

                <div class="form-group">
                    <label>مكان العمل:</label>
                    <input type="text" id="workplace" required placeholder="مثال: الفرع الرئيسي - الإدارة...">
                </div>

                <div class="form-group">
                    <label>اسم المستخدم:</label>
                    <input type="text" id="username" required placeholder="اختر اسم مستخدم للنظام...">
                </div>

                <div class="form-group">
                    <label>كلمة المرور:</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
            </div>

            <!-- قسم التقاط الصورة والموقع -->
            <div class="camera-section">
                <label style="color: #0369a1; font-weight: 700; display: block; margin-bottom: 8px;">📸 التحقق بالوجه والموقع:</label>
                
                <div class="video-box">
                    <video id="webcam" autoplay playsinline></video>
                </div>
                <button type="button" class="btn-action" onclick="captureFace()">التقاط صورة الوجه</button>
                <p id="photoStatus" style="color: #059669; font-weight: bold; font-size: 12px; display: none; margin-top: 6px;">✓ تم التقاط صورة الوجه بنجاح</p>

                <hr style="border: 0; border-top: 1px solid #cbd5e1; margin: 15px 0;">

                <button type="button" class="btn-action btn-location" onclick="getLocation()">📍 جلب الموقع الجغرافي (أساس البصمة)</button>
                <div id="locationDisplay" class="location-display">
                    لم يتم جلب موقع العمل بعد...
                </div>
                <input type="hidden" id="empLocation" required>
            </div>

            <button type="submit" class="btn-submit">إتمام التسجيل والربط الآلي</button>
        </form>
    </div>

    <script>
        const video = document.getElementById('webcam');
        let capturedImageData = "";

        // تشغيل الكاميرا للهواتف المحمولة
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } })
                .then(stream => {
                    video.srcObject = stream;
                })
                .catch(err => {
                    console.log("تعذر الوصول للكاميرا: ", err);
                });
        }

        // التقاط صورة الوجه
        function captureFace() {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth || 220;
            canvas.height = video.videoHeight || 150;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            capturedImageData = canvas.toDataURL('image/png');
            document.getElementById('photoStatus').style.display = 'block';
        }

        // جلب الموقع الجغرافي الأساسي لقبول البصمة
        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    const lat = pos.coords.latitude.toFixed(6);
                    const lon = pos.coords.longitude.toFixed(6);
                    const coordsString = `${lat}, ${lon}`;
                    
                    document.getElementById('empLocation').value = coordsString;
                    document.getElementById('locationDisplay').innerHTML = `
                        <strong>📍 تم رصد الاحداثيات بنجاح:</strong><br>
                        خط العرض: ${lat}<br>
                        خط الطول: ${lon}
                    `;
                }, err => {
                    alert("⚠️ تعذر جلب الموقع. تأكد من تفعيل إذن الموقع (GPS) في هاتفك.");
                }, { enableHighAccuracy: true });
            } else {
                alert("⚠️ متصفح هاتفك لا يدعم خاصية تحديد الموقع.");
            }
        }

        // إرسال وحفظ البيانات بشكل مباشر وآمن بدون الاعتماد على ملفات خارجية قد تفشل
        document.getElementById('registerForm').addEventListener('submit', (e) => {
            e.preventDefault();

            if (!capturedImageData) {
                alert('⚠️ يرجى التقاط صورة الوجه أولاً!');
                return;
            }

            const locationVal = document.getElementById('empLocation').value;
            if (!locationVal) {
                alert('⚠️ يرجى النقر على زر "جلب الموقع الجغرافي" لتعيين نقطة الارتكاز للبصمة!');
                return;
            }

            const compId = document.getElementById('companyId').value.trim();
            localStorage.setItem('activeCompanyId', compId);

            const newEmployee = {
                id: 'emp_' + Date.now(),
                companyId: compId,
                companyName: document.getElementById('companyName').value.trim(),
                name: document.getElementById('fullName').value.trim(),
                specialty: document.getElementById('specialty').value.trim(),
                workplace: document.getElementById('workplace').value.trim(),
                username: document.getElementById('username').value.trim(),
                password: document.getElementById('password').value,
                photo: capturedImageData,
                location: locationVal,
                startDate: new Date().toLocaleDateString(),
                status: "نشط"
            };

            try {
                // حفظ البيانات مباشرة في LocalStorage للشركة المحددة
                const storageKey = `company_employees_${compId}`;
                let employees = JSON.parse(localStorage.getItem(storageKey) || '[]');
                
                // التحقق من تكرار اسم المستخدم
                if (employees.find(e => e.username === newEmployee.username)) {
                    alert('⚠️ اسم المستخدم موجود مسبقاً، يختار اسماً آخر!');
                    return;
                }

                employees.push(newEmployee);
                localStorage.setItem(storageKey, JSON.stringify(employees));

                // إضافة إشعار للمدير
                let notifications = JSON.parse(localStorage.getItem('companyNotifications') || '[]');
                notifications.unshift({ text: `موظف جديد: ${newEmployee.name}`, time: new Date().toLocaleString() });
                localStorage.setItem('companyNotifications', JSON.stringify(notifications));

                // رسالة النجاح والتوجيه الإجباري لصفحة تسجيل الدخول
                alert('🎉 تم تسجيل حسابك بنجاح! سيتم تحويلك الآن إلى صفحة تسجيل الدخول.');
                window.location.href = 'login.html';

            } catch (error) {
                alert('⚠️ حدث خطأ أثناء الحفظ في ذاكرة الهاتف: ' + error.message);
            }
        });
    </script>
</body>
</html>

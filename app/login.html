<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المراقب برو - تسجيل دخول الموظف</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e1b4b 0%, #31103f 50%, #0f172a 100%);
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            padding: 30px 25px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .header-title {
            text-align: center;
            margin-bottom: 25px;
        }

        .header-title h2 {
            font-size: 22px;
            font-weight: 800;
            color: #0284c7;
            margin-bottom: 5px;
        }

        .header-title p {
            font-size: 13px;
            color: #64748b;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 15px;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 700;
            color: #475569;
        }

        .form-group input {
            padding: 12px 14px;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
            width: 100%;
        }

        .form-group input:focus {
            border-color: #0284c7;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }

        .btn-submit {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: #fff;
            border: none;
            padding: 13px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);
            transition: 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            opacity: 0.95;
        }

        .links-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            font-size: 13px;
        }

        .links-container a {
            color: #0284c7;
            text-decoration: none;
            font-weight: 600;
        }

        .links-container a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="header-title">
            <h2>🔐 تسـجيل دخول الموظف</h2>
            <p>المراقب برو - تطبيق الهاتف المحلي</p>
        </div>

        <form id="loginForm" onsubmit="handleEmployeeLogin(event)">
            <div class="form-group">
                <label>اسم المستخدم أو رقم الهاتف:</label>
                <input type="text" id="loginUsername" required placeholder="أدخل اسم المستخدم...">
            </div>

            <div class="form-group">
                <label>كلمة المرور:</label>
                <input type="password" id="loginPassword" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn-submit">تسجيل الدخول</button>

            <div class="links-container">
                <a href="register.html">إنشاء حساب جديد</a>
                <a href="#" onclick="alert('يرجى مراجعة مدير النظام لإعادة تعيين كلمة المرور.')">نسيت كلمة المرور؟</a>
            </div>
        </form>
    </div>

    <!-- ربط ملف المزامنة والبيانات المشتركة -->
    <script src="employees-sync.js"></script>

    <script>
        function handleEmployeeLogin(e) {
            e.preventDefault(); // منع إعادة تحميل الصفحة الافتراضي

            const usernameInput = document.getElementById('loginUsername').value.trim();
            const passwordInput = document.getElementById('loginPassword').value;

            // استدعاء دالة جلب الموظفين من ملف المزامنة المشترك
            const employees = getAllEmployees();

            if (employees.length === 0) {
                alert('⚠️ لا توجد أي حسابات مسجلة محلياً في النظام حتى الآن. يرجى إنشاء حساب جديد أولاً.');
                return;
            }

            // البحث عن الموظف بالمطابقة (اسم المستخدم أو رقم الهاتف + كلمة المرور)
            const matchedEmployee = employees.find(emp => 
                (emp.username === usernameInput || emp.phone === usernameInput) && emp.password === passwordInput
            );

            if (matchedEmployee) {
                // حفظ الجلسة الحالية للموظف
                localStorage.setItem('activeEmployee', JSON.stringify(matchedEmployee));
                localStorage.setItem('isEmployeeLoggedIn', 'true');

                alert(`🎉 أهلاً بك يا ${matchedEmployee.name}، تم تسجيل الدخول بنجاح!`);
                
                // الانتقال إلى واجهة الموظف الرئيسية أو صفحة البصمة
                // (يمكنك تغيير اسم الصفحة المستهدفة حسب اسم ملف الواجهة لديك، مثل employee-dashboard.html)
                window.location.href = 'employee-dashboard.html'; 
            } else {
                alert('❌ اسم المستخدم أو كلمة المرور غير صحيحة! تأكد من البيانات المدعومة محلياً.');
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المراقب برو - تسجيل الدخول</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #2e1a47 0%, #1f1135 50%, #100820 100%);
            color: #1e293b;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            padding: 35px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .header-title {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 15px;
        }

        .header-title h2 {
            font-size: 24px;
            font-weight: 800;
            color: #0284c7;
            margin-bottom: 5px;
        }

        .header-title p {
            font-size: 13px;
            color: #64748b;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        .form-group label {
            font-size: 14px;
            font-weight: 700;
            color: #475569;
        }

        .form-group input {
            padding: 14px 16px;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            font-size: 15px;
            background: #fff;
            outline: none;
            transition: 0.2s;
            width: 100%;
        }

        .form-group input:focus {
            border-color: #0284c7;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }

        .btn-submit {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: #fff;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);
            transition: 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            opacity: 0.95;
        }

        .footer-links {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
        }

        .footer-links a {
            color: #0284c7;
            text-decoration: none;
            font-weight: bold;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="header-title">
            <h2>🔐 تسجيل دخول الموظف</h2>
            <p>أدخل بيانات الحساب للانتقال لبصمة الحضور</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label>رمز الشركة (المعرف الفريد):</label>
                <input type="text" id="loginCompanyId" required placeholder="مثال: B-2026">
            </div>

            <div class="form-group">
                <label>اسم المستخدم:</label>
                <input type="text" id="loginUsername" required placeholder="أدخل اسم المستخدم...">
            </div>

            <div class="form-group">
                <label>كلمة المرور:</label>
                <input type="password" id="loginPassword" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn-submit">دخول إلى لوحة البصمة</button>
        </form>

        <div class="footer-links">
            ليس لديك حساب؟ <a href="register_2.html">تسجيل موظف جديد</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();

            const compId = document.getElementById('loginCompanyId').value.trim();
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;

            // جلب موظفي الشركة المحددة من ذاكرة الهاتف
            const storageKey = `company_employees_${compId}`;
            const employees = JSON.parse(localStorage.getItem(storageKey) || '[]');

            // البحث عن الموظف بالاعتماد على اسم المستخدم وكلمة المرور
            const employee = employees.find(emp => emp.username === username && emp.password === password);

            if (employee) {
                // حفظ معرف الشركة ومعرف الموظف النشط حالياً في الجلسة
                localStorage.setItem('activeCompanyId', compId);
                localStorage.setItem('activeEmployeeUsername', username);

                alert(`مرحباً بك يا ${employee.name}! تم التحقق بنجاح.`);
                
                // الانتقال المباشر إلى صفحة بصمة الحضور والانصراف
                // (تأكد من تسمية صفحة البصمة لديك، أو استبدل attendance.html باسم صفحتك الحالية)
                window.location.href = 'attendance.html';
            } else {
                alert('⚠️ خطأ: رمز الشركة، اسم المستخدم، أو كلمة المرور غير صحيحة!');
            }
        });
    </script>
</body>
</html>

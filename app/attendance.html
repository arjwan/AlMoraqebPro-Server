<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المراقب برو - بصمة الحضور والانصراف</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); color: #f8fafc; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        
        .card { background: #1e293b; padding: 30px; border-radius: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); width: 100%; max-width: 420px; text-align: center; border: 1px solid #334155; }
        h2 { color: #38bdf8; font-size: 22px; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .subtitle { color: #94a3b8; font-size: 13px; margin-bottom: 25px; }

        .time-box { background: #0f172a; border: 1px solid #334155; padding: 15px; border-radius: 14px; font-size: 26px; font-weight: bold; color: #f8fafc; margin-bottom: 25px; letter-spacing: 1px; }

        .btn { width: 100%; padding: 14px; border-radius: 14px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
        .btn-checkin { background: #10b981; color: white; }
        .btn-checkin:hover { background: #059669; }
        .btn-checkout { background: #ef4444; color: white; }
        .btn-checkout:hover { background: #dc2626; }
        
        /* زر الخدمات المضاف خصيصاً لينقل الموظف لصفحة الخدمات */
        .btn-services { background: #0ea5e9; color: white; margin-top: 5px; }
        .btn-services:hover { background: #0284c7; }

        #alertBox { margin-top: 15px; padding: 10px; border-radius: 10px; font-size: 13px; font-weight: bold; display: none; }
        .alert-success { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #10b981; }
    </style>
</head>
<body>

    <div class="card">
        <h2>⏱️ بصمة الحضور والانصراف</h2>
        <p class="subtitle" id="companySubtitle">سجل وقت عملك اليومي بكل سهولة</p>

        <div class="time-box" id="liveClock">00:00:00</div>

        <button class="btn btn-checkin" onclick="registerAttendance('تسجيل حضور')">
            🟢 تسجيل حضور
        </button>
        
        <button class="btn btn-checkout" onclick="registerAttendance('تسجيل انصراف')">
            🔴 تسجيل انصراف
        </button>

        <!-- زر الانتقال المباشر لصفحة الخدمات والطلبات -->
        <a href="services.html" class="btn btn-services">
            🗂️ الانتقال إلى صفحة الخدمات والطلبات
        </a>

        <div id="alertBox"></div>
    </div>

    <script>
        // تحديث الساعة الحية
        setInterval(() => {
            const now = new Date();
            document.getElementById('liveClock').textContent = now.toLocaleTimeString();
        }, 1000);

        const currentEmployee = localStorage.getItem('activeEmployee') || 'موظف تجريبي';
        const currentCompany = localStorage.getItem('activeCompanyId') || 'default_company';

        document.getElementById('companySubtitle').textContent = `الموظف: ${currentEmployee} | الشركة المرتبطة`;

        // تسجيل الحضور والانصراف وتخزينه مع إشعار فوري
        function registerAttendance(type) {
            const nowTime = new Date().toLocaleString('ar-EG');
            
            const attendanceRecord = {
                id: 'ATT_' + Date.now(),
                companyId: currentCompany,
                employeeName: currentEmployee,
                type: type,
                timestamp: nowTime
            };

            // حفظ السجل محلياً وإرساله لسجل حركات النظام للمدير
            const logs = JSON.parse(localStorage.getItem(`system_logs_${currentCompany}`)) || [];
            logs.unshift({
                type: type,
                details: `قام الموظف (${currentEmployee}) بعملية ${type} بنجاح`,
                user: currentEmployee,
                timestamp: nowTime
            });
            localStorage.setItem(`system_logs_${currentCompany}`, JSON.stringify(logs));

            // إظهار الإشعار الفوري للموظف
            const alertBox = document.getElementById('alertBox');
            alertBox.style.display = 'block';
            alertBox.className = 'alert-success';
            alertBox.textContent = `✅ تم بنجاح (${type}) في تمام الساعة: ${nowTime}`;

            setTimeout(() => {
                alertBox.style.display = 'none';
            }, 4000);
        }
    </script>
</body>
</html>
